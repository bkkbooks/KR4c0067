front:
  text: 李文饒文集卷第十九會昌一品制集
  hash: sha256:29b461a032e07058628a8f8fb354edd27caa0b09dc4f14196c3d7b07330812da
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4c0067_SBCK_019-1a}
body:
  text: 謝恩或以抵莫夜須自敘意者即軍狀故事宰相狀並是舍人或敕使節謝宣示盟沒斯等冠帶訖圖狀謝恩賜王元逵與臣贊皇縣圖及三祖碑狀謝恩令所進異域歸忠傳兩箞序中改元奉敕撰狀謝宣示所進黠戞斯朝貢圖深愜于懷狀謝恩贈故蕃維州城副使悉怛謀官狀謝恩所進㙐橘賦宣副使史館狀謝恩讓官批答狀謝恩不許讓官狀二謝恩改封魏國公狀謝恩加特進階狀謝恩不許讓官狀連宣謝賜錦綵銀器狀二謝問疾狀連宣二狀謝宣示盟斯等冠帶訖圖狀伏以漢宣帝時呼韓單于來朝京邑然待以客禮未備漢儀至後漢建武二十六年單于慕先人之義歸心中國光武修祖宗之業柔服北邊因其稱藩始知冠帶厥後綿歷五代僅及千年惟聞征伐之勤莫覩來廷之盛伏惟陛下功高漢后威服窮荒不勞七月之師坐俟七旬之格故得盟沒斯誓心向闕稽首歸忠自獻刑馬之書仍酌留挈之酒永勵臣節以保塞垣今則榮以彯纓解其衣毳簪笏就列威儀可觀推徑捍之心豈勞戴鶡服禮義之化寧比冠雞鑒于丹青益表神化臣等謬參樞近獲覩成功歡抃之心陪萬常品謝恩賜王元逵與臣贊皇縣圖及三祖碑文狀高品楊文端至奉宣聖旨賜臣前件圖等伏以桑梓雖存久隔兵戈之地松楸浸逺已絶霜露之思運屬承明時逢開泰戎臣效順寰海大同故國山河因丹青而盡見祖宗基搆尋碑坂而可知祗戴天慈載深感泣不任荷恩榮惕之至謝恩賜進異域歸忠傳兩卷序中改奉敕撰奉宣卿所進異域歸忠傳兩卷宜寫賜盟沒斯序中仍云奉敕撰者臣才識淺近學藝空虛輕瀆宸嚴方懷兢惕豈望聖慈弘貸時假寵光頒賜歸國之臣仍榮奉敕之字草木乘雨露之澤皆被鮮輝煙霞照日月之光盡成綵繢顧臣璅陋獲奉殊恩竹帛垂榮傳于不朽不任荷恩感戴之至今既奉敕撰序與臣自進不同序中巳改兩處訖謹同封進上如允聖意伏望宣付中書門下謝宣示進黠戞斯朝貢圖深愜于懷狀今日欵義行深至奉宣聖旨卿所進圖傳深愜于懷者伏以陛下大化神明百蠻震疊故逺夷慕義萬里來朝誠宜圖以丹青録於編簡傳之千古以輝威靈臣學術空虛文藝淺薄輒為傳序莫究聖功陛下延納微誠特賜宣示寵渥所及縉紳為榮不任荷恩感戴之至謝贈故蕃維州城副使悉怛謀官狀伏以逺夷率服大國綏懷一失良圖千古不復悉怛謀仰天歸命空壁求降據其款誠巳絶羌戎之望執之為戮實傷義士之心受降之時臣與其盟詛力不能救心實懷慙運屬聖明合申幽枉輒敢論奏豈望聽從陛下用周文之心巳同葬骨念汧城之枉仍賜䇿書臣忝補鈞衡嘗居戎帥仰感玄造陪百羣情臣不任云云謝恩所進瑞橘賦宣付史館狀高品劉傳奉宣聖旨賜臣批示以臣所請宣示史館特賜允從者伏以橘性不遷楚詞所載聖情封植禁籞結根此六合同風九州共貫之應也玄宗朝種柑結實亦是乘太平之休氣道德之仁風事協祖宗實光簡册臣目觀佳瑞慙無潤色之工心感玄猷莫盡揄揚之美豈謂天慈曲被特允微衷擊壤庸音獲知於皇鑒雕蟲薄伎謬列於青編千古光榮百生何幸不任感恩踴躍之至謹奉狀陳謝以聞謝賜讓官批答狀高品馮至珣至奉宣聖旨并賜臣批答以臣昨所陳請未賜允從者蜉蝣淺命未報君恩犬馬微誠敢忘臣節迫以服藥瞑眩抱疾沉羸心力衰殘形氣減耗承訏俞之命或慮闕遺忽奉密之機實憂不逮輒陳誠款兾或聽從陛下特降綸言再加褒飾德音撫慰自合忘生睿奬至深豈敢言病謹當䇿勵疲蹇上副天慈竭盡肺肝以修官業不任荷恩感戴之至謝恩不許讓官表狀今日行深紹宗奉宣聖旨卿大尉官自朕意與不是他門僥求而不得要更引故事辭讓者臣跪受聖旨惶灼無地臣昨者以位高疾仆器滿忌傾實懷瞰室之憂敢喜在閭之賀輒陳微懇退積慙惶陛下察臣孤立事君寵拔皆由於睿監一心守道進取不近於回邪勉以至公絶其辭讓臣敢不秪奉明詔克勵貞規慕孔父益恭之誠遵叔敖愈卑之志豈比罪無所禱孫賈黜於聖人久不自安崔烈詢於厥子仰思眷宸倍積光榮不任荷恩感激之至謹奉狀陳謝以聞謝恩不許讓官表狀兵罷後上表行深紹宗奉宣聖旨豈政理有失風俗有乖何遽退辭一二年分憂不用進表者伏以自古臣得其君最為難遇非龍顔英王良平無以效其謀非日角聖姿冠鄧莫能申其志則知致理不由於臣力成功皆系於上心伏以陛下明過高光德侔天地常制勝於千里之外動合機先不取材於三傑之臣皆躋慮表故能征伐必克擒蹤無遺臣謬忝鈞衡親稟神算竟微獲兔之效內展指蹤又無汗馬之勞外施武力每奉聖詔屢奬丹誠夙夜自思氷炭交集況今四表無事六氣斯和蕭芍可致於治平文軌盡同於玄化時雨既降浸灌何施鴻明照臨爝火宜息昨者輒陳誠懇上黷宸嚴所兾守介石之誠或能回日寧敢慕揮金之樂取適當年陛下至德矜愚深慈宥過寬其罪戾重降恩私唯願盡螻蟻之生勉自陳力豈復顧蜉蝣之命更徇微衷上戴皇明尤增靦懼臣不任云云謝恩加特進階改封衛國公狀奉今月二十七日敕臣封衛公者仰戴天慈獲遂私懇以感以泣榮惕載深伏以支庶嗣候雖存故事玄成以兄有譴乃紹扶陽之封耿霸以父屬愛遂繼牟平之爵開元中蘇頲特封許國公亦無襲字然地居嫡長受則無嫌伏思亡父先臣開國全趙亡兄巳經繼襲未傳臣每念貽謀豈宜不正若苟安殊寵實存幽明輒罄愚衷果蒙聽察況衛國之疆畛密邇叢臺先祖之所成名由兹光大微孫得以啓上實謂至榮祗奉寵章益慚非據臣不任云云謝恩加特進階狀伏奉今月十二日制書授臣散官特進者伏以漢氏之制勛望優隆則位加特進服以文冕列侍清祠榮亞三台品居第二自非學深張禹功重竇融則何以膺是寵章允兹瞻望臣器本凡薄才在下幸遭逢聖明謬忝樞務近者展采清廟祗事圓丘獲親日月之光巳驚殊寵又沐雲霄之澤更荷新恩雖臣殞身豈能上報惟兾飲氷效節介石存誠居若對於神明動罔僣於風雨保其一志少答鴻私臣不任荷恩惕懼之至會昌五年十二月三日宰相對後就宅宣示謝恩不許讓官表狀連宣卿所讓夷等奉欲遂頥養辭位間休今者社稷安謀系在良平況北虜殘孽未殄西戎國內不安除冦靖邊藉卿調鼎遽兹陳退所不忍聞縱纍陳情終不允遂今日奉宣縱纍陳情終不允遂者臣荏苒六年徒竭丹款竟無一善稍補皇猷􅌤冒難居屢祈退免靣請則每慮煩瀆口陳則莫盡肺肝頻以懇誠託於同列因臣不對得為上聞豈意天慈矜愚聖德念舊尚取涓塵之效未徵尸素之尤纍降近日再宣慈旨實恐罄蜉蝣之命無以報天所兾盡犬馬之心唯知戀主仰戴皇澤倍切微衷臣不任云云謝賜錦綵銀器狀中使田獻鍔至奉宣聖旨臣前件錦綵銀器等臣伏聞虞舜舞干而苗人來革周穆徂征而荒服不至即知王者之功莫大於耀德戢兵安人柔逺伏以陛下聖德廣運神武照臨息雷霆之威而蠻夷自服弘天地之德而邊鄙乂安臣願以鴻猷播於蕃師因綴古今之事庶堅忠義之心豈意慈容厚加寵錫班行聳聽里閈生光非止闔門之榮實增後代之價仰慚恩覆倍積兢惶謝恩賜錦綵銀器狀高品劉行宣奉宣聖旨以臣撰真容贊特賜前件錦綵銀器等臣學非稽古文不逮人徒以運遇聖明職叨宰弼宸心向屬榮寵薦加得以淺漏之詞上述鴻明之德敘帝堯之竒表非可強名讚軒后之英威空慙竭思豈謂皇慈曲被厚錫俄霑錦綵耀華麗之文器物呈雕鎪之妙跪受榮感報效無階臣不任會昌二年六月二十九日就宅宣并謝恩問疾狀卿昨日所上表陳情緣多疾病請退守周行朕巳省覽終不允所奏卿實有疾為復别有故如要有備陳宜盡肺肝便進狀來況北虜未歸朝廷事切每有料度皆藉規模且三五年間終未令卿離中書忽有奏章實難允遂如實有疾但將息候痊日須強扶持對來仍斷來章高品駱遂泰至奉宣聖旨者臣承命兢皇不知所處臣緣抱疾嵗久服藥過多形體虛羸筋力不逮實恐妨廢機務轉積愆尤所以輒獻懇誠願辭繁劇每於延英奏事陛下常假慈顔心肺肝懷無所不盡更無他故須有上陳只以衰羸自憂顛仆況臣四海之內孤獨一身唯將赤誠仰戴明主豈敢輒懷願望上負天慈伏望更許兩日將息即兾朝謁臣不任云云謝恩問疾狀高品王克諫至奉宣聖旨卿小有違𥙿昨日於延英面奏乞假將息實疚豫懷且善頥養當就痊平所要內庫食物及藥物無致嫌疑但具數奏來即令宣賜者臣緣常服冷藥十五餘年屬蒲柳年侵衰憊日甚風毒腳氣往往上衝頃刻之間心腹悶痛飯食至少筋力漸羸所以冒昧上陳請三數日在家將息陛下恩深覆育軫父母惟疾之憂德過生成念犬馬至微之命恤問稠疊沉痼頃痊臣食物未得更無所闕天慈下降感極涕零臣不任云云李文饒文集卷第十九
