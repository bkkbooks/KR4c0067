body:
  text: 平泉山居戒子孫記經始平泉追先志也吾隨侍先太師忠公在外十四年上會稽探禹冗歷楚澤登巫山逰沅湘望衡嶠先公每維舟淸眺意有所感必凄然遐想屬目伊川嘗賦詩曰龍門南嶽盡伊原草樹人煙目所存正是北州梨棗熟夢魂秋日到郊園吾心感是詩有退居伊洛之志前守金陵於龍門之西得喬處士天寶末避地逺逰為荒榛首翠微山尚有薇蕨山陽舊徑唯餘竹木吾乃剪荆莾驅狐狸如立班生之宅漸成應叟之地又得名花珍木竒石列於庭際平生素懷於此足矣吾嘗以出處者貴得其道進退者貴不失時古來賢逹多有遺恨至於玄祖潛身於柱史栁惠養德於士師漢代丙曼容官不過六百石終無辱殆邈難及矣越蠡激文牛以肥遁留矦託黃老以辭世亦其次焉范睢感蔡澤一言超然高謝鄧禹見功臣多敗委逺名勢又其次也矧吾者於葵無衛足之智處有不鳴之患雖有泉石杳無歸期留此林居貽厥後代鬻平泉者非吾子孫也以平泉一樹一石與人者非佳也吾百年後為權勢所奪則以先人所命泣而告之此吾志也詩曰維桑與梓必恭敬止言其父所植也昔周人之思召伯愛其所憩之樹近代薛令君於禁省中見先祖所據之石必泫然流涕汝曹可不慕之唯岸為谷谷為陵然巳焉可也平泉山居草木記余嘗覽想石泉公家藏藏書日有園庭草木𬞞則知先哲所尚必有意焉余二十年間三守吳門一蒞淮服嘉樹芳草性之所耽或致自同人或得於樵客始則盈尺今已豐尋因感學詩者多識草木之名為騷者必盡蓀荃之美乃記所出山澤庶資博聞木之竒者有天台之金松琪樹稽山之海棠棐檜剡溪之紅桂厚朴海嶠之香柳木蘭天目之靑神鳯集鍾山之月桂靑颼楊梅曲房之山桂溫樹金陵之珠柏欒荆杜鵑茒山之山桃側柏南燭宜春之柳柏紅豆山櫻藍田之栗梨龍柏其水物之美者荷有蘋洲之重臺蓮美蓉湖之白蓮茅山東溪之芳蓀復有日觀震澤巫嶺羅浮桂水嚴湍廬阜漏澤之石在焉其伊洛名園所有今並不載豈若潘賦間居稱郁棣之藻麗陶歸衡宇喜松菊之猶存爰列嘉名書之于石巳未歲又得畨禺之山茶宛陵之紫丁香會稽之百葉木美蓉百葉薔薇永嘉之紫桂蔟蝶天台之海石楠桂林之俱郍衛台嶺八公之怪石巫峽之嚴湍琅邪臺之水石布于清渠之側仙人迹鹿迹之石列於佛榻之前是歲又得鍾陵之同心木芙蓉剡中之真紅桂稽山之四時杜鵑相思紫苑貞桐山茗重臺薔薇黃槿東陽之牡桂紫石楠九華山藥樹天蓼靑櫪黃心㭠子朱杉龍骨庚申歲復得宜春之筆樹楠稚子金荆紅筆密蒙勾栗木其草藥又得山薑碧百合金松賦并序廣陵東南有顔大師猶子舊宅其地即孔北海故臺豫因晚春夕景命駕逰眺忽覩竒木植於庭際枝似柳松葉如瞿麥迫而察之翠葉金貫粲然有光訪其名曰金松訊其所來曰得於台嶺乃就主人求得一本列於平泉今聞封植得地枝葉茷盛敘其所自作此賦靑春已暮白日將夕經顔子之故巷訪孔公之舊宅美珍木之在庭得嘉名於樵客曩擢本於台嶺近徙根於簷隙其柯肅肅可比於真松其葉纎纎實侔於瞿麥風入葉而成韻露垂柯而流液不受命於嚴霜諒同心於寒柏含春靄而蔥蒨映夕陽而的皪疑翠尾之群翔若金潭之旁射雜爽籟於簧竹混晶光於瑶碧竒樹以垂珠而擅名金松以潛頴而莫覿亦猶處子在於隱淪竒才遺於草澤我有衡宇依山岑寂類仲長之淸曠如蕭宰之窮僻託根此地似在崖壁殊橘柚之不䙲同甘棠之可惜庶封植於園林永愛玩而無斁靈泉賦并序豫林居西嶺平壤出泉廣不逾尋而深則盈尺自東鄰故丞相崔公至谷口故丞相司徒李公凡别墅五六皆謂之平泉實彂源於此觀其湧不騰沸淡然冽淸冬溫夏寒明媚可鑒其靈泉之藴也豫往歲獲戾放逐再罹謗傷泉必變色久而後復昔傅長虞庭有湧泉以其色在夏則冷涉冬而溫乃為神泉賦况潛靈藴異美過神泉因效長虞所作偶成此賦作擬效一山下出泉厥壤非石隨淺深而見底實秋毫之可柝其瑩若纎埃之映琉璃微蟲之潛琥珀玉瑕瑜而不掩鏡妍媸而盡覿且夫動則廣大止則虛明如君子之絶德乃望表而見情彂源而東百谷皆盈既處高而就下雖遇坎而亦平曩者方聘康衢俄驚覆輒泉色暫晦含晶不彂又如塵掩懸黎霧昏秋月纍夕而翳盈旬乃徹爾其脈引淸泚環匝荆扉淪漣寫照物色殊暉孕蘋藻為瑶碧涵沙皪為珠璣歷長坂而麟爛度小山而雪披若乃砥石於宇析波自沼入虛白而逶迤浮縹淸而繚繞氣潤蘅蘭色滋松篠含逸響於桐林動孤光於溪鳥於是列植芳菊華艷芊綿漬漪瀾而更馥搖霽景而相鮮葉凝夕露叢靄秋煙美楚人之餐英慕胡公之飲泉况復自亭徂溪夤緣數里懸瀑溜於碧潭散浮湍於淸沚乘鷁舳以晨泛聽菱歌而夜起見蒹葭之始香疑湘沅之在此重曰原隰既平泉流既清三徑未荒萬水向榮感棣華之零落愴時鳥之相鳴恐閲水兮日逝且歸來兮養生秋聲賦并序昔潘嶽寓直騎省因感二毛遂作秋興賦况豫百齡過半承明三入髮巳皓白午三參掖坦自中書舍人及淸秋可悲尚書十一丈鵷掖上寮人文大匠聊為此作以俟知音露華肅天氣晶碧空無氛霽海清明當其時也草木隂蟲皆有秋聲自虛無而響作由寂寞而音生始蕭瑟於林野終混合於太清出哀壑而憤起臨悲谷而怨盈朔鴈聽而增逝孤猿聞而自驚此聲也異桐竹之韻非金石之鳴足以動羈人之魄感君子之情况乎臨淄藻思薛縣英名遽興華屋之歎預想曲池之平豈待琴而魂散固聞笛以涕零亦有毁家蔡琰降北李卿聽朔吹之夜動見霜鴻之曉征既慷慨而訴懷獨汍瀾而流纓雖復蘇門傲世秦靑送行詎能寫自然之天籟究吹萬之淸泠客有貞詞瀏湸逸氣縱橫賦掩漏巵之妙文同蟠木之精聊染翰以寫意期報之以瑶瓊牡丹賦并序豫觀前賢之賦草木者多矣靡不言託植之幽深採􅓯之莫致風景之妍麗追賞之歡愈至於體物良有未盡惟牡丹未有賦者聊以狀之僕射十一丈蔚為儒宗詞賦之首聲氣所感或能相和又見陳思王賦序多言命王粲劉稹繼作今亦效之邀侍御裴舍人同作青陽既暮鷃鴠巳鳴念蘭若之方歇歎桃李之隂成惟翠華之艷爚傾百卉之光英抽翠柯以布素粲紅芳而彂榮其始也碧海霄澄􅌐珠躍出深波曉霽丹梓吐實煥神龍之銜燭皎若木之並日其盛也若紫芝連葉鴛雛比翼奪珠樹之鮮輝掩非煙之竒色倐忽摛錦紛葩似織其落也明豔未褫紅衣如脫朱草柯折珊瑚枝碎霞既皪而轉研紅欲消而猶綷爾乃獨含芳意幽怨殘春將獨立而傾國雖不言兮似人觀其露彩猶泫日華初照燁其晨葩情若微笑色雖美而自艷類河汾之窈窕逮乎的皪含景離披向風鉛華春而思蕩蘭澤晚而光融情放縱以自得凝若煥之冶容既而華豔恍惚繁華遽畢驚寶雉之乍回想江妃而復出望獻璫之玉俄以蔽光感懷珮之川悵然如失客顧余曰勿謂淑美難久徂芳不留彼妍華之閲世非人夀之可儔君不見龍􅋮閈宏池臺御溝堂挹山林峯連萃樓有百歲之芳叢舍甲第猶今京師精牡丹在有天寶中無昔日之通俠豈暇當飛霍之時始嗟零落且欲同樹萱之意聊自忘憂􅊨􅊨近於伊川卜山居將命者畫圖而至欣然感聊賦此詩兼寄上浙東元相公大夫使求靑田胎化鶴歲作乙巳弱歲弄詞翰遂叨明主恩懷章過越邸建斾守吳門西圯隂難駐東臯意尚存慙逾六百石愧負五千言寄世知嬰繳辭榮類觸藩欲追綿上隱况近子平村邑有桐鄉愛山餘黍谷暄免非逃相地乃是故侯園野竹多微徑岩泉豈一源映池方樹密傍澗古藤繁卭杖堪扶老牛巳服轅只應將唳鶴幽谷共翩翻憶平泉山居贈沈吏部一首中書作昔聞羊叔子茅屋在東渠豈不念歸路徘徊畏簡書乃知軒冕客自與田園踈歿世有遺恨精誠有所如嗟豫寡時用風志在林閭雖抱山水癖敢希仁智居清泉繞舍下修竹蔭庭除幽徑松蓋密小池蓮葉初從來有好鳥近復躍鯈魚少室映川陸鳴臯對蓬廬張何舊寮宷金門寮故也豫與吏部乃相勉在懸輿常恐似伯玉瞻前慙魏舒夏晚有懷平泉林居宜春作孟夏守畏途捨舟在徂暑愀然何所念念我龍門䲧密竹無蹊徑高松有四五飛泉鳴樹間颯颯如度雨􅌲桂秀層嶺芳蓀媚幽渚稚子候我歸衡門獨延佇誰言聖與哲曾是不懷土公旦既思周宣尼亦念魯矧余竄炎裔日夕誰晤語眷闕悲子牟班荆感椒舉悽悽視環玦惻惻步庭廡豈待莊舄吟方知倦羇旅早秋龍興寺江亭間眺憶龍門山居寄崔張舊從事宜春作江亭感秋至蘭徑悲露泫粳稻秀晚川杉松鬱晴巘嗟豫有林壑茲夕念原衍緑篠連嶺多靑莎近溪淺淵明菊猶在仲蔚蒿莫剪喬木粲凌苕隂崖積幽蘚遙思伊川水北渡龍門峴蒼翠雙闕間逶迤清灘轉故人在鄉國歲晏路悠𬗟惆悵此生涯無由共登踐比聞龍門敬善寺有紅桂樹獨秀伊川嘗於江南諸山訪之莫致陳侍御知豫所好因訪剡溪樵客偶得數株移植郊園衆芳色沮乃知敬善所有是蜀道菵草徒得嘉名因賦是詩兼贈陳侍御金陵作昔聞紅桂枝獨秀龍門側越叟遺數株周人未嘗識平生愛此樹攀玩無由得君子知我心因之為羽翼豈煩嘉客譽且就清隂息來自天姥岑長疑翠嵐色芬芳世所絶偃蹇枝漸直瓊葉潤不凋珠英粲如織猶疑翡翠宿想待鵷雛食寧止暫淹留終當更封植懷山居邀松陽子同作我有愛山心如飢復如渴出谷一年餘常疑十年别春思巖花爛夏憶寒泉冽秋憶泛蘭巵冬思玩松雪晨思小山桂暝憶深潭月醉憶剖紅梨飯思食紫鱖坐思藤蘿密步憶莓苔滑晝夜百刻中愁腸幾回絶每念羊叔子言之豈常輟人生如意事十乃居七八我未及懸輿今猶佩朝紱焉能逐麋鹿便得遊林樾范恣滄波舟張惟赤松列惟應詎身恤豈敢忘臣節器滿自當欹物盈終有缺從茲返樵徑庶可希前哲思歸赤松村呈松陽子昔人思避世惟恐不深幽禽慶潛名嶽鴟夷漾釣舟顧余知止足所樂在歸休不似尋山者忘家恣逺逰近臘對雪有懷林居蓬門常晝掩竹徑寂無人鳥起飄松霰􅍪行動谷榛應闕禽魚侣闕與薜蘿親遙憶平臯望溪煙巳彂春李文饒别集卷第九李文饒别集卷第十平泉山居草木記思山居一十首淸明後憶山中遙思寒食後野老林下醉月照一山明風吹百花氣飛泉與萬籟髣佛疑簫吹不待曙華分巳應喧鳥至題寄商山石綺皓巖中石嘗經闕隱淪紫芝歌幾曲紅蘚閟千春聊用支琴尾寧惟倚病身自知來處所何暇問嚴遵憶種苽時尚平方畢娶踈廣念歸期澗底松成蓋簷前桂長枝徑間芳草合山靜落花遲雖有苽園在無因及種時春日獨坐思歸壯齡心巳盡孤賞意猶存豈望圖麟閣惟思卧鹿門無謀堪適野何力可拘原只有客身去幽山自灌園思登家山林嶺自知無世用只是愛山逰舊有嵇康懶今慙趙武偷登巒未覺疾泛水便忘憂最惜殘筋力捫蘿遍一丘思鄉園老人常羡蓽門翁所思惟歲稔遙知松月曙尚在山􅙘寢蘭氣入幽簾禽言傍孤枕晨興步巖徑更酌寒泉飮寄龍門僧龍門有開士愛我春潭碧淸景出東山間來玩松石應憐林壑主逺作滄溟客為我謝此僧終當理歸䇿憶藥苖溪上藥苖齊手茸正堪掇皆能扶我夀豈止堅肌骨味掩商山芝英逾首陽蕨豈如井谷士只得香泉啜水是湖廣者南陽甘谷有菊憶村中老人春酒叟善釀有劉揚二二叟茅茨下清晨飮濁醪雨殘紅芍藥風落紫櫻桃巢燕㗸泥疾簷蟲挂網高間思春谷事轉覺宦途勞憶葛勝木禪床憶我齋中榻寒宵幾獨眠管寧穿亦坐徐孺去常懸蟲網垂應遍苔痕染更鮮何人及身在歸對老僧禪初夏有懷山居山中有所憶夏景始淸幽野竹隂無日巖泉冷似秋翠岑當纍榭皓月入輕舟只有思歸夕空簾且夢遊張公超谷中石鼓篋依緑槐橫經起秋霧有時連嶽客尚辦絃歌處自豫去幽石誰人襲芳杜空留古苔石對我岩中樹初歸平泉過龍門南嶺遙望山居即事初歸故鄉陌極望且徐輪近野樵蒸至平泉煙火新農夫饋雞黍漁子薦霜鱗惆悵懷楊僕慚為關外人伊川晚眺桑葉初黃梨葉紅伊川落日盡無風漢儲何假終南客角里先生在谷中潭上喜見新月簮組十年夢園廬今夕情誰憐故鄊月復映碧潭生皓彩松上見寒光波際輕還將孤賞意暫寄玉琴聲郊外即事奉寄侍郎大尹高秩慙非隱間林喜退居老農爭席坐稚子帶經鋤竹徑難回騎仙舟但跂豫豈知陶靖節秪自愛吾廬山居遇雪喜道者相訪幽居近谷西喬木與山齊野竹連池合巖松映雪低喜君來白杜值我在靑溪應笑於陵子遺榮自灌畦雪霽晨起雪覆寒溪竹風卷野田蓬四望無行迹誰憐孤老翁洛中士君子多以平泉見呼愧獲方外之名因以此詩為報奉寄劉賔客非高柳下逸自愛竹林間才異居東里愚因在北山徑荒寒未掃門設晝長關不及鴟夷子悠悠煙水間早春至言襌公法堂憶平泉别業金陵作昔我伊原上孤逰竹樹間人依紅桂靜鳥傍碧潭間松蓋低春雪藤輪倚暮山永懷桑梓邑衰老若為還峽山亭月夜獨宿對櫻桃花有懷伊川别墅作金陵皎月照芳樹鮮葩含素輝愁人惜春夜逹曙想巖扉風靜隂滿砌露濃香入衣恨無金谷妓為我奏思歸春暮思平泉雜詠二十首淮南作自此並望伊川逺村寒食後細雨度川來芳草連溪合梨花映墅開槿蘺懸落照松徑長新苔向夕亭臯望逰禽幾處回潭上紫藤故鄉春欲盡一歲芳難再巖樹巳靑蔥吾廬日堪愛幽溪人未去芳草行應礙遙憶紫藤垂繁英照潭黛書樓晴望幽居人世外久厭巿朝喧蒼翠連雙闕微茫認九原山南名臣丘壠東望盡見萬安殘紅映鞏樹斜日照轘轅薄暮柴扉掩誰知仲蔚園西嶺望鳴臯山高秋對涼野四望何蕭瑟逺見鳴臯山靑峯原上出晨興採薇蕨向暮歸蓬蓽詎假數揮金餐和養餘日瀑泉亭向老多悲恨悽然念一丘巖泉終古在風月幾年逰􅌲閣饒佳樹菱潭有釣舟不如羊叔子名與峴山留紅桂樹心因以為號此樹白花紅欲求塵外物此樹是瑶林後素合餘絢如丹見本心妍姿無點辱芳意託幽深願以鮮葩色凌霜照碧潯金松出天台山台嶺生竒樹佳名世未知纎纎疑大菊落落是松枝照日含金晰籠煙漾翠滋勿言人去晚猶有歲寒期月桂出蔣山淺黃色何年霜夜月桂子落寒山翠幹生巖中金英在人間幽崖空自老淸漢未知還惟有涼秋夜嫦娥未暫攀山桂此花紫色英藻繁吾愛山中樹繁英滿目鮮臨風飄碎錦映日亂非煙影入春潭底香凝月榭前豈知幽獨客賴此當朱絃柏枝葉盡舟四别樹經霜暫聞有三株樹惟應祕閬風珊瑚不生葉朱草又無叢未若凌雲柏常能終歲紅晨霞與落日相照在巖中蓀溪蓀花紫色生茅山東溪楚客重蘭蓀遺芳今未歇葉抽淸淺水花照暄妍節紫艷映渠鮮輕香含露結離君若有贈暫與幽人折流杯亭激水自山椒析波分淺瀨回環疑古篆詰曲如縈帶雪訴羽觴遲惟觀親友會欲知中聖處皓月臨松蓋東溪近蓄東溪水悠悠起渌波綵鴛留不去芳草日應多夾岸生竒篠緑巖覆女蘿蘭橈思無限為感濯纓歌鸂􅴞清沚雙鸂􅴞前年海上雛今來戀洲嶼思若在江湖欲起搖荷蓋間飛濺水珠不能常泛泛惟作逐波鳬西園西園最多趣永日自忘歸石瀨流清淺峯岑淡翠微曉翻紅藥艷晴鳥碧潭輝獨望姢姢月宵分未掩扉海昔見歷陽山雞籠巳孤秀今看海嶠樹翠蓋何幽茂霰雪詎能侵霜雪不侵此樹枝葉密煙嵐自相揉攀條獨臨憩况值清隂晝雙碧潭清剡與嚴湍潺湲皆可憶適來玩山水無此秋潭色莫辦幽蘭叢難分翠禽翼遲遲洲渚步臨眺忘飱食竹徑野竹自成徑繞溪三里餘檀欒被層阜蕭瑟蔭淸渠日落見林靜風行知谷虛田家故人少誰肯共焚魚花藥欄續常可留玩花藥四時相蕙草春已碧蘭花秋更紅四時彂英豔三徑滿芳叢秀色濯清露鮮輝搖惠風王孫未知返幽賞竟誰同自敘遊五嶽非尚子遍五嶽徑雖深遍逰心巳蕩苟能知止足所遇皆清曠七十難可期一丘乃微尚遙懷少室山常恐非吾望首夏淸景想望山居嘉樹隂初合山中賞更新禽言未知夏蘭徑尚餘春散滿蘿垂帶扶踈桂長輪丹靑寫不盡宵夢歎非真纍榭空留月虛舟若待人何時倚蘭棹相與掇汀蘋思平泉樹石雜詠一十首釣臺我有嚴湍思懷人訪故臺客星依釣隱仙石逐槎回倒影含淸沚凝隂長碧苔飛泉信可挹幽客未歸來似鹿石林中有竒石髣佛獸潛行乍似依巖桂還疑食野蘋葺長緑鮮映班細紫苔生不是見羇者何勞如頓纓海上石笋常愛仙都山竒峯千仞懸迢迢一何逈不與衆山連忽逢海嶠石稍慰平生憶何以似我心亭亭孤且直疊潺湲桂水湍潄石多竒狀鱗次冠煙霞蟬聮疊波浪今來碧梧下逈出秋潭上歲晚苔蘚滋懷賢益惆悵重臺美蓉美蓉含露時秀色波中溢五女襲朱裳重重映皓質晨霞耀丹景片片明秋日蘭澤多衆芳妍姿不相匹白鷺鷀余心憐白鷺潭上日相依拂石疑星落凌風似雪飛碧沙常獨立淸景自忘歸所樂惟煙水徘徊戀釣磯海魚骨昔日任公子期年釣此魚無由見成嶽聊喜識專車皎皎連霜月高高映碧渠陶潛雖好事觀海只披圖泛池舟桂舟蘭作枻芬芳皆絶世只可弄潺湲焉能濟大川樹懸涼夜月風散碧潭煙未得同魚子菱歌共扣舷舴艋舟無輕舴艋舟始自鴟夷子雙闕挂朝衣五湖極煙水時逰杏壇下乍入湘川裏永日歌濯纓超然謝滓塵二猿釣瀨水連漪富春山合沓松上夜猿鳴谷中淸響合衝網忽見羈故山從此辭無由碧潭飲爭接緑蘿枝思在山居日偶成此詠邀松陽子同作間思昔歲事忽忽念伊川乘月步秋坂滿山聞石泉回塘碧潭映高樹緑蘿懸露下呌田鶴風來嘶晚蟬懷茲長住夢歸去且無緣幽谷人未至蘭苕應更鮮作乘興乘月一重憶山居六首平泉源出谷才浮芥中園巳濫觴逶迤過竹塢浩渺走蘭塘夜靜聞魚躍風微見鴈翔從茲東向海可泛濟川航泰山石兖州從事所寄雞鳴日觀望逺與扶桑對滄海似鎔金衆山如點黛遙知碧峯首獨立煙嵐內此石依五松蒼蒼幾千載巫山石十二峯前月三聲猿夜愁此中多怪石日夕潄寒流必是歸星渚先求歷斗牛斗牛分楊州是還疑煙雨霽髣佛是嵩丘羅浮山番禺連帥所遺龍伯釣鼇時蓬萊一峯坼是蓬萊邉山浮來裴淵廣州記羅浮山飛來碧海畔遂與三山隔其下多長溪有七十二長溪茅君內傳山下潺湲宗亂石知君分如此贈逾荆山壁漏潭石魯客見遺常疑六合外未信漆園書及此聞溪漏方欣驗尾閭大哉天地氣呼吸有盈虛美石勞相贈瓊瑰自不如釣石於溪人處求得嚴光隱富春山色溪文碧所釣不在魚揮綸以自適余懷慕君子且欲坐潭石持此返伊川悠然慰衰夕懷伊川郊居衰疾常懷土郊園欲掩扉雖知明目地不及有身歸鞏樹秋隂遍伊原霽色微此生看白首良願已應違晨起見雪隱山居忽憶巖中雪誰人拂薜蘿竹梢低未舉松蓋偃應多山溜隨冰落林􅍪帶霰過不勞聞鶴語方奏苦寒歌憶平泉雜詠憶初暖今日初春暖山中事若何雪開喧鳥至澌散躍魚多幽翠生松柏輕煙起薜蘿柴扉常晝掩惟有野人過憶辛夷辛夷金陵余赴欲門昔年將出谷幾日對辛夷倚樹憐芳意攀條惜歲滋淸隂須暫憩秀色正堪思只待揮金日殷勤泛羽巵憶寒梅寒塘數樹梅常近臘前開雪映緣巖竹香侵泛水苔遙思淸景暮還有野禽來誰是攀枝客茲辰醉始回憶藥欄野人清旦起掃雪見蘭芽始畎春泉入惟愁暮景斜未抽萱草葉才彂欵冬花誰念江潭老中宵旅夢賖憶茗芽谷中春日暖漸憶掇茶英欲及清明火能銷醉客酲松花飄鼎泛蘭氣入甌輕飮罷間無事捫蘿溪上行憶野花余未嘗春到故園雖逰洛陽道未識故園花曉憶東溪雪晴思冠嶺霞谷深蘭色秀村逈柳隂斜悵望龍門晚誰知小隱家憶春雨春鳩鳴野樹細雨入池塘潭上花微落溪邉草更長疏風白鷺起拂水綵鴛翔最羡歸飛燕年年在故鄉憶晚眺伊川新雨霽原上見春山緱嶺晴虹斷龍門宿鳥還牛羊平野外桑柘夕煙間不及鄉園叟悠悠盡日間憶新藤遙聞碧潭上春晚紫藤開水似晨霞照林疑綵鳯來淸香凝島嶼繁艷映莓苔金谷如相並應將錦帳回憶春耕郊外杏花坼林間布榖鳴原田春雨後溪水夕流平野老荷蓑至和風吹草輕無因共沮溺相與事巖耕余所居平泉村舍近蒙韋常侍大尹特攺嘉名因寄詩以謝未謝留侯疾常懷仲蔚園間謡紫芝曲歸夢赤松村忽攺蓬蒿色俄吹黍谷喧多慙孔北海傳教及衡門山信至説平泉别墅草木滋長地轉幽深悵然思歸復此作忽聞樵客語慙慰野人心幽徑芳蘭密間庭秀木深􅍪麚來澗底鳬鵠遍川潯誰念滄溟上歸歟起歎音臨海太守惠豫赤城石報以是詩聞君採竒石剪斷赤城霞潭上倒虹影波中搖日華仙巖接絳氣溪路雜桃花若值客星去便應隨海槎前相國贊皇公早葺平泉山居暫還憩旋起赴詔命作鎮浙右輒抒懷賦四言詩一十四首寄正議大夫行尚書兵部侍即集賢殿學士賜紫金魚袋裴潾動復有原進退有期用在得正明以知微夫惟哲人會且有歸靜固勝熱安每慮危將憩於盤止亦先機右一植慶在根鍾福有兆珠潛巨海玉藴昆嶠披室生白照夜成晝揮翰飛文入侍左右出納帝命弘茲在宥右二歷難求試執憲成風四鎮咸人三階以融捧日柱天造膝納忠建儲固本樹屏息戎彼狐彼鼠窒穴掃蹤右三我力或屈我躬莫沔三黜如飴三起惟懼再賓為龍一麾為飫昔在治繁常思歸去今則合契行斯中慮右四有鳯自南亦􅔘其羽好姱佳麗于伊之滸五彩含章九苞合矩佩仁服義鳴中律吕我來思卷薄言遵渚右五鑿龍中闢伊原右奔下有祕洞豁起石門竹澗水橫松架雪屯岫環如壁巖虛若軒朝昏含景夏淸冬溫右六南溪回舟西嶺望踈水遠如空山微似二室峯連四山駢聳玉女乍欹玉華獨踊雲翔日耀如戴如拱右七飛泉挂空如決天潯萬仭懸注直貫潭心月正中央洞見淺深群山無影孤鶴時吟我嘯我歌或眺或臨右八鳥之在巢風起林搖退翔城顛翠亂捫天雨止雲旋亦息于淵人皆知進我獨止焉人皆務明我獨晦焉邈矣其山默矣其泉右九寢丘之田土山之上孫既貽謀謝亦遐想儉則為福華固難長寧若我心一泉一壤造適為足超然孤賞右十其風自西言彂帝庭飄彼黃素墮於山楹公拜稽首靡敢受榮宸嚴再臨俾撫百城戀此莫處星言其征右十一公昔南邁我不反覩言旋舊觀莫獲安語今則不遑載騫載舉離憂莫寫歡好曷敘愴矣東望泣涕如雨右十二山嵇之舊劉盧之恩舉世莫尚惟公是敦哀我蠢蠢念我諄諄振此鎩翮扇之騰翻斯德未報抵誓子孫右十三迢迢秦塞南望吳門對酒不飮設琴不鼓何以代面寄之濡翰何以寫懷詩以足言無密玉音以慰我魂右十四開成元年九月相公以太子賓客分司東都九月十九日逹洛下安居於平泉別墅潾輒述公素尚賦四言詩兼述山泉之美未及刻石其年十一月二十一日除浙西觀察使寵兼八座亞相之重十二月四日彂赴任開成二年有潾自兵部侍郎除河南尹乃於河南𪠘中自書于石立於平泉之山居開成二年九月二十五日河南尹裴潾題諸書載平泉花木劇談録李德𥙿東都平泉莊去洛城三十里卉木臺榭若造仙府有虛檻對引泉水縈回疏鑿像巫峽洞庭十二峯九派迄於海門江山景物之狀以間行徑有平石以手磨之皆隱隱見雲霞龍鳯草樹之形初德𥙿營平泉逺方之人多以異物奉之有題平泉詩曰隴右諸侯供語鳥日南太守送名花賈氏談録贊皇公平泉莊周圍十里構臺榭百餘所今基址猶存天下竒花異草珍松怪石靡不畢致其間故德𥙿自製平泉草木記今悉蕪絶唯鴈翅檜珠子柏蓮房玉藻等蓋僅有存焉鴈之翅珠子柏柏實鴈翅檜葉婆娑如鴻蓮蘂跗蕚上花分五朵而實同一房皆如白珠子藂生葉上香聞數十步怪石名品甚衆多為洛城有力者取去女道二字石上皆刻唯禮星石及師子石今為陶學士徙置梨園别墅尺餘有文理成斗極禮星石縱廣一丈厚通貫其狀如師子首尾眼鼻皆具足之象師子石高三四尺孔竅千萬遞相河南志河南長殿南有婆娑亭貯竒石處世傳李德𥙿醒酒石以水沃之有林木自然之秋今謂婆娑石蓋以樹名五代史張全義字國維監軍嘗得李德𥙿平泉醒酒石德𥙿孫延古因託全義復求之監軍忿然曰自黃巢亂後洛陽園池無復能守豈獨平泉一石哉全義嘗在巢賊中以為譏巳因大怒奏笞殺監軍者李文饒别集卷第十
