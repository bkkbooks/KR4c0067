body:
  text: 論貨殖論近世良相論近世節士論折群疑相論禱祀論黃冶論祥瑞論冥數有報論周秦行紀論牛僧孺周秦行紀附梁武論喜徴論貨殖論欲知將相之賢不肖視其貨殖之厚薄彼貨殖厚者可以曰天機斡河嶽使左右貴倖役當世奸人若孝子之養父母矣隂陽不能爲其冦寒暑不能成其疾鬼神不能促其數雷霆不能震其邪是以危而不困老而不死縱人生之大欲處將相之極休兄弟光華子孫安樂昔公孫朝穆好酒及色而不慕荣禄鄧析猶謂之真人况兼有荣樂乎後世雖有貶之者如用斧鉞於糞上施桎梏於朽株無害於身矣則大易之害盈福謙老氏之多藏厚亡不足信矣昔秦時金䇿謂之夭醉豈夭之常醉㢤故晉世唯貴於錢神漢台不慙於銅臭謂子文無兼曰之積顔氏樂一瓢之飮晏平仲祀不掩豆儀休相以㧞葵皆爲薄命之人矣如嚮者四賢天與之生則生天與之夀則夀窮逹夭夀皆在彼蒼而望貴倖之知奸人之譽終身不可得矣余有力命賦以致其意庻後之知我者興歎而巳近世良相論客謂余曰楊子灋言有重黎顔騫二篇顔子名犯廟諱不書品藻漢之將相敢問近代良相可得聞乎余曰唯唯夫股肱與若同體四海之所瞻也恩義至重實先於愛敬非社稷大計不可以強諌亦猶父有諍子不獲已而諍豈可以爲常也唯宜將朙獻替致其主於三代之隆孝經曰天子有諍臣七人非宰相之職也必求端士正人以當言責導其謇諤救其患難而已唯聖人言危而不持顛而不扶則焉用彼相此亦將朙獻替之謂也使其君昭朙令德不至於顛危也漢之良相十數人矣公孫弘開陳其端而不肯廷辯固未可也蕭望之剛不護闕王嘉訐而犯上致元哀二后有信讒邪之惡戮忠直之名此其失者也魏相薛廣德持重守正弼諧盡忠可謂得宰相體矣近世貞以制動思在無邪松栢所以後凋藜藿由是不採貴不患失言必匪躬似薛廣德者鄭丞相陳丞相有之矣此謂故右僕射鄭司徒故左僕射陳司徒麟之爲瑞也仁而不觸玉之爲寳也廉而不劌恕以及物善不近名高朗令終天下無怨似丙博陽者王丞相鄭丞相有之矣此謂故中書王丞相故鄭丞相好古洽聞應變膚敏幾可以成務智足以取捨仁愛樂善勤瘁奉公逄時得君不失其正似倪寛者韋丞相李丞相有之矣此謂故中書韋司空故侍中李司空困於臲卼以盡天涯雖劒光不沉而鸞翮長鎩靈均之九死無悔栁惠之三黜非辜既没不瞑號于上帝似蕭望之者所謂李丞相矣此謂故淮李司空也余亦同病莫保其主知我者以爲忠亦巳鮮矣庻乎數世之後朋黨稍息以俟知音耳近世節士論客又謂余曰近世將相既巳聞之矣敢問士君子身在下位而義激衰世者有其人乎余曰焉得無之丁生魏生是也昔盖寛饒多仇少與在位及貴戚人與爲怨唯諌議大夫鄭昌愍傷寛饒忠直憂國爲文吏所詆挫上書曰山有猛獸藜藿爲之不採國有忠臣姦邪爲之不起寛饒上無許史之屬下無金張之託職在司察直道而行鄭昌可謂好是正直矣梅福南昌一尉耳與王章無薦寵之私無逰宴之好當王鳯之世權歸外戚上書曰䳒鵲遭害則仁鳥增逝愚者蒙戮則智士深退折直士之節結諌臣之舌群臣皆知其非然不敢爭天下以言爲戒最國家之大患也梅福可謂不畏強禦矣余頃歲待罪廟堂六年竊位而言責之官執憲之臣屬薦丁生稱其有清直之操亦有毁之者曰體羸多病必不能舉職余惑是說未及升之於朝而一旦觸群邪犯衆怒爲一孤臣獨夫正言無避亦鄭昌梅福之比也昔貫高竟能以不生白王而高祖賢其然諾戴就不忍以臣謗其君而薛安感其壮節周燕寜恨於不食陸績豈辭於禁錮世歴千祀有此㡬人魏生爲酷吏所逼終不詘服詞義雅正有古人之風亦貫高戴就之儔也鳴呼田叔孟舒皆位顯於朝而魏生亦輿疾逺竄溘盡道途疑其幽魂必上訴於天矣或曰自古名節之士鮮受厚福豈天意於善人薄耶余曰非也夫名節者非危亂不顯非險難不彰免鈇鑕全性命者尚十無二三况福禄乎若使不受困辱不嬰楚毒父母妻子恬然安樂則天下之人盡爲之矣又何貴於名節者㦲折群疑相論夫相之相在乎淸朙将之相在乎雄傑清朙者珠玉是也爲天下所寳雄傑者虎兕是也爲百獸所伏然淸者必得大權不能享豊富雄者必當昌侈不能爲大柄兼而有之者在乎粹羙而巳余頃歲蒞淮海屬縣有旴眙而山多珉玉剖而爲噐淸朙洞澈雖水精朙氷不如也而價不及凡玉終不得爲至寳以其不粹也清而粹者天也故高不可測清而澈者泉也故深亦可察此其大畧也余嘗精而求之多士以才爲命婦人以色爲命天賦是羙者必將有以貴之才高者雖孟嘗眇小蔡澤折額亦居萬人之上色羙者雖鉤弋之拳李夫人之賤亦爲萬乗之偶然不如而粹者必身名俱荣福禄終泰張良是也擇士能用此術可以㧞十得九無所疑也禱祝論語曰丘之禱乆矣又曰祭則受福豈非聖人與天地合德與日月合朙與鬼神合契無所請禱而禱必感通唯牧伯之任不可廢也失時不雨稼穡將枯閉閣責躬百姓不見若非避群望則皆謂太守無憂人之意雖在畎畞不絶歎音余前在江南毁滛祠一千一十五所可謂不謟神黷祭矣然歲或大旱必先令掾屬祈禱積旬無效乃自躬行未嘗不零雨随車或當霄而應其術無他唯至誠而巳将與祭必閒居三日清心齋戒雖禮未中於洞酌而意巳接於神朙所以治郡八年歲皆大稔江左黎庻謳歌至今古人乃有剪瓜致詞積薪自誓精意上逹雨必滂沲此亦至誠也苟誠能逹天性能及物焉用以肌膚自苦燋爛爲期動天地感鬼神莫尚於至誠故備物不足報功禴祭所以受福余以爲人患不誠天之去人不相逺矣黃冶論或問黃冶變化余曰未之學也焉却無有然天地萬物皆可以至理索之夫光朙砂者天地自然之寳在石室之間生雪床之上如初生芙蓉紅苞未拆細者環拱大者處中有辰居之象有君臣之位光朙外澈採之者尋石脉而求此造化之所鑄也倘至人道奥者用天地之精合隂陽之粹濟以神術或能成之若以藥石鎔鑄術則踈矣昔人問楊子鑄金而得鑄人以孔聖鎔冶顔子至於殆庻幾亦恭造化之鑄丹砂矣方士固不足恃劉向葛洪皆下學上逹極天地之際謂之可就必有精理劉向鑄作不成得非天意宻此神機不欲世人皆知之矣祥瑞論夫天地萬物異於常者雖至羙至麗無不爲妖覩之宜先戒懼不可以爲禎祥何以言之栢靈之世多鸞鳯丘墳之上生芝草神僊之物食之上可以凌倒景次可以保永年生於丘墳豈得爲瑞若以孝思所致則瞽瞍之墓曾晢之墳宜生萬株矣何者爲仁孝之瑞唯甘露䧏於松栢縞鹿素烏馴優不去皆有縞素之色足表幽朙之感貞元中余在甌越有隱者王遇好黃冶之術暮年有芝草數十莖産於丹竈之前遇自以爲名在金格暢然滿志逾月而遇病卒齊中書抗有别業在若耶溪忽生芝草百餘莖數月而中書去世文餘姚守盧君在郡時盧君名從有芝草生於督郵屋梁上五綵相鮮若樓䑓之狀其歲盧君爲叛將栗鍠所害置遺骸於屋梁之下並耳自所驗非自傳聞由是而言則褒姒􅌐姬皆爲國妖以禍周晋緑珠窈娘皆爲家妖以災喬石不可不察也又黃河凊而聖人生徴應不在於當世朙矣栁谷玄石爲魏室之妖啓将来之端亦不可不察也是以宜先戒懼以消桑榖雉雊之變耳冥數有報論宣尼罕言性命不語怪神非謂無也欲人嚴三綱之道奉五常之教修天爵以致人爵不欲言冨貴出於天命福禄由於冥數昔衞卜恊於沙丘爲謚巳乆秦塞屬於臨洮名子不窹朝歌未㓕而周流丹烏矣白帝尚在而漢㫁素蛇矣皆兆彂於先而符應於後不可以智測也周孔與天地合德與鬼神合契將来之數無所遁情而狼䟦於周鳯衰於楚豈親戚之義不可去也人倫之教不可廢也條侯之貴鄧通之富死於兵革可也死於女室可也唯不宜以綏終此又不可以理得也而命偶時来盗有名噐者謂禍福出於􅎍懐荣枯生於口吻沛然而安溘然而笑曾不知黃雀逰於茂林而挾彈者在其後也余乙丑歲自荆楚保釐東周路岀方城聞有隱者困於泥塗不知其所如也姓姜不知其名往謂方城長曰居守後二年南行萬里則知憾余者必因天譴譛余者必自鬼謀雖抱至冤不以爲恨也余嘗三遇異人非卜祝之流皆遁世者也初掌記北門有管涔山隱者詣余曰君朙年當在人君左右爲文翰之職然湏值少主余聞之愕𣅿酒然變色隱者亦悔失言避席求去余徐問曰何爲而事少主對曰君與少主巳有累世縁業是以言之余其年秋登朝至朙年正月穆宗纉緒召入禁苑及右丞御史有閩中隱者叩門請見余因下榻與語曰時事非人公不早去冬必作相禍将至矣若亟請居外代公者受患後十年終當作相自西南而入是秋出鎮呉門歲經八稔尋又杖鉞南燕秋暮有邑子王生引鄴郡道士至纔升賔階未及命席謂余曰公當爲西南節制孟冬望舒前節符至矣三者皆與言恊不差歲月自憲闈竟十年居相由西蜀而入代余執憲俄亦竄逐唯再謫南服未嘗有前知者爲余言之豈禍患不可移者神道所秘莫得預聞自古衘冤殁世者多矣冥報之事或有或無遂使好亂樂禍者以神道爲茫昧余嘗論之仁人上哲必逹生知命如顔氏之子犯而不校釋門逹磨了空喻幻必不思報矣其下柔弱無心者力不能報所能報者乃中人耳悍強任氣如伯有灌夫之流亦其在臨殁之際方寸不撓魂魄不散唯結念於此是以能報夫人之捨生也如薪盡火㓕溘然則無能爲矣逹於理者使心不亂則精爽常存不生不㓕自可以超然出世升躋神朙其次精多魄強則能爲厲冥報之事或有或無理在此也周秦行紀論牛僧孺周秦行紀附言發于中情見乎辭則言辭者志氣之来也故察其言而知其內翫其辭而見其意矣余嘗聞太牢氏凉國李公嘗呼牛僧孺曰太牢梁公名不便故不書好竒怪其身險易共行以其姓應國家受命之䜟曰首尾三麟六十年兩角犢子恣狂顛龍蛇相闘血成川及見著玄怪録多造隱語人不可觧其或能暁一二者必附會焉縱司馬取魏之漸用田常有齊之由故自卑秩至于宰相而朋黨若山不可動揺欲有意擺憾者皆遭誣坐莫不測目結舌事具史官劉軻日暦余得太牢周秦行紀周秦行紀附於下反覆覩其太牢以身與帝王后妃冥遇欲證其身非人臣相也将有意於狂顛及至戯德宗爲沈㜑兒以代宗皇后爲沈㜑令人骨戰可謂無禮於其君甚矣懐異志於圖䜟朙矣余少服臧文仲之言曰見無禮於其君者如鷹鸇之逐鳥雀也故貯一作貶太牢巳乆前知政事欲正刑書力未勝而罷余讀國史見開元中御史汝南一作周子諒彈奏牛僊客以其姓符圖䜟雖似是而未合三麟六十之數自裴晉國與余凉國名不便彭原程趙郡紳諸從兄嫉太牢如讎頗類余志非懐私忿盖悪其應䜟也太牢作鎮襄州日判復州刺史樂坤賀武宗監國狀曰閑事不足爲賀則恃姓敢如此耶㑹余復知政事将欲彂覺未有由值平昭義得與劉從諌交結書因竄逐之嗟乎爲人臣隂懐逆節不獨人得誅之鬼得誅矣凡與太牢膠固未嘗不是薄流無頼輩以相表裏意太牢有非望而就佐命焉斯亦信符命之致或以中外罪余於太牢愛憎故朙此論庻乎知余志所恨未暇族之而余又罷豈非王者不死乎遺禍胎於國亦余大罪也倘同余志繼而爲政宜爲君除患暦既有數意非偶然若不在當代其必在於子孫湏以太牢少長咸寘於灋則刑罰中而社稷安無患於二百四十年後嘻余致君之道分隔於朙時嫉悪之心敢辜於早歲因援毫而攄宿僨亦書行紀之跡于後周秦行紀牛僧孺撰余真元中舉進士落第歸宛葉間至伊闕南道鳴臯山下将宿大安民舎㑹暮不至更十餘里一道甚易夜月始出忽聞有異香氣因趍進行不知狀逺見火朙意謂荘家更前驅至一大宅門庭若富豪家黃衣閽人曰郎君何至余荅曰僧孺姓牛應進士落第往家本往大安民舎誤道来此直乞宿無他中有小䯻靑衣出責黃衣曰門外誰何一作門外爲誰黃衣曰有客黃衣入告少時出曰請郎尹入余問誰氏宅黃衣曰第進無湏問入十餘門至大殿殿蔽以珠簾有朱衣紫衣人百數立階下間左右曰拜一有遂拜于字殿下簾中語曰妾漢文帝母薄太后此是廟郎不當来何辱至余曰巨葉苑下将歸失道恐死豺虎敢託命乞宿太后幸聽受太后遣軸簾起席曰妾故漢文君母君子唐朝名士不相君臣幸無簡敬便一作便上殿来見太后着練衣狀貌瑰偉不甚粧飾慰余曰行役無苦乎召坐食頃聞殿内庖厨聲太后曰今夜風月甚善一作佳偶有二女侍一作伴相尋况又遇佳賔不可不成一會呼左右屈兩箇娘子出見牛秀才良乆有二女子從中至從者数百前立者一人挾腰長面多髮不粧衣青衣僅可二十餘太后顧指曰此高祖戚夫人余下拜夫人亦拜更有一人圓題柔臉穩身貌舒光彩射逺近時時好矉多服花繡年低薄后后指顧曰此元帝王嬙余拜如戚夫人王嬙復拜各就坐坐定太后使紫衣中貴人曰迎楊家潘家来乆之空中有五色雲下聞笑語聲䆮近一有太字后曰楊潘至矣忽車音馬跡相雜羅錦綺繡列旁視不給有二女子從雲中下余超侍前立者一人纎腰身修睟容甚閒暇衣黃衣戴黃冠年二十以来太后顧指曰此是唐朝太真妃余即伏謁肅拜如臣禮太真曰妾得罪先帝皇朝不然妾在后妃數中此禮豈不虚乎不敢受却答拜更一人厚肌敏視身小材質㓗白齒極卑被寛博衣太后顧而指曰此齊帝潘淑妃余拜如王昭君妃復拜太后命進饌少焉食至芳㓗萬品皆不得名字粗欲之腹不能足食巳更置酒其噐盡寳玉語太真曰何乆不相㸔太真謹容對曰三郎数幸華清扈從不暇至太后又謂潘妃曰子亦不来何也潘妃匿笑不禁不成對太真視潘妃一有而對曰潘妃向玉奴說懊惱東昏侯二有踈字狂終日出獵故不得時謁太后問余曰今天子一有爲誰余對曰今皇帝名适代宗皇帝長子太真笑曰沈㜑児作天子也太竒太后曰何如主余對曰小臣不足以知君德太后曰然無謙第言之余曰民間傳英朙聖武太后首肯三四太后命進酒加樂樂皆少年女子酒環行数周樂亦随輟太后請戚夫人鼓琴夫人約指以玉環光照手西京雜記云高祖與夫人石錬金環照見指骨引琴而一有鼓字聲甚怨太后曰牛秀才邂逅逆旅到此又諸娘子偶相訪今無以盡平生歡牛秀才盍各賦詩言志不亦善乎遂各授以牋筆逡廵詩成薄后詩曰月寢花宫得奉君至今猶愧管夫人漢家舊日笙歌地煙草幾經秋又春王嬙詩曰雪裏穹廬不見春漢衣雖舊淚長新如今猶恨毛延夀愛把丹靑錯畫人戚夫人詩曰自别漢宫休楚舞不能粧粉恨君王無金豈得迎啇叟吕氏何曽畏木強太真詩曰金釵墮地别君王紅淚流珠滿御床雲雨馬嵬分散後􅌐宫無復聽霓裳潘妃詩曰秋月春風幾度歸江山猶是鄴宫非東昏舊作蓮花地空想曾拖金縷衣再三趣余作詩余不得辭遂應教作詩曰香風引到大羅天月地雲階拜洞仙共道人間惆悵事不知今夕是何年别有善笛女子短鬟衫呉帶貌甚羙多媚與潘氏偕来太后以接坐居之時令吹笛往往亦及酒太后顧而謂曰識此否石家緑珠也潘妃養作妹故潘妃與俱来太后因曰緑珠豈能無詩乎緑珠拜謝作詩曰此地元非昔日人笛聲空起一作怨趙王倫紅牋鈿碎一作紅殘緑碎花枝下金谷千年更不春太后曰牛秀才逺来今夕誰人與伴戚夫人先起辭曰如意成長固不可且不宜如此况實爲非乎潘妃辭曰東昏侯以玉児妃名身死國除不擬負他緑珠辭曰石衞尉性嚴忌今有死不可及亂太后曰太真今朝先帝貴妃固勿言他乃謂王嬙曰昭君始嫁呼韓單于一冇後字復爲姝叅效追一本作爲株絫若䪘單于婦固自用宜苦寒地胡鬼何能爲昭君幸無辭昭君不對低眉羞恨俄各歸休余爲左右送入昭君院會将旦侍人告起得也昭君泣以持别忽聞外有太后命余遂見太后太后曰此非郎乆留地宜亟還便别矣幸無忘何采歡更索酒酒再行戚夫人潘妃緑珠皆泣下竟辭去太后使朱衣人送往大安邸西道旋失使人行往一本作所在字時始朙余就大安里問其人人曰去此十數里有薄后廟余却望廟荒毁不可入非何見者余衣上香經年不歇竟不知其一作如何梁武論所論出於釋氏故全以釋典明之世人疑梁武建佛刹三百餘所而國破家亡其禍甚酷以爲釋氏之力不能拯其顛危余以爲不然也釋氏有六波羅宻檀波羅宻是其一也又曰難捨能捨大者頭目支體其次國城妻子此所謂難捨也余嘗深求此理本不戒其不貪能自㣲不有其寳必不懆人所寳與老氏之無欲知足司城之不貪爲寳其義一也庸夫謂之作福斯爲妄矣而梁武所建佛刹未嘗自損一毫或岀自有司或厚歛垊俗竭經國之費破生人之産劳後不止杼柚其空閏位偏方不堪其弊以徼身福不其悖㢤此梁武所以不免也喜徴論陸賈偁蟢子垂而百事禁不徴其故何也凡人将有喜兆必垂於冠冕余常思之盖以人肖圓方之形禀五行之氣有生之最靈者也如景如火忽有歊然感氣彂於圓首之上其荣盛也如陽氣彂生烟涵煴煦其變衰也如秋氣索然寂寞沉悴雖不能自覩其鍳朙者必可察之唐舉許負疑用此術所以望表而知竆逹何以朙之淑春愛景必有蟢子垂於簷楹之間室有朙燭膏爐必垂於屏幃之際喜氣将盛故集於冠冕之上以此推之無所逃也卷終
