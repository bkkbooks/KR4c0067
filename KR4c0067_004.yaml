front:
  text: 李文饒文集卷第四會昌一品制集
  hash: sha256:0bcd8f62cb4ad8c5bcacb0d89333689471a3aacfcd1a527ae1cd74d6eacda3fc
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4c0067_SBCK_004-1a}
body:
  text: 制授王元逵平章事制授石雄晉絳行營節度使制贈斐度太師制贈陳夷行司徒制贈崔琯左僕射制贈王茂元司徒制贈右衛將軍李安靜制贈蕃維州城副使悉怛謀制授元䀲諌議大夫制授假元遜哥舒嶠等官制問授徐商禮部員外郎制授狄兼謨兼益王傳鄭東之兼益王府長史制授鄭朗等左諌議大夫制授鄭裔綽渭南縣尉直弘文館制授李丕晉州刺史冀代行營攻討副使制授李丕汾州刺史制授王元逵平章事制門下古之命帥必重其名假三事之崇允萬夫之望故韓信以丞相擊魏樊噲以相國伐燕克成茂功賞抑有典成德節度使鎮冀深趙等州觀察處置兼充北靣行營招討澤潞等使金紫光祿大夫檢校司徒兼鎮州大都督府長史御史大夫駙馬都尉雲騎尉王元帥逵生稟忠厚天資信誠竒正得於心機嚴莊表於師律去病之略無假絲吳翁歸之才實備文武屬狡童逆命自固穴巢果能揚義聲以載馳繇直道而先奮鋒逾駭電勢盛疾雷宣士卒上據層巒削成垣壘下臨平壤盡見秋毫始擒伏莽之戎遽拔升天之險尋又陳兵原野漸洗堯山摧困獸之鬪心挫螳螂之怒臂棄甲者萬計折首者千人先獻戎俘益彰臣節則望王師之陳草木為兵聞吾師之風椒蘭比德顧其殘孽豈獲稽誅夫賞不逾時速人為善雖卨敷五教已列三公而禹分兵麾宜佩相印是用命爾升于鼎司於戲昔吳起有大功者三不為魏相竇嬰破藩國者七未踐漢台豈非名器之重曷常虛受爾其奮揚威武殱厥渠魁當感激而成功勿遷延而玩冦服茲休命可不戒哉可檢校司徒同中書門下平章事兼鎮州大都督府長史依前充成德軍節度使鎮冀深趙等州觀察處置兼充北靣招討澤潞等使散官駙馬勳如故主者施行授石雄晉絳行營節度使制門下兵家之䇿戒在勢分故楚為三軍破於英布光武料敵非劉尚之别營葛亮出師制魏延之異道專其大任方見成功斷自朕心授之戎律天德軍豐州四城都防禦本𬋩押蕃落等使兼充晉絳行營諸軍副使銀青光祿大夫檢校左散騎常侍豐州刺史御史大夫上柱國石雄倜儻仗義沉密有謀近者被羽先登搴旗深入剪彼葷允碎其穹廬勇則冠軍威能振敵屬壼關逆命羽檄交馳命征虜奉公之心思成皋過險之將嘉其壯節召自極邉既而亞夫會兵馳六乘之傳庶乎馬武力戰為衆軍之鋒朕以彥佐早升大將之壇久服上公之冕資其碩望任以指蹤鄧禹之鎮關河功雖未遂羊祜之守吳會不必自行罷戎役以會朝待冦寧而撫俗親授方略慰彼蒸黎爰擢奇才付豫重事爾其再申兵法奮起士心去病無以家為勿邀天幸臧宫保於常勝實在貴謀敬聽朕言副茲寵寄可守本官兼充晉絳行營諸軍節度使餘並如故主者施行贈斐度大師制敕堯之舊臣伯益顯庸於舜禹周之元老召公流美於成康永惟其人是屬良相斐度始以謀䇿除害佐烈祖之中興終以忠貞立朝毗纍聖之鴻業經緯之志華皓不衰功勳爛然圖史輝焯姦邪所忌臲卼于時暨氛霧既開魚水將叶條風孰見其喜愠零雨皆美其來歸未踐明廷遽嬰沉痼威鳯莫翔於舊沼虛舟長往於夜川殂謝之初朋黨異義贈典不稱人情鬱然屬告類上玄渙流大號載懷先正宜有褒崇寵既極於維師恩有加於在昔豈必望鄼矦之壟方念茂功過梁道之祠乃思遺美以茲為勸可不務乎贈陳夷行司徒制敕昔柳莊云亡輟宗廟之祭公叔既殁表貞惠之名前代所以追往悼懷飾終加禮永言髦傑宜峻舊章故河中節度晉絳磁隰等州觀察處置等使檢校司徒兼河中尹御史大夫陳夷行身為儒宗位致宰相言必體要行歸于周得壺遂之深忠持顔子之極樂信能感物桃李所以不言思在無邪藜藿由其不採朕纘承鴻業再授鈞衡陳群立朝道無適莫葛亮稱物心匪重輕雖壯趾為災屣步為蹇朕之毗倚方回始終任以建牙暫去巖廊之上射不穿札遂居將帥之間方期永年為我良翰遽聞淪謝痛悼于心是用襚以衮章載之簡册言念舊德尚懷黃髮之謀𬗟想貞風爰舉素絲之節以資縟禮用慰幽魂贈崔琯左僕射制敕孔子以顔再之行首於四科漢代以荀陳之門方於八凱乃眷時哲保茲令名用舉飾終之恩以杼殱良之歎故山南西道節度使銀青光祿大夫檢校吏部尚書兼興元尹御史大夫上柱國崔琯誠明履正粹密鄰幾有子政之精忠得公綽之不欲禮樂二事以為身文仁義五常自成家範往以茂器列于大僚屬賢相受誣廟堂議法用長孺之道以右正人微京兆之言豈聞非罪既是魏其之直益彰王鳯之邪莊色于朝群公聳視讜詞不撓淑問攸歸歷踐名藩皆有遺愛居常慎獨淸則畏知爰自子襟迄于白首厲翼之志終始不渝未陟台階實孤公望追榮左揆式是優祟贈王茂元司徒制敕昔許穆公身殁於師贈以矦服王事加等春秋所書言念勞臣終于盡瘁舉茲盛典用峻彞章王茂元幼則服儒長能習史晚為邉將頗振軍聲近者元戎啓行大旅臨境誓陟羊腸之險寧辭馬革之勞來必挫鋒去者奪魄挑戰孤壘自揭髙旌坐觀爇火之蓬方解迎創之竹必當樽爼制勝枕席還師勢如風霆功在刻漏遽嬰沉痼莫展良圖伏彼之壯勇不衰吕蒙之療護無及日未回於三舍星已旋於再周列諸葛之鼓旗徐驅而返閲祭遵之車騎悼往則深亦既聞其綏復是宜加於衮斂勉爾群帥知豫報功贈右衛將軍李安靜制敕昔班固有言何武王嘉區區以一簣障江河用歿其身朕常以固作一代之典非所以垂法勸後也若觀時以避禍量力以圖全則三綱之道幾於絶矣故右衛將軍李安靜其祖太子少師綱謇諤大節炳於青史安靜聿修厥德不隕令名往者産祿擅朝充躬交亂每念王室殆於阽危不憚芳蘭之焚竟全孤竹之志廣稱遺老坑感憤之詞荀不食言由忠貞之故永懷臣節逺邁前良近者深戒有司下令遴柬惟爾苖裔靡有孑遺昔庭堅不祀臧文所歎仲宣無後魏祖興嗟榮以先王之臣褒以揚名之典懋茲休寵用慰冥魂贈故蕃維州城副使悉怛謀制敕兵家之法地有必爭逺則漢氏之得隂山胸奴慟哭近則張願之城河外朔邉底寧乃眷維州實為險隘有金湯之固居襟帶之衝沒為戎疆垂六十載故蕃維州城副使悉怛謀嘗解辮髮獻其壘垣議臣託以和盟沮其誠欵尋令束縛歸戮虜庭彼獲甘心且無噍類昔常山臨代為全趙之寶符河西絶羌斷西戎之右臂棄茲要害用長冦讎至今蜀人言必流涕豈陳湯之專命由匡衡之廢忠言念始謀久罹幽枉爰加寵贈用慰貞魂授元晦諫議大夫制敕昔汲黯薄淮陽守願出入禁闥補過拾遺則諌爭之任實資諒直我求其比今得正人吏部郎中元晦往在內廷嘗感先顧奮彂忠懇不私形骸俯伏靑蒲至於雪涕數共工之罪不蔽聖聰辨垣平之詐益張文德近因旌别邪正宰弼上言以魯公藏罟莫如置革於左右漢后輯檻孰若列遊於公卿是用命爾登于文陛爾其副我寵擢不替初心勿沽小名以枉大節勉服官業期於有終可授假元遜哥舒嶠等官制授徐商禮部員外郎制敕朝議郎殿中侍御史內供奉上柱國徐商于公以容駟髙閎虞氏以升卿名子其所全活不聞大賢猶誠感幽神慶流苗裔矧乃祖往以淑問嘗為理官屬政在吕宗謀克王室將相陷辟忠良受誣而深念群獄之寃固拒詔使分别楚囚之濫自履危機義激命輕仁為已任有是隂德宜覃後昆爾風度粹和文詞溫麗列於淸憲有貞標既旌先正之忠爰舉賞延之典勉修官業無替家聲可授狄兼謨兼益王傅鄭柬之兼益王府長史制敕古者聖人之教子也皆妙選天下之端士以衛翼之漢代梁王好書則以賈誼經緯之才推明其志淮陽好政則以玄成禮讓之節鎮靜其浮前王令猷百伐良法况朕建立元子錫之粵區朱邸初開黃髮是憲以兼謨慷慨納説有爰絲正席之忠以柬之取捨俟時有貢禹彈冠之操皆行不苟合誠無暗欺歷職有聲居正無撓舉其素行擢在首僚爾宜廣德義之風明孝愛之道俾其嚴於問寢敬不絶馳化與心成中道若性服我休命可不慎歟授鄭朗等左諌議大夫制豫欲左右前後皆得正人朝夕交戒警豫之闕所以分左右而備針諌也思見大儒骨鯁白首耆艾論議通古今喟然動衆心所以增其秩而厚其祿也朝散大夫守諫議大夫兼弘文館學士上柱國鄭朗等皆以貞正守道列於左掖從容諷諫每竭嘉猷况朗璜近因陛見乃能庭爭執以言責本於忠誠昔峻坂乘危爰絲攬轡期門近出次况當車增主之明二臣之力我求端士用繼前良期爾盡規致豫無過拾遺左右汲黯之願已諧祿賜愈多貢禹之誠當勵勉思厥職無沗優思可授鄭裔綽渭南縣尉直弘文館制敕宣議郎前行京兆府參軍驍騎尉榮陽縣開國子鄭裔綽昔漢武帝云有社稷之臣汲黯近之矣𬗟懷先正實邁前良况兩代持衡皆有貞節守正持法遺風凛然爾生於德門且服儒訓黃金不遺唯守於一經白環比德方榮於四代嘉其勵行不隕令名俾從丹地之逰佇繼緇衣之美可京兆府渭南縣尉直弘文館散官勳如故授李丕汾州刺史制賈誼云守圉扞敵之臣誠死城郭封疆聖人有金城者比物此志也若火焚岡而不攺其貞風振野而獨摽其徑臨危自奮見義必為得不寵以命爵列於上賞欣州刺史兼御史中丞李丕幼而倜儻長負不羈才耀奇而頴出智釋結而觹解禦侮是寄益德冠於三軍騷動得人劇孟雄於一敵昔在爾祖志康國屯翼龍而飛既濡其雨露刑馬而誓已表於山河貽厥孫謀載揚休問近者侵生參代盜起汾川保信都之城不為威惕戮邯鄲之使終以節全戎士間行奏章狎至閲其忠欵可謂著明乃眷西河控于大厦文侯舊壤干木遺風以節概著者居之固其宜也勉圖嘉績以保令名可授李丕晉州刺史充冀代行營攻討副使制敕晉謀元帥必有仇軍漢制出師皆立副二所以重戎事而肅王命也李丕頗有大慮常好竒功自為攻拒之書尤邃揣摩之術淬其智創斫未兆之機森其禮干得備嚴之稱暨蟬蛻丹水鵬摶赤霄未及歲暮纍見誠節今以玉璧重地汾河要津俾換圭符用佐樽爼庶乎易行而誘成苖賁之為不胄而驅效葉公之入勉於蕩寇副我知臣可李文饒文集卷第四
