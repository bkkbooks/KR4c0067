body:
  text: 詔敕中量册命時奏請依價相公華夷述便以黠黠戞斯國號皆依蕃書譯字所以不同商爲定戞斯與紇扢斯可汗書與黠戞斯可汗書二附進状與黠戞斯書意附進状賜石雄及三軍敕書賜潞州軍人敕書意賜党項敕書賜劉沔張仲武宻詔二賜張仲武詔賜何重順詔賜張仲武詔意賜彦佐沔茂元詔賜彦佐詔意與紇扢斯可汗書奏宣撰皇帝敬問紇扢斯可汗時屬載陽想彼休泰朕撫臨萬㝢子育群生思致洽和用臻至理將軍踏布等祖等至鍳表具之可汗生戴斗之鄉居寒露之野智謀精果材志沉雄威動龍荒聲馳象魏眷言丕績深用注懐我太宗文皇帝聖德髙於百王英材軼於千古内定諸夏外服百蠻貞觀四年西北蕃君長詣闕頓顙請上尊號爲天可汗是復降璽書西北蕃君長皆偁皇帝天可汗臨綂四夷實自茲始暨貞觀六年太宗遣使臣王義弘至可汗本國將命鎮撫貞觀二十一年可汗本國君長身自入朝太宗授左屯衞将軍堅昆都督至天寳末年朝貢不絶則可汗祖先已受我國家恩德計可汗國中遺老必自流傳朕纉奉不圖思申舊好比聞天寳以後爲回鶻所隔乆阻誠款回鶻自謂天驕罔修仁義肆行殘忍凌虐諸蕃知可汗代爲仇讐果能報國㓕其國邑皆已立君驅彼酋渠盡逾沙漠茂功壯節近代無儔回鶻當中國伐叛之時甞展勲力列聖嘉其大順累降婣親今失國逃亡寄於塞上只合早歸竆欵受朕撫循而乃轉自鴟張益懐狼顧在隂山之外誘惑小蕃乗我無虞即来侵掠恣爲邉患今已四年朕大徵甲兵乆欲除翦比令幽州太原兩道節度使皆充招撫以示綏懐望其悛心猶務含育而凌蔑公主頻擬傷殘馳突邉城敢謀盜竊近太原節度使劉沔不勝其忿潜出偏師乗其譸張使襲牙帳虜衆大潰穹廬盡焚元悪傷殘脫身潜竄已取得太和公主即至闕庭回鶻殘兵不滿千人散投山谷旬日之内必合梟擒朕再見公主良欣深慰可汗既爲讐怨湏盡殘夷儻留餘燼必生後患想遠聞慶快當惬素心聞可汗受氏之源與我同族漢北平太守材氣天下無雙結髪事邉控弦貫石自後子孫多習武畧代爲將門至嫡孫都尉提精卒五千深入大漠單于舉國来敵莫能抗威身雖䧟沒名震蠻貊我國家承北平太守之後可汗又是都尉苗裔以此合族尊卑可知昨聞太和公主爲可汗衆兵所得可汗以同姓之國使遣歸還有以見可汗秉禮義之心重親隣之好朕深用感歎至于涕零公主尋爲回鶻刼奪久不歸國可汗所使使臣皆被誅戮朕言念傷痛至今不忘昨見可汗表求訪公主使公主上天入地必湏覔得今邉將憤惋已立奇功回鶻罪人計日可致即當顯戮以謝可汗况回鶻夷㓕種族必盡與可汗便爲隣國各保舊疆継好息人事同一體從此邉陲罷警弓矢載櫜必當諸部服從皆懐徤羡知我兩國永爲宗盟想可汗明智自有良筭故令太僕卿兼御史中丞趙蕃持節充使以荅深誠質於神明用存大信朕言不貳可不勉歟又自古外蕃皆湏因中國冊命然可弹壓一方亟欲垂命可汗時加美號縁未知可汗之意且遣謝懐行趙罄回日别命使展禮以申和好彼國將相並存問之遣書指不多及與黠戞斯可汗書皇帝敬問黠戞斯可汗将軍諦德伊斯難殊至覧書及領所獻馬百匹鶻十具悉皇帝聰明天禀英姿生質恐德未徧覆愧漢宣兼臨之盛况與彼國壌隔內外非正朔所加禮既不施政豈宜及但以惜可汗宗盟之國顧保先名爲可汗弘遠之謀湏除後患所以具古今禍福往諭至懐昔呼韓單于以郅支尚存國難未靖稱蕃事漢福及子孫之後漢單于比以大父軆漢而安繼襲其號上書款塞永願藩蔽漠南遂致朔塞底寧烽燧永息近則回鶻結大國之援雄長北蕃諸部率從莫敢不服一隅安樂百有餘年此事昭然可汗所覩况今回鶻種類未盡介居蕃漢之間爰及黒車子乆畏其威素服其信慮彼再振常持兩端湏令小蕃知朕親厚可汗棄絶回鶻實在和好分定內附約盟則邪計奸謀無由而入故欲顯加冊命昭示萬方況登里可汗回鶻舊號是國家頃年所賜非回鶻自制此名今回鶻國已破亡理當嫌避朕以可汗先祖往在貞觀身自入朝太宗授以左衞将軍堅昆都督朕思欲継太宗之舊典彼亦宜遵先祖之朙誠便以堅昆爲國施於冊命更加美號以表懿親况堅者不朽之名昆者有後之稱示不忘本豈不美歟朕昨令禮部尚書鄭肅等與彼使臣靣陳大計温仵合将軍等皆諭朕㫖願言結成豈必契徑路之金舉留犂之酒保茲誠信固在厥初頃者回鶻初至塞上請國家精兵十萬送至漠北漸歸本蕃又請借漢界一城養育疲羸以圖興復朕以可汗之故盡不聴從今回鶻是國家叛臣爲可汗讐敵湏去根本方保永安是天亡之時易於攻取古人云天與不取反受其咎可汗湏乗此機便早務芟夷回鶻未㓕以前可汗勿以飲食爲甘弋獵爲樂勵兵秣馬不可暫閑所恨隔在諸蕃國家難於同力儻更近塞豈復稽誅又恐餘孽歸降可汗未能盡戮納有罪之衆受逋逃之臣儻收吾憎必開邉隙則是蕃養虺毒自生勵階前年回鶻宰相等向漢使云李靖擒頡利後國中只有三二十人便卻興復郢在危困尚爾張皇可汗深察此言豈得不慮又聞合羅川回鶻牙帳未盡毁除想其懐土之心必有思歸之志速要平其區落無使孑遺既表成功彼當絶望可汗已攄積年之憤自爲一代之雄至於居處服章皆悉變革焉得安於所習姑務因循則何以震耀北方弹壓諸部朕撫有中夏愛育生靈常恐百姓未安一物失所豈願更廣威畧遥制要荒但縁與可汗方保和盟義同憂樂纎㣲之事皆欲備言想可汗與将相籌謀副茲誠意此使到日必諒朕心郎宜速遣報章此當遣重臣冊命夏熱想可汗休泰将相以下並存問之遣書指不多及進所撰黠戞斯書狀二右今月十三日於閣中靣奉聖㫖令撰書進来者臣請待鄭肅等與語了撰述今撰訖謹進上進所撰黠戞斯可汗書狀右奉宣令臣與書內添堅昆事者縁未審知黠戞斯的是堅昆之後恐湏粗言梗㮣未可明書今已依宣添攺其間有詞意未盡處亦更加添臣學識空虚文理淺近再陳嚴扆伏積兢惶謹連封進賜黠戞斯書附進狀奉宣撰皇帝敬問黠戞斯可汗将軍諦德伊斯難殊至覧書并白馬二疋其悉可汗降精斗極雄朔漠以偁君禀耀麾頭分天街而建國特負英豪之氣夙推綂御之才眷想嘉猷載深寤歎来書云温仵合将軍歸國後漢使不来温仵合去日朕書具云速遣報章此當遣重臣冊命自是可汗未諭此意報荅稍遲此則尋欲遣使只是延望来信又云金石路已隔絶盖爲山川悠遠未得自與可汗封壌接連非是兩國之情猶有阻隔想可汗明識無復致疑又云兩地遣書彼此不㑹且書不可以盡言言不可以盡意况蕃漢文字傳譯不同只在共推赤心永保盟好豈必縁飾詞語以此交歡毎欲思惟先思好意不更疑惑便是明誠又云欲除却兩楹間悪剌此一事最是嘉言縁回鶻雄㨿北方代爲君長諸蕃臣伏百有餘年今可汗掃其空廬大雪讐耻功業既髙於前古威聲以振於北方固當深務遠圖豈可更留餘燼黒車子不度徳量力敢保冦讐則是輕侮可汗獨不嚮化此而可忍孰不可容况可汗前来云求訪公主使上天入地必湏覔得今若舎而不問何以取信朕懐想可汗乗彼盛秋長驅精騎問回鶻逋迯之罪行黒車子後服之誅取若拾遺役無再舉從茲盪定豈不美歟来書又云送公主到彼無一語来縁公主纔離可汗五日便被回鶻刼奪所遣来使盡被殺傷公主二年之中流離沙漠事已隔遠所以不再叙言然趙蕃去日已具感恱之心足表殷勤之意又聞今秋欲移就回鶻牙帳滅其大國便保舊居足使諸蕃畏威回鶻絶望稍近漢境頗謂良圖所云請發兵馬期集去處縁黒車子猶去漢界一千餘里在沙漠之中從前漢兵未甞到彼比聞回鶻深意常欲投竄安西待至今秋朕當令幽州太原振武天徳縁兵四鎮要路出兵料可汗攻討之時回鶻必當潜遁各令邀截便可梟擒此是無是一本字軍期湏合符契想可汗必全大信用叶一心諦徳伊斯難殊朕已於三殿靣對兼賜宴樂並依来表不更滯留朕續遣重臣便申冊命故先逹此首令彼國明知冊命之禮並依回鶻故事可汗爰始立國臨長諸蕃湏示鄰壌情深宗盟義重以此鎮撫誰敢不從宜體至懐共弘遠畧春暖想可汗休泰将相以下並存問之遣書指不多及進所撰黠戞斯書狀右奉宣令臣撰進来者臣詳其表中情款一一報荅盡不闕遺兼不爲文言遣其易㑹縁冊命時湏令其稱蕃事湏云冊命之禮並依回鶻故事若湏更有邀約即待朝廷命使日别賜敕書稍爲允惬謹縁上進未審否賜石雄及三軍敕書敕石雄晋絳宻邇王畿地當襟帶自卿與將士等抳其險要勇冠諸軍捍彼奔衝爲吾砥柱毎尅期深入屡挫狂鋒批亢擣虚導􅑆逰刅永言勲績豈忘於懐昔商伐鬼方三年乃剋周公東征三年不歸憲宗平淮西文宗定滄海士不解甲或三四年想卿等乆在戎行心經此役且士之生代本爲功名仗義從軍固當殉命居平則孝養父母成長則子孫衣食所資無非國力有事則投袂而起負甲先登撫養之息惟此爲報今者纔近半歲未曰勞師功在垂成往無不㨗将士等各宜感勵成此功名上黨既平天下無事從此永安家室不復征行近者楊弃首爲猖狂扇惑亂卒今則身膏齊斧戮及妻孥生爲不忠之人死爲負義之鬼身名俱㓕可不痛㢤諸部既安王師益振乘此聲勢必殄餘妖故令中使宣慰兼賜優賞卿等便湏鼓行而進徑入賊界下營從此駐軍速圖進取勿使功業歸於别帥爵賞在於他人勉務圖副茲厚遇想宜知悉賜潞州軍人敕書意劉稹乳臭騃童未有所識皆是郭誼王恊幸其昏弱矯託軍情妄獻表章欲求継襲志在肆行禍福自擅兵權偁感從諌之恩誓同生死及見山東三郡皆已歸降事迫勢窮歸悪劉稹令其一門受戮便欲自取寵榮不義不忠古無其比朕以誘䧟劉稹皆是此二人販賣圖全義難容捨巳令澤潞冀氏兩路遣軍只取郭誼王恊及同悪之類其他軍人一切不問仍各有優賞後從敕處分如兩道兵馬未到以前有忠義之士先非同惡者能自擒僇郭誼等所與優賞並同斐問王釗例處分已詔石雄王宰到彼不令侵擾軍人百姓如秋毫有犯便按軍法各宜勉思機計共保忠誠勿受姦人扇動妄生疑忌互相告報咸使明知妄生一作妄懷扇動一作扇惑賜党項敕書敕自爾祖歸款國家依附邉塞爲我赤子編於黔黎牛馬蕃孶種落殷盛不侵不叛頗效信誠比聞邉將不守朝章失於綏輯因縁征歛害及無辜念爾遠人莫知控告特命朕之愛子實㧾元戎所冀群師聽命而不敢自專諸部懐怨而有所披訴奉我憲令以保和寧如聞莫顧私恩遂懐慿恃攘奪不避於官物驅掠罔憚於平人擅興甲兵恣行攻刼豈有朝廷內地輙此鴟張道路阻艱商旅殆絶朕便欲詔命諸鎮同力勦除深慮玉石難分善惡同斃今再爲條例各使得宜却令節將指揮許其處斷如是有濫政乗公平並遣廵院奏聞朝廷必爲申理如或不知恩貸猶敢猖狂國有典章必難容捨故茲宣示當體朕懐賜劉沔張仲武客詔敕劉沔等自回鶻本國殘破寄命北邉朕以其艱難之時常效勲力平寧之後結以姻親義切懐柔情深兼愛亦既轉粟賑救降使撫循示信推恩朕無所愧而狼顧塞上䑕守雲中聞有備雖暫移營稍隙復来近塞察其情計殊未歸還朕祗荷丕圖撫臨萬㝢守祖宗之法制思黎庻之义安豈可蓄虺宂於塞垣養蠆毒於懐䄂乗其馳突必欲驅除昔晋侯報楚之功避子玉於三舎然明先車一本作背秦之惠覆孟明於二崤安國庇人大義斯在卿宜遣使告諭明示朕懐如或遲留尚爲巧詐即湏埼角相應臨以兵威勉務良圖副委兹遇賜張仲武詔敕仲武周璵至省表知可汗猶有疑惧近日移营卿自惣戎麾累剪狂冦英威所振桀鷔皆從仁義所綏降附相継昨者可汗来依塞表已在彀中豈謂黠虜之奸心尚懐翻覆柔服之際又此遁逃逺揣虜情必終難保信昔去病深入大漠方殄獯戎近李靖再襲穹廬始擒頡利况卿伐謀制勝才出古人宜選練勁兵掩其無備使吕嘉懐貳而受首孟獲雖縱而必擒特立竒勲永光千古朕已令劉沔旋布却入東徑候卿本道成功即令歸鎮經畧之事全以付卿湏及塞草未靑虜騎方困一舉便剋使無孑遺卿先彂馬歩一萬人於大界原防戍今縁可汗入卿掌握已在網羅豈得更屯精兵守無用之地即宜追赴本道同力剪除縁卿師旅至多費用尤重其出界粮料已令所司依前支給卿宜勉於盡敵以副朕懐賜何重順詔向前句九詞不同與王元逹詔同惟敕重順卿代傳忠孝志在功名朕毎用注心豈忘終食况卿先父當太和之際已有誠款思靖隣封臣節昭彰遐邇稱歎澤潞一軍素聞忠順從前命帥皆是儒臣穆宗以劉悟有歸闕之功委之心膂令居善地鎮靖一方及殂謝之時不能堅守臣節遂使三軍上請以㓜子惣戎其時朝廷因循姑務安靖授以旄鉞事盖從權今從諌疾恙所侵頗聞緜惙昨士奏至大將及下復請劉稹權知軍務朕深惜劉悟一門自夫逸懐以来累代忠節今劉稹又欲自擅墮其門風當撤瑟之辰罔聞憂戚在甞藥之際便窺兵權尤爲臣子所當共弃卿宜訓練戎旅嚴固封疆候彼軍中有變便湏遣書告諭令其三軍送劉稹歸闕請朝廷推新擇帥朕必選舊德重望委之撫循劉稹厚加爵賞别有任用如妄自制置邀求寵荣國家典法亦難寛宥澤潞一鎮與卿事体不同勿爲子孫之謀欲存輔車之勢但能顯立功效自然福及後昆勉務良圖副茲委遇髙秩厚賞無所悋焉賜張仲武詔卿智畧挺生忠誠特著毎陳章奏皆契朕心言念壯猷無忘寤寐今縁從諌疾病頗以深緜深慮將校異謀妄有制置太原地連河朔城府空虚已詔劉沔旋師却歸本鎮又縁回鶻餘燼未㓕塞上湏有防虞藉卿長才列於禦侮邉境戎事悉以副卿宜深體朕懐勉弘方畧控馭朔塞爲我長城當使早殄餘妖永淸絶漠副茲委遇以保功名賜劉沔茂元詔敕古者凉風至白露下天子乃命將厲兵以征不義申令誓衆今則其時况蓐收司刑助天而肅殺金星動色應節而糴芒咨爾帥臣爲予之佑得不敬順天道振揚兵威近有詔書令取七月中旬五道齊進王元逵乆蓄忠憤爲國除殘率兵先諸軍深入其險阻㧞宣務要害之壘絶堯山應援之兵既以㧖咽必當破膽而卿不務疾雷先奮欲以歲月勝彼凡爲將帥誰不樂此豈祭遵之安重致欒伯之遷延且不副於詔書以後期於成德若未可深入亦要先聲宜早進軍速臨賊境樹立城柵羅列旌旗深溝髙壘勿與之戰兼擇猛将時出竒鋒令彼一方疲於奔命如此足分賊勢益壮東師昔趙充國征羗漢宣帝詔曰太白出髙用兵深入敢戰者吉卿宜思古名將早立竒功無執狐疑之心勉務鷹揚之舉國之大事賞罰必行當體朕懐勿稽詔命想宜知悉賜彦佐詔意卿累當大任實惣元戎既行節制之師湏務綏懐之德養威持重屬在於卿至於負羽先登搴旗深入本非將帥之事當假拳勇之材况自古出師皆有副貳臨難則權以相濟料敵則智以相資故韓信伐趙張耳爲貳呉漢征蜀劉尚副軍國朝以来多用此制李勣之取平壌參以道宗李靖之襲隂山副之公謹近者劉沔全師北伐按甲雲州委石雄先鋒太破回鶻朕以石雄近摧醜虜巳著威名久在徐州諳練士卒今輟自天德與卿副湏諸軍卿宜選徐州陳許精兵三千人便令先入勵其猛氣必立竒功倘能挫覆妖巢亦自勲歸元帥勉於率下深務恊心体朕至懐以圖丕績李文饒文集巻第六
