  text: 李文饒文集卷第一會昌一品制集
  hash: sha256:e27aead53a69ec27d894b48686074b951fbc55981101084e7f6d2de0f7ffafab
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4c0067_SBCK_001-1a}
body:
  text: 徽册讃上尊號玉册文仁聖文武至神大孝皇帝真容讃并序上尊號玉册文二年會昌奉敕撰維會昌二年歲次壬戌四月乙丑朔十四日戊寅攝大尉光祿大夫守司空兼門下侍郎同中書門下平章事臣德𥙿銀青光祿大夫守尚書左僕射兼門下侍郎同中書門下平章事臣夷行金紫光祿大夫尚書右僕射兼中書侍郎同中書門下平章事臣拱銀青光祿大夫守中書侍郎同中書門下平章事臣李紳及文武百官金紫光祿大夫檢校司徒兼太子太保臣僧孺等六十五百七十四人言臣聞羲皇首太古之號成湯顯神武之稱我髙祖皇王是憲尊名若古貽厥丕訓為子孫之法豈不善始善述哉矧乃臣唐受命繼體承業理運將至大君以興昊穹所以開至聖也曩者明兩未定帝華不協捨㣧傳聖深惟至公先后所以昭天命也亦猶堯發於唐矦文興於代邸神明之祚不其難哉伏惟皇帝陛下淸明溥鬯光耿四海玄德莫鄰天休大賚日角見表氣志如神爰初定命正心理物如辰居極而天下無邪矣由是昭德塞違尊賢遠佞禹不自滿成不敢康罔盤于田不邇于色自閨壼以施王教由家道而刑國風去比周核名實攬乾綱擇聖紀修舊典協誠質扢嘉壇欵泰一進正臣以端治表禮故老以求讜言遠無蔽獄近無留命祈玄祖而膏雨降祀靈嶽而嘉穀登省刑罰而蓬孛消彂倉廪而螽螟息去歲龍旗承祀大輅親郊捧玉瓉而一獻光靈來格振金石而六變魄寶昭臨然猶古訓是學緝熙于道天文炳煥雲漢其章溫恭敬遜承太任之教和樂愷悌洽戚藩之心德風偃于群黎威霆動乎絶域又以敬養不逮於長樂昭配未升於禰宫每懷嗣徽蒸蒸而慕所以奉若慈訓對越兩儀因心立制永錫其教寬虔劉之罪興惻隱之仁回電收霜為之反汗及單于慕義景附朔邉耀德戢兵謙臨是受至於備文物展國容莫不先甲而布甘澤丁辰而廓隂羽和景晏溫卿靄絪緼斯所謂神祗之心應矣天人之際交矣於是服冕之士戴鶡之倫暨藩矦邦伯黃髮鮐背不謀而進曰陛下玄默天晬輝光日新大矣孝熙四極爰臻誠宜玉版溫潤鏤鴻明之德神寶焜耀薦萬斯之年丕夫大典不可辭也陛下猶謙退固拒至于三四群臣不已乃曰俞哉夫遍覆包含之謂仁極深研幾之謂聖憲度著明之謂文蠻夷震懾之謂武感而遂通之謂神無思不服之謂孝臣等不勝大願謹奉玉册玉寶上尊號曰仁聖文武至神大孝皇帝伏惟陛下乾健不息謙尊而光樂戒其禽戒其荒夀乃侔於殷宗俗乃厚於成康貽燕後昆受福無疆臣德裕等誠歡誠躍頓首頓首謹言上尊號玉册文會昌五年維會昌五年歲次乙丑正月已酉朔一日已酉光祿大夫守太尉兼門下侍郎同中書門下平章事臣德𥙿光祿大夫守尚書左僕射兼門下侍郎同中書門下平章事臣悰朝議大夫守尚書右僕射兼中書侍郎同中書門下平章事臣讓夷朝議大夫守中書侍郎兼户部尚書同中書門下平章事臣崔鉉及文武百官太中太夫太常卿臣孫簡等六千二百二人言臣聞在昔周宣撿抁內侵四扗薄伐以定王國則詩人大其功暨于漢宣北夷乖亂呼韓慕義郅支遠遁則簡䇿著其美惟此二代稱為中興間者開成之未星孛如雲螟飛蔽天先帝戚之黎人懼焉乃授至聖遺大投艱迄茲成功厥有冥數伏惟仁聖文武至神大孝皇帝表應龍翼粹合乾剛神全而正氣凝宇定而天光彂智燭千里動必察微心鏡萬機物來斯應於是三材用四維張建中和之極綴前聖之綱重樞機修法制刑御家之理無出壼之言銷讒邪遠佞幸絶背公之黨退好徑之人內嚴體貌增堂陛之峻外絶締交去輔車之勢古所謂受命於天惟舜獨正也又曰一心定而萬物服惟陛下得之曩者北狄矜功耗蠧中國種類磐牙根柢封殖異術肺腑縞衣如荼挾邪作蠱浸淫宇內倒懸不解百有餘年既而龍祠埡滅携國欵塞質帝女蹙海疆有狼顧平城之心鯨吞咸洛之志爰命梟將搴旗剛旃兵鏖穹廬火烈荆榛揚罽幕碎䡝六羸遁逃貴王生還剗滅妖迹剿除醜類故名王結髮冠帶入臣堅昆稽首鞮譯來獻而又姦臣放命二紀陸梁據太行之固下窺􅏖邑通故絳之道旁睨近關樹其遺孽以竊兵柄議者僉曰精甲十萬積穀十年泉魚不察湯網宜懸陛下雄斷霆聲群疑氷釋揚淸風而掃雲鼓迅雷而破山任馮異則拔天井而振上黨仗吳漢則彂突騎而窺邯鄲壺關夫險山東奪魄屬有戍邉叛將竊彂參墟人心搖蕩異議放肆陛下臨朝而言曰二冦獲罪於天豫所不捨未三旬而定晉地才期年而滅潞子不以金購稀將多降不勞師克粵首馳報非至德感物孰能臻於此乎由是台宰百辟藩屏將帥上言曰成伐東夷而肅慎來賀景剪七國而王室乃安莫不始於武功終致刑措將以禋上帝薦祖宗宜受鴻名以答玄貺陛下猶謙遜而五讓之勤請弗已乃屈已以俞之雲漢為章所以昭法度也神明其德所以成教化也巍乎有功帝堯之則也勤于大道玄祖之訓也臣等不勝大願謹奉玉册玉寶上尊號曰仁聖文武章天成功神德明道大孝皇帝伏惟陛下不有其名以保其成不德其功以戒其盈享殷宗之福致周道之平熙我王度玉振金聲臣德𥙿等誠歡誠躍頓首蝢首謹言仁聖文武至神大孝皇帝真容讃并序仁聖文武至神大孝皇帝御極之五載氣應天和德感人心朝廷四方感一於正以精蕩侵以道勝殘故得風雨時若螽螟嵗息銷逢孛為休氣驅戎狄為懷人北荒堅昆重譯而至厥有窘伐憑阻弄兵陸梁韋顧既伐夙沙自縛武功既成體德昭明前古未聞百王莫致之事皆葳蕤於圖諜矣皇上以為大禹敘九疇敬五事豈不曰貌恭則莊視明則止豫欲作繢傳照審其儀形且夫聖人潛心於天以通神明先定其神而萬物理矣昔之訪具茨期姑射在此而已况乎廣成之戒抱一玄元之去多欲豫所貴道良謂是矣豈眩夫係風之言竒彼淖冰之術從偓佺之所遺堯舜之令命各哉於是圖輕素寫良金擬鑑形於止水若凝視於淸鏡五彩既彰穆穆皇皇居列仙之館近玄祖之光蓋以昭燕翼之謀顯丕承之德矣臣聞古之至聖必有竒相是以黃熊之瑞應於龍體赤精之符協於圖表頎然而長文王所以新天命也體貌多竒漢髙所以威海內也然則繢事之微極於微肖至於天光淸日光明潤非可圖也庶髣佛焉末臣奉詔敢揚言曰唐運中興天授大君軒耀其武堯煥其文北伐撿抁朔漠消氛西伏堅昆稽首稱臣祲生壼關盜起河汾沈機先物雄斷解紛克定群慝竟全大勳八表既寧萬機益勤爰命彩繢載模天真昆閬仙岑峻極秋旻蓬瀛白日光照淸晨涵育如天尊嚴若神輝赫絪緼為龍為雲聖作物覩禎祥以臻宣光孕靈虞熙載甄政建中和金聲玉振太階既平廟器乃陳化下以德持盈以仁四瀆宗海衆星拱辰億萬斯年藻朗日新李文饒文集卷第一
