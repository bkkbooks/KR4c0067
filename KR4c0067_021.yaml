body:
  text: 賦上十三首成都二首黃冶賦并序蜀道有青城峨眉山皆隱淪所託辛亥歲有以鑄金術干余者竊嘆劉向纍世懿德為漢儒宗其所述作振於聖道猶愛信鴻寶幾嬰時僇况流俗之士能無感於此乎因作賦以正之漢武帝遵世承百蠻以寧自謂德成堯禹功高湯武聞升龍於鼎湖乃井心於斯語有方士李少君譎詐丕誕乘邪進取盛稱化丹砂為黃金可以登青霄而輕舉時董大夫侍側帝曰子知其術乎仲舒進曰臣惟聞天地變化聖人鎔範方士之言臣以為諂至如圓方為爐造化為冶鼓風為槖熾陽為火玄黃之氣絪緼和粹禀而生者為仁為智是以生寶實繁終古不匱天地之鎔範鼓鑄也如是及夫堯舜之化大道為罏中和為冶聲教為槖文明為火以法天為造以得賢為寶是以得其鴻名後天難老至於仲尼無位大莫能致猶鑄顏於與冉底於極智聖人之鎔鑄也取類天地字一本有若乃不務逺德營信祕録祈年永久以極嗜欲斯則不由於正道無益於景福帝曰善乃罷方士而去之故得漢道隆盛令名不虧畫桐花鳯扇賦并序成都夾岷江磯岸多植紫桐每至暮春有靈禽五色小於玄鳥來集桐花以飲朝露及華落則烟飛雨散不知其所往有名工繪於素扇以償稚子余因作小賦書於扇上桐始華兮緑江曙粲鮮葩兮泫朝露樹曄曄兮霞舒鳥爛爛兮星布彼嘉桐兮貞且徛當暮春兮彂英𬎼豈鵷雛之珍族又棲託乎瓊枝彼零露兮甘且白涵晚月兮灑鮮澤豈青鳥之靈儔常飲吮乎玉液有嘉穀而不喙有喬松而不適獨美露而愛桐非人間之羽翮逮花落而春歸忽雨散而川寂悵丹穴之何遠想瑤池而已隔爰有妙工圖其麗容宛宛兮若飱珠於芳蘂飄飄兮疑振羽於光風感班姬之素扇空皎潔兮如霞亦有美人增華點絢雀伺蟬而輕䳱畫扇南朝蟬雀尤重女乘鸞而微眄未若繪斯禽於珍箑動凉風於羅薦非欲發長𬒮之清香掩高歌之孤轉庶玉女之提携列崑墟之瑤宴乃為歌曰青春晚兮芳節闌敷紫華兮䕃碧湍美斯鳥兮類鵷鸞具體微兮容色丹彼飛翔於霄漢此藻繪於氷紈雖清秋而已至常愛玩而忘餐再至江南四首通犀帶賦并序客有以通犀帶示余者嘉其珍物古人未有詞賦因杼此作蓋盡其美焉君子以良玉比德豈不以溫潤而近人惟駭雞之至實亦含章而可珍包黃中之粹色彂竒彩之彬彬芝草繞葩而獵葉烟霞異狀而輪囷雖復孕玄兔於月魄隱青鵉於鏡塵顧霄漢之悠逺悵工人之弗真匠者以其靈可禦邪光能遠燭剪截本末彂揮藻縟砥若礪金剸如切玉析以為帶加之盛服御之則祔身禠之則韞櫝似逹人之卷舒不專玩乎掌握矧乎白璧雖美尚不掩瑕何兹物之無玷豈待瑩而增華溫兮如玉氣舒虹粲兮若晨光爍霞彼廓落之繁飾諒無足以稱嗟若乃名山岑寂珍圖譎詭栁谷則麟馬粲然扶風則魚龍隱起徒有象而無施故雖奇而莫擬然則美服珍玩近於禍機虞公滅而垂棘返莊武殘而龍劍飛先哲所以聞象則服防患則微經候委珮而去宣子辭環以歸鼓吹賦鼓吹本軒皇因出師而作前代將相有功目假之今藩閫皆備此樂余往歲剖符金陵有童子六七人皆於此藝特妙每曲宴奏之及再至江南並逾弱冠悲流年之倐忽憶前歡而悽愴乃為此賦追昔吳㑹之年思為衛霍之將懷瀚海而發憤想狼居而在望厭桑濮之遺音感簫鼓之悲壯每聞兹樂心焉猶尚爰有侲童京賦出西頴秀含聰思慮未敢專和發中繁㑹曲折變態不窮交簻爍電揮手成風或纍彂而碎隱或徐辨而從容管孤引以嚖嚖鼓輕投而逢逢若乃清景妍和嘉客來萃登高臺而互動對芳樹而並吹見鵬鶚之爭厲聳壯士之憤氣士怒皆鼓鵬鶚爭壯名吹曲忽疑朔鴈叶於寒煙胡沙蔽於天地其始也若伐木丁丁響連青冥喧禽萬族聲應崖谷其縱也狼羊鬪角奔兕相觸轉石振於崩溪燎野焚於寒竹其終也如風飊暫息萬籟皆肅天地霽而雷霆收川波靜而魚龍伏昔我往矣子襟青青我今來思突而棄兮諒昔人之多感覩移柳而興悽惜歲年之易往歎親好之長暌於是勉其成人再命迭作念所思而不見慨悲翁之蕭索並曲谷所思悲翁音豈殊於今昔情自有於哀樂乃知孔將比於鳴蛙陸反思於唳鶴彼衰退於憂傷並榮華之昭灼白芙蓉賦并序金陵城西池有白芙蓉素蕚盈尺皎如霜雪江南梅雨麥秋後風景甚清漾舟緑潭不覺隆暑與嘉客泛玩終夕忘疲古人惟賦紅蕖未有斯作因以抒思庶得其髣佛焉朱明夕霽佳木凝隂蘭未歇其秀色鳥尚流其好音泛回塘兮清景暮環修渚兮碧流深誠有感於逝節更新於賞心是時黛葉已繁瓊英始彂搖瑞彩於波上挺纎莖於蘋末忽疑臣蚌濯漪暫覩其明月復似處子映松遙覿其氷雪煥列宿於長河耀良於方折㸃白露於葭菼散飛鴻於林樾余乃鼓輕枻入澄瀛池澤中曰瀛楚詞曰楚人呼度柳𣏌越蘭蘅斐回容與放志遺榮近汀洲而菱密出蓮徑而潭平飛鸂􅴞起鵁鶄揮水珠而濺葉􅏒波紋而抗莖傳羽而適性合金絲而寫情管度風而音遠歌臨流而轉清既而稍憩川隂暫遊霄外極望漪瀾靜無夕靄又如游女解珮於漢曲宓妃採蓮於湍瀨舒蘊藻以為席倚立荷以為蓋彂巧笑之芬芳感嘉期之來㑹嗟夫楚澤之中無蓮不紅惟斯華以素為絢猶美人以禮防躬銀輝光而流燭玉精氣而舒虹雖有貴其符采且未匹其華容由是南國之姝以為麗觀延華頸於沼沚曵羅𥚑於磯岸且謂降玄實於瑶池徙靈根於天漢悵霄路兮永絶與時芳兮共玩聽高柳之早蟬悲此歲之過半彼妍姿之昭灼待風雨而消散乃為歌曰秋水濶兮秋露濃盛華落兮歎芙蓉菖花紫兮君不識萍實丹兮君不逢想佳人兮密靜處顔如玉兮無冶容重臺芙蓉賦并序吳興郡南白蘋亭有重臺芙蓉本生於長城章后舊居之側移植蘋洲至今滋茂余頃歲徙根於金陵桂亭奇秀芬芳非世間之物因為此賦以代美人託意焉昔柳惲為吳興太守顧座客而歎曰遊汀洲以採蘋憶瀟湘之故人悲白日之已晚惜青春之不返且欲捨瓊蘃於桂山折瑶華於蘭畹客乃稱曰彼有清川爰生瑞蓮紅葩煒而曄曄翠葉小而田田於常蓮此花大於衆荷而葉小願得薦佳名於君子恱麗色於當年於是縱蘭棹泛淪漣吟朱鷺於笛管鳴鵾雞於瑟絃臨漪瀾以遠望歎華艷之何鮮是日際海澄廓微風不起涵麗景於碧湍爛朝霞於清沚鮮膚秀頴攢立叢倚疑西子之顔配自館娃而戻止逺以意之若珠闕玲瓏疊映崑峯粲玉女之光色抗霓旗以相從迫而察之若桂裳重復鬱撓丹谷思江妃之窈窕發紅羅之紛郁爾其映蘭芷出蘋萍掩萋萋之衆色挺嫋嫋之修莖泫清露以濯秀流鮮飈而彂精雖草木之無情亦獨立而傾城若乃行潦既收秋光始靜見凉野之夕隂悵回塘之餘景思摘芳以贈逺更臨流而引領翡翠失其輝解珠璣奪其光頴惟斯物之特麗宜獨秀於寥天在靈境而何降居下澤而何偏有繁華而不實嗟淑類而莫傳念莊姜之無子非巧笑之未妍彼天意之所屬諒難得而知焉三數年故人間罕有此花無實徙根又不乃為歌曰吳山秀兮烟景媚因淑女兮感斯瑞蓮雖多兮無厥類蘭徒芳兮何足貴人已去兮代不留獨含情兮託茲地山鳳凰賦仰山在群之坤隅高松翳景名翬所集有麗鳥殊色瑞鸚鵡賦殊色出應文如縟繡邑人呼為山鳳凰其毛羽重於身命雖遭繒繳終不奮飛比夫雄雞斷尾則殊知異心矣余感而賦之以貽親友懿靈山之岑寂實珍禽之可依何文章之英麗信羽族之所稀混赤霄而一色與白日而增輝煥若玉女携宓妃凌丹壑兮遊翠微振桂裳兮垂組綬騰鏕駕兮曳鸞旗粲若夭桃彂兮山已春朝霞爛兮露欲晞或飲于澗或集于磯糅關蕖之絳采掩虹霓之夕霏既而衡網高懸虞人合圍身桂纎繳足履駭機畏采毛之摧落不凌厲而奮飛乃知玉之敗也以致其瓊辨翠之焚也猶襲其寶衣何異夫懷祿耽寵樂而忘歸玩軒冕而不去惜印綬而無時嗟乎乘君子之器與茲鳥而同譏孔雀尾賦并序故人以孔雀見遺死於中途將命者提挈作携一本空籠與翠尾皆至余憫而為賦感君子之嘉惠意未忘於所知携珍禽以贈余諒有貴乎羽儀去舊國之岑寂歷三湘之嶮巇念未飛之衆雛懷獨宿之羇雌忽哀鳴而望絶遂委翼而長辭異黃鵠之高翔揭空籠而載馳想綷羽而不見覩修尾而增悲蘭色䒠鬱金華陸離垂之兮疑拖緑盩戾音名綬舉之兮如飛翠緌嗟紱冕之寄身與鎩翮而一槩雖暫榮而可樂終以飾而賈害况復德輶如毛而鮮舉福輕乎羽而莫載何必負斯尾之翹翹冒長途而效愛智囊賦并序余嘗感漢朝錯魏桓範皆號為智囊不能全身竟罹大患楊子稱或問多以智殺身雄對曰臯陶以其智為帝謨箕子以其智為武王陳洪範殺身者遠矣余久欲賦之比屬逾紀總戎願言不暇今俟罪江徼倣徨歲深筐篋之中典籍皆闕聊以所記古今興敗粗成此賦夫天之清氣為人而人之清氣為智苟虛心而冲用必存神而索至况悟養以保身豈憂患之能纍何興敗之相詭乃躁靜而殊致或朋遠而無疵或馳䳱而役思故由於彼而入聖門出於此而爭利器若乃淡然玄默應變無方韜隨和而不耀匣于越而寶藏雖不止如炙輠猶淵然如括囊君子所以有斯號者蓋欲保無咎於末光夫智可以養生乃能周物道無夷險用有二拙得於身也祭以免而荀以全失於邦也臧不容而湯不沒彼前軌之昭然曾未戒於危轍嗟乎水濟舟以致遠亦覆舟於畏途智排患以解紛亦有患於不虞將必殆於無涯信莫尚於冥樞或有好學務敏擇仁乃廬斯先哲之所履亦庶幾於不渝然則大智間間不嬰世故舉始終而後入先奔沉而預慮或衛足之無術故離形而盡去呂易宗於竒貨疾知來於武庫雖乘勢與億中非淑人之所務鴟夷子喟然歎曰昔我經世徒聞智憂索遺珠而不得復明燭其焉求與萬物而道夭又何謨於大猷今吾所謂智者乘五湖之浩蕩未終老於扁舟積薪賦并序此郡巖壑重復榛林鬱盛樵採之子未嘗輟音往往㳂流而下詣余求售余因積薪于庭竊有所歎乃為積薪賦邈巖居之幽遠有楚澤之放臣方絶學以自㸑誠未暇於披榛悲顔子之飯煤感萊蕪之生塵時束藴本一字作緼以請火訪蓬茨於善鄰乃遇樵客維舟水濵余言卂之曰樵採賤業常棲隱淪詩既嘉於刈楚傳亦歎於析薪爾豈延瀨之客不取金而且貧豈叔敖之子以好廉而苦辛何乃負擔不已其生實勤客顧余而歎曰貴則近禍富多不仁寄迹於此以養吾真善大雅之知言信芻蕘之可詢既而交加纍積高下齊均矗若井幹疊似龍麟避汍泉而無浸先曲突以斯陳苟知防患之術終無焦爛之賔嗟長孺之昧道常喻此而求伸雖後來而高處亦居上而先焚使薪為能言之物豈容入㸑而揚芬未若生幽崖之側紏芳桂之輪不近野田之燎免罹匠者之斤冒霰雪以終歲齊天年於大椿欹器賦并序癸丑歲余時在中樞丞相路公見遺欹器贈以古人之物永懷君子之心嘗欲報以詞賦屬力小任重朝夕盡瘁固未暇於體物今者公已歿世余又放逐忽覩茲器悽然懷舊因追為此賦置公靈筵昔周道砥平既安且寧赫赫公旦配德阿衡謂難守者成難持者盈始作茲器告于神明至仲尼憲文武之道思周公之德入太廟而觀器覩遺法而歎息且曰月滿而虧日中則吳彼天道而常然欲久盛而焉得乃沃水而器察微要終挹彼注茲受之若冲虛則臲卼似君子之困䝉中則端平若君子之中庸既滿則跌霆流電彂器如坻隤水若河决非神鼎之自盈異衢樽之不竭蓋欲表人道之隆替明百事之有節然茲器也不以中而自藏不以跌而自傷其過也如彼薄蝕其更也浸彂輝光得其道者居則念於豐蔀動乃思於謙受顏既復而不遠惠屢黜而何咎知任重之必及悟物盈之難久雖神道之無形常參然於前後昔與君子同秉國鈞公得之為賢相余失之為放臣覩遺物之猶在懷舊好而悲辛欲克己以復禮永德報於仁人蚍蜉賦并序此郡多蚍蜉所居臨流實繁其類或聚於袵席或入於盤盂終日厭苦而不知可禦之術因戲為此賦令稚子燁和之惟江潭之下國况幽居於澤畔何螻蟻之微物亦有徒而凌亂或泮散於經笥或夤緣於食案余乃戲而問之曰爾能居厚地而漏山阿無乃處吾身而為大患蟻不能言辭以意宣其㫖曰我禀形於造化亦一氣之所甄嘗濟齊師之乏亦聞媯德之羶覩封穴而知雨驗寸壤而得泉出以時而不息故學者得而稱焉戴粒而遊若巨鼇之冠神嶽繞磨而行若日月之麗清天若乃依垤緣壁淫淫奕奕其聚無聲其行無迹值晏溫而出逰當祁寒而入隙迅雷作而不駭微雨灑而自適生雖瑣細亦有行藏止若群羊之聚進如旅鴈之翔乘其便也雖鱣鯨而可制無其勢也雖蛭蟥而不傷今願悔咼戢于垣墻豈同青蠅之㸃白汙君子之衣裳振鷺賦并序此郡帶江緣嶺野竹成林每向夕有白鷺群飛集于林杪余所居在峯岑之上臨眺一川玩其往來有以自適因為此賦日之夕矣川陸載隂有群飛之振鷺顧儔匹而㺯音始遵渚以亂下若濤起於清潯俄矯翼以歸來疑霰集於平林爾其遊止有度不徐不疾散雪彩於江煙皎霜容於寒日映楓葉而暫見入蘆花而還失歎美羽之翩翻感余生之憂栗若乃不為鷁退常與鴻冥乍回合兮如練忽寥落兮如星陋汀葭之靡靡棲岸竹之青青又似素旄陳於曠野白筆森於廣庭悲夫緑篠枝弱巢非所據簫瑟而多風亦扶踈而受露豈不知陂澤可宿荆榛易固惡下流而不居恐搏獸之當路逮乎天清潦收獨立蓮漪意態間暇羽毛襂襹或暫往而得遊鯈或終夕而守空陂隱青莎以延佇若田父之輟輜重曰振鷺于飛于彼滄洲聊自適於遐曠本無心於去留思有客於微子愧植羽於宛丘信茲禽之可玩何必從海上之群鷗李文饒别集卷第一
