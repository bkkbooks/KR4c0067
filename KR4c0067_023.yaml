  text: 李文饒别集卷第三
  hash: sha256:f40868a46a63974518d69e7278ea60be9021639e1b081dcf96bab58faa48d7b7
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4c0067_SBCK_023-1a}
body:
  text: 詩上并唱和酬答三十六首七言九韻雨中自祕書省訪王三侍御知早入朝便入集賢侍御任集賢校書及升柏臺又與祕閣相對同院張學士亦余特厚故以詩贈之祕書省校書郎李德裕共憐獨鶴青霞姿瀛洲故山歸已遲仁者焉能效鷙鶚飛舞自合追長離梧桐逈齊鳷鵲觀煙雨屢拂蛟龍旗鴻鴈衝颷去不盡寒聲晚下天泉池顧我蓬萊靜無事玉版寶書藏衆瑞青編盡以汲冢來科斗皆從魯室至金門待詔何逍遙名儒早問張子僑王褒軼材晚始入宫女已能傳洞簫應令柏臺長對户别來相望獨寥寥奉酬李校書雨中自祕書省歸見訪時早入朝便入集賢不遇頃任集賢校書及升柏臺又與祕閣相對今直書張學士賞忝同席而與校書相遠故瞻望之詞多王台庭才子來欵扉典校初從天祿歸已慙陋巷來玉趾仍聞細雨霑綵衣詰朝始趍鳳闕去此日逐歎雞黍違憶昨謬官在烏府喜君對門討魚魯直廬相望夜每闌高閣遙臨月時吐昔聞三入承明廬今來重至中祕書校文復忝丞相屬博物更與張侯居新冠峩峩不變鐵舊泉脈脈猶在渠忽見校書有情人臨風不羡潘舒憶見青天霧未卷吟玩瑤草不知晚自憐豈是風引舟如何漸與蓬山遠山亭書懷太原節度使檢校吏部尚書平章事張弘靖叢石依古城懸泉灑清池高低袤丈內衡霍相蔽虧歸田竟何因為郡豈所宜誰能辨人野寄適聊在斯奉和山亭書懷節度掌書記監察御史李德裕岩石在朱户風泉當翠樓始知峴亭賞難與清暉留餘景淡將夕凝嵐輕欲收東山有歸志方接赤松遊節度副使檢校右散騎侍崔恭高情樂間放寄迹山水中朝霞鋪座右虛白貯清風潛竇激飛泉石路險且崇步武有勝槩不與俗情同節度判官侍御史韓察搆石狀崖巘翠含城上樓若移廬霍峰遠帶沅湘流瀟灑主人靜夤緣芳徑幽清輝在昏旦豈異東川遊節度推官監察御史高銖鬪石類崖巘飛流瀉潺湲遠壑簷宇際孤巒雉堞間何必到海嶽境幽機自間茲焉得奇趣高步謝東山給事中陸纒激水瀉飛瀑寄懷良在茲如何謝安石要結東山期入座蘭蕙馥當軒松桂滋於焉悟幽道境寂心自怡右金吾衛大將軍胡證飛泉天台狀峭石蓬萊姿潺湲與青翠咫尺當幽奇居然盡精到得似書妍詞豈無他山勝懿此清軒墀從姪尚書右丞賈中庭起崖石潄玉下漣漪丹丘誰云遠寓象得心期豈不貴鍾鼎至懷在希夷唯當蓬萊閣靈鳳復來儀月十二日題元和十三年六奉和韋侍御陪相公遊開義五言六韻節度掌書記監察御史裏行賜緋魚袋李德裕羊公追勝槩茲地暫逍遙風景同南峴丹青見北朝石渠清夏氣高樹激鮮颷念法珍禽集聞經醉象調偶分井露味偏覺衆香饒飯故云便食僧為間毗城內餘薰幾日銷贈圓明上人頂之最圓公佛遠公説易長松下龍樹雙經海藏中今日導師聞佛慧始知前路化成空贈奉律上人維摩終律公精於知君學地厭多聞廣渡群生出世氛飯色不應殊寶器樹香皆遣入禪薰戲贈愼微寺王道安上座三僧正甘露灑空惟一味旃檀移植自成薰遙知暢獻分南北應用調柔致六群元和十三年二月十九日題石寺廢移崇福寺木塔院陷石于東壁長安秋夜內宫傳詔問戎機載筆金鑾夜始歸萬戶千門皆寂寂月中清露點朝衣清冷池懷古序刻石余别有區囿三百里常聞駟馬來旌旗朝角道簫鼓燕平臺追昔賦文雅從容遊上才竹園秋水淨風苑雪煙開牛禍釁將彂羊孫謀始回孫詭羊勝公袁絲徒伏劍長孺欲成灰國韓安興廢由所感湮淪斯可哀空留故池鴈刷羽尚徘徊述夢詩四十韻去年七月溽暑之後驪降其夕五鼓未盡涼風凄然始覺枕簟微冷俄而假寐斯熟忽夢賦詩懷禁掖舊遊凡四十餘韻初覺尚憶其半經時悉以遺忘今屬歲杪無事羈懷多感因綴其所遺為述夢詩以寄一二僚友賦命誠非薄良時幸已遭君當堯舜日官接鳯凰曹目睇煙霄濶心驚羽翼高夢中作此六句椅梧連鶴禁壀堄接龍韜西接羽林軍內署北連春宫我后憐詞客等是我門客先朝曽宣諭卿吾僚並雋髦著書同陸賈待詔比王褒重價連懸璧英詞淬寶刀泉流初落澗流於齒文賦稱泉露滴更濡毫赤豹欣來獻彤弓喜暫櫜赴闕海內無事纍月詩稱赤時西戎乞盟函鎮二帥束身貊之貢物豹黃羆蓋蠻非煙含瑞氣馴雉潔霜毛靜室便幽獨虛樓散鬱陶有小樓時宴語於此學士各有一室西垣花光晨艷艷松韻晚騷騷畫壁看飛鶴仙圖見巨鼇鶴先是西壁畫海內署垣壁比畫松臨幸中使懼而塗焉中曲龍山憲宗曽欲倚簷隂藥樹落格蔓蒲桃句悉此八逰者依然可想也是內署中物惟嘗荷靜蓬池鱠氷寒郢水醪初上賜每學士以酒味稍濃每和水而飲禁中有郢酒坊也食皆是蓬萊池魚鱠夏至後賜及頒燒香酒荔枝來自遠蘆橘賜仍叨蒙頒賜自後以道逺罷獻也先朝初臨御南方曾獻荔枝亦麝氣隨蘭澤霜華入杏膏恩光惟覺重携挈未為勞入比興常携挈而歸句述以恩賜每有賜夕閲梨園騎宵聞禁仗獒園擸每梨門常見歸騎回或抵暮夜院扇回交彩翟雕起揚銀絛轡待袁絲攬書期蜀客操盡規常謇謇退食尚忉忉肉庭所覩此八句述龜顧垂金鈿鸞飛曵錦袍詩人不曵不婁之義也曽蒙賜錦𫀆曵者蓋取御溝楊柳弱天廄驌驦豪借飛龍馬學士皆蒙屢換青春直間隨上苑遨遊眺芙蓉亦謂之南苑也普濟寺與芙蓉苑相連常所煙低行殿竹風拆繞牆桃浣日逰戲此八句述沭聚散俄成昔悲愁益自熬每懷仙駕遠更望茂陵號地接三茅嶺川迎伍子濤稱伐嗔氣所作海濤是伍子花迷瓜步暗石固蒜山牢夢中所作此兩句又是蘭野凝香管梅洲動翠篙泉無驚綵妓溪鳥避干旄感舊心猶絶思歸更首搔無聊燃密炬誰復勸金舠為觥賔僚顧形迹未曽以此相勸余自到此絶無夜宴酒器中大者呼嵐氣朝生棟城隂夜入濠望煙歸海嶠送鴈渡江臯宛馬嘶寒櫪吳鈎在錦韜未能追狡兔空覺長黃蒿水國逾千里風帆過萬艘閲川終古恨惟見暮滔滔奉和浙西大夫述夢四十韻韻次本大夫本題言贈於夢中賦詩以寄一二僚友故今所和者亦止述翰苑舊遊而已元稹聞有池塘什還因夢寐遭攀禾工類蔡詠豆敏過曹莊蝶玄言祕羅禽藻思高三聮亦多徴故事也本篇稱六句皆夢中作戈矛排筆陳貔虎讓文韜綵繢鵉凰鵛權奇驥騄髦神樞千里應華袞一言褒李廣留飛箭王祥得佩刀傳乘司隸馬繼染翰林毫辨頴洵超脫詞鋒豈足􅐤金剛錐透玉賔鐵劍吹毛盛文藻秀麗翰苑謨猷綸誥褒自戈矛而下皆述大夫刀筆贍世縱臺綱充學士等矣貶功多名將人許三公顧我曾陪附思君正鬱陶近酬新樂録仍寄續離騷酬和才畢此篇續至近蒙大夫寄􅓋篥欹阿閣偏隨鳳偏多同直大夫與􅍬方壺共跨鼇借騎銀杏葉例借飛龍學士初入馬橫賜錦垂萄本篇解巳具氷井分珍果金瓶貯御醪獨辭珠有戒廉取玉字一本有非叨綾紙侵紅點綾搏𥿄書詔皆用蘭燈焰碧高通宵勘寫麻制例皆代豫言不易承聖旨偏勞與稹翰林承旨大夫相代為繞月同棲鵲驚風比夜獒吏傳開鎖契門使勘契開鎖聲甚煩多學士院密通銀臺每旦常聞神撼引鈴絛命即鈴索院中有急以為常自搖習渥澤深難報危心過自操犯顏誠懇懇騰口懼忉忉佩寵雖緺綬安貧尚葛袍賔親多謝絶延薦必英豪祕與頻繁奉職勤勞畏慎周密等事也自阿閣而下皆言稹同在翰林日居處深分阻杯盤會間隨寺觀遨與稹時時而字一本作相期學士無過從聚會之例大夫行而已矣於寺觀間祗園一林杏恩慈仙洞萬株桃都玄澥海滄波減昆明劫火熬未陪登鶴駕已計墮烏號痛淚過江渚冤聲出海濤尚看恩詔濕已夢壽宫牢是夢中作故言本篇言此兩句夢字故言再造承天寶新持濟巨篙猶憐弊簪屨重委舊衣褒興彂春塘草魂交益部刀形開猶抱膝燭盡遽揮毫昔士當初筮逢時詠載􅐤懷鉛辦蟲蠧染素學鵝毛車騎方休汝歸來欲效陶從事歸京師大夫罷太原南臺資謇諤內署選風騷羽化如乘鯉樓居舊冠鼇美香焚濕麝名果賜乾萄議敕蠅棲筆邀歡蟻泛醪代言無所戲謝表自稱叨蘭焰凝芳澤芝泥瑩玉膏對頻聲價出直久夢魂勞草詔令歸馬批章答獻獒闕西戎幽驥歸見前注乞盟並銀花懸院牗翠羽映簾絛諷諫欣然納奇觚率爾操禁中時諤諤天下免忉忉左顧龜成印雙飛鵠織袍謝賔緣地密潔已是心豪五日思歸沐三春夫閣老豫嘗玩乃得此名此樹吳人不識因潤州刺史李德𥙿玉蘂天中樹金閨昔共窺落英開舞雪密葉乍低帷旋久之方集庭際大夫草詔之月皆邀豫同玩內署沈大夫所居門前有此樹每花落空中回舊賞煙霄遠前歡歲月移今來想顔色還似憶瓊枝奉酬浙西尚書九丈招隱山觀玉蘂樹戲書見懷之作江南西道團練觀察使沈傅師曾對金鑾直同依玉樹隂雪英飛舞近煙葉動搖深素蕚年年密衰容日日侵勞君想華髮僅欲不勝簪寄題惠林李侍郎舊館棟宇非吾室煙山是我鄰下齡惟待盡一世樂長貧半壁懸秋日空林滿夕塵秪應雙鶴吊松路更無人寄茅山孫錬師何地最翛然華陽第八天松風清有露蘿月淨無煙乍警瑶壇鶴時嘶玉樹蟬欲馳千里戀惟有鳳門泉又二絶石上溪蓀彂紫茸碧山幽藹水溶溶菖花定是無人見春日惟應羽客逢獨尋蘭渚玩遲暉間倚松􅙘望翠微遙想春山明月曙玉壇清磬步虛歸題奇石西公署石在浙藴玉抱清輝間庭日瀟灑塊然天地間自是孤生者送張中丞入臺從事馹騎朝天去江城眷闕深夜珠光去握芳桂乍辭隂澤國三千里羇孤萬感心自嗟文廢久此曲為盧諶懷京國海上東風犯雪來臘前先折鏡湖梅遙思禁苑青春夜坐待宮人畫詔回追和太師顏公同清遠道士遊虎丘寺茂苑有靈峰嗟余未遊觀藏山半平陸壞谷焉高岸岡繞數仞墻巖潛千丈幹乃知造化意回幹資奇玩鏐騰昔虎踞劒沒嘗龍煥潭黛入海底崟岑聳霄半層巒未升日哀狖寧知旦緑篠夏凝隂碧林秋不換冥搜既窈窕回望何蕭散川晴嵐氣收江春雜英亂逸人綴青藻前哲留篇翰共扣哀玉音皆舒文繡假難追彥回賞徒起興公歎一夕如再升含毫星斗爛東郡懷古二首王京兆河水昔將決衝波溢川潯崢嶸金堤下噴薄風雷音投馬災未弭為魚歎方深惟公執圭璧誓與身俱沉誠信不虛彂神明冝爾臨湍流自此回咫尺焉能侵逮我守東郡悽然懷所欽雖非識君靣自謂知君心意氣苟相合神明無古今登城見遺廟日夕空悲吟陽給事宋氏遠家左豺狼滿中州陽君守滑臺終古垂英猷數仞城既毁萬夫心莫留跳身入飛鏃免胄臨霜矛畢命在旗下僵尸橫道周義風激河壯氣淪山丘嗟爾抱忠烈古來誰與儔就烹感漢使握節悲陽秋顏子綴清藻鏗然如素璆徘徊望故壘尚想精魂遊月一日題大和四年六秋日登郡樓望贊皇山感而成詠昔人懷井邑為有挂冠旗顧我飄蓬者長隨泛梗移越吟因病感潘鬢入秋悲北指邯鄲道應無歸去期雨後淨望河西連山愴然成詠宿雨初收晚吹繁秋光極目自錹魂煙山北下歸遼海鴻鴈南飛出薊門只恨無功書史藉豈悲臨老事戎軒唯懷藥餌蠲衰病為惜餘年報主恩秋日美晴郡樓間眺寄荆南張書記高檻涼風起清川旭景開秋聲向野去爽氣自山來霄外鴻初返簷間燕已歸不因煙雨夕何處夢陽臺故人寄茶劒外九華英緘題下玉京開時微月上碾處亂泉聲半夜邀僧至孤吟對竹烹碧流霞腳碎香泛乳花輕六腑睡神去數朝詩思清其餘不敢費留伴讀書行作肘讀一本李文饒别集卷第三
