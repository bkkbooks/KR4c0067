body:
  text: 針丹扆針六首并序舌針一首并序銘聖祖院石磬銘鹿迹山銘劔門銘贊圯上圖贊大迦葉贊丹扆針并序臣聞詩云心乎愛矣遐不謂矣此古之賢人所以篤於事君者也夫迹踈而言親者危地逺而意忠者忤然臣竊念拔自先聖偏倚寵光若不愛君以忠則是上負靈鑒臣頃事先朝屬多隂診常獻大明賦以諷頗蒙先朝嘉納臣今日盡節明主亦猶是心昔張敞之守逺郡梅福之在遐徼尚竭誠盡規不避尤悔况臣嘗學舊史頗知官針雖在踈逺猶思獻替謹稽首上丹扆六針具列于後仰塵睿覽伏積兢惶一宵衣針先王聽政昧爽以俟雞鳴既盈日出而視伯禹大聖寸隂為貴光武至仁反友不忌無俾薑后猶去簮珇彤管記言克念前志二正服針聖人作服法象可觀雖在宴逰尚不懷安汲黯莊色能正不冠楊阜毅然亦譏縹紈四時所御各有其官非此勿服惟辟所難慨然矣毅然一作三罷獻針漢文罷獻詔還騄駬鑾輅徐驅安用千里厥后令王亦能恭巳翟裘既焚筒布則毁道德為麗慈儉為美不過天道斯為至理四納誨針惟后納誨以求厥中從善如流乃能成功漢驁沉湎舉白浮鍾魏睿侈㑀凌霄作宫中雖不忤而善亦從以視為瑱是謂塞聰五辨邪針居上處深在察微萌雖有讒慝不能蔽明漢之孝昭睿過周成上書知詐照姦得情燕蓋既折王猷洽平百代之後乃流淑聲六防微針天子之孝敬遵王度安必思危乃無遺慮亂臣猖獗非可遽數玄黃莫辨觸瑟始仆柏谷微行豺豕塞路覩貌獻飱斯可誡懼舌針并序戊辰歲仲春月戊申夜余宿於洞庭西夢與中書令姚公偶坐如舊相識問余曰君見僕所作口針乎余對曰去歲居守東周於公曾孫諌議某處覩金石之刻遂莞爾而笑曰孫子猶能記之余以仲夏月逹于海曲嘗竊思之聖哲之言上可以動天地成典謨次可以正人倫明得失默而不言後代何述焉繫辭云不善則千里之外違之在植其所言而巳矣豈不緘其口銘其背以矯當世哉楊子稱孰有書不由筆言不由舌張儀以舌存而交亂亦善不善之效也余感姚公之夢乃為舌針云粵有帝舜洎於殷宗龍命惟允允以龍出內朕命故舜命九官自禹至龍命曰龍説言乃雍代子言故曰説言殷高宗夢傅説其周有良弼王之喉舌鼓舞而生渙汗乃發傳以言旋作義易以講習施恱天以卷舌屏讒儒以金口駕説伯陽之誡柔存剛缺言貴無瑕辨貴若訥則知門猶閉囊不在括是以楊雄悼讒者之冤梅福痛忠臣之結善乎先聖之言既明且清國之以寧人之不朽犯無隱情無恃爾言駟馬不及嗟爾君子念茲在茲勿以寤一言而取宰相以舌三寸而為帝師徒見婁敬掉而獲爵不知魏其齰以可悲雖言必有中而適其時子房能用其䇿難以爭立愛奉春善建不拔無以免係縲衛無警夫莫椚叔向哀於是出惟敬仲之難明由匠石之無質楊子曰重則有法輕則招憂言能如是可以寡尤聖祖院石磬銘有美浮石凄若銅音笙竽合奏鸞鷟在林淸越盈耳和愈感心懸之玉宇永託仙岑鹿迹山銘不動者山不死者仙山在仙存真訣不傳猗歟先生耽道體玄騰駕素鹿遨逰紫煙時憩蓬壺下視桑田一往茲山于今幾年兹山岑寂先生是宅淸泉緑蘿獨與世隔我居洞宫人見崖壁空留鹿迹永存幽石劔門銘群山西來波積雲屯地險所會斯為蜀門層岑峻壁森若戈戟萬壑奔東雙飛高闕翠嶺中橫黵然黛色樹茲雄屏以衛王國若列屏此一峯最竒而説者未劍門當中有一峯峻嶺橫峙望也嘗及峯拔井幹溪回溝洫嚴守重扄隱如臨敵運有隆替地無險厄閉于昏頑開于有德馬錯西伐蜀矦敗績艾出隂平禪亦來格粵在憲祖英威四克始剪蜀妖遂清卭棘蠻夷軌道諸侯述職武臣銘之金石乃刻圯上圖贊夫天所以睟淸者其氣理也故能四時變化萬物粲然倦則隂陽為災光景不耀而况於人乎人亦肖圜方之形稟淸濁之氣存神索至極物窮情則倚伏之先見其如視矣子房潛心於神而逹之見其圓狀如得其粵則有女子之粹美嬰兒之專和粹所以含至精專所以研至賾散萬金之資柔毅也祖萬乘之仇仁勇也學禮履方也變名圯上避世也若乃五日為期三往增敬則尾生之信違道矣退不離國心不忘君則鴟夷之遁非忠矣合時變以蟬蛻望仙路以鴻冥優遊於綺皓之門髣佛乎赤松之際豈不善始善終哉黃石者其天地之藴神明之璽歟不然則無以覺悟于房輔翼天漢嗟乎喪亂既定韜匱而葆祠之生也奉符歿而同穴有以見子房之神交不渝矣大迦葉贊頭陀第一惟大迦葉依無上智初分寶坐終授密記晚遇金粟乃知平地潛形雞足以待慈氐李文饒别集卷第八
