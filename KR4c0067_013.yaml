body:
  text: 論用兵於堂案今拾舊藁得三分之一論兵状請詔者㽞在內廷降者敕有田牟請許党項讐復回鶻嗢沒斯部落事狀請宻詔塞上事冝狀請賜嗢沒斯等物狀請於太原添兵備狀請遺使訪問太和公主狀論幽州主冝狀請令符澈與幽州大將書狀條流太原巳北邉備事冝狀扶符天德天德軍捉到回鶻生口狀論嗢沒斯特勒等狀狀附将士請賜嗢沒斯鎗旗狀論嗢沒斯家口狀太原振武軍鎮退渾党項等牙市狀奉宣嗢沒斯所請落下馬價絹便賜與可汗穩便否奏来狀論田牟請許党項讐復回鶻嗢沒斯部落事狀右臣等雖不習兵鈐昧於邊事然酌其物理情實可知伏希聖慈特賜詳覽比者陛下常慮回鶻國中離散未是實情今㩀我阿泥伊難珠合等書云此間更無活處即是實耗又回鶻安孝順云赤心宰相問漢國中看你回鶻好無足知依倚大國意甚懃懇今若許田牟徇党項貪利之心不自量力犯必死之慮絶歸款之誠事捷亦損耗甲兵大虧恩信不成則永為邉患取笑四夷况窮鳥入懐尚湏矜憫逺人慕義曾釆犯邉自六月至今未嘗捉烽戍一人奪党項一物披誠欵塞望闕哀鳴昨者所獻表章詞懇意順棄而不納先務誅夷此不可一也若回鶻國中無釁種落皆安嗢沒斯叛逆而来即湏拒絶可汗既自失國才帳已無携挈傷残寄命他所嗢沒斯等廹於飢困各欲求生田牟執稱背國亡命是去年為悪徒黨都似與德彞雪屈為党項報讐察其用情殊非體國此不可二也漢宣帝五鳯中匈奴大亂議者多曰匈奴為害可因其壊亂舉兵滅之蕭望之對曰宜遣使吊問救其災患四夷聞之咸貴中國之仁義其後南單于果是臣服六十年邉境無事今縱不能扶其㣲弱豈冝因此幸災此不可三也伏望具詔太原振武排比騎兵於邉上嚴防侵軼待犯國家城鎮然以武力驅除若只於党頂退渾小有劫奪任部落自相仇報未可助以甲兵常令大信不渝懐柔得所彼雖戎狄必合感恩待張賈使回足知情實仍望詔田牟不得擅出詭計妄邀竒功兼詔仲武不得納將吏惑詞為國生事如䝉允許伏望付翰林約此意處分請宻詔塞上事宜狀一㨿太原奏事官孫儔稱昨来回鶻到横水柵殺戮軍人百姓今抽在釋迦泊東約西去可汗三百里未知此回鶻是郍頡特下為復是可汗遣来今且湏以此回鶻為罪人云不受可汗指揮擅自刼掠邉界請宻詔劉沔與仲武計會先經略此賊如可以討逐事亦有名摧此一支可汗必自知惧一比聞公主與可汗常别居帳幕每見漢使去即令将宻意看方便說諭公主知親廟子孫只合死生爲國常湏作計自拔歸投國家不合與可汗同行擾亂邉界如萬一迎得公主亦不得便令赴闕湏且㽞在邉上制置回鶻縱力不能及只要假公主名號制服蕃人一又慮回鶻於山外安置老弱家口将精兵逼近城柵攪擾百姓如有此事即湏堅壁清野不得與戰其小城堡兵力薄少不堪固守處並望抽入大城回鶻從得小城亦無用處即别選驍將潜出兵掠其家口輜重此最是制勝之術右謹件如前望各賜宻詔潜令以此為意請賜回鶻嗢沒斯等物詔右此者只待張賈使回今到已数日湏早彂遣縁回鶻已入邊界未測多少天徳兵力寡少湏務懐柔伏以自古禦戎只有二道一是厚加撫慰二是以力驅除此事利害較然前古皆有明効漢宣帝厚撫呼韓大享其利邊境六十年無事漢武力制匈奴海內疲弊生人减半今嗢沒斯若不稍加恩意令盡歡心湏至以力驅除必恐永為邊患假使其衆残破摧伏不難亦湏先加以恩不令疑貳古人云将欲取之必固與之正謂此也臣等商量縱不與糧食接借其賜物不可太薄若止於只賜特勒宰相實恐彂遣未得湏是稍令優厚於朝廷若無費損可以保全朝野群情皆望如此伏希聖慈特賜察納請於太原添兵備狀右緣嗢沒斯等夲國残破未有所歸逗留塞上今已嵗周雖近有恩賜喻其歸還然夲蕃未寜時屬寒沍馬畜羸乏必難首途回鶻和好多年忠効乆著雖在邊境之内計無侵軼之虞臣等所慮吐蕃變詐多端不可測度或謂朝廷方備北虜未暇西防或云嗢沒斯招米點汗回鶻乗此機勢謀䧟豐州緣元和十三年已曾此来不可無備太原兵額雖存皆被軍將放却散諸處緩急點集至難臣等商量請彂陳許歩軍三千人鄭滑歩軍三千人令至太原屯集如北邊有驚則大同軍正當賊路足應事機如河西有虞便令取嵐石路過河至亦近便况两道人心忠義徴彂不難只如一年防秋無所損費臣等詢於物議皆願有此隄防伏惟聖朙特賜允納請遣使訪問太和公主狀右伏以元和中回鶻累請和親憲宗不許至長慶初穆宗以北虜代結姻好中國無虞邊境晏然生人受福所以割慈下嫁用示懐柔今回鶻國已破亡公主未知所在若不遣使訪問慰其艱危戎狄必謂國家公主虜庭本非愛惜便懐輕易之意永無敬重之心非止甚傷虜情實亦負於公主臣等商量望令苖稹將一二十騎輕賫詔書先至嗢没斯處令其轉差人送入至公主所在若嗢没斯便受朝㫖固表恭順之心若辭拒此行足彰背叛之跡因此偵察無所隱情伏希聖㫖特賜省察論幽州事冝狀右臣等今月五日於紫宸陛下訪問劉約事冝令臣等亦與君賞一書諭以此意臣等將謂君賞乆在河朔諳練戎機逺授䂓模必副聖意君賞只合自出已意潜道款誠事從乖張泯然無跡豈有將朝廷宻㫖顕示亂軍激其悖心致此章表兼見君賞與張絳手䟽詞甚卑遜非惟失將帥之體實亦失忠藎之誠近者何重順未得節制初遣茂復諭㫖又遣執方致書臣等兩度令元蹇申意料重順豈不知是朝廷宻諭然竟無大將軍表終守恭順之詞所以授之有名不紊朝典幽州一方自朱克融㽞連中使不受賜衣継以楊志誠累遣將吏上表邀求官爵自此悖慢之氣與鎮魏不同今若便與書諭實為朝廷之耻伏望且逗㽞旬月更候事冝克恭傔回日伏望不賜詔書庶全事體請令符澈與幽州大將書若訪聞張仲武是幽州大將張朝先之子沉勇有謀陛下縱欲加恩亦須且挫其氣又幽州旬月之內移易三人因此翻覆多端亦要令其知愧臣等商量且望令符澈與大將已下一書觀其報答詞理足以知其情出鄰道節將於國體無虧其書白謹同封進條䟽太原以北邉備事宜一雲州之北並是散地備禦之要繫把頭𤇺今符澈雖修繕已畢把頭𤇺內並未添兵鎮守事同虚設恐不應機未廢把頭𤇺以前把頭𤇺後併合抽却望令廵邊使速與符澈計會却抽舊兵依前制置如舊兵已少即與太原城下及閑處抽兵其與山東連接處及西北鎮兵不在抽限如更要築堡城亦委逐便制置三受降城相去四百里自置天德軍及振武節度其東受䧏城中並在腹內都無大叚兵馬鎮守就中中受䧏城不過三五十人古城摧断都不修築今虜衆在隂山之北山中盡有過路若突出山南便入二城即天德振武當時隔斷其中受䧏城本是突厥拂雲詞最是要地今天德人力不及望令太原振武共出三千人速與修築便令鎮守即天德形勢自壮虜騎不敢窺邊一東受降城縁是近年新築城内無水城外取金河水充飲又於城西門掘一二十井若被圍守即湏困蹙今築月城䕶取井水其張仁愿舊城頗當要害張惟清錯奏恐黄河侵壊先賢制置皆有神靈保持廢来二十年基址依舊園𬞞樹木至今盡在隔河便是勝州相去数里望委廵邊使與劉沔計會如何却復舊城至為穏便以前件臣等伏以回鶻在邊切湏有備邉備既壯制置不難訪問利害大約如此其一要切湏得使臣專往自驗機冝謹具條䟽如前其間條䟽不盡者望委廵邊使與所在節度使商量聞奏謹具如前條䟽應接天德討逐回鶻事一一請速降中使齎敕至雲朔天德已来宣諭生熟退渾及党項諸部落等待天德交鋒後任隨便出軍討逐如得羊馬錢物奴婢等任便夲主自收官中更不尋問仍據煞戮回鶻多少别議優賞一自古出師皆有副貳以防主將有故便湏得人石雄驍勇善戰當今無敵望授天德軍都防禦副使兼馬歩都知兵馬使助田牟攻討仍勒乗遞赴天德軍一回鶻藥羅葛元政馬價絹望且勒㽞在振武令中使與忠順同檢點收管如田牟已用兵其藥羅葛元政便望委忠順收録如請歸降仍作般次送付太原除首領外委劉沔且散配儀沁嵐石等州去塞逺處安置並官給粮食如不肯降即湏收係待後處分其趙進用等亦望詔劉沔收管其首領於公舘安置長行等散配諸處一田牟都似不曉兵機奏狀已出三千人拒回鶻計其兵数必是全軍盡出忽有不利城内豈免空虚馬上馳突是戎虜所長攻城圍守戎虜所短田牟只合堅守城壘以俟救兵望速詔田牟輒不得出兵野戰待諸處兵至方可逐便討除一回鶻馬軍難於支敵依林守險湏用勁弩望於浙西取弩手三百人令取河曲路赴天德如所在逢回鶻便令把隘及依叢林射馬河曲路與天德直對兼經歴塩夏等州所在要處便堪應急到天德後權取田牟指揮一嗢没斯誠款雖未知真偽然早要别加官爵縱使不誠亦是反間且要奬其忠義為討伐之名令逺近諸蕃知朝廷只是責可汗犯順非是要㓕回鶻一回鶻既乏糧食又累年勞苦人心易動必可招降望且遣田牟速招䧏者許以優賞如有䧏虜旋給糧食逓過太原取優賞不得留在天德兼聞並以前臣等商量若待天徳奏到已恐不及事機望付翰林各撰宻詔令中使向前審詳事勢如已接戰便湏准此處分如䝉允許其石雄便湏今日降敕未審日縁田牟不待朝㫖㑹昌二年四月十八兵馬故有此處分已岀兵拒可汗下論嗢沒斯特勒等狀右自回鶻近邊人情疑恐聖德所感威懐克宣果得嗢没斯望闕歸心率徒効命必在優賞昭示四方使戎狄逺聞皆感恩信望降中使宣慰嗢没斯特勒及王子等并多攬将軍共七人望各内賜錦綵銀噐其嗢沒斯下兵馬望賜米五千石度支給絹三千疋以户部物充度支速差綱般送仍許不分散部落待委知事情續議制論嗢没斯下將士二千六百一十八人右嗢沒斯下將士既與衣粮又加冠帯賜其軍號實壮邉聲撫循其人莫切於此臣等商量望賜號歸義軍仍望翰林賜敕書宣示嗢没斯下歸義軍將士等其嗢沒斯望且令兼充歸義軍使如䝉允許便添入加工部尚書制宣行仍與中書門下勅牒月二十一日㑹昌二年六論天德軍捉到回鶻生口等狀右臣等見今日天德軍奏事官王可度云毎有回鶻投降及城來捉得十人五人緣不敢留在軍城問得事情後便皆處置伏以回鶻窮困情亦可憐屡有殺傷恐傷仁化望付翰林賜田牟仲武詔前後更有此類便逓送太原令配在諸州安置稍為允愜未審昌㑹月四日二年三請賜嗢沒斯搶旗狀右嗢沒斯既加軍號甚壯邉城錫以牙旗尤彰寵異臣等商量望依神䇿諸城鎮使例賜以旗兩口豹尾兩對噐仗并刀一副令中使押領宣賜如以中使行速齎持稍難其搶旗令於太原節度使下㨂新好者充賜亦穩便謹錄奏聞月二十二日㑹昌二年六論嗢沒斯家口等狀右嗢没斯既加軍號請留家口在太原安置與諸弟等苦處先登者臣等商量嗢沒斯赤誠向闕極力捍邉請遣宗族盡歸內地非惟絶其顧望足以堅彼闘心望詔劉沔義忠於雲朔等州㨂一空閑城壘兼與隨事造土屋其嗢沒斯及愛耶勿宰相等家口等即與别造壯净屋宇安置其應歸漢家口等大口每月給米三㪷充粮食委度支供軍使逐月支給仍委劉沔差漢兵勾當防援不得令側近部落侵擾論太原及振武軍鎮及退渾党項等部落牙市牛馬駱駝等狀右緣回鶻新得馬價絹訪聞塞上軍人及諸蕃部落苟利貨財不惜駝馬必恐充爲互市招誘外蕃豈惟資助虜兵實亦减耗邉備望詔劉沔忠順義忠守志等切加鈐鍵如有違犯並按軍令馬及互市物並納官如有人紏告便以所得物充賞奉宣嗢沒斯所請落下馬價絹便賜與可汗穏便否奏来者右臣等商量賜可汗甚全國體望付翰林賜可汗書得嗢沒斯表稱在本分馬價絹並合落下請充進奉以可汗本國破残乆在邉陲此已量與嗢沒斯已下本分馬價絹便賜可汗兼望賜嗢沒斯詔奬其忠藎緣卿率衆歸國若又落下馬價絹恐可汗與卿結怨轉深事體之間亦慮非便以卿等所請奏進奉馬價絹回賜可汗所冀部落早退令卿等必保安謐望約此意處分實為允愜月十九日㑹昌二年七李文饒文集卷第十三
