body:
  text: 論用兵於堂案今拾舊藁得三分之一論兵狀請詔者留在內廷降者敕有田牟請許黨項讐復回鶻嗢沒斯部落事狀請密詔塞上事冝狀請賜嗢沒斯等物狀請於太原添兵備狀請遺使訪問太和公主狀論幽州主冝狀請令符徹與幽州大將書狀條流太原巳北邉備事冝狀扶符天德天德軍捉到回鶻生口狀論嗢沒斯特勒等狀狀附將士請賜嗢沒斯鎗旗狀論嗢沒斯家口狀太原振武軍鎮退渾黨項等牙市狀奉宣嗢沒斯所請落下馬價絹便賜與可汗穩便否奏來狀論田牟請許黨項讐復回鶻嗢沒斯部落事狀右臣等雖不習兵鈐昧於邊事然酌其物理情實可知伏希聖慈特賜詳覽比者陛下常慮回鶻國中離散未是實情今據我阿泥伊難珠合等書云此間更無活處即是實耗又回鶻安孝順云赤心宰相問漢國中看你回鶻好無足知依倚大國意甚勤懇今若許田牟徇黨項貪利之心不自量力犯必死之慮絶歸款之誠事捷亦損耗甲兵大虧恩信不成則永為邉患取笑四夷况窮鳥入懷尚須矜憫逺人慕義曾釆犯邉自六月至今未嘗捉烽戍一人奪黨項一物披誠欵塞望闕哀鳴昨者所獻表章詞懇意順棄而不納先務誅夷此不可一也若回鶻國中無釁種落皆安嗢沒斯叛逆而來即須拒絶可汗既自失國才帳已無携挈傷殘寄命他所嗢沒斯等迫於飢困各欲求生田牟執稱背國亡命是去年為惡徒黨都似與德彞雪屈為黨項報讐察其用情殊非體國此不可二也漢宣帝五鳯中胸奴大亂議者多曰胸奴為害可因其壞亂舉兵滅之蕭望之對曰宜遣使吊問救其災患四夷聞之咸貴中國之仁義其後南單于果是臣服六十年邉境無事今縱不能扶其微弱豈冝因此幸災此不可三也伏望具詔太原振武排比騎兵於邉上嚴防侵軼待犯國家城鎮然以武力驅除若只於黨頂退渾小有劫奪任部落自相仇報未可助以甲兵常令大信不渝懷柔得所彼雖戎狄必合感恩待張賈使回足知情實仍望詔田牟不得擅出詭計妄邀竒功兼詔仲武不得納將吏惑詞為國生事如蒙允許伏望付翰林約此意處分請密詔塞上事宜狀一據太原奏事官孫儔稱昨來回鶻到橫水柵殺戮軍人百姓今抽在釋迦泊東約西去可汗三百里未知此回鶻是郍頡特下為復是可汗遣來今且須以此回鶻為罪人云不受可汗指揮擅自劫掠邉界請密詔劉沔與仲武計會先經略此賊如可以討逐事亦有名摧此一支可汗必自知懼一比聞公主與可汗常别居帳幕每見漢使去即令將密意看方便説諭公主知親廟子孫只合死生為國常須作計自拔歸投國家不合與可汗同行擾亂邉界如萬一迎得公主亦不得便令赴闕須且留在邉上制置回鶻縱力不能及只要假公主名號制服蕃人一又慮回鶻於山外安置老弱家口將精兵逼近城柵攪擾百姓如有此事即須堅壁清野不得與戰其小城堡兵力薄少不堪固守處並望抽入大城回鶻從得小城亦無用處即别選驍將潛出兵掠其家口輜重此最是制勝之術右謹件如前望各賜密詔潛令以此為意請賜回鶻嗢沒斯等物詔右此者只待張賈使回今到已數日須早彂遣緣回鶻已入邊界未測多少天德兵力寡少須務懷柔伏以自古禦戎只有二道一是厚加撫慰二是以力驅除此事利害較然前古皆有明效漢宣帝厚撫呼韓大享其利邊境六十年無事漢武力制胸奴海內疲弊生人減半今嗢沒斯若不稍加恩意令盡歡心須至以力驅除必恐永為邊患假使其衆殘破摧伏不難亦須先加以恩不令疑二古人云將欲取之必固與之正謂此也臣等商量縱不與糧食接借其賜物不可太薄若止於只賜特勒宰相實恐彂遣未得須是稍令優厚於朝廷若無費損可以保全朝野群情皆望如此伏希聖慈特賜察納請於太原添兵備狀右緣嗢沒斯等夲國殘破未有所歸逗留塞上今已嵗周雖近有恩賜喻其歸還然夲蕃未寧時屬寒沍馬畜羸乏必難首途回鶻和好多年忠效久著雖在邊境之內計無侵軼之虞臣等所慮吐蕃變詐多端不可測度或謂朝廷方備北虜未暇西防或云嗢沒斯招米點汗回鶻乘此機勢謀陷豐州緣元和十三年已曾此來不可無備太原兵額雖存皆被軍將放却散諸處緩急點集至難臣等商量請彂陳許步軍三千人鄭滑步軍三千人令至太原屯集如北邊有驚則大同軍正當賊路足應事機如河西有虞便令取嵐石路過河至亦近便况兩道人心忠義徴彂不難只如一年防秋無所損費臣等詢於物議皆願有此隄防伏惟聖明特賜允納請遣使訪問太和公主狀右伏以元和中回鶻纍請和親憲宗不許至長慶初穆宗以北虜代結姻好中國無虞邊境晏然生人受福所以割慈下嫁用示懷柔今回鶻國已破亡公主未知所在若不遣使訪問慰其艱危戎狄必謂國家公主虜庭本非愛惜便懷輕易之意永無敬重之心非止甚傷虜情實亦負於公主臣等商量望令苖稹將一二十騎輕賫詔書先至嗢沒斯處令其轉差人送入至公主所在若嗢沒斯便受朝旨固表恭順之心若辭拒此行足彰背叛之迹因此偵察無所隱情伏希聖旨特賜省察論幽州事冝狀右臣等今月五日於紫宸陛下訪問劉約事冝令臣等亦與君賞一書諭以此意臣等將謂君賞久在河朔諳練戎機逺授規模必副聖意君賞只合自出已意潛道款誠事從乖張泯然無迹豈有將朝廷密旨顯示亂軍激其悖心致此章表兼見君賞與張絳手疏詞甚卑遜非惟失將帥之體實亦失忠藎之誠近者何重順未得節制初遣茂復諭旨又遣執方致書臣等兩度令元蹇申意料重順豈不知是朝廷密諭然竟無大將軍表終守恭順之詞所以授之有名不紊朝典幽州一方自朱克融留連中使不受賜衣繼以楊志誠纍遣將吏上表邀求官爵自此悖慢之氣與鎮魏不同今若便與書諭實為朝廷之耻伏望且逗留旬月更候事冝克恭傔回日伏望不賜詔書庶全事體請令符徹與幽州大將書若訪聞張仲武是幽州大將張朝先之子沉勇有謀陛下縱欲加恩亦須且挫其氣又幽州旬月之內移易三人因此翻覆多端亦要令其知愧臣等商量且望令符徹與大將已下一書觀其報答詞理足以知其情出鄰道節將於國體無虧其書白謹同封進條疏太原以北邉備事宜一雲州之北並是散地備禦之要繫把頭𤇺今符徹雖修繕已畢把頭𤇺內並未添兵鎮守事同虛設恐不應機未廢把頭𤇺以前把頭𤇺後併合抽却望令巡邊使速與符徹計會却抽舊兵依前制置如舊兵已少即與太原城下及間處抽兵其與山東連接處及西北鎮兵不在抽限如更要築堡城亦委逐便制置三受降城相去四百里自置天德軍及振武節度其東受降城中並在腹內都無大假兵馬鎮守就中中受降城不過三五十人古城摧斷都不修築今虜衆在隂山之北山中盡有過路若突出山南便入二城即天德振武當時隔斷其中受降城本是突厥拂雲詞最是要地今天德人力不及望令太原振武共出三千人速與修築便令鎮守即天德形勢自壯虜騎不敢窺邊一東受降城緣是近年新築城內無水城外取金河水充飲又於城西門掘一二十井若被圍守即須困蹙今築月城護取井水其張仁願舊城頗當要害張惟清錯奏恐黃河侵壞先賢制置皆有神靈保持廢來二十年基址依舊園𬞞樹木至今盡在隔河便是勝州相去數里望委巡邊使與劉沔計會如何却復舊城至為穩便以前件臣等伏以回鶻在邊切須有備邉備既壯制置不難訪問利害大約如此其一要切須得使臣專往自驗機冝謹具條疏如前其間條疏不盡者望委巡邊使與所在節度使商量聞奏謹具如前條疏應接天德討逐回鶻事一一請速降中使齎敕至雲朔天德已來宣諭生熟退渾及黨項諸部落等待天德交鋒後任隨便出軍討逐如得羊馬錢物奴婢等任便夲主自收官中更不尋問仍據煞戮回鶻多少别議優賞一自古出師皆有副二以防主將有故便須得人石雄驍勇善戰當今無敵望授天德軍都防禦副使兼馬步都知兵馬使助田牟攻討仍勒乘遞赴天德軍一回鶻藥羅葛元政馬價絹望且勒留在振武令中使與忠順同檢點收管如田牟已用兵其藥羅葛元政便望委忠順收録如請歸降仍作般次送付太原除首領外委劉沔且散配儀沁嵐石等州去塞逺處安置並官給糧食如不肯降即須收係待後處分其趙進用等亦望詔劉沔收管其首領於公館安置長行等散配諸處一田牟都似不曉兵機奏狀已出三千人拒回鶻計其兵數必是全軍盡出忽有不利城內豈免空虛馬上馳突是戎虜所長攻城圍守戎虜所短田牟只合堅守城壘以俟救兵望速詔田牟輒不得出兵野戰待諸處兵至方可逐便討除一回鶻馬軍難於支敵依林守險須用徑弩望於浙西取弩手三百人令取河曲路赴天德如所在逢回鶻便令把隘及依叢林射馬河曲路與天德直對兼經歷鹽夏等州所在要處便堪應急到天德後權取田牟指揮一嗢沒斯誠款雖未知真偽然早要别加官爵縱使不誠亦是反間且要奬其忠義為討伐之名令逺近諸蕃知朝廷只是責可汗犯順非是要滅回鶻一回鶻既乏糧食又纍年勞苦人心易動必可招降望且遣田牟速招降者許以優賞如有降虜旋給糧食遞過太原取優賞不得留在天德兼聞並以前臣等商量若待天德奏到已恐不及事機望付翰林各撰密詔令中使向前審詳事勢如已接戰便須準此處分如蒙允許其石雄便須今日降敕未審日緣田牟不待朝旨會昌二年四月十八兵馬故有此處分已出兵拒可汗下論嗢沒斯特勒等狀右自回鶻近邊人情疑恐聖德所感威懷克宣果得嗢沒斯望闕歸心率徒效命必在優賞昭示四方使戎狄逺聞皆感恩信望降中使宣慰嗢沒斯特勒及王子等并多攬將軍共七人望各內賜錦綵銀器其嗢沒斯下兵馬望賜米五千石度支給絹三千匹以户部物充度支速差綱般送仍許不分散部落待委知事情續議制論嗢沒斯下將士二千六百一十八人右嗢沒斯下將士既與衣糧又加冠帶賜其軍號實壯邉聲撫循其人莫切於此臣等商量望賜號歸義軍仍望翰林賜敕書宣示嗢沒斯下歸義軍將士等其嗢沒斯望且令兼充歸義軍使如蒙允許便添入加工部尚書制宣行仍與中書門下敕牒月二十一日會昌二年六論天德軍捉到回鶻生口等狀右臣等見今日天德軍奏事官王可度云每有回鶻投降及城來捉得十人五人緣不敢留在軍城問得事情後便皆處置伏以回鶻窮困情亦可憐屢有殺傷恐傷仁化望付翰林賜田牟仲武詔前後更有此類便遞送太原令配在諸州安置稍為允愜未審昌會月四日二年三請賜嗢沒斯搶旗狀右嗢沒斯既加軍號甚壯邉城錫以牙旗尤彰寵異臣等商量望依神䇿諸城鎮使例賜以旗兩口豹尾兩對器仗并刀一副令中使押領宣賜如以中使行速齎持稍難其搶旗令於太原節度使下㨂新好者充賜亦穩便謹録奏聞月二十二日會昌二年六論嗢沒斯家口等狀右嗢沒斯既加軍號請留家口在太原安置與諸弟等苦處先登者臣等商量嗢沒斯赤誠向闕極力捍邉請遣宗族盡歸內地非惟絶其顧望足以堅彼鬪心望詔劉沔義忠於雲朔等州㨂一空間城壘兼與隨事造土屋其嗢沒斯及愛耶勿宰相等家口等即與别造壯淨屋宇安置其應歸漢家口等大口每月給米三斗充糧食委度支供軍使逐月支給仍委劉沔差漢兵勾當防援不得令側近部落侵擾論太原及振武軍鎮及退渾黨項等部落牙市牛馬駱駝等狀右緣回鶻新得馬價絹訪聞塞上軍人及諸蕃部落苟利貨財不惜駝馬必恐充為互市招誘外蕃豈惟資助虜兵實亦減耗邉備望詔劉沔忠順義忠守志等切加鈐鍵如有違犯並按軍令馬及互市物並納官如有人紏告便以所得物充賞奉宣嗢沒斯所請落下馬價絹便賜與可汗穩便否奏來者右臣等商量賜可汗甚全國體望付翰林賜可汗書得嗢沒斯表稱在本分馬價絹並合落下請充進奉以可汗本國破殘久在邉陲此已量與嗢沒斯已下本分馬價絹便賜可汗兼望賜嗢沒斯詔奬其忠藎緣卿率衆歸國若又落下馬價絹恐可汗與卿結怨轉深事體之間亦慮非便以卿等所請奏進奉馬價絹回賜可汗所冀部落早退令卿等必保安謐望約此意處分實為允愜月十九日會昌二年七李文饒文集卷第十三
