body:
  text: 賦下一十四首袁州八首問泉途賦并序問泉途思沈侯也師也沈使傳余與沈侯同侍禁林俱守藩翰出入光寵垂二十年君性樂山水尤好絲竹良辰美景不廢賞心嘗歎人世險艱多言可畏固未得盡其所懷也昔尚子平稱吾已知富不如貧貴不如賤未知存亡何如耳陶靖節亦稱人生實難生如之何今作賦以問之昔我與子同升玉堂回先帝之英盻被霄漢之輝光君聳駕於長沙余建斾於朱方且欲極山水之臨泛盡人生之樂康謝既好於絲竹陶亦間於壺觴雖爵服之已貴何憂思之未忘寶瑟獨奏於門庭玉顔不畜於洞房今則逝矣前榮可傷於是託意宵夢久而乃寐問冥昧於故人求神道之髣佛或曰生特在於行樂死何用於虛諡或言惟令名之不泯非苦節而安致彼終古之茫茫竟斯言之誰是又曰君有瑶席尚可陳兮君有清香尚可焚兮昔之艷姬復得見兮昔之哀歌復得聞兮誰為朋友展戲謔兮豈有樽酒接殷勤兮余聞神之清者上為列星德之粹者復為賢人萬化轉續如在鎔鈞或壽或夭或鄙或仁亦受氣於蠻貊仍託形於介麟獨讒人沒於泉下不得同於物化懷君子之素風方俟命於昊穹無乃困武叔而見弘石迫無極而值克躬有明龍而害正有儀尚之蔽忠苟不罹於此患固無傷於道窮傷年賦并序余茲年五十久嬰沉痼楚澤卑濕杳無歸期恐田園將蕪不遂懸車之適乃為此賦五十已至生涯可知在樂安而猶歎况形神之支離傷壽有賈生之痛招魂無宋玉之詞邈故園之寥遠念歸途之未期顧稚子而悽惻想田廬而涕洟有客戾止問我何悲仲尼晚而喜易郤穀老而敦詩公問國語行年五十矣守學彌篤元帥於趙衰對曰郤穀可苟朝聞於聖道雖年往而未衰余乃對曰心之憂矣子豈知之嗟世路之險隘矧駑駘之已疲法先哲以行止經險阻而勿違陽息駕於折坂思保身於不危文飛轡於崤道若遺風而載馳幸回車之未晚與此路而長辭嗟乎亢必有悔盈難久持李耽寵而忘返豈黃大之可思種嬰患而且窹眇滄波而莫追雋畏勢而自引非罻㒿之所羇宜見險而高舉顧軒冕其如遺雖高華之難企在哲人之所為何必求季主以盡性訪詹尹而決疑商有山兮逶迤從園公兮採芝湘有水兮漣漪繼漁父兮維絲既已覺於今是豈遑遑於路岐懷梟賦并序荆楚多飛梟余所居在岑壑之中蓋茲鳥族類所託不足歎其蕃也天寶末韋郇公謫守蘄春時李鄴公亦以處士放逐嘗中夜同宴屢聞梟音即公執爵流涕歎曰長沙下國鄴公曰此鳥之聲人以為惡以好音聽之則無足悲矣請飲酒不聞梟音者浮以大白坐客皆企其聲終夕不厭余因其夜鳴不已感前賢亦罹其患乃為此賦我樂遐深幽居北岑積杉松之翠靄蔽􅙪簵之清隂夜氣常合頽陽易沉何飛梟之茂族盡棲息乎繁林余以修短委命行藏縱心既無情於忌鵩非有歎於巢鵀未嘗張羅於叢薄射宿於川潯誠不忍於思炙惟載懷於革音嗟夫天地之間禽有萬類彼鵷鳳之靈姿故特稟於間氣標靜素於鴻鵠賦妍華於孔雀獨茲鳥之可傷無一美而自庇或曰人之所處不冝來萃故聞其音而悽慘覩其貌而􅌓眙由是翔集無所摧頺逼威晝戢翼於蒙籠夜相鳴而悲思余乃歎曰天有定命聖不能知彼冥數之未兆非畏之而可移梟集牙而戰勝蛇入笥而福綏造化默以潛運倚伏難以預期况乎愛子及室恩斯勤斯齊萬物以遂性豈美惡而異宜至人入鳥而不亂至治層巢而不窺我若不容於深谷使其伏竄而何之觀釣賦并序余所居止江流之上每值清景必杖䇿獨遊見蘆人漁子則樂而忘返莊生稱就藪澤樂間曠釣魚間處此江湖之士避世之人也班嗣亦稱魚釣一壑則萬物不姦其志是知古之賢人皆樂於此彼之垂釣者未可量焉因為觀釣賦臨江臯以四望愛春水以悠悠赴滄海以東會引清湘而北流北流此水想鴟夷而可覿冀漁父之出遊將欲訪行止於二子永棲遲於一丘徘徊春渚忽值鈞舟奏小海之悲曲彂阿激之棹謳觀其垂綸川上或縱或收悟直針之莫致楚詞直針察芳餌之自求追感夫子遑遑歲暮麟鳳不來絃歌誰訴客有皓髮愕而招路問孔氏之何治獨危真而未悟悲聞道之已晚乃引舟而遠去子寂聽其拏音季授綏而不顧逮乎屈平既放飄爾南征不泛泛以隨波或皎皎而揚清漁父歎其違俗大夫井其徇名遂鼓枻而孤往猶放歌乎乎濯纓若乃川霧始收秋光向夕蘭露沍而風清竹煙散而潭碧映微月於湍瀨響哀猿於岩壁喜良夜而不歸更鳴桹而逺適或有略小務大邈乎難量任公期年而釣鰲吕望何時而得璜且夫一竿之説所貴不綱九罭未具難希鱒魴顧余情之無欲彼小大而皆忘雖餌食而不取思寄適於濠梁斑竹管賦并序余寓居郊外精舍有湘中守贈以斑竹筆管竒彩爛然愛玩不足因為小賦以報之山合沓兮瀟湘曲水潺湲兮出幽谷緣層嶺兮茂奇篠夾澄瀾兮聳修竹鷓鴣起兮鈎輈白猿悲兮斷續實璀璨兮來鳳根連延兮倚鹿往者二妃不從獨處茲岑望蒼梧兮日遠撫瑤琴兮怨深灑思淚兮珠已盡染翠莖兮苔更侵何精誠之感物遂散漫於幽林爰有良牧採之巖址表貞節於苦寒見虛心於君子始裁截以成管因天姿而具美疑貝錦之濯波似餘霞之散綺自我放逐塊然巖中泰初憂而絶筆殷浩默而書空忽有客以贈鯉遂起豫以雕蟲念楚人之所賦實周詩之變風昔漢代方侈增其炳煥綴明璣以為押飾文犀以為玩黃金節以和璧綴以隨珠裝傳子曰漢末一筆之押雕以之植必象牙之管也以翡翠此筆非文犀徒有貴於繁華竟何資於藻翰曾不知擇美於江潭訪奇於湘岸况乃彤管有煒列於詩人周得之以操牘張得之以書紳惟茲物之日用與造化之齊均方資此以終老永躬耕於典墳柳柏賦并序夫受天地之正者惟松柏而已故聖人稱其有心美其後雕豈無他木莫可儔匹豫嘗歎柏之為物貞苦有餘而姿華不足徒植於精舍列於幽庭不得處園池之中與松柏相映獨此郡有柳柏風姿濯濯宛若荑楊而冒霜停雪四時不改斯得謂之具美矣惜其生而遐遠人罕知之偶為此賦以貽親友惟天地之生物均覆載而不私雖草木之殊性皆榮落之有時感松柏兮得真經隆冬而乃知常集霰於窮節終秉心而不移觀夫竹嬋娟以挺秀松英茂以含滋可蔭蔚於臺榭故封植於園池嗟緑柏之貞若爰自託於幽崖或森森於寒壠或肅肅於江祠何炎徼之僻陋或珍木而在茲齊蓊蔚於蘭若儷芬芳於桂枝遠而象之聳幹參差疑翠旌之陸離迫而玩之布葉低垂若羽蓋之葳𬎼又似翠列巢以群棲鸞奮翼而來儀含輕煙於夕景泣零露於朝曦待秋實之繁衍綴青珠之纍纍嗟乎材不可備人亦如斯子張之容雖盛柳惠之貞則虧有長孺之正色無思曼之風姿歎此物之具美以幽深而見遺非欲企瓊林於塵外方玉樹於前墀望舊國兮無際思故人兮未期曾不得倚樹而泛瑤瑟攀條而獻蘭芝慨路遠而莫致抑毫端而孔悲顧謂稚子燁起為謠曰楚山側兮湘水源美斯柏兮託幽根條總翠兮冬轉茂實垂珠兮秋始繁彼變化兮不測焉知非緩也之精魂白猿賦并序此郡多白猿其性馴而仁愛所止榛林不瘁果熟乃不取與玃相狎猴亦畏而避之昔傅奕玄或言有猿猴賦但恱其變態似優以為賦玩且不言二物殊性余今作賦以辨之爾昔周穆之南邁將奮旅於湘沅既隻輪而無返化君子以為猿嗟物變而何常故族類而始蕃或哀吟於永夜或清呌於朝暾峯合沓以連響水潺湲而共喧矧三聲之未絶感行客之銷魂觀其雖為異物而猶善處動不為暴止皆擇所青松鬱而不殘楂梨熟而後取顧狖鼯與猱挺廷音信莫得而儔侣若乃靈通有知有神白猿淮南子稱女試劍而方接舉修簻而止馳養矯矢而未彂眄喬柯而已悲凌峻壑而電耀挂長蘿而匏垂避側足而不履尚有畏於阽危施於射則李控弦而盈貫用於道則華養形而不衰中有戲猿也華他五禽戲彼沐猴之佻巧雖貌同而心異既貪婪而解讓亦躁動而不忌嗟斯物之既馴有仁愛而可畏故鄧生以違性興感齊后以望思掩淚嗟乎人之化也實可悲辛或少貴而老賤或始富而終貧中行之後困於畎畝叔敖之子疲於負薪何止鮌化熊而為厲哀成虎而不仁變欽梟於瑤席鳴杜鵑於巴岷乃知人世之可厭不足控搏而自珍二芳叢賦并序余所居精舍前有山石榴黃躑躅春晚敷榮相錯如錦因為小賦以狀其繁麗焉鷤鴂鳴矣衆芳已衰美嘉木之並植惜繁榮之後時觀其擢纎柯以相糾糅鮮葩而如織金散裊蹄之輝玉耀雞冠之色一則含情脈脈如有思而不得類西施之容冶服紅羅之盛飾復似朱草彂其英𬎼長離奮其羽翼一則凝思悵悵若將翺而未翔疑嬴女之性情媠鬱金之薄粧又似黃星爛於霄漢瑞鵠來於建章彼紅榮之曄曄麗幽叢而有光其舒熖也朝霞之映白日其含彩也丹砂之生雪床彼緗蘂之粲粲隱衆葉而間芳其繁姿也時菊之被秋霜其秀色也鳴鸝之集荑楊由是楚澤放臣小山遊客厭杜蘅之靃靡忘桂花之潔白玩此樹而淹留倚幽岩而將夕嗟衰老之已遽念流芳之可惜况鱗悲失浪羽畏虛彈有掦朱之危涕無越石之暫歡豈獨琴感猗蘭之曉詩嗟蕙草之殘思欲揖金膏而駐魄攀珠樹而輟餐顧人間之華艷何足幽賞而盤桓北歸六首畏途賦并序乙卯歲孟夏余俟罪南服自歷陽登舟五月屇于盠澤當隆暑赫曦之候涉潯陽不測之川親愛聞之無不揮淚今明王祝網幸得生去炎方或有勉余改轅而陸者因答此賦余非軒冕來寄廟堂非據賀客旋軫吊賔在户自淮服而載馳貫岷山而上泝敲氣溢於大浸溫風彂於中路于時行潦猥至百川皆注望九派而無濟橫扁舟而徑度非知漁父之勇已忘胥靡之懼陽矦此為神將駭而還伏蛟欲絶而自去豈有幼安之感幸杜侯之慮訪潯陽之故里懷靖節之舊居陳一樽之遙奠悲三徑之久蕪當其辭簮組返蓬蘆逸妻賔敬稚子歡娛臨流賦詩卧壑觀書對南山之幽靄蔭嘉木之扶踈不為軒冕之纍焉得風波之虞何夫子之早窹居一世之不如然代有覆舟之子皆由任其智力比鷁舳為輕禽以席帆為快翼載已重而皆積途既遠而未息志擾擾以爭先日冥冥而作慝既而戕風鼓怒氛侵改色深則困於巨浪淺則觸於危石雖有神人莫能拯溺談者未知患難之所來常以川流為怵惕今余所謂畏途蠡澤敬仲以為富鄉蒙莊以為袵席苟能慮於幾微又何畏於行役知止賦并序古人稱山林之士往而不能返朝廷之士入而不能出先哲所以趍舍異懷隱顯殊迹蓋兼之者鮮矣今余自春秋至西漢取其卿大夫進能知止退不失正者綴為此賦觀陽秋與漢册求知止之大夫魯莫高於柳惠衛莫貴於寧俞吳乃得於延州楚乃尚於於莬雖至聖無軌超然不拘猶歎行藏以與顔稱卷舒而善蘧則由聖門而進退者豈不勇於知止乎在漢留侯與道為徒厭華屋而不處思赤松以遊娛清則兩龔美則二踈父子欣以相顧衰老至而歸歟祈祈青襟載負經書靄靄玄冕祖我城隅歎冥鴻之不及皆雪涕以漣洳嗟余生之疲病念寄世之須臾曾涉險而知懼痛摧輪之不虞諒難復於玷缺復玷缺之艱難韋玄成作詩自著且覃思於玄虛聊揮金於餘日乃回駕於迷途况乎託北阜以為宅此以為宅因茂林以為蔭矣應璩詩南臨洛水北據印山託就東山而結廬著經始東山廬詩左思徙居洛城東仲既得於清曠卜居清曠以仲長論日欲志樂吾陶豈歎於將蕪其遠眺也則伊出陸渾北統皇居度雙闕之蒼翠若天澤之逶迂少室東映於原隰鳴臯西對於林閭其近玩也則濫泉流於一壑嘉木盈於萬株徑被芳蓀沚映芙蕖聽求友之鳴禽見自樂之倏魚徙奇樹於台嶺隱翠葉而垂珠得怪石於震澤聳青岑而韜瑜昔有淮矦種瓜陶相灌蔬竊比君子亦能荷鋤或引蔓於長坂或遵流於清渠傲情人世之外寄迹羲皇之初望夕景於平林眺寒煙於故墟麏麚遠而騰倚鳬鴈去而相呼酌盈樽而自慰賴鳴琴而不孤懷綺皓而披素卷想瀛洲而觀畫圖何必尚遍遊於名嶽平尚子蠡長往於五湖嗟夫世於知止之道若存若無李斯忌於稅駕惠子疲於據梧盡生涯以自若何智力之有餘庶耿光之未晚期終老於桑榆劍池賦并序丙辰歲孟夏月余屇途豐城弭楫江渚問埋劍之地則左池存焉感其至靈之物亦有淪棄非遇識者無由振彂雖人亡劍去而故事可悲因維舟俄頃以為此賦天地神物龍泉太阿光耀時促沉埋日多往者紫氣衝星時人莫識吳已亡而氣存寶乃隆於敵國既精感而上達當龍變而不息未遭風雨之會尚假雷生之力豈通塞之有時何顯晦之難測我不自振掘之而得雖潛朽壤之中每受莓苔之蝕誠宜英主用之提携旨揮內以清諸矦外以服四夷為東序之祕寶備有國之光儀一見留於邑長一獲備於台司始謂伸於知已終乃屈於不知既而長鳴玉匣躍入漣漪化鋒鍔兮奮迅煥晶光兮陸離垂尾滄波斷鯨鯢之族矯首清漢襲江海之祗昔時在獄今成廢池寶嘗棄於茲地人載懷而孔悲况乎耶溪水涸赤堇山閉巧冶既歿作者曠世風胡已遠壯武復逝斯物倘有知之者誰氏惟人代兮去不留嗟雙劍兮焉可求望匡廬賦并序滄湖口北望匡廬二山影入澄潭峯連清漢江水無際煙景相鮮沿流而東若存世表因懷遠公陸先生悵然成賦春水湖平霽天景旭眇赴海之清瀾映于霄之翠嶽波麟爛而勢微帆鴈引而相續輕煙冒於爐峯若香散於空谷飛流灑於星灣疑虹飲於曾曲想遠公之平昔比孟綽之不欲談精義於松間與殷仲堪説易東林寺有逺公在松猶寄虛懷於巖足喜濯纓而旋返悲負鼎而放逐耻隨屈賈之波不及宗雷之躅整襟帶於瑤席望玄師於林麓傳法山之祖師也余受於芳法玄師則徒佩紫青之書未脫朱丹之轂感明主之嘉惠荷天地之覆育既復扶陽之爵又剖專城之竹被金組於薄躬昭皇明於荒服豹文忽變蔚然以姿蟬緌更新倐然而脫雖澡身於滄浪終有愧於玷辱念大福兮不再來歸東臯兮供黍粟大孤山賦并序余剖符淮司道出蠡澤屬江天清霽千里無波點大孤於中流升旭日於匡阜不因左官豈遂斯遊謝康樂尤好山水嘗居此地竟闕詞賦其故何哉彼孤嶼亂流非可儔匹因為小賦以寄友朋川瀆巇道人心所惡必有穹石禦其橫鶩勢莫壯於灔澦氣莫雄於砥柱惟大孤之角立掩二山而磔竪高摽九派之衝以捍百川之注耽若虎視蚴如龍據靡搖巨浪神明之所扶不倚群山上玄之所固彼迤邐而何多信嶷然而有數念前世之獨立知君子之難遇如介石者袁楊制橫流者李杜觀其側秀靈草旁挺奇樹寧憂梓匠之斤豈有樵人之路想江妃之乍遊疑水仙之或駐嗟瀛洲之方丈蓋髣佛如煙霧據神鼇而臲卼逐風濤而沿泝未若根連坤軸終古而長存迹寄夜川負之而不去雖愚叟之復生焉能移其咫步項王亭賦并序丙辰歲孟夏余息駕馬江晨登荒亭曠然遠覽因覩太尉清河公刻石美項氏之材歎其屈於天命且曰困厄之時生計非蕭張所出余以為不然矣自古聰明神武之主未嘗不應天順人以定大業項氏縱火咸陽失秦中之固遷主炎裔傷義士之心違天違人霸業墮矣漢皆反是故能成功據秦遺業東制區夏數敗於外常有關中為舊主縞素以義動天下雖項氏猶存而王業基矣若乃蠖屈鴻門龍潛天漢始降志於一人終申威於四海則蕭張之計亦不遠乎余嘗論之漢祖猶龍項氏如虎龍雖困而能變不測虎雖雄而其力易摧一神一鷙宜乎敻絶然􅋈舟不渡留騅報德亦可謂知命矣自湯武以干戈創業後之英雄莫高項氏感其伏劍此地因作賦以吊之登彼高原徘徊始曙尚識􅋈舟之岸焉知繫馬之樹望牛渚以悵然歎烏江而不渡想山川之未改嗟斯人之何據思項氏之入關按秦圖之割據恃八千之剽疾棄百二之險固咸陽不留王業已去將衣錦於舊國遂揚旌而東顧雖未至於隂陵誰不知其失路耻沐猴之醜詆乃烹韓而泄怒謂天命之可欺何霸王之不窹嗟乎楚聲既合漢圍已布歌既闋而甚悲酒盈樽而不御當其盛也天下侯伯自我而宰制及其衰也帳中美人寄命而無處季數遁而不亡羽一敗而終仆豈非獨任於威力不由於智慮追昔四隤之下風煙將暮大吒雷奮重瞳電注叱漢千騎如獵狐兔謝亭長而依然愧父兄兮不渡既伏劍而已矣彼群帥之猶懼雖霸業之無成亦終古而獨步周視陳迹緬然如素聽喬木之悲風感高秋之零落因獻吊於茲亭庶神期之可遇李文饒别集卷第二
