front:
  text: 李文饒文集卷第五會昌一品制集詔敕上者請翰林添奬飾語他眥倣此詔書凡有敕字者使行無敕字
  hash: sha256:d3a56ce61d6ed37cfa133e892fd1b2a3338ee5e2e1d5db4640078ac0dcf33368
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4c0067_SBCK_005-1a}
body:
  text: 賜回鶻可汗書賜回鶻書意賜回鶻可汗書意賜回鶻可汗書并宫主及九姓宰相詔書賜太和公主敕書賜背叛回鶻敕書賜回鶻嗢沒斯特勒等詔書賜回鶻嗢沒斯等詔書賜思忠詔書賜回鶻可汗書敕我國家統臨萬寓列塞在隂山之南先可汗哲率本部建牙於大漠之北各安土宇二百餘年此天所以限隔內外不可逾越近聞為紇扢斯所敗加以飢荒國邑為墟尸僵道路今可汗稍收離散漸近邉城將議遠圖舍先文誥故兹命使宜聽朕言可汗纍代以來推誠嚮國任者中原有誰助剪群凶列聖念功每加優寵寧國咸安二公主降嫁龍庭爰及先朝復以今公主好又以土無絲纊歲遺縑繒恩禮轉深諸蕃稱羡久保誠信兩絶猜嫌但以國家舊章蕃漢殊壤稍逾經制豈朕所安去歲嗢沒斯特勒巳至近升邉將憤激便請袪除朕念其無主可歸且令安撫今可汗既立彼又降附便合率漸復舊疆漂寓塞垣殊非良計又得宰相頡干伽思等表借振武一城權與可汗公主居住中國之制與外蕃不同須守前代規模祖宗法度昔漢朝單于乖亂呼韓欵塞宣帝送單于出朔方雞鹿塞唯賑以米粟國初大宗皇帝命李思摩建牙於漢南遺址並存事皆可驗未有深入漢界借以一城與退渾黨項微小雜種同為百姓實亦屈可汗之尊貴亂中國之舊規若以未復本蕃或欲别遷善地求大國聲援戢諸部交爭亦須率思歸之人且於漠南駐止朕當許公主朝覲親問事宜儻須應接必無所吝冀今𬒳國從此輯寧豈不謂去危就安轉禍為福朕緣公主將可汗丹誠來告深感于衷制置之間須存逺大故遣右金吾衛大將軍兼御史大夫王會宗正少卿兼御史中丞李師偃馳往喻懷爰定所居便申誓約神明是質豈可食言可汗並保一心自求多福賜回鶻書意奉宣撰朕想可汗公主以久修鄰好纍降嘉姻望我國家如歸親戚朕每弘容納之意固無纎芥之嫌但以將相大臣纍陳公議以可汗代居絶漠臨長諸蕃名聲既雄部伍甚衆今逗留塞上逼近邉城百姓不安人心疑惑耕種盡廢士馬疲勞朕二年以來保護可汗一國內阻公卿之議外遏將帥之言朕於可汗心亦至矣可汗亦須深見事體早見歸還所求種糧及安存摩尼尋勘退渾黨項劫掠等事並當應接處置必遣得宜惟是擬借一城自古以來未有此事天地以沙漠山河限隔南北想蕃中故老亦合備知只如長安東有潼關西有散關南有藍田關北有蒲關今四海一家天子所都猶有限隔况蕃漢殊壤豈可通同且天下者髙祖太宗之天下朕守祖宗成業常懷兢畏豈敢上違天地之限中隳祖宗之法每欲彂一號施一令皆告于宗廟不敢自專所借一城理絶言議想可汗便須息意勿更披陳其餘令楊觀專往視喻朕意賜回鶻可汗書意楊觀至覽表欲求糧食牛羊糧食已許自已馬價絹就振武和糴三千石緣中國以農為本最貴耕牛百姓所蓄無多常斷屠殺羊則産於北土不出中華惟塞土蕃渾各有畜牧朝廷未嘗徵率務使安存今之所求難允來意又所請束縛嗢沒斯送歸者嗢沒斯比自投邉將屢猒誠欵自本國破亡之初奔迸先至塞上不隨可汗公主已是二年慮彼猜嫌自懷憂懼窮迫歸命望朕保持未嘗有交構之言離間兩國前可汗已緣失制馭之道無兼愛之仁侵擾諸蕃肆為暴虐所以親屬內叛部落外離國破家殘實由於此今可汗失地遠客危難之中尤須追悔前非以安反側若又仁愛不至骨肉相殘可汗左右信臣誰敢自保朕統萬國非止一蕃未附者頃務懷柔歸誠者因宜存撫儻徇可汗之意殊乖覆育之恩今已特許歸降止於存其種族必不别有任使授以腹心在可汗不失恩慈於朝廷免虧信義豈不兩全事體深叶良圖况前代以來盡有故事漢朝呼延邪單于欵塞其下大將鳥厲屈烏厲溫敦並來降附漢宣帝封以列侯又國初頡利可汗之破敗也降者甚衆酋豪首領至朝廷皆拜將軍僅百餘人無不撫納想可汗深明朕意勿更再論摩尼教天寶以前中國禁斷自纍朝緣回鶻敬信始許興行江淮數鎮皆令闡教近各得本道申奏緣自聞回鶻破亡奉法者因茲懈怠蕃僧在彼稍似無依吳楚水鄉人性囂薄信心既去翕習至難且佛是大師尚隨緣行教與蒼生緣盡終不力為朕深念異國遠僧欲其安堵且令於兩都及大原信嚮處行教其江淮諸寺權停待回鶻本土安寧即却令如舊賜回鶻可汗書并公主及九姓宰相詔書朕自臨寰區為人父母惟以好生為德不願黷武為名故自彼國不幸紇扢斯所破來投邉境已歷歲年撫納之間無所不至初則念其飢歉給其糇糧旋則知其破傷盡還馬價前後遣使勞問交馳道路小小侵擾亦盡不計今則可汗尚屯近塞未議還蕃朝廷大臣與四方節將皆懷疑忿盡請興師雖朕切務含弘亦所未喻日昨數使卻回皆言可汗只待馬價及令交付之次又聞所止屢遷或侵掠雲朔等州或讐掣羌渾諸部未知此意終欲何如若以未交馬價且近塞垣行止之間亦宜先告邉將豈有倐來忽去遷徙不常雖云隨逐水草動皆逼近城柵遙揣深意似恃姻好之情每觀蹤迹實懷馳突之計况昨到橫水柵下煞戮至多蕃渾牛羊豈吝驅掠黎庶何罪皆被傷夷所以中朝大臣等皆云回鶻近塞已是違盟更戮邉人實乖大義咸願因此翦逐以雪殂謝之寃然朕志在懷柔情深屈巳寧可汗之負德終未忍於幸災石誡直久在京城備知仁作人一本心憤惋彂於誠懇固請自行嘉其深見事機所以不能違阻可汗審自詢問速擇良圖無至不悛或貽後悔賜太和公主敕書奉宣撰敕姑遠嫁絶域二十餘年跋履險難備罹屯苦朕每念於此良用惘然恭惟太皇太后春秋已髙慈愛深厚比者望姑朝謁再敘悲歡倐已歲暮寂無音耗想姑見舊國之城邑能不銷魂望漢將之旌麾必當流涕今朔風既至霰雪已零絶國蕭條固難久處旃墻罽幕何以禦冬肉飯酪漿且非適口朕撫臨萬宇子育群生一物未安終食三歎况姑纍年漂泊何日忘懷想姑髙明必是懸鑒姑承宗廟之餘慶為三室之懿親先朝割愛降婚義寧家國謂回鶻必能侮禦安靜塞垣使邉人子孫不見兵革射獵者不敢西向畏軒轅之臺今回鶻所為甚不循理蕃渾是朕之人百姓牛羊亦國家所有因依漢地遂致蕃孶回鶻託以私讐恣為侵掠每馬首南向姑得不畏髙祖太宗之威靈欲侵擾邉疆姑得不思大皇大后之慈愛為其國母足得指揮若回鶻能不稟命則是棄絶姻好今日以後不得以姑為詞若恃我為親稟姑教令則須便自戢斂以繼舊歡想姑以朕此書喻彼將相令其知分更不徇非塞外祈寒且無絲纊朕每御裘服則思彼未授衣豈可回鶻譸張遂忘親愛今寄冬衣若干具如别録賜背叛回鶻敕書奉宣撰近數得邉將奏報知卿等本國自有離亂可汗遇禍雖未委虛實良深震悼我國家與卿等本國代結姻好久為親戚協德同心常為諸蕃所羡故得邉候不聳封疆晏然卿等忽領師徒漠南屯集又數至天德侵掠頗擾邉人聚師無名忠義俱失既乖舊好良用憮然若卿等本國所立新主非可汗至親人心不從擾亂未定卿等只合自申方略竭效忠誠安靖本蕃以圖勳績亦合遣使告朕具述此心若新立可汗是中國至親人已歸附卿等便合早自相率保國寧家與可汗協心以修舊好豈得寄命塞上久勞師人朕緣與卿本國情義至深事同一體又緣公主在彼未知存亡故遣使臣魏謨往諭朕意卿宜備陳誠𣢾不得虛詞兼禁戢師徒勿為侵軼近聞天德遊奕軍將曽有交鋒卿等既犯塞垣亦是邉將常事今已各令諸鎮不許交兵卿宜曉諭部落各令知悉賜回鶻嗢沒斯特勒等詔書奉宣撰敕回鶻嗢沒斯特勒那頡啜特勒頡干伽思於解亦阿耽于思莫賀逹干宰相伊難朱密伽諦略摩咄將軍諦略等天德軍遞所奏表至再三省覽憂屬良深彼蕃自忠義毗伽可汗以來代為親鄰連降愛主恩禮持異古今莫及君臨萬國撫育殊方苟有未安則宜來告况特勒等乃祖乃父歸誠纍朝昨遣嗣澤王溶吊册先可汗回始聞卿國中喪亂諸部乖離救患恤鄰豈忘令典方圖鎮撫以命使臣今又知堅昆等五族深入凌虐可汗被害公主及新可汗播越他所未歸城邑特勒等力不能制思存逺圖相率遁逃萬里歸命又知欲奉公王朝覲忠謀不從已踰大漠之南同𣢾五原之塞彂此單使布其赤心言念艱危惻然軫歎料卿等皆英酋貴族羈寓沙場懷土之情如何可處豈非欲討除外冦匡復本蕃抱此至忠託於大援但緣未知指的難便聽從又慮邉境守臣見卿忽至或懷疑阻不副朕心故遣鴻臚卿張賈馳住安撫朕既奬卿忠款報以信誠雖隔塞垣已如相見卿須深明朕忠盡吐所懷一一言於使臣令其速還聞奏佇聞誠願續有指揮必當副彼急難固不惜於事力勉於謀度用保忠勳秋熟卿及部下諸官并左相阿波兀等部落黑車子逹怛等平安好遣書指不多及賜回鶻嗢沒斯等詔奉宣撰敕回鶻嗢沒斯特勒那頡啜特勒悉勿啜特勒烏離思特勒赤心宰相等張賈等回知卿等欲遠赴闕庭自申忠款眷言深志豈忘于懷聞卿等本國頃因飢荒遂至離散親屬內叛諸部外侵新立可汗猶未安定既是國中所奉則為卿等君親古人云未有仁而遺其親者義而後其君者想卿等本心必思推戴况回鶻代雄朔漠威服諸蕃今已破傷足堪悲憤若皆自爭雄長不顧其君各據一隅必更衰弱深慮從此之後為諸蕃所輕與卿等本國代結姻親久修鄰好每念於此良用惻然與卿等為謀須務遠大莫若自相率勵同奉可汗興復本蕃再圖強盛朕欲召卿赴闕親諭此懷又恐可汗聞知謂朕幸其艱危因有招納蓋欲深全國體兼為卿等避嫌以此思之難遂於請卿等宜早歸本國不更滯留卿等表請器甲朕君臨萬國非止一蕃祖宗舊章不敢逾越國家未曽賜諸蕃器甲卿等亦合備知若一處開恩必自茲援例朔州般次舊例須待可汗遣駝馬迎聖方令進彂可汗信使未至難於遣行今有賜物具在别録以卿等率先向彂特示優恩緣新立可汗未受朝廷册命數降使至卿等部落亦恐非宜所有賜賚止於此度想卿等明識深諒朕懷便令髙品魏敬休宣諭想宜知悉賜思忠詔書奉宣撰吕衛等至知卿與可汗不能戢下頗擾邉疆既告諭不浚須兵勢驅逐卿忠誠奮彂願立竒功請退渾沙陀等部落合勢及戰馬器甲等並已允卿所奏各有别敕處分今令左衛將軍何淸朝蔚州刺史契苾通分領蕃渾部落取卿指揮朕已切戒何淸朝等令其協盡心力副卿忠誠進取之時一切取卿方略卿宜每事與弘順等商量審度事機勿為輕進但得可汗抽退不敢稽留塞上安寧即是卿之勳力必不可落其姦計以損國威兼令髙品駱遂泰權監行營將士卿與之籌慮續續奏聞五卷終
