body:
  text: 十一軍築杖義城以制大度青溪闗之阻作禦侮城以控榮經犄角勢作柔逺城以阨西山吐蕃復卬崍闗徙巂州治臺登以奪蠻險舊制嵗抄運内粟贍黎巂州起嘉眉道陽山江而達大度乃分餉諸戍常以盛夏土地苦瘴毒輦夫多死徳裕命轉卬雅粟以十月為漕始先夏而至以佐陽山之運饋者不涉炎月逺民乃安蜀人多鬻女為人妾徳裕為著科約凡十三而上執三年勞下者五嵗及期則歸之父母毀屬下浮屠私廬數千以地予農蜀先主祠旁有猱村其民剔髮若浮屠者畜妻子自如徳裕下令禁止蜀風大變於是二邊寖懼南詔請還所俘掠四千人吐蕃維州將悉怛謀以城降維距成都四百里因山為固東北由索叢嶺而下二百里地無險走長川不三千里直吐蕃之牙異時戍之以制虜入者也徳裕既得之即發兵以守且陳出師之利僧孺居中沮其功命返悉怛謀於虜以信所盟徳裕終身以為恨㑹監軍使王踐言入朝盛言悉怛謀死拒逺人向化意帝亦悔之即以兵部尚書召俄拜中書門下平章事封賛皇縣伯故事丞郎詣宰相須少間乃敢通郎官非公事不敢謁
