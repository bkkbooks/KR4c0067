body:
  text: 李衛公外集巻四唐李徳裕撰評史四史評評史四貨殖論欲知將相之賢不肖視其貨殖之厚薄彼貨殖厚者可以回天機幹河嶽使左右貴倖役當世奸人若孝子之養父母矣隂陽不能為其寇寒暑不能成其疾鬼神不能促其數雷霆不能震其邪是以危而不困老而不死縱人生之大欲處將相之極休兄弟光華子孫安樂昔公孫朝穆好酒及色而不慕榮禄鄧析猶謂之真人况兼有榮禄乎後世雖有貶之者如用斧鉞於糞土施桎梏於朽株無害於身矣則大易之害盈福謙老氏之多藏厚亡不足信矣昔秦時得金策謂之天醉豈天之常醉哉故晉世唯貴於錢神漢台不慙於銅臭謂子文無兼日之積顔氏樂一瓢之飲晏平仲祀不掩豆儀休愠以拔葵皆為薄命之人矣如嚮者四賢天與之生則生天與之壽則壽窮達夭壽皆在彼蒼而望貴倖之知奸人之譽終身不可得矣余有力命賦以致其意庶後之知我者興歎而巳近世良相論客謂余曰揚子法言有重黎顔騫二篇品藻漢之將相敢問近代良相可得聞乎余曰唯唯夫股肱與君同體四海之所瞻也恩義至重實先於愛敬非社稷大計不可以强諫亦猶父有諍子不獲巳而諍豈可以為常也唯宜將明獻替致其主於三代之隆孝經曰天子有諍臣七人非宰相之職也必求端士正人以當言責導其謇諤救其患難而巳唯聖人言危而不持顛而不扶則焉用彼相此亦將明獻替之謂也使其君昭明令徳不至於顛危也漢之良相十數人矣公孫𢎞開陳其端而不肯廷辯固未可也蕭望之剛不護闕王嘉訐而犯上致元哀二后有信讒邪之惡戮忠直之名此其失者也魏相薛廣徳持重守正弼諧盡忠可謂得宰相體矣近世貞以制動思在無邪松柏所以後凋藜藿由是不採貴不患失言必匪躬似薛廣徳者鄭丞相陳丞相有之矣麟之為瑞也仁而不觸玉之為寳也亷而不劌恕以及物善不近名髙朗令終天下無怨似丙博陽者王丞相鄭丞相有之矣好古洽聞應變膚敏㡬可以成務智足以取捨仁愛樂善勤瘁奉公逢時得君不失其正似倪寛者韋丞相李丞相有之矣困於臲卼以盡天涯雖劒光不沈而鸞翮長鎩靈均之九死無悔栁惠之三黜非辜既沒不瞑號於上帝似蕭望之者所謂李丞相矣余亦同病莫保其生知我者以為忠亦巳鮮矣庶乎數世之後朋黨稍息以俟知音耳近世節士論客又謂余曰近世將相既巳聞之矣敢問士君子身在下位而義激衰世者有其人乎余曰焉得無之丁生魏生是也昔葢寛饒多仇少與在位及貴戚人與為怨唯諫議大夫鄭昌愍傷寛饒忠直憂國為文吏所詆挫上書曰山有猛獸藜藿為之不採國有忠臣奸邪為之不起寛饒上無許史之屬下無金張之託職在司察直道而行鄭昌可謂好是正直矣梅福南昌一尉耳與王章無薦寵之私無遊宴之好當王鳳之世權歸外戚上書曰䳒鵲遭害則仁鳥増逝愚者䝉戮則智士深退折直士之節結諫臣之舌羣臣皆知其非然不敢争天下以言為戒最國家之大患也梅福可謂不畏强禦矣余頃嵗待罪廟堂六年竊位而言責之官執憲之臣屢薦丁生稱其有清直之操亦有毀之者曰體羸多病必不能舉職余惑是説未及升之於朝而一旦觸羣邪犯衆怒為一孤臣獨夫正言無避亦鄭昌梅福之比也昔貫髙竟能以不生白王而髙祖賢其然諾戴就不忍以臣謗其君而薛安感其壯節周燕寜恨於不食陸績豈辭於禁錮世歴千祀有此㡬人魏生為酷吏所逼終不詘服詞義雅正有古人之風亦貫髙戴就之儔也嗚呼田叔孟舒皆位顯於朝而魏生亦輿疾逺竄溘盡道途疑其幽魂必上訴於天矣或曰自古名節之士鮮受厚福豈天意于善人薄耶余曰非也夫名節者非危亂不顯非險難不彰免鈇鑕全性命者尚十無二三况福禄乎若使不受困辱不嬰楚毒父母妻子恬然安樂則天下之人盡為之矣又何貴于名節者哉折羣疑相論夫相之相在乎清明將之相在乎雄傑清明者珠玉是也為天下所寳雄傑者虎兕是也為百獸所伏然清者必得大權不能亨豐富雄者必當昌侈不能為大柄兼而有之者在乎粹美而巳余頃嵗蒞淮海屬縣有旴􅇇而山多珉玉剖而為器清明洞澈雖水精明氷不如也而價不及凡玉終不得為至寳以其不粹也清而粹者天也故髙不可測清而澈者泉也故深亦可察此其大略也余嘗精而求之多士以才為命婦人以色為命天賦是美者必將有以貴之才髙者雖孟嘗眇小蔡澤折額亦居萬人之上色美者雖鉤弋之拳子夫之賤亦為萬乗之偶然不如清而粹者必身名俱榮福禄終泰張良是也擇士能用此術可以拔十得九無所疑也禱祝論語曰丘之禱久矣又曰祭則受福豈非聖人與天地合徳與日月合明與鬼神合契無所請禱而禱必感通唯牧伯之任不可廢也失時不雨稼穡將枯閉閣責躬百姓不見若非避羣望則皆謂太守無憂人之意雖在􅅵畝不絶歎音余前在江南毀淫詞一千一十五所可謂不謟神黷祭矣然嵗或大旱必先令掾屬祈禱積旬無效乃自躬行未嘗不零雨隨車或當霄而應其術無他唯至誠而巳將與祭必閒居二日清心齊戒雖禮未申於泂酌而意巳接於神明所以治郡八年嵗皆大稔江左黎庶謳歌至今古人乃有剪𤓰致詞積薪自誓精意上達雨必滂沱此亦至誠也苟誠能達天性能及物焉用以肌膚自苦焦爛為期動天地感鬼神莫尚於至誠故備物不足報功禴祭所以受福余以為人患不誠天之去人不相逺矣黄冶論或問黄冶變化余曰未之學也焉知無有然天地萬物皆可以至理索之夫光明砂者天地自然之寳在石室之間生雪床之上如初生芙蓉紅苞未拆細者環拱大者處中有辰居之象有君臣之位光明外澈採之者尋石脈而來此造化之所鑄也倘至人道奥者用天地之精合隂陽之粹濟以神術或能成之若以藥石鎔鑄術則疎矣昔人問揚子鑄金而得鑄人以孔聖鎔冶顔子至於殆庶㡬亦參造化之鑄丹砂矣方士固不足恃劉向葛洪皆下學上達極天地之際謂之可就必有精理劉向鑄作不成得非天意宻此神機不欲世人皆知之矣祥瑞論夫天地萬物異於常者雖至美至麗無不為妖覩之宜先戒懼不可以為禎祥何以言之桓靈之世多鸞鳳丘墳之上生芝草神仙之物食之上可以凌倒景次可以保永年生於丘墳豈得為瑞若以孝思所致則瞽瞍之墓曽晳之墳宜生萬株矣何者為仁孝之瑞唯甘露降於松柏縞鹿素烏馴擾不去皆有縞素之色足表幽明之感貞元中余在甌越有隠者王遇好黄冶之術暮年有芝草數十莖産於丹竈之前遇自以為名在金格暢然滿志逾月而遇病卒齊中書抗有别業在若耶溪忽生芝草百餘莖數月而中書去世又餘姚守盧君在郡時有芝草生於督郵屋梁上五綵相鮮若樓臺之狀其嵗盧君為叛将栗鍠所害置遺骸於屋梁之下並耳目所驗非自傳聞由是而言則褒姒驪姬皆為國妖以禍周晉綠珠窈娘皆為家妖以災喬石不可不察也又黄河清而聖人出徵應不在於當世明矣栁谷𤣥石為魏室之妖啓將來之瑞亦不可不察也是以宜先戒懼以消桑穀雉雊之變耳㝠數有報論宣尼罕言性命不語怪神非謂無也欲人嚴三綱之道奉五常之敎修天爵以致人爵不欲言富貴出於天命福禄由於冥數昔衛卜協於沙丘為謚巳久秦塞屬於臨洮名子不寤朝歌未滅而周流丹烏矣白帝尚在而漢斷素蛇矣皆兆發於先而符應於後不可以智測也周孔與天地合徳與鬼神合契將來之數無所遁情而狼跋於周鳳衰於楚豈親戚之義不可去也人倫之敎不可廢也條侯之貴鄧通之富死於兵革可也死於女室可也唯不宜以餒終此又不可以理得也而命偶時來盜有名器者謂禍福出於胸懐榮枯生於口吻沛然而安溘然而笑曽不知黄雀遊於茂林而挾彈者在其後也余乙丑嵗自荆楚保釐東周路出方城聞於隠者困於泥塗不知其所如也往謂方城長曰居守後二年南行萬里則知憾余者必因天譴譛余者必自鬼謀雖抱至寃不以為恨也余嘗三遇異人非卜祝之流皆遁世者也初掌記北門有管涔山隠者詣余曰君明年當在人君左右為文翰之職然須值少主余聞之愕眙洒然變色隠者亦悔失言避席求去余徐問曰何為而事少主對曰君與少主巳有累世縁業是以言之余其年秋登朝至明年正月穆宗纉緒召入禁苑及右丞御史有閩中隠者叩門請見余因下榻與語曰時事非人公不早去冬必作相禍將至矣若亟請居外代公者受患後十年終當作相自西南而入是秋出鎮吳門嵗經八稔尋又杖鉞南燕秋暮有邑子王生引鄴郡道士至纔升賔階未及命席謂余曰公當為西南節制孟冬望舒前節符至矣三者皆與言協不差嵗月自憲闈竟十年居相由西蜀而入代余執憲俄亦竄逐唯再謫南服未嘗有前知者為余言之豈禍患不可移者神道所秘莫得預聞自古銜寃歿世者多矣㝠報之事或有或無遂使好亂樂禍者以神道為茫昧余嘗論之仁人上哲必達生知命如顔氏之子犯而不校釋門達磨了空喻幻必不思報矣其下柔弱無心者力不能報所能報者乃中人耳悍强任氣如伯有灌夫之流亦其在臨歿之際方寸不撓魂魄不散唯結念於此是以能報夫人之捨生也如薪盡火滅溘然則無能為矣達於理者使心不亂則精爽常存不生不滅自可以超然出世升躋神明其次精多魄强則能為厲㝠報之事或有或無理在此也周秦行紀論言發於中情見乎辭則言辭者志氣之來也故察其言而知其内玩其辭而見其意矣余嘗聞太牢氏好竒怪其身險易其行以其姓應國家受命之䜟曰首尾三麟六十年兩角犢子恣狂顛龍蛇相鬭血成川及見著𤣥怪録多造隠語人不可解其或能曉一二者必附㑹焉縦司馬取魏之漸用田常有齊之由故自卑秩至于宰相而朋黨若山不可動揺欲有意擺撼者皆遭誣坐莫不側目結舌事具史官劉軻日歴余得太牢周秦行紀反覆覩其太牢以身與帝王后妃㝠遇欲証其身非人臣相也將有意於狂顛及至戲徳宗為沈㜑兒以代宗皇后為沈㜑令人骨戰可謂無禮於其君甚矣懐異志於圖䜟明矣余少服臧文仲之言曰見無禮於其君者如鷹鸇之逐鳥雀也故佇太牢巳久前知政事欲正刑書力未勝而罷余讀國史見開元中御史汝南子諒彈奏牛仙客以其姓符圖䜟雖似是而未合三麟六十之數自裴晉國與余涼國彭原程趙郡紳諸從兄嫉太宰如仇頗類余志非懐私忿葢惡其應䜟也太牢作鎮襄州日判復州刺史樂坤賀武宗監國狀曰閑事不足為賀則恃姓敢如此耶㑹余復知政事將欲發覺未有由值平昭義得與劉從諫交結書因竄逐之嗟乎為人臣隂懷逆節不獨人得誅之鬼得誅矣凡與太牢膠固未嘗不是薄流無賴輩以相表裏意太牢有非望而就佐命焉斯亦信符命之致或以中外罪余於太牢愛憎故明此論庶乎知余志所恨未暇族之而余又罷豈非王者不死乎遺禍胎於國亦余大罪也倘同余志繼而為政宜為君除患歴既有數意非偶然若不在當代其必在於子孫須以太牢少長咸寘於法則刑賞中而社稷安無患於二百四十年後嘻余致君之道分隔於明時嫉惡之心敢辜于早嵗因援毫而攄宿憤亦書行紀之跡於後梁武論所論出於釋氏故全以釋典明之世人疑梁武建佛刹三百餘所而國破家亡其禍甚酷以為釋氏之力不能拯其顛危余以為不然也釋氏有六波羅密檀波羅密是其一也又曰難捨能捨大者頭目支體其次國城妻子此所謂難捨也余嘗深求此理本不戒其不貪能自微不有其寳必不懆人所寳與老氏之無欲知足司城之不貪為寳其義一也庸夫謂之作福斯為妄矣而梁武所建佛刹未嘗自損一毫或出自有司或厚斂氓俗竭經國之費破生人之産勞役不止杼柚其空閏位偏方不堪其弊以徼身福不其悖哉此梁武所以不免也喜徵論陸賈稱蟢子垂而百事禁不徵其故何也凡人將有喜兆必垂於冠冕余嘗思之蓋以人肖圓方之形稟五行之氣有生之最靈者也如景如火忽有歊然感氣發于圓首之上其榮盛也如陽氣發生烟涵煴煦其變衰也如秋氣索然寂寞沈悴雖不能自覩其鑒明者必可察之唐舉許負疑用此術所以望表而知窮達何以明之淑春愛景必有蟢子垂於簷楹之間室有明燭膏爐必垂于屏幃之際喜氣将盛故集於冠冕之上以此推之無所逃也李衛公外集巻四
