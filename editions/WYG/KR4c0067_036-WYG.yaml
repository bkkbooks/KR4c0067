body:
  text: 李宗閔時往往通賔客李聴為太子太傅招所善載酒集宗閔閣酣醉乃去至徳裕則喻御史有以事見宰相必先白臺乃聴凡罷朝由龍尾道趨出遂無輒至閣者又罷京兆築沙堤兩街上朝衛兵常建言朝廷惟邪正二途正必去邪邪必害正然其辭皆若可聴願審所取舍不然二者並進雖聖賢經營無由成功俄而宗閔罷徳裕代為中書侍郎集賢殿大學士始二省符江淮大賈使主堂厨食利因是挾貲行天下所至州鎮為右客富人倚以自髙徳裕一切罷之後帝暴感風害語言鄭注始因王守澄以藥進帝少間又薦李訓使待詔帝欲授諫官徳裕曰昔諸葛亮有言親賢臣逺小人先漢所以興隆也親小人逺賢臣後漢所以傾頽也今訓小人頃咎惡暴天下不宜引致左右帝曰人誰無過當容其改且逢吉嘗言之對曰聖賢則有改過若訓天資奸邪尚何能改逢吉位宰相而顧愛兇回以累陛下亦罪人也帝語王涯别與官徳裕揺手止涯帝適見不懌訓注皆怨即復召宗閔輔政拜徳裕為興元節度使入見帝自陳願留闕下復拜兵部尚書宗閔奏命巳行不可止更徙鎮海軍以代王璠先是大和中漳王養母杜仲陽歸浙西有詔在所存問時徳裕被詔乃檄留後使如詔書璠入為尚書左丞而漳王以罪廢死因與户部侍郎李漢共譛徳裕嘗賂仲陽導王為不軌帝惑其言召王涯李固言路隋質之注璠漢三人者語益堅獨隋言徳裕大臣不宜有此讒燄少衰遂貶徳裕為太子賔客分司東都復貶袁州長史隋亦免宰相未㡬宗閔以罪斥而注訓等亂敗帝追悔徳裕以誣搆逐乃徙滁州刺史又以太子賔客分司東都開成初帝從容語宰相朝廷豈有遺事乎衆咸以宋申錫對帝俛首涕數行下曰當此時兄弟不相保獨申錫邪有司為我褒顯之又曰徳裕亦申錫比也起為浙西觀察使後對學士禁中黎埴頓首言徳裕與宗閔皆逐而獨三進官帝曰彼嘗進鄭注而徳裕欲殺之今當以官與何人埴懼而出又指坐扆前示宰相曰此徳裕争鄭注處徳裕三在浙西出入十年遷淮南節度使代牛僧孺僧孺聞之以軍事付其副張鷺即馳去淮南府八十萬緡徳裕奏言止四十萬為鷺用其半僧孺訴于帝而諫官姚合魏謩等共劾奏徳裕挾私怨沮傷僧孺帝置章不下詔徳裕覆實徳裕上言諸鎮更代例殺半數以備水旱助軍費因索王播段文昌崔從相授簿最具在惟從死官下僧孺代之其所殺數最多即自劾始至鎮失於用例不敢妄遂待罪有詔釋之武宗立召為門下侍郎同中書門下平章事既入謝即進戒帝辨邪正專委任而後朝廷治臣嘗為先帝言之不見用夫正人既呼小人為邪小人亦謂正人為邪何以辨之請借物為諭松栢之為木孤生勁特無所因倚蘿蔦則不然弱不能立必附他木故正人一心事君無待於助邪人心更為黨以相蔽欺君人者以是辨之則無惑矣又謂治亂繫信任引齊桓公問管仲所以害霸者仲對琴瑟笙竽弋獵馳騁非害霸者惟知人不能舉舉不能任任而又雜以小人害霸也太𤣥徳憲四宗皆盛朝其始臨御自視若堯舜寖久則不及初陛下知其然乎始一委輔相故賢者得盡心久則小人並進造黨與亂視聴故上疑而不專政去宰相則不治矣在徳宗最甚晩節宰相惟奉行詔書所與圖事者李齊運裴延齡韋渠牟等訖今謂之亂政夫輔相有欺罔不忠當亟免忠而材者屬任之政無他門天下安有不治先帝任人始皆回容積纎微以至誅貶設使雖小過必知而改之君臣無猜則讒邪不干其間矣又言開元初輔相率三考輒去雖姚崇宋璟不能逾至李林甫秉權乃十九年遂及禍敗是知亟進罷宰相使政在中書誠治本也帝嘗疑楊嗣復李珏顧望不忠遣使殺之徳裕知帝性剛而果於斷即率三宰相見延英嗚咽流涕曰昔太宗徳宗誅大臣未嘗不悔臣欲陛下全活之無異時恨使二人罪惡暴著天下共疾之帝不許徳裕伏不起帝曰為公等赦之徳裕降拜升坐帝曰如令諫官論事雖千疏我不赦徳裕重拜因追還使者嗣復等乃免時帝數出畋游暮夜乃還徳裕上言人君動法於日故出而視朝入而燕息傳曰君就房有常節惟深察古誼毋繼以夜側聞五星失度恐天以是勤勤儆戒詩曰敬天之渝不敢馳驅願節田游承天意尋冊拜司空回鶻目開成時為黠戛斯所破㑹昌後烏介可汗挾公主牙塞下種族大飢以弱口重器易粟於邊退渾党項利虜掠因天徳軍使田牟上言願以部落兵擊之議者請可其奏徳裕曰回鶻於國尚有功以窮來歸未輙擾邊遽伐之非漢宣帝待呼韓之義不如與之食以待其變陳夷行曰資盜糧非計也不如擊之便徳裕曰沙陀退渾不可恃也夫見利則進遇敵則走雜虜之常態孰肯為國家用邪天徳兵素弱以一城與勁虜當無不敗請詔牟無聴諸戎計帝於是貸粟二萬斛㑹嗢沒斯殺赤心以降赤心兵潰於是回鶻勢窮數丐羊馬欲藉兵復故地又願假天徳城以舍公主帝不可乃進逼振武保大柵杷頭峰以略朔川轉戰雲州刺史張獻節嬰城不出回鶻乃大掠党項退渾皆保險莫敢拒帝益知不許田牟用二部兵之效乃復問以計徳裕曰杷頭峰北皆大磧利用騎不可以步當之今烏介所恃公主爾得健將出竒奪還之王師急擊彼必走今鋭將無易石雄者請以藩渾勁卒與漢兵銜枚夜擊之勢必得帝即以方略授劉汚令雄邀擊可汗於殺胡山敗之迎公主還回鶻遂敗進位司徒黠戛斯遣使來且言攻取安西北廷帝欲從黠戛斯求其地徳裕曰不可安西距京師七千里北廷五千里異時繇河西隴石抵玉門闗皆我郡縣往往有兵故能緩急調發自河隴入吐蕃則道出回鶻回鶻今破滅未知黠戛斯果有其地邪假令安西可得即復置都䕶以萬人往戍何所興發何道饋輓彼天徳振武於京師近力猶苦不足况七千里安西哉臣以為縱得之無用也昔漢魏相請罷田車師賈捐之請棄珠崖近狄仁傑亦請棄四鎮及安東皆不願貪外以耗内此三臣者當全盛時尚欲棄割以肥中國况久沒甚逺之地乎是持實費市虚事滅一回鶻而又生之帝乃止澤潞劉從諫死其從子稹擅畱事以邀節度徳裕曰澤潞内地非河朔比昔皆儒術大臣守之李抱真始建昭義軍最有功徳宗尚不許其子繼及劉悟死敬宗方怠於政遂以符節付從諫太和時擅兵長子隂連訓注外託効忠請除君側及有狗馬疾謝醫拒使便以兵屬稹捨而不討無以示四方帝曰可勝乎對曰河朔稹所恃以脣齒也如令魏鎮不與則破矣夫三鎮世嗣列聖許之請使近臣明吿以澤潞命師不得視三鎮今朕欲誅稹其各以兵㑹帝然之乃以李回持節諭王元逵何𢎞敬皆聴命始議用兵中外交章固争皆曰悟功高不可絶其嗣又從諫畜兵十萬粟支十年未可以破也他宰相亦媕娿趨和徳裕獨曰諸葛亮言曹操善為兵猶五攻昌霸三越巢湖況其下哉然贏縮勝負兵家之常惟陛下聖策先定不以小利鈍為浮議所揺則有功矣有如不利臣請以死塞責帝忿然曰為我語於朝有沮吾軍議者先誅之羣論遂息元逵兵巳出而𢎞敬逗留持兩端徳裕建遣王宰以陳許精甲假道於魏以伐磁𢎞敬聞遽勒兵請自涉漳取磁路㑹横水戍兵叛入太原逐其帥李石奉裨將楊弁主留事方是時稹未下朝廷益為憂議者頗言兵皆可罷帝遣中人馬元實如太原偵其變弁厚賄中人帳飲三日還謬曰弁兵多屬明光甲者十五里徳裕詰曰李石以太原無兵故調横水卒千五百使戍榆社弁因以亂渠能列卒如此多邪則曰晉人勇皆兵也募而得之徳裕曰募士當以財李石以人欠一縑故兵亂石無以素之弁何得邪太原一鎧一㦸舉送行營安致十五里明光乎使者語塞徳裕即奏弁賤伍不可赦如力不足請捨稹而誅弁遽趣王逢起榆社軍詔元逵趨土門㑹太原河東監軍吕義忠聞即日召榆社卒入斬弁獻首京師徳裕每疾貞元太和間有所討伐諸道兵出境即仰給度支多遷延以困國力或與賊約令懈守備得一縣一屯以報天子故師無大功因請敕諸將令直取州勿攻縣故元逵等下刑洛磁而稹氣索矣俄而高文端歸命稱稹糧乏皆女子挼穟哺兵未㡬郭誼持稹首降帝問何以處誼徳裕曰稹豎子安知反職誼為之今三州巳降而稹窮蹙又販其族以邀富貴不誅後無以懲惡帝曰朕意亦爾因詔石雄入潞盡取誼等及嘗為稹用者悉誅之策功拜太尉進封趙國公徳裕固讓言唐興太尉惟七人尚父子儀乃不敢拜近王智興李載義皆超拜保傅盖重惜此官裴度為司徒十年亦不遷臣願守舊秩足矣帝曰吾恨無官酬公母固辭徳裕又陳先臣封於趙冢孫寛中始生字曰三趙意將傳嫡不及支庶臣前益封巳改中山臣先世皆嘗居汲願得封衛從之遂改衛國公帝嘗從容謂宰相曰有人稱孔子其徒三千亦為黨信乎徳裕曰昔劉向云孔子與顔回子貢更相稱譽不為朋黨禹稷與臯陶轉相汲引不為比周無邪心也臣嘗以共鯀驩兠與舜禹雜處共工驩兠則為黨舜禹不為黨小人相與比周迭為掩蔽也賢人君子不然忠於國則同心聞於義則同志退而各行其巳不可交以私趙宣子隨㑹繼而納諫司馬侯叔向比以事君不為黨也公孫𢎞每與汲黯請間黯先發之𢎞推其後武帝所言皆聴黯𢎞雖並進然廷詰齊人少情譏其布被為詐則先發後繼不為黨也太宗與房𤣥齡圖事則曰非杜如晦莫能籌之及如晦在焉亦推𤣥齡之策則同心圖國不為黨也漢朱博陳咸相為腹心背公死黨周福房植各以其黨相髙議論相軋故朋黨始於甘陵二部及甚也謂之鉤黨繼受誅夷以王制言之非不幸也周之衰列國公子有信陵平原孟嘗春申游談者以四豪為稱首亦各有客三千務以譎詐勢利相傾仲尼之徒惟行仁義今議者欲以比之罔矣臣未知所謂黨者為國乎為身乎誠為國邪隨㑹叔向汲黯房杜之道可行不必黨也今所謂黨者誣善蔽忠附下罔上車馬馳驅以趨權勢畫夜合謀美官要選悉引其黨為之否則抑壓以退仲尼之徒有是乎陛下以是察之則姦偽見矣時韋𢎞質建言宰相不可兼治錢穀徳裕奏言管仲明於治國其語曰國之重器莫重於令令重君尊君尊國安治人之本莫要於令故曰虧令者死益令者死不行令者死留令者死不從令者死五者無赦又曰令在上而論可否在下是主威下繫於人也太和後風俗寖敝令出於上非之在下此敝不止無以治國匡衡曰大臣者國家股肱萬姓所瞻仰明主所慎擇也傳曰下輕其上爵賤人圖柄臣則國家揺動而人不静今𢎞質為人所敎而言是圖柄臣者也且蕭望之漢名儒為御史大夫奏云嵗首日月少光咎在臣等宣帝以望之意輕丞相下有司詰問貞觀中監察御史陳師合上言人之思慮有限一人不可總數職太宗曰此欲離間我君臣斥之嶺外臣謂宰相有姦謀隠慝則人人皆得上論至於制置職業人主之柄非小人所得干議古者朝廷之士各守官業思不出位𢎞質賤臣豈得以非所宜言妄觸天聴是輕宰相陛下照其邪計從黨人中來當遏絶之徳裕大意欲朝廷尊臣下肅而政出宰相深疾朋黨故感憤切言之又嘗謂省事不如省官省官不如省吏能簡冗官誠治本也乃謂罷郡縣吏凡二千餘員衣冠去者皆怨時天下巳平數上疏乞骸骨而星家言熒惑犯上相又懇丐去位皆不許當國凡六年方用兵時決策制勝他相無與故威名獨重於時宣宗即位徳裕奉冊太極殿帝退謂左右曰向行事近我者非太尉邪每顧我毛髮為森豎翌日罷為檢校司徒同中書門下平章事荆南節度使俄徙東都留守白敏中令狐綯崔鉉皆素仇大中元年使黨人李咸斥徳裕隂事故以太子少保分司東都再貶潮州司馬明年又導吴汝納訟李紳殺吳湘事而大理卿盧言刑部侍郎馬植御史中丞魏扶言紳殺無罪徳裕狥成其寃至為黠御史罔上不道乃貶為崖州司戸參軍越明年卒年六十三徳裕既沒見夢令狐綯曰公幸哀我使得歸葬綯語其子滈滈曰執政皆其憾可乎既夕又夢綯懼曰衛公精爽可畏不言禍將及白於帝得以喪還徳裕性孤峭明辨有風采善為文章雖至大位猶不去書其謀議援古為質衮衮可喜嘗以經綸天下自為武宗知而能任之言從計行是時王室㡬中興先是韓全義敗於蔡杜叔良敗於深皆監軍宦人制其權將不得專進退詔書一日三四下宰相不豫又諸道鋭兵票士皆監軍取以自隨每督戰乗髙建旗自表師小不勝輒巻旗去大兵隨以北繇是王師所向多負至討回鶻澤潞徳裕建請詔書付宰司乃下監軍不得干軍要率兵百人取一以為衛自是號令明壹將乃有功元和後數用兵宰相不休沐或繼火乃得罷徳裕在位雖遽書警奏皆從容裁決率午漏下還第休沭輙如令沛然若無事時其處報機急帝一切令徳裕作詔徳裕數辭帝曰學士不能盡吾意伐劉稹也詔王元逵何𢎞敬曰勿為子孫之謀存輔車之勢元逵等情得皆震恐思效巳而三州降賊遂平帝毎稱魏博功則顧徳裕道詔語咨其切於事而能伐謀也三鎮每奏事徳裕引使者戒敕為忠義指意丁寧使歸各謂其師道之故河朔畏威不敢慢後除浮屠法僧亡命多趣幽州徳裕召邸吏戒曰為我謝張仲武劉從諫招納亡命今視之何益仲武懼以刀授居庸闗吏曰僧敢入者斬帝既數討叛有功徳裕慮忲于武不可戢即奏言曹操破袁紹於官度不追奔自謂所獲巳多恐傷威重養由基古善射者栁葉雖百步必中觀者曰不如少息若弓撥矢鉤前功皆棄陛下征伐無不得所欲願以兵為戒乃可保成功帝嘉納其言方士趙歸真以術進徳裕諫曰是敬宗時以詭妄出入禁中人皆不願至陛下前帝曰歸真我自識顧無大過召與語養生術爾對曰小人於利若蛾赴燭向見歸真之門車轍滿矣帝不聴于是挾術詭時者進帝志衰焉所居安邑里第有院號起草亭曰精思毎計大事則處其中雖左右侍御不得豫不喜飲酒後房無聲色娛生平所論著多行於世云子曄仕汴宋幕府貶象州立山尉懿宗時以赦令徙郴州餘子皆從死貶所曄子延右乾符中為集賢校理累擢司勲員外郎還居平泉昭宗東遷坐不朝謁貶衛尉主簿徳裕之斥中書舍人崔嘏字乾錫誼士也坐書制不深切貶端州刺史嘏舉進士復以制策歴邢州刺史劉稹叛使其黨裴問戍于州嘏説使聴命改考功郎中時皆謂遴賞至是作詔不肯巧傳以罪吳汝納之獄朝廷公卿無為辨者惟淮南府佐魏鉶就逮吏使誣引徳裕雖痛楚掠終不從竟貶死嶺外又丁柔立者徳裕當國時或薦其直清可任諫争官不果用大中初為左拾遺既徳裕被貶柔立内愍傷之為上書直其寃坐阿附貶南陽尉懿宗時詔追復徳裕太子少保衛國公贈尚書左僕射距其沒十年李衛公本傳
