body:
  text: 李衞公别集巻八唐李德裕撰箴丹扆箴并序臣聞詩云心乎愛矣遐不謂矣此古之賢人所以篤於事君者也夫迹疏而言親者危地遠而意忠者忤然臣竊念抜自先聖偏倚寵光若不愛君以忠則是上負靈鑒臣頃事先朝屬多隂沴常獻大明賦以諷頗䝉先朝嘉納臣今日盡節明主亦猶是心昔張敞之守遠郡梅福之在遐徼尚竭誠盡規不避尤悔况臣嘗學舊史頗知官箴雖在疎遠猶思獻替謹稽首上丹扆六箴具列于後仰塵睿覽伏積兢惶一宵衣箴先王聽政昧爽以俟雞鳴既盈日出而視伯禹大聖寸隂為貴光武至仁反友不忌無俾姜后猶去簪珥彤管記言克念前志二正服箴聖人作服法象可觀雖在宴遊尚不懷安汲黯莊色能正不冠楊阜毅然亦譏縹紈四時所御各有其官非此勿服惟辟所難毅然一作慨然三罷獻箴漢文罷獻詔還騄駬鑾輅徐驅安用千里厥后令王亦能恭已翟裘既焚筒布則毁道德為麗慈儉為美不過天道斯為至理四納誨箴惟后納誨以求厥中從善如流乃能成功漢成沉􅊺舉白浮鍾魏明侈汰凌霄作宫中雖不忤而善亦從以規為瑱是謂塞聰五辯邪箴居上處深在察微萌雖有讒慝不能蔽明漢之孝昭叡過周成上書知詐照姦得情燕蓋既折王猷治平百代之後乃流淑聲六防微箴天子之孝敬遵王度安必思危乃無遺慮亂臣猖獗非可遽數𤣥黄莫辨觸瑟始仆栢谷微行􅉘豕塞路覩貌獻飱斯可誡懼舌箴并序戊辰歲仲春月戊申夜余宿於洞庭西夢與中書令姚公偶坐如舊相識問余曰君見僕所作口箴乎余對曰去歲居守東周於公曾孫諫議某處覩金石之刻遂莞爾而笑曰孫子猶能記之余以仲夏月達于海曲嘗竊思之聖哲之言上可以動天地成典謨次可以正人倫明得失黙而不言後代何述焉繫辭云不善則千里之外違之在植其所言而已矣豈必緘其口銘其背以矯當世哉楊子稱孰有書不由筆言不由舌張儀以舌存而交亂亦善不善之效也余感姚公之夢乃為舌箴云粵有帝舜洎於殷宗龍命惟允說言乃雍周有良弼王之喉舌鼓舞而生渙汗乃發傳以言旋作義易以講習施悦天以巻舌屏讒儒以金口駕說伯陽之誡柔存剛缺言貴無瑕辯貴若訥則知門猶閉囊不在括是以揚雄悼讒者之寃梅福痛忠臣之結善乎先聖之言既明且清國之以寧人之不朽犯無隱情無恃爾言駟馬不及嗟爾君子念茲在茲勿以寤一言而取宰相以舌三寸而為帝師徒見婁敬掉而獲爵不知魏其齰以可悲雖言必有中而適其時子房能用其策難以爭立愛奉春善建不抜無以免係縲衞武警夫莫捫叔向哀於是出惟敬仲之難明由匠石之無質揚子曰重則有法輕則招憂言能如是可以寡尤聖祖院石磬銘有美浮石凄若銅音笙竽合奏鸞鷟在林清越盈耳和愉感心懸之玉宇永託僊岑鹿跡山銘不動者山不死者仙山在仙存眞訣不傳猗歟先生耽道體𤣥騰駕素鹿遨遊紫烟時憇蓬壺下視桑田一往茲山于今幾年茲山岑寂先生是宅清泉綠蘿獨與世隔我居洞宫人見崖壁空留鹿跡永存幽石劒門銘羣山西來波積雲屯地險所㑹斯為蜀門層岑峻壁森若戈㦸萬壑奔東雙飛高闕翠嶺中横黵然黛色樹茲雄屏以衞王國劒門當中有一峯峻嶺横峙望若列屏此一峯最竒而說者未嘗及也峯抜井幹溪回溝洫嚴守重扄隱如臨敵運有隆替地無險阨閉于昏頑開于有德馬錯西伐蜀侯敗績艾出隂平禪亦來格粤在憲祖英威四克始剪蜀妖遂清卭棘蠻夷軌道諸侯述職武臣銘之金石乃刻圯上圖賛夫天所以晬清者其氣理也故能四時變化萬物粲然倦則隂陽為災光景不耀而况於人乎人亦肖圜方之形稟清濁之氣存神索智極物窮情則倚伏之先見其如視矣子房潛心於神而達之見其圓狀如得其奥則有女子之粹美嬰兒之專和粹所以含至精專所以研至賾散萬金之資柔毅也報萬乘之仇仁勇也學禮闕履方也變名圯上避世也若乃五日為期三往增敬則尾生之信違道矣退不離國心不忘君則䲭夷之遁非忠矣合時變以蟬蛻望僊路以鴻㝠優游於綺皓之門髣髴乎赤松之際豈不善始善終哉黄石者其天地之藴神明之璽歟不然則無以覺悟子房輔翼天漢嗟乎䘮亂既定韜匵而葆嗣之生也奉符殁而同穴有以見子房之神交不渝矣大迦葉賛頭陀第一惟大迦葉依無上智初分寳坐終授宻記晚遇金粟乃知平地潜形雞足以待慈氏李衞公别集巻八
