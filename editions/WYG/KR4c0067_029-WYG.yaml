body:
  text: 李衞公别集巻九唐李徳裕撰雜著平泉山居戒子孫記經始平泉追先志也吾隨侍先太師忠公在外十四年上㑹稽探禹穴歴楚澤登巫山遊沅湘望衡嶠先公每維舟清眺意有所感必凄然遐想屬目伊川嘗賦詩曰龍門南岳盡伊原草樹人烟目所存正是北州棃棗熟夢魂秋日到郊園吾心感是詩有退居伊洛之志前守金陵於龍門之西得喬處士天寳末避地逺遊為荒榛首翠微山尚有薇蕨山陽舊徑唯餘竹木吾乃剪荆莾驅狐狸始立班生之宅漸成應叟之地又得名花珍木竒石列於庭際平生素懐於此足矣吾嘗以出處者貴得其道進退者貴不失時古來賢達多有遺恨至於𤣥祖潜身在柱史栁惠養徳於士師漢代丙㬅容官不過六百石終無辱殆邈難及矣越蠡激文牛以肥遁留侯託黄老以辭世亦其次焉范睢感蔡澤一言超然髙謝鄧禹見功臣多敗委逺名勢又其次也矧吾者於葵無衞足之智處有不鳴之患雖有泉石杳無歸期留此林居貽厥後代鬻平泉者非吾子孫也以平泉一樹一石與人者非佳也吾百年後為權勢所奪則以先人所命泣而告之此吾志也詩曰維桑與梓必恭敬止言其父所植也昔周人之思召伯愛其所憇之樹近代薛令君於禁省中見先祖所據之石必泫然流涕汝曹可不慕之唯岸為谷谷為陵然巳焉可也平泉山居草木記余嘗覽想石泉公家藏藏書日有園庭草木疏則知先哲所尚必有意焉余二十年間三守吳門一􅊩淮服嘉樹芳草性之所耽或致自同人或得於樵客始則盈尺今巳豐尋因感學詩者多識草木之名為騷者必盡蓀荃之美乃記所出山澤庻資博聞木之竒者有天台之金松琪樹稽山之海棠榧檜剡溪之紅桂厚朴海嶠之香檉木蘭天目之青神鳯集鍾山之月桂青颼楊梅曲房之山桂溫樹金陵之珠栢欒荆杜鵑茆山之山桃側栢南燭宜春之栁栢紅豆山櫻藍田之栗梨龍柏其水物之美者荷有蘋洲之重臺蓮芙蓉湖之白蓮茅山東溪之芳蓀復有日觀震澤巫嶺羅浮桂水嚴湍廬阜漏澤之石在焉其伊洛名國所有今並不載豈若潘賦閒居稱郁棣之藻麗陶歸衡宇喜松菊之猶存爰列嘉名書之于石已未歲又得畨禺之山茶宛陵之紫丁香㑹稽之百葉木芙蓉百葉薔薇永嘉之紫桂蔟蝶天台之海石楠桂林之俱郍衞台嶺八公之怪石巫峽之嚴湍琅邪臺之水石布於清渠之側仙人跡鹿跡之石列於佛榻之前是歲又得鍾陵之同心木芙蓉剡中之真紅桂稽山之四時杜鵑相思紫苑貞桐山茗重臺薔薇黄槿東陽之牡桂紫石楠九華山藥樹天蓼青櫪黄心㭠子朱杉龍骨闕庚申歲復得宜春之筆樹楠稚子金荆紅筆宻䝉勾栗木其草藥又得山薑碧百合劇談録李徳裕東都平泉莊去洛城三十里卉木臺榭若造仙府有虚檻對引泉水縈回疏鑿像巫峽洞庭十二峯九𣲖迄於海門江山景物之狀以間行逕有平石以手磨之皆隱隱見雲霞龍鳯草樹之形初徳裕營平泉逺方之人多以異物奉之有題平泉詩曰隴右諸侯供語鳥日南太守送名花賈氏談録賛皇公平泉莊周圍十里構臺榭百餘所今基址猶存天下竒花異草珍松怪石靡不畢致其間故徳裕自製平泉草木記今悉蕪絶唯鴈翅檜珠子柏蓮房玉藻等葢僅有存焉鴈翅檜葉婆娑如鴻鴈之翅珠子栢栢實皆如白珠子藂生葉上香聞數十步蓮蘂跗蕚上花分五朶而實同一房怪石名品甚衆多為洛城有力者取去石上皆刻女道二字唯禮星石及師子石今為陶學士徙置梨園别墅禮星石縱廣一丈厚尺餘有文理成斗極之象師子石髙三四尺孔竅千萬逓相通貫其狀如師子首尾眼鼻皆具足河南志河南長殿南有婆娑亭貯竒石處世傳李徳裕醒酒石以水沃之有林木自然之狀今謂婆娑石葢以樹名五代史張全義字國維監軍嘗得李徳裕平泉醒酒石徳裕孫延古因託全義復求之監軍忿然曰自黄巢亂後洛陽園池無復能守豈獨平泉一石哉全義嘗在巢賊中以為譏已因大怒奏笞殺監軍者金松賦并序廣陵東南有顔太師猶子舊宅其地即孔北海故臺予因晩春夕景命駕遊眺忽覩竒木植於庭際枝似檉松葉如瞿麥迫而察之翠葉金貫粲然有光訪其名曰金松訊其所來曰得於台嶺乃就主人求得一本列於平泉今聞封植得地枝葉茂盛叙其所自作此賦青春已暮白日將夕經顔子之故巷訪孔公之舊宅美珍木之在庭得嘉名於樵客曩擢本於台嶺近徙根於簷隙其柯肅肅可比於真松其葉纎纎寔侔於瞿麥風入葉而成韻露垂柯而流液不受命於嚴霜諒同心於寒柏含春靄而葱蒨映夕陽而的皪疑翠尾之羣翔若金潭之旁射襍爽籟於簧竹混晶光於瑶碧琪樹以垂珠而擅名金松以潜頴而莫覿亦猶處子在於隱淪竒才遺於草澤我有衡宇依山岑寂類仲長之清曠如蕭宰之窮僻託根此地似在崖壁殊橘柚之不遷同甘棠之可惜庶封植於園林永愛玩而無斁靈泉賦并序予林居西嶺平壤出泉廣不逾尋而深則盈尺自東鄰故丞相崔公至谷口故丞相司徒李公凡别墅五六皆謂之平泉寔發源於此觀其湧不騰沸淡然冽清冬溫夏寒明媚可鑒其靈泉之藴也予往歲獲戾放逐再羅謗傷泉必變色久而後復昔傅長虞庭有湧泉以其色在夏則冷涉冬而温乃為神泉賦况潜靈藴異美過神泉因效長虞所作偶成此賦效一作擬山下出泉厥壤非石隨淺深而見底實秋毫之可析其瑩若纎埃之映琉璃微虫之潜琥珀玉瑕瑜而不掩鏡妍􅑦而盡覿且夫動則廣大止則虚明如君子之絶徳乃望表而見情發源而東百谷皆盈既處髙而就下雖遇坎而亦平曩者方騁康衢俄驚覆轍泉色暫晦含晶不發又如塵掩懸黎霧昏秋月累夕而翳盈旬乃澈爾其脉引清泚環匝荆扉淪漣寫照物色殊暉孕蘋藻為瑤碧涵沙皪為珠璣歴長坂而鱗爛度小山而雪披若乃砥石於宇析波自沼入虚白而逶迤浮縹清而繚繞氣潤蘅蘭色滋松篠含逸響於桐林動孤光於溪鳥於是列植芳菊華艷芊綿漬漪瀾而更馥搖霽景而相鮮葉凝夕露叢靄秋烟美楚人之飡英慕胡公之飲泉况復自亭徂溪夤縁數里懸瀑溜於碧潭散浮湍於清沚乘鷁舳以晨泛聴菱歌而夜起見蒹葭之始香疑湘沅之在此重曰原隰既平泉流既清三逕未荒萬木向榮感棣華之零落愴時鳥之相鳴恐閲水兮日逝且歸來兮養生秋聲賦并序昔潘岳寓直騎省因感二毛遂作秋興賦况予百齡過半承明三入髪已皓白自中書舍人及午三叅掖垣清秋可悲尚書十一丈鵷掖上寮人文大匠聊為此作以俟知音露華肅天氣晶碧空無氛霽海清明當其時也草木隂蟲皆有秋聲自虚無而響作由寂寞而音生始蕭瑟於林野終混合於太清出哀壑而憤起臨悲谷而怨盈朔鴈聼而増逝孤猿聞而自驚此聲也異桐竹之韻非金石之鳴足以動覊人之魄感君子之情况乎臨淄藻思薛縣英名遽興華屋之嘆預想曲池之平豈待琴而魂散固聞笛以涕零亦有毁家蔡琰降北李卿聴朔吹之夜動見霜鴻之曉征既慷慨而訴懐獨汍瀾而流纓雖復蘇門傲世秦青送行詎能寫自然之天籟䆒吹萬之清泠客有貞詞瀏湸逸氣縱横賦掩漏巵之玅文同蟠木之精聊染翰以寫意期報之以瑤瓊牡丹賦并序予觀前賢之賦草木者多矣靡不言託植之幽深採斸之莫致風景之妍麗追賞之歡愉至於體物良有未盡惟牡丹未有賦者聊以狀之僕射十一丈蔚為儒宗詞賦之首聲氣所感或能相和又見陳思王賦序多言命王粲劉楨繼作今亦效之邀侍御裴舍人同作青陽既暮鶡鴠巳鳴念蘭若之方歇嘆桃李之隂成惟翠華之艷爚傾百卉之光英抽翠柯以布素粲紅芳而發榮其始也碧海霄澄驪珠躍出深波曉霽丹梓吐實煥神龍之銜燭皎若水之並日其盛也若紫芝連葉鴛雛比翼奪珠樹之鮮輝掩非煙之竒色倐忽摛錦紛葩似織其落也明豔未褫紅衣如脱朱草柯折珊瑚枝碎霞既皪而轉妍紅欲消而猶綷爾乃獨含芳意幽怨殘春將獨立而傾國雖不言兮似人觀其露彩猶泫日華初照􅖙其晨葩情欲微笑色雖美而自艷類河汾之窈窕逮乎的皪含景離披向風鈆華春而思蕩蘭澤晩而光融情放縱以自得凝若煥之冶容既而華豔恍惚繁華遽畢驚寳雉之乍廻想江妃而復出望獻璫之玉俄以蔽光感懐珮之川悵然如失客顧余曰勿謂淑美難久徂芳不留彼妍華之閲世非人壽之可儔君不見龍驤閈宏池臺御溝堂挹山林峯連翠樓有百歲之芳叢今京師精舍甲第猶有天寳中牡丹在無昔日之通侯豈暇當飛藿之時始嗟零落且欲同樹萱之意聊自忘憂近於伊川卜山居將命者畫圖而至欣然感謝聊賦此詩兼寄上淅東元相公大夫使求青田胎化鶴乙已歲作弱歲弄詞翰遂叨明主恩懐章過越邸建斾守吳門西圯隂難駐東臯意尚存慙逾六百石愧負五千言寄世知嬰繳辭榮類觸藩欲追緜上隱况近子平村邑有桐鄉愛山餘黍谷暄免非迯相地乃是故侯園野竹多微逕岩泉豈一源映池方樹宻傍澗古藤繁卭杖堪扶老闕牛巳服轅只應將唳鶴幽谷共翩翻憶平泉山居贈沈吏部一首中書作昔聞羊叔子茅屋在東渠豈不念歸路徘徊畏簡書乃知軒冕客自與田園疎没世有遺恨精誠有所如嗟予寡時用夙志在林閭雖抱山水癖敢希仁智居清泉繞舍下修竹䕃庭除幽徑松葢宻小池蓮葉初從來有好鳥近復躍鯈魚少室映川陸鳴臯對蓬廬張何舊寮宷予與吏部乃金門寮故也相勉在懸輿常恐似伯玉瞻前慙魏舒夏晩有懐平泉林居宜春作孟夏守畏途捨舟在徂暑愀然何所念念我龍門塢宻竹無蹊徑髙松有四五飛泉鳴樹間颯颯如度雨􅌲桂秀層嶺芳蓀媚幽渚稚子候我歸衡門獨延佇誰言聖與哲曽是不懐土公旦既思周宣尼亦念魯矧余竄炎裔日夕誰晤語眷闕悲子牟班荆感椒舉悽悽視環玦惻惻步庭廡豈待莊舄吟方知倦覉旅早秋龍興寺江亭閒眺憶龍門山居寄崔張舊從事宜春作江亭感秋至蘭徑悲露泫秔稻秀晩川杉松鬱晴巘嗟予有林壑兹夕念原衍綠篠連嶺多青莎近溪淺淵明菊猶在仲蔚蒿莫剪喬木粲凌苕隂崖積幽蘚遥思伊川水北渡龍門峴蒼翠雙闕間逶迤清灘轉故人在鄉國歲晏路悠緬惆悵此生涯無由共登踐比聞龍門敬善寺有紅桂樹獨秀伊川嘗於江南諸山訪之莫致陳侍御知予所好因訪剡溪樵客偶得數株移植郊園衆芳色沮乃知敬善所有是蜀道菵草徒得嘉名因賦是詩兼贈陳侍御金陵作昔聞紅桂枝獨秀龍門側越叟遺數株周人未嘗識平生愛此樹攀翫無由得君子知我心因之為羽翼豈煩嘉客譽且就清隂息來自天姥岑長疑翠嵐色芬芳世所絶偃蹇枝漸直瓊葉潤不凋珠英粲如織猶疑翡􅀢宿想待鵷雛食寧止暫淹留終當更封植懐山居邀松陽子同作我有愛山心如饑復如渇出谷一年餘常疑十年别春思巖花爛夏憶寒泉冽秋憶泛蘭巵冬思翫松雪晨思小山桂暝憶深潭月醉憶剖紅梨飯思食紫鱖坐思藤蘿宻步憶莓苔滑晝夜百刻中愁腸幾回絶每念羊叔子言之豈常輟人生如意事十乃居七八我未及懸輿今猶佩朝紱焉能逐麋鹿便得遊林樾范恣滄波舟張惟赤松列惟應詎身恤豈敢忘臣節器滿自當欹物盈終有缺從兹返樵逕庶可希前哲思歸赤松村呈松陽子昔人思避世惟恐不深幽禽慶潜名岳鴟夷􅃞釣舟顧余知止足所樂在歸休不似尋山者忘家恣逺遊近臘對雪有懐林居蓬門常晝掩竹逕寂無人鳥起飄松霰麕行動谷榛應闕禽魚侶闕與薜蘿親遥憶平臯望溪烟已發春李衛公别集巻九欽定四庫全書李衞公别集巻十唐李徳裕撰思山居十首清明後憶山中遥思寒食後野老林下醉月照一山明風吹百花氣飛泉與萬籟髣髴疑簫吹不待曙華分已應喧鳥至題寄商山石綺皓巖中石常經闕隱淪紫芝歌幾曲紅蘚閟千春聊用支琴尾寧惟倚病身自知來處所何暇問嚴遵憶種苽時尚平方畢娶疎廣念歸期澗底松成葢簷前桂長枝逕閑芳草合山靜落花遲雖有苽園在無因及種時春日獨坐思歸壯齡心已盡孤賞意猶存豈望圖麟閣惟思卧鹿門無謀堪適野何力可拘原只有客身去幽山自灌園思登家山林嶺自知無世用只是愛山遊舊有嵇康嬾今慙趙武偷登巒未覺疾汛水便忘憂最惜殘筋力捫蘿遍一丘思鄉園老人常羡蓽門翁所思惟歲稔遥知松月曙尚在山忩寢蘭氣入幽簾禽言傍孤枕晨興步巖逕更酌寒泉飲寄龍門僧龍門有開士愛我春潭碧清景出東山閑來翫松石應憐林壑主逺作滄溟客為我謝此僧終當理歸策憶藥苗溪上一苗齊手茸正堪掇皆能扶我壽豈止堅肌骨味掩商山芝英逾首陽蕨豈如甘谷士只得香泉啜南陽甘谷有菊水是湖廣闕者憶村中老人春酒有劉楊二叟善釀二叟茅茨下清晨飲濁醪雨殘紅芍藥風落紫櫻桃巢燕啣泥疾簷䖝掛網髙閑思春谷事轉覺䆠途勞憶葛勝木禪床憶我齋中榻寒宵幾獨眠管寧穿亦坐徐孺去常懸虫網垂應遍苔痕染更鮮何人及身在歸對老僧禪初夏有懐山居山中有所憶夏景始清幽野竹隂無日巖泉冷似秋翠岑當累榭皓月入輕舟只有思歸夕空簾且夢游張公超谷中石鼓篋依緑槐横經起秋霧有時連岳客尚辦絃歌處自予去幽石誰人襲芳杜空留古苔石對我岩中樹初歸平泉過龍門南嶺遙望山居即事初歸故鄉陌極望且徐輪近野樵蒸至平泉烟火新農夫饋鷄黍漁子薦霜鱗惆悵懐楊僕慚為關外人伊川晩眺桑葉初黄梨葉紅伊川落日盡無風漢儲何假終南客甪里先生在谷中潭上喜見新月簮組十年夢園廬今夕情誰憐故鄉月復映碧潭生皓彩松上見寒光波際輕還將孤賞意暫寄玉琴聲郊外即事奉寄侍郎大尹髙秩慙非隱閑林喜退居老農爭席坐稚子帶經鋤竹逕難迴騎僊舟但跂予豈知陶靖節秪自愛吾廬山居遇雪喜道者相訪幽居近谷西喬木與山齊野竹連池合巖松映雪低喜君來白社值我在青谿應笑於陵子遺榮自灌畦雪霽晨起雪覆寒溪竹風巻野田蓬四望無行跡誰憐孤老翁洛中士君子多以平泉見呼愧獲方外之名因以此詩為報奉寄劉賓客非髙栁下逸自愛竹林閑才異居東里愚因在北山徑荒寒未掃門設晝長關不及䲭夷子悠悠烟水間早春至言禪公法堂憶平泉别業金陵作昔我伊原上孤遊竹樹間人依紅桂靜鳥傍碧潭閑松葢低春雪藤輪倚暮山永懐桑梓邑衰老若為還峽山亭月夜獨宿對櫻桃花有懐伊川别墅金陵作皎月照芳樹鮮葩含素輝愁人惜春夜達曙想巖扉風靜隂滿砌露濃香入衣恨無金谷妓為我奏思歸春暮思平泉襍詠二十首自此並淮南作望伊川逺村寒食後細雨度川來芳草連谿合梨花映墅開槿蘺懸落照松逕長新苔向夕亭臯望遊禽幾處回潭上紫藤故鄉春欲盡一歲芳難再巖樹已青葱吾廬日堪愛幽溪人未去芳草行應礙遥憶紫藤垂繁英照潭黛書樓晴望幽居人世外久厭市朝喧蒼翠連雙闕微茫認九原東望盡見萬安山南名臣丘壠殘紅映鞏樹斜日照轘轅薄暮柴扉掩誰知仲蔚園西嶺望鳴臯山髙秋對凉野四望何蕭瑟逺見鳴臯山青峯原上出晨興採薇蕨向暮歸蓬蓽詎假數揮金飡和養餘日瀑泉亭向老多悲恨悽然念一丘巖泉終古在風月幾年遊􅌲閣饒佳樹菱潭有釣舟不如羊叔子名與峴山留紅桂樹此樹白花紅心因以為號欲求塵外物此樹是瑶林後素合餘絢如丹見本心妍姿無㸃辱芳意託幽深願以鮮葩色凌霜照碧潯金松出天台山台嶺生竒樹佳名世未知纎纎疑大菊落落是松枝照日含金晰籠烟淡翠滋勿言人去晩猶有歲寒期月桂出蔣山淺黄色何年霜夜月桂子落寒山翠幹生巖中金英在人間幽崖空自老清漢未知還惟有凉秋夜嫦娥來暫攀山桂此花紫色英藻繁吾愛山中樹繁英滿目鮮臨風飄碎錦映日亂霏烟影入春潭底香凝月榭前豈知幽獨客賴此當朱絃栢别樹經霜枝葉盡丹聞有三珠樹惟應秘閬風珊瑚不生葉朱草又無叢未若凌雲栢常能終歲紅晨霞與落日相照在巖中蓀生茅山東溪溪蓀花紫色楚客重蘭蓀遺芳今未歇葉抽清淺水花照暄妍節紫艷映渠鮮輕香含露結離君若有贈暫與幽人折流盃亭激水自山椒析波分淺瀨回環疑古篆詰曲如縈帶雪愬羽觴遲惟觀親友㑹欲知中聖處皓月臨松葢東谿近蓄東谿水悠悠起渌波綵鴛留不去芳草日應多夾岸生竒篠縁巖覆女蘿蘭橈思無限為感濯纓歌鸂鷘清沚雙鸂鷘前年海上鶵今來戀洲嶼思若在江湖欲起揺荷葢閑飛濺水珠不能常泛泛惟作逐波鳬西園西園最多趣永日自忘歸石瀨流清淺峯岑澹翠微曉飜紅藥艷晴鳥碧潭輝獨望娟娟月宵分未掩扉海昔見歴陽山鷄籠已孤秀今看海嶠樹翠葢何幽茂霰雪詎能侵此樹枝葉宻霜雪不侵烟嵐自相揉攀條獨臨憇况值清隂晝雙碧潭清剡與嚴湍潺湲皆可憶適來玩山水無此秋潭色莫辨幽蘭叢難分翠禽翼遲遲洲渚步臨眺忘飱食竹逕野竹自成逕繞溪三里餘檀欒被層阜蕭瑟䕃清渠日落見林靜風行知谷虚田家故人少誰肯共焚魚花藥欄花藥四時相續常可留翫蕙草春已碧蘭花秋更紅四時發英豔三逕滿芳叢秀色濯清露鮮輝揺惠風王孫未知返幽賞竟誰同自叙非尚子遍游五嶽五嶽逕雖深遍游心已蕩苟能知止足所遇皆清曠七十難可期一丘乃微尚遥懐少室山常恐非吾望首夏清景想望山居嘉樹隂初合山中賞更新禽言未知夏蘭逕尚餘春散滿蘿垂帶扶疎桂長輪丹青冩不盡宵夢嘆非真累樹空留月虚舟若待人何時倚蘭棹相與掇汀蘋思平泉樹石雜詠十一首釣臺我有嚴湍思懐人訪故臺客星依釣隱仙石逐槎回倒影含清沚凝隂長碧苔飛泉信可挹幽客未歸來似鹿石林中有竒石髣髴獸潜行乍似依巖桂還疑食野苹茸長緑鮮映班細紫苔生不是見覉者何勞如頓纓海上石笋常愛僊都山竒峯千仞懸迢迢一何逈不與衆山連忽逢海嶠石稍慰平生憶何以佀我心亭亭孤且直疊潺湲桂水湍潄石多竒狀鱗次冠煙霞蟬聨疊波浪今來碧梧下逈出秋潭上歲晩苔蘚滋懐賢益惆悵重臺芙蓉芙蓉含露時秀色波中溢五女襲朱裳重重映皓質晨霞耀丹景片片明秋日蘭澤多衆芳妍姿不相匹白鷺鶿余心憐白鷺潭上日相依拂石疑星落凌風似雪飛碧沙常獨立清景自忘歸所樂惟烟水徘徊戀釣磯海魚骨昔日任公子期年釣此魚無由見成岳聊喜識專車皎皎連霜月高高映碧渠陶潜雖好事觀海只披圖泛池舟桂舟蘭作枻芬芳皆絶世只可弄潺湲焉能濟大川樹懸涼夜月風散碧潭烟未得同魚子菱歌共扣舷舴艋舟無輕舴艋舟始自䲭夷子雙闕挂朝衣五湖極烟水時遊杏壇下乍入湘川裏永日歌濯纓超然謝塵滓二猿釣瀨水連漪富春山合㳫松上夜猿鳴谷中清響合衝網忽見覊故山從此辭無由碧潭飲爭接緑蘿枝思在山居日偶成此詠邀松陽子同作閑思昔歲事忽忽念伊川乘月步秋坂滿山聞石泉回塘碧潭映髙樹緑蘿懸露下呌田鶴風來嘶晩蟬懐兹長在夢歸去且無縁幽谷人未至蘭苕應更鮮乘月一作乗興重憶山居六首平泉源出谷纔浮芥中園巳濫觴逶迤過竹塢浩淼走蘭塘夜靜聞魚躍風微見鴈翔從兹東向海可泛濟川航泰山石兖州從事所寄鷄鳴日觀望逺與扶桑對滄海似鎔金衆山如㸃黛遥知碧峯首獨立烟嵐内此石依五松蒼蒼幾千載巫山石十二峯前月三聲猿夜愁此中多怪石日夕潄寒流必是歸星渚先求歴斗牛揚州是斗牛分還疑烟雨霽髣髴是嵩丘羅浮山番禺連帥所遺龍伯釣鼇時蓬萊一峯圻裴淵廣州記羅浮山是蓬萊邊山浮來飛來碧海畔遂與三山隔其下多長溪茅君内傳山下有七十二長溪潺湲宗亂石知君分如此贈逾荆山壁漏潭石魯客見遺常疑六合外未信漆園書及此聞溪漏方欣騐尾閭大哉天地氣呼吸有盈虚美石勞相贈瓊瑰自不如釣石於谿人處求得嚴光隱富春山色谿文碧所釣不在魚揮綸以自適余懐慕君子且欲坐潭石持此返伊川悠然慰衰夕懐伊川郊居衰疾常懐土郊園欲掩扉雖知明目地不及有身歸鞏樹秋隂遍伊原霽色微此生看白首良願巳應違晨起見雪隱山居忽憶巖中雪誰人拂薜蘿竹梢低未舉松葢偃應多山溜隨冰落林麕帶霰過不勞聞鶴語方奏苦寒歌憶平泉雜詩憶初暖今日初春暖山中事若何雪開喧鳥至澌散躍魚多幽翠生松栢輕烟起薜蘿柴扉常晝掩惟有野人過憶辛夷余赴金陵辛夷欲開昔年將出谷幾日對辛夷傍樹憐芳意攀條惜歲滋清隂須暫憇秀色正堪思只待揮金日慇懃泛羽巵憶寒梅寒塘數樹梅常近臈前開雪映縁巖竹香侵汛水苔遥思清景暮還有野禽來誰是攀枝客兹辰醉始迴憶藥欄野人清旦起掃雪見蘭芽始放春泉入惟愁暮景斜未抽萱草葉纔發欵冬花誰念江潭老中宵旅夢賖憶茗芽谷中春日暖漸憶掇茶英欲及清明火能銷醉客醒松花飄鼎泛蘭氣入甌輕飲罷閑無事捫蘿谿上行憶野花余未嘗春到故園雖遊洛陽道未識故園花曉憶東谿雪晴思冠嶺霞谷深蘭色秀村迥栁隂斜悵望龍門晩誰知小隱家憶春雨春鳩鳴野樹細雨入池塘潭上花微落谿邊草更長疏風白鷺起拂水綵鴛翔最羡歸飛燕年年在故鄉憶晩眺伊川新雨霽原上見春山緱嶺晴虹斷龍門宿鳥還牛羊平野外桑柘夕烟間不及鄉園叟悠悠盡日閑憶新藤遥聞碧潭上春晩紫藤開水似晨霞照林疑綵鳯來清香凝島嶼繁艷映莓苔金谷如相並應將錦帳回憶春耕郊外杏花坼林間布榖鳴原田春雨後谿水夕流平野老荷蓑至和風吹草輕無因共沮溺相與事巖耕余所居平泉村舍近蒙韋常侍大尹特改嘉名因寄詩以謝未謝留侯疾常懐仲蔚園閑謡紫芝曲歸夢赤松村忽改蓬蒿色俄吹黍谷喧多慙孔北海傳敎及衡門山信至説平泉别墅草木滋長地轉幽深悵然思歸復此作忽聞樵客語暫慰野人心幽逕芳蘭宻閑庭秀木深􅍪䴥來澗底鳬鵠遍川潯誰念滄溟上歸歟起嘆音臨海太守惠予赤城石報以是詩聞君採竒石剪斷赤城霞潭上倒虹影波中揺日華仙巖接絳氣谿路襍桃花若值客星去便應隨海槎李衞公别集巻十欽定四庫全書李衛公外集巻一唐李德裕撰評史一
