body:
  text: 周官顧命秦始皇帝并一區宇丞相李斯實掌其言漢興當秦焚書之後侍從之臣皆不習文史蕭曹之輩又乏儒墨之用每封功臣建子弟其辭多天子為之縱委於執翰者亦非彰灼知名之士武帝使司馬相如視草率皆文章之流以相如非將相器也厥後寖㣲寖長下於魏晉亦代有其人我髙祖革隋文物大備在貞觀中則顔公師古岑公文本興焉在天后時則李公嶠崔公融出焉燕許角立于𤣥宗之朝常楊繼美於代宗之代洎憲宗皇帝英武啟運雄圖赫張中興之業髙映前古其時則先太師忠公翺翔内署有密勿賛佐之績平吳定蜀時惟其功及登樞衡作霖雨尊王室卑諸侯圖蔡料齊外定内理顯王言于典誥彰帝範于圖籍紀在徽冊播于無窮特進太子少保分司東都衛公長慶中事惠皇為翰林學士訓誥之業彰于前聞昭肅皇帝統握乾符寤寐良弼詔自淮海復升台庭盡付𤣥機允厭神度每彤墀奏罷列承天睠帝亦講伊尹傅説之㫖定元首股肱之契以太平之制度上古之文教咸屬于公焉㑹先太后懿號未立帝明發有永懐之痛公述沙麓神井之瑞贊繞樞懐日之慶懋遵聖緒光慰孝思于是承命有宣懿祔廟之制及武宗郊昊天拜清廟文物胥備朝廷有禮華夷述職河朔修貢乃顯神休薦徽號奉揚一徳以示萬方于是撰仁聖文武至神大孝之冊封域無虞天子翛然有求𤣥之思乃範貞金模聖表隆準日角燭于宫庭中外臣僚咸欲頌山河而褒日月也公于是有聖容之贊天街之北獯鬻攸居因饑憑陵怙衆强禦嚴之以刁斗而勃爾無懼申之以文告而腆然不率天子震怒旋命征之公獨運沈機上資宸斷萬里勝負决于帷中雷霆既震犬羊遂潰疣贅披抉腥羶解離遁其名王復我貴主于是有討北狄之詔天寳末薊門為首亂之地瘡痏榛棘襲世未平至於漁陽帥仲武埽除妖孽臧獲仇讐奉揚威神乃底康靖仍願勒石于盧龍之塞以叙聖功飛章上聞帝用允若公祗膺明命舒展格言呼嘯神祗吐納嵩華當畫而文星見不寐而白鳳來成諸侯不朽之勲尊元后無私之化公於是有幽州紀聖功之碑潞帥劉從諫死其子因闗河之嶮恃甲兵之衆請爵爭地屢聞王庭中外疑迷互撓天聴帝將耀神武公累罄忠謀且言曰重耳在䘮不聞利父雄渠受戮祗以抵君况眀皇舊宫天井内地跨揺河北脅倚山東豈可行有匪人坐為汙俗若可忍也孰不可容沃心無疑躡足乃定又曰上黨居天下之脊當河朔之喉今漳水雄兵常山勁卒是為脣齒實懼因依不若乘其未萌制其將動帝俞其奏乃妙選使臣以勞諭之嚴立刑賞以勸戒之魏侯鎮侯勠力從命絶壺闗之右臂收泜水之上㳺獲兹渠魁在此成算又轅門叛將横水餘兇竊上相之旌旗盜晉陽之管鑰帝怒斯赫人心愈疑咸以師老于郊梟巢尚固議罷兵者蚊聚請宥過者雷同公又揚笏而言曰彼地則義師帥分宗室是𤣥祖勤商之邑后稷造周之邦𤓰瓞具存堂構斯在苟虧策畫不襲仇讐則是奬彌牟逐主之風長冒頓射親之俗詩稱築室于道書謂疑謀勿成由是洞啟宸衷大破羣議運籌制勝舉無遺策防㣲慮逺必契神機授鉞之臣伏膺承命謝安之圍碁尚刼曹參之飲酒方酣果有軍書繼聞戎捷砥磨周鉞水淬鄭刀萬里來袁尚之頭顱二冢𦵏蚩尤之肩髀歡聲雖震于朝市喜氣不見於形容何其纂立功勲鎮定風俗若是之重也公於是有伐上黨之制平晉陽之敕宗英可汗獻琛貢賮越自絶漠通於本朝文畢伯氏之𦙍呼韓谷蠡之師或執玉而朝靈囿或解辮而拜甘泉並垂於冊書光彼明命公於是有諭回鶻之命五慰堅昆之書四文章等於訓𫝊機事出於神明固將偃仰邳石之符傲睨鬼箝之録聞之者可以袪聾聵得之者可以弼邦國每牙管既㧞芝泥將熟常於前席親授筆札公亦分隂可就落簡如飛時有急宣闗於宻畫内庭外制皆不與聞或勢切疾雷機難終日宣室未召武帳莫開公則手疏封章達於旒扆當乙夜觀書之際未嘗不稱美再三此又豈可與𫝊洞簫而諷于後庭聞子虚而嗟不同世者論功校徳邪嵗在乙丑羣公常伯以天子之道貫於神祗一年而風雨攸序災沴不作二年殲醜虜興北伐之師四年誅狡童詠東征之歌而又移摩尼之風壊浮圖之俗偃兵返樸四海胥定思欲増鴻名光下武公乃觀東序之圖按西崑之牒鋪舒名實藻縟文采類於上帝為唐神宗於是篹章天成功神徳明道之冊文號位既畢華夷㑹同方將命禮官召儒者訪匡衡后土之議採公玉明堂之圖考肆覲之禮於梁生取封禪之文于犬子盡皇王之盛事極臣子之殊功而軒鼎將成禹書就掩然猶進先嘗之藥獻髙手之醫藏周旦請代之書追漢宣易名之美作為大誥祈于昊天始終一朝紹續九徳其功伐也既如彼其制作也又如此故合武宗一朝冊命典誥奏議碑贊軍機羽檄凡兩帙二十巻輒署曰㑹昌一品制集紀年追聖徳也書位旌官業也嵗在丁夘亞自左掖出為桂林九月公書至自洛以典誥制命示于幽鄙且使為序以集成書尋𤣥珠莫究其倪域聴希聲莫窮於髙下承恩震恐幾移朝夕援筆而復止者三四伏念江陸盡盪辭讓不及因齋潔以序焉夫全功難恃大名難兼日赫于晝而乏清媚月皎于夜而無陽煦冬之為候也則雪霜飄暴凍入肌髪夏之為用也則金流石爍火走膚脈如陽春髙秋者稀焉南則毒虺之為厲也北則獯戎黠虜之為患也如洛邑咸秦者幾焉雕鷲不傅之以馳騁驊騮不授之以鶱翥如應龍者鮮焉仲尼聖賢之宗也位止於司冦老聃道徳之祖也官不過柱史如姬旦者幾焉是以保衡傅説左右殷宗召公畢公寅亮周室咸著大訓克為元龜書契以來未之多有李斯以刻石紀號之文勝而不在休明之運又何足數哉周勃霍光雖有勲伐而不知儒術枚皋嚴忌善為文筆而不至巖廊自是已降其類實繁惟公藴開物致君之才居元弼上公之位建靖難平戎之業垂經天緯地之文萃於直躬慶是全徳盖四序之陽春九州之咸雒品彚之應龍人倫之姬旦後之學者其景行之云爾鄭亞序
