body:
  text: 李衛公本傳李徳裕字文饒元和宰相吉甫子也少力于學既冠卓犖有大節不喜與諸生試有司以廕補校書郎河東張𢎞靖辟為掌書記府罷召拜監察御史穆宗即位擢翰林學士帝為太子時巳聞吉甫名由是顧徳裕厚凡號令大典冊皆更其手數召見賚奬優華帝怠荒于政故戚里多所請丐挾宦人詗禁中語闗託大臣徳裕建言舊制駙馬都尉與要官禁不往來開元中訶督尤切今乃公至宰相及大臣私第是等無他材直洩漏禁密交通中外耳請白事宰相者聴至中書無輒詣第然之再進中書舍人未㡬授御史中丞始吉甫相憲宗牛僧孺李宗閔對直言策痛指當路條失政吉甫訴于帝且泣有司皆得罪遂與為怨吉甫又為帝謀討兩河叛將李逢吉沮解其言功未既而吉甫卒裴度實繼之逢吉以議不合罷去故追銜吉甫而怨度擯徳裕不得進至是間帝暗庸訹度使與元稹相怨奪其宰相而巳代之欲引僧孺益樹黨乃出徳裕為浙西觀察使俄而僧孺入相由是牛李之憾結矣初潤州承王國清亂竇易直傾府庫賚軍貲用空殫而下益驕徳裕自儉約以留州財贍兵雖儉而均故士無怨再期則賦物儲牣南方信禨巫雖父母癘疾子棄不敢養徳裕擇長老可語者諭以孝慈大倫患難相收不可棄之義使歸相曉勅違約者顯寘以法數年惡俗大變又按屬州非經祠者毀千餘所撤私邑山房千四百舍寇無所廋蔽天子下詔褒揚敬宗立侈用無度詔浙西上脂盝䊋具徳裕奏比年旱災物力未完乃三月壬子赦令常貢之外悉罷進獻此陛下恐聚斂之吏緣以成姦彫窶之人不勝其敝也本道素號富饒更李錡薛苹皆𣙜酒於民供有羡財元和詔書停𣙜酤又赦令示諸州羡餘無送使今存者惟留使錢五十萬緡率嵗經費常少十三萬軍用褊急今所須脂盝䊋具度用銀二萬三千兩金百三十兩物非土産雖力營索尚恐不逮願詔宰相議何以俾臣不違詔㫖不乏軍興不疲人不歛怨則前敕後詔咸可遵承不報方是時罷進獻不閲月而求貢使者足相接於道故徳裕推一以諷他又詔索盤絛繚綾千匹復奏言太宗時使至凉州見名鷹諷李大亮獻之大亮諫止賜詔嘉歎𤣥宗時使者抵江南捕鵁鶄翠鳥汴州刺史倪若水言之即見褒納皇甫詢織半臂造琵琶捍撥鏤牙筩於益州蘇頲不奉詔帝不加罪夫鵁鶄鏤牙微物也二三臣尚以勞人損徳為言豈二祖有臣如此今獨無之葢有位者蔽而不聞非陛下拒不納也且立鵝天馬蹙豹盤絛文彩怪麗惟乗輿當御今廣用千匹臣所未喻昔漢文身衣弋綈元帝罷輕纎服故仁徳慈儉至今稱之願陛下師二祖容納逺思漢家恭約裁賜節減則海隅蒼生畢受賜矣優詔為停自元和後天下禁毋私度僧徐州王智興紿言天子誕月請築壇度人以資福詔可即顯募江淮間民皆曹輩奔走因牟擷其財以自入徳裕劾奏智興為壇泗州募願度者人輸錢二千則不復勘詰普加髠落自淮而右户三丁男必一男剔髮規影徭賦所度無算臣閲度江者日數百蘇常齊民十固八九若不加禁遏則前至誕月江淮失丁男六十萬不為細變有詔徐州禁止時帝昏荒數遊幸狎比羣小聴朝簡忽徳裕上丹扆六箴表言心乎愛矣遐不謂矣此古之賢人篤於事君者也夫迹疏而言親者危地逺而意忠者忤臣竊惟念拔自先聖徧荷寵私不能竭忠是負靈鑒臣在先朝嘗獻大明賦以諷頗䝉嘉採今日盡節明主亦由是也其一曰宵衣諷視朝希晩也二曰正服諷服御非法也三曰罷獻諷斂求怪珍也四曰納誨諷侮棄忠言也五曰辨邪諷任羣小也六曰防微諷偽遊輕出也辭皆明直婉切帝雖不能用其言猶勅韋處厚諄諄作詔厚謝其意然為逢吉排笮訖不内徙時亳州浮屠詭言水可愈疾聞南方之人率三十户僦一人使往汲既行若飲病者不敢近葷血危老之人率多死而水斗三十千取者益他汲轉鬻於道互相欺訹往者日數十百人徳裕嚴勒津邏捕絶之且言昔吳有聖水宋齊有聖火皆本妖祥古人所禁請下觀察使令狐楚填塞以絶妄源從之帝方惑佛老禱福祈年浮屠方士並出入禁中狂人杜景先上言其友周息元壽數百嵗帝遣宦者至浙西迎之詔在所馳驛敦遣徳裕上疏曰道之高者莫若廣成𤣥元人之聖者莫若軒轅孔子昔軒轅問廣成子治身之要曰無視無聴抱神以静形將自正無勞子形無揺子精乃可長生慎守其一以處其和故我修身千二百嵗矣形未嘗衰又曰得吾道者上為皇下為王𤣥語孔子曰去子之驕氣與多欲態色與淫志是皆無益於子之身陛下修軒后之術物色異人若使廣成𤣥元混迹而至告陛下之言亦無出於此臣慮今所得者皆迂怪之士使物淖氷以小術欺聰明如文成五利者也又前世天子雖好方士未有御其藥者故漢人稱黄金可成以為飲食器則壽高宗時劉道合𤣥宗時孫甑生皆能作黄金二祖不之服豈非以宗廟為重乎倘必致真隠願止師保和之術慎毌及藥則九廟慰悦矣息元果誕譎不情自言與張果葉静能遊帝詔畫工肖狀為圖以觀之終帝世無他驗文宗即位乃逐之大和三年詔拜兵部侍郎裴度薦材堪宰相而李宗閔以中人助先秉政且得君出徳裕為鄭滑節度使引僧孺協力罷度政事二怨相濟凡徳裕所善悉逐之於是二人權震天下黨人牢不可破矣踰年徙劍南西川蜀自南詔入冦敗杜元穎而郭釗代之病不能事民失職無聊生徳裕至則完殘奮怯皆有條次成都既南失姚協西亡維松由清溪下沬水而左盡為蠻有始韋臯招來南詔復嶲州傾内資結蠻好示以戰陣文法徳裕以臯啓戎資盜其策非是養成癰疽第未決耳至元穎時遇隙而發故長驅深入蹂剔千里蕩無孑遺今瘢夷尚新非痛矯革不能刷一方恥乃建籌邊樓按南道山川險要與蠻相入者圖之左西道與吐蕃接者圖之右其部落衆寡饋運逺邇曲折咸具乃召習邊事者與之指畫商訂凡虜之情偽盡知之又料擇伏瘴舊獠與州兵之任戰者廢遣獰耄什三四士無敢怨者又請甲人於安定弓人河中弩人浙西由是蜀之器械皆犀鋭率戸二百取一人使習戰貸勿事緩則農急則戰謂之雄邊子弟其精兵曰南燕保義保惠兩河慕義左右連弩騎士曰飛星鷙擊竒鋒流電霆聲突騎總
