body:
  text: 李衞公别集巻三唐李德裕撰詩上并唱和酬答三十六首七言九韻雨中自秘書省訪王三侍御知早入朝便入集賢侍御任集賢校書及升柏臺又與秘閣相對同院張學士亦余特厚故以詩贈之秘書省校書郎李德裕共憐獨鶴青霞姿瀛洲故山歸已遲仁者焉能效鷙鶚飛舞自合追長離梧桐逈齊鳷鵲觀烟雨屢拂蛟龍旗鴻鴈衝飈去不盡寒聲晩下天泉池顧我蓬萊靜無事玉版寳書藏衆瑞青編盡以汲冢來科斗皆從魯室至金門待詔何逍遥名儒早問張子僑王褒軼才晚始入宫女已能傳洞簫應令柏臺長對户别來相望獨寥寥奉酬李校書雨中自秘書省歸見訪時早入朝便入集賢不遇頃任集賢校書及升柏臺又與秘閣相對今直書張學士賞忝同席而與校書相遠故瞻望之詞多王闕台庭才子來欵扉典校初從天祿歸已慙陋巷來玉趾仍聞細雨霑綵衣詰朝始趍鳳闕去此日逐歎雞黍違憶昨謬官在烏府喜君對門討魚魯直廬相望夜每闌高閣遙臨月時吐昔聞三入承明廬今來重至中秘書校文復忝丞相屬博物更與張侯居新冠峩峩不變鐵舊泉脉脉猶在渠忽闕情人臨風不羡潘闕舒憶見青天霧未巻吟玩瑤草不知晩自憐豈是風引舟如何漸與蓬山遠山亭書懷太原節度使檢校吏部尚書平章事張𢎞靖叢石依古城懸泉洒清池高低袤丈内衡霍相蔽虧歸田竟何因為郡豈所宜誰能辨人野寄適聊在斯奉和山亭書懷節度掌書記監察御史李德裕岩石在朱户風泉當翠樓始知峴亭賞難與清暉留餘景淡將夕凝嵐輕欲收東山有歸志方接赤松遊節度副使檢校右散騎侍崔恭高情樂閑放寄跡山水中朝霞鋪座右虛白貯清風潜竇激飛泉石路險且崇歩武有勝槩不與俗情同節度判官侍御史韓察搆石狀崖巘翠含城上樓若移廬霍峰遠帶沅湘流瀟洒主人靜夤緣望徑幽清輝在昏旦豈異東山遊節度推官監察御史高銖鬭石類崖巘飛流瀉潺湲遠壑簷宇際孤巒雉堞間何必到海岳境幽機自閑茲焉得奇趣高歩謝東山給事中陸纒激水瀉飛瀑寄懷良在茲如何謝安石要結東山期入座蘭蕙馥當軒松桂滋于焉悟幽道境寂心自怡右金吾衞大將軍胡証飛泉天台狀峭石蓬萊姿潺湲與青翠咫尺當幽奇居然盡精到得似書妍詞豈無他山勝懿此清軒墀從姪尚書右丞賈中庭起崖石潄玉下漣漪丹丘誰云遠寓象得心期豈不貴鐘鼎至懷在希夷唯當蓬萊閣靈鳳復來儀元和十三年六月十二日題奉和韋侍御陪相公遊開義五言六韻節度掌書記監察御史裏行賜緋魚袋李德裕羊公追勝槩茲地暫逍遥風景同南峴丹青見北朝石渠清夏氣高樹激鮮飈念法珍禽集聞經醉象調偶分甘露味偏覺衆香饒便食僧飯故云為問毗城内餘薰幾日銷贈圓明上人圓公佛頂之最遠公說易長松下龍樹雙經海藏中今日導師聞佛慧始知前路化城空贈奉律上人律公精于維摩經知君學地厭多聞廣渡羣生出世氛飯色不應殊寳器樹香皆遣入禪薰戲贈愼微寺王道安上座三僧正甘露洒空惟一味旃檀移植自成薰遙知暢獻分南北應用調柔致六羣元和十三年二月十九日題石寺廢移崇福寺木塔院陷石于東壁長安秋夜内宫傳詔問戎機載筆金鑾夜始歸萬戸千門皆寂寂月中清露㸃朝衣清泠池懷古余别有序刻石區囿三百里常聞駟馬來旌旗朝角道簫鼔燕平臺追昔賦文雅從容遊上才竹園秋水淨風苑雪烟開牛禍釁將發羊孫謀始回羊勝公孫詭袁絲徒仗劒長孺欲成灰韓安國興廢由所感湮淪斯可哀空留故池鴈刷羽尚徘徊述夢詩四十韻去年七月溽暑之後驪降其夕五鼓未盡凉風凄然始覺枕簟微冷俄而假寐斯熟忽夢賦詩懷禁掖舊遊凡四十餘韻初覺尚憶其半經時悉以遺忘今屬歲杪無事羈懷多感因綴其所遺為述夢詩以寄一二僚友賦命誠非薄良時幸已遭君當堯舜日官接鳯凰曹目睇烟霄濶心驚羽翼高此六句夢中作椅梧連鶴禁壀堄接龍韜内署北連春宫西接羽林軍我后憐詞客先朝曾宣諭卿等是我門客吾僚並雋髦著書同陸賈待詔比王褒重價連懸璧英詞淬寳刀泉流初落澗文賦稱泉流于吻齒露滴更濡毫赤豹欣來獻彤弓喜暫櫜時西戎乞盟幽鎭二帥束身赴闕海内無事累月詩稱赤豹黄熊蓋蠻貊之貢物非烟含瑞氣馴雉潔霜毛靜室便幽獨虛樓散鬱陶學士各有一室西垣有小樓時宴語于此花光晨艷艷松韻晚騷騷畫壁看飛鶴仙圖見巨鰲内署垣壁北畫松鶴先是西壁畫海中曲龍山憲宗㑹欲臨幸中使懼而塗焉倚簷隂藥樹落格蔓蒲桃此八句悉是内署中物惟嘗遊者依然可想也荷靜蓬池鱠氷寒郢水醪每學士初上賜食皆是蓬萊池魚鱠濃夏至後頒賜氷及燒香酒以酒味稍每和水而飲禁中有郢酒坊也荔枝來自遠盧橘賜仍叨先朝初臨御南方曾獻荔枝亦䝉頒賜自後以道遠罷獻也麝氣隨蘭澤霜華入杏膏恩光唯覺重携挈未為勞此八句述以恩賜每有賜與常携挈而歸夕閱梨園騎宵聞禁仗獒每梨園獵回或扺暮夜院門常見歸騎扇回交彩翟鵰起颺銀絛轡待袁絲攬書期蜀客操盡規常謇謇退食尚忉忉此八句述内庭所覩龜顧垂金鈿鸞飛曵錦袍曽䝉賜錦袍曵者蓋取詩人不曵不婁之意也御溝楊柳弱天廐驌驦豪學士皆䝉借飛龍馬屢換青春直閑隨上苑遨普濟寺與芙蓉苑相連常所游眺芙蓉亦謂之南苑也烟低行殿竹風拆繞牆桃此八句述沭澣日遊戲聚散俄成昔悲秋益自熬每懷仙駕遠更望茂陵號地接三茅嶺川迎伍子濤代稱海濤是伍子嗔氣所作花迷𤓰歩暗石固蒜山牢此兩句又是夢中所作蘭野凝香管梅洲動翠篙泉魚驚綵妓溪鳥避干旄感舊心猶絶思歸首更搔無聊然蜜炬誰復勸金舠余自到此絶無夜宴酒器中大者呼為觥賔僚顧形迹未曽以此相勸嵐氣朝生棟城隂夜入濠望烟歸海嶠送鴈渡江臯宛馬嘶寒􅇫吳鈎在錦弢未能追狡兔空覺長黄蒿水國逾千里風帆過萬艘閱川終古恨惟見暮滔滔奉和浙西大夫述夢四十韻次本韻大夫本題言贈于夢中賦詩以寄一二僚友故今所和者亦止述翰苑舊遊而已元稹聞有池塘什還因夢寐遭攀禾工類蔡詠豆敏過曹莊蝶𤣥言秘羅禽藻思高本篇稱六句皆夢中作三聨亦多徵故事也戈矛排筆陣貔虎讓文韜綵繢鸞凰鵛權奇驥騄髦神樞千里應華袞一言褒李廣留飛箭王祥得佩刀傳乗司𨽻馬繼染翰林毫辨頴洵超脫詞鋒豈足􅐤金剛錐透玉賔鐵劍吹毛自戈矛而下皆述大夫刀筆贍盛文藻秀麗翰苑謨猷綸誥褒貶功多名將人許三公世總臺綱充學士等矣顧我曾陪附思君正鬱陶近酬新樂錄仍寄續離騷近䝉大夫寄觱篥歌酬和才畢此篇續至阿閣偏隨鳳大夫與稹偏多同直方壺共跨鼇借騎銀杏葉學士初入例借飛龍馬横賜錦垂萄解已具本篇冰井分珍果金瓶貯御醪獨辭珠有戒廉取一本有玉字非叨綾紙侵紅㸃書詔皆用綾搏紙蘭燈焰碧膏麻制例皆通宵勘寫代予言不易承聖旨偏勞繞月同栖鵲驚風比夜獒吏傳開鎖契學士院宻通銀臺每旦常聞門使勘契開鎖聲甚煩多神撼引鈴絛院中有急命即鈴索自揺習以為常渥澤深難報危心過自操犯顏誠懇懇騰口懼忉忉佩寵雖緺綬安貧尚葛袍賔親多謝絶延薦必英豪自阿閣而下皆言稹同在翰林日居處深秘與頻繁奉職勤勞畏愼周宻等事也分阻盃盤㑹閒隨寺觀遨學士無過從聚㑹之例大夫與稹時而相期於寺觀間行而已矣祗園一林杏慈恩仙洞萬株桃𤣥都澥海滄波減昆明劫火熬未陪登鶴駕已計墮烏號痛淚過江渚寃聲出海濤尚餘恩詔濕已夢壽宫牢本篇言此兩句是夢中作故言夢字再造承天寳新持濟巨篙猶憐敝簪屨重委舊旌旄渤海以下皆言舉感先恩捧荷新澤等事北望心彌苦西一本有馳字回首屢搔九霄難就日兩浙僅容舠暮竹寒窗影衰楊古郡濠魚鰕集橘市鶴鸛起亭臯越州宅牕户間盡見城郭朽刃休衝斗自謂良弓枉在弢竊論早彎摧虎兕便鑄墾蓬蒿漁艇宜孤棹樓船稱萬艘量才分用處終不學滔滔浙西大夫述夢四十韻并浙東相公繼有酬和斐然繼聲本韻次用劉禹錫位是才能取時因際㑹遭羽儀呈鷟鸑鋩劒試豪曹洛下推年少山東許地高門承金鼎鉉家有玉璜韜呂汲嗣侯海浪浮鵬翅天風引驥髦便知蓬閣秘不識魯衣褒興發春塘草魂交益部刀形開猶抱膝燭盡遽揮毫昔士當初筮逢時詠載􅐤懷鉛辦虫蠧染素學鵝毛車騎方休汝歸來欲效陶大夫罷太原從事歸京師南臺資謇諤内署選風騷羽化如乘鯉樓居舊冠鼇美香焚濕麝名果賜乾萄議敕蠅栖筆邀懽蟻泛醪代言無所戲謝表自稱叨蘭焰凝芳澤芝泥瑩玉膏對頻聲價出直久夢魂勞草詔令歸馬批章答獻獒幽薊歸闕西戎乞盟並見前注銀花懸院牖翠羽映簾絛諷諫欣然納奇觚率爾操禁中時諤諤天下免忉忉左顧龜成印雙飛鵠織袍謝賔緣地宻潔已是心豪五日思歸沭三春美衆遨茶爐依綠筍棊局就紅桃溟海桑潛變隂陽灰暗熬仙成脫屣去臣憶奉弓號建節辭烏柏宣風看鷺濤土山京口峻鉄瓮郡城牢舊說潤州城如鉄瓮見韓滉南城紀曲島花千樹官池水一篙鶯來和絲管雁起拂旌旄宛轉傾羅扇回旋墮玉搔罰籌長竪纛觥盞様如舠山是千重障江為四面濠卧龍曾得雨浙東孤鶴上鳴臯浙西劒用雄開匣二公弓閑蟄受弢自謂鳳姿嘗在竹二公鷃語不離蒿自謂吳越分雙鎭東西接萬艘今朝比潘陸江海更滔滔招隱山觀玉蘂樹戲書即事奉寄江西沈大夫閣老此樹吳人不識因予嘗玩乃得此名潤州刺史李德裕玉蘂天中樹金閨昔共窺落英開舞雪宻葉乍低帷内署沈大夫所居門前有此樹每花落空中回旋久之方集庭際大夫草詔之月皆邀予同玩舊賞烟霄遠前歡歲月移今來想顔色還似憶瓊枝奉酬浙西尚書九丈招隱山觀玉蘂樹戲書見懷之作江南西道團練觀察使沈傅師曾對金鑾直同依玉樹隂雪英飛舞近烟葉動揺深素蕚年年宻衰容日日侵勞君想華髪僅欲不勝簪寄題惠林李侍郎舊舘棟宇非吾室烟山是我鄰下齡惟待盡一世樂長貧半壁懸秋日空林滿夕塵秪應雙鶴弔松路更無人寄茅山孫練師何地更翛然華陽第八天松風清有露蘿月淨無烟乍警瑶壇鶴時嘶玉樹蟬欲馳千里戀惟有鳳門泉又二絶石上谿蓀發紫茸碧山幽藹水溶溶菖花定是無人見春日惟應羽客逢獨尋蘭渚翫遲暉間倚松牕望翠微遙想春山明月曙玉壇清磬歩虛歸題奇石石在浙西公署藴玉抱清輝間庭日瀟洒塊然天地間自是孤生者送張中丞入臺從事馹騎朝天去江城睠闕深夜珠光去握芳桂乍辭隂澤國三千里羈孤萬感心自嗟文廢久此曲為盧諶懷京國海上東風犯雪來臘前先折鏡湖梅遥思禁苑青春夜坐待宮人畫詔廻追和太師顏公同清遠道士遊虎丘寺茂苑有靈峯嗟余未遊觀藏山半平陸壞谷為高岸岡繞數仞墻巖潜千丈幹乃知造化意回幹資奇玩鏐騰昔虎踞劒沒嘗龍煥潭黛入海底崟岑聳霄漢層巒未升日哀狖寧知旦綠篠夏凝隂碧林秋不換𡨕搜既窈窕回望何蕭散川晴嵐氣收江春雜英亂逸人綴青藻前哲留篇翰共扣哀玉音皆舒文綉叚難追彦回賞徒起興公嘆一夕如再升含毫星斗爛東郡懷古二首王京兆河水昔將決衝波溢川潯崢嶸金堤下噴薄風雷音投馬災未弭為魚歎方深惟公執珪璧誓與身俱沉誠信不虛發神明宜爾臨湍流自此回咫尺焉能侵逮我守東郡悽然懷所欽雖非識君靣自謂知君心意氣苟相合神明無古今登城見遺廟日夕空悲唫陽給事宋氏遠家左豺狼滿中州陽君守滑臺終古垂英猷數仞城既毁萬夫心莫留跳身入飛鏃免胄臨霜矛畢命在旗下僵尸横道周義風激河汴壯氣淪山丘嗟爾抱忠烈古來誰與儔就烹感漢使握節悲陽秋顏子綴清藻鏗然如素璆徘徊望故壘尚想精魂遊太和四年六月一日題秋日登郡樓望贊皇山感而成詠昔人懷井邑為有掛冠期顧我飄蓬者長隨泛梗移越唫因病感潘鬂入秋悲北指邯鄲道應無歸去期雨後淨望河西連山愴然成詠宿雨初收晩吹繁秋光極目自消魂烟山北下歸遼海鴻雁南飛出薊門只恨無功書史籍豈悲臨老事戎軒唯懷藥餌蠲衰病為惜餘年報主恩秋日美晴郡樓閑眺寄荆南張書記高檻凉風起清川旭景開秋聲向野去爽氣自山來霄外鴻初返簷間燕已歸不因烟雨夕何處夢陽臺故人寄茶劒外九華英緘題下玉京開時惟月上碾處亂泉聲半夜邀僧至孤唫對竹烹碧流霞脚碎香泛乳花輕六腑睡神去數朝詩思清其餘不敢費留伴讀書行讀一本作肘李衞公别集卷三
