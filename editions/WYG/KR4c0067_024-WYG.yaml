  text: 欽定四庫全書
  hash: sha256:64d9ff2e7643d8cd3464e7f4c9e75c7d6d85eb6ee80c540d6dcbeeab187b9ddc
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4c0067_WYG_024-1a, image: WYG1079/WYG1079-0266a.png}
body:
  text: 李衞公别集卷四唐李德裕撰詩下并唱酬共三十五首奉送相公十八丈鎭揚州西川節度使李德裕千騎風生大斾舒春江重到武侯廬共懸龜印銜新綬同憶鱣庭訪舊居取履橋邊啼鳥換釣璜溪畔落花初今來却笑臨卬客入蜀空馳使者車酬西川尚書淮南節度使王播昔年獻賦去江湄今日行春到始悲三徑尚存新竹樹四隣惟見舊孫兒壁間潛認偷光處川上寧忘結網時更見橋邊記名字始知題柱免人􅅓題劒門奇峯百仞懸清眺出嵐烟逈若戈回日高疑劒倚天參差霞壁聳合沓翠屏連想是三刀夢森然在目前頃歲入蜀偶題此詩馬上所成數字未穩今憑連帥尚書盧公再換舊石㑹昌三年四月一日守司空兼門下侍郎平章事李德裕漢州月夕遊房太尉西湖丞相鳴琴地何年閉玉徽房公以好琴聞于四海偶因明月夕重敞故樓扉桃柳谿空在芙蓉客暫依南史安陸侯與王仲寳長史庾杲之書稱泛淥水依芙蓉何其麗也誰憐濟川楫長與夜舟歸重題晩日臨寒渚微風發櫂謳鳳池波自闊魚水運難留亭古思宏棟川長憶夜舟想公高世志祗似冶城遊奉和兵部侍郎鄭澣太尉留琴地時移重可尋徽絃一掩抑風月助登臨榮駐清油騎高張白雪音秪言酬唱美良史記王箴重題靜對烟波夕猶思棟宇精卧龍空有處馴鳥獨忘情顧歩襟期遠參差物象横自宜雕樂石爽氣際青城奉和禮部郎中集賢殿學士劉禹錫木落漢川夜西湖懸玉鈎旌旗還外次舟楫泛中流目極想前事神交如舊遊瑶琴久已絶松韻自悲秋重題林端落照盡湖上遠風清水榭芝蘭室仙舟魚鳥情人琴久寂寞烟月冀平生一泛釣潢處再唫鏘玉聲房公舊竹亭聞琴緬慕風流神期如在因重題此作流水音長在青霞意不傳獨悲形解後誰聽廣陵絃奉和鄭澣石室寒飈警孫枝雅器裁坐來山水操絃斷弔餘哀奉和劉禹錫尚有竹間露永無綦下塵一聞流水曲重憶飡霞人憶金門舊遊奉寄江西沈大夫東望滄溟路幾重無因白首更相逢已悲泉下雙琪樹韋中令武元昌皆已淪沒又借天邊一卧龍杜西川謫官南海人事升沉纔十載官遊漂泊過千峯思君遂寄西山藥大夫嘗鎭鍾陵兼好金丹之術歲暮相期向赤松錦城春事憶江南五言三首桐花鳳百花潭憶子夜歌並闕早入中書行公主冊禮事畢登集賢閣成詠明星入東陌燦燦光層宙皎月映高梧輕風發凉候金門列葆吹鍾室傳清漏簡冊自中來貂黄添宣授更登天祿閣極眺終南岫遥羡商山翁閑歌紫芝秀晨興念始辱夕惕思致冦傾奪非我心悽然感田竇題羅浮石列于石刻清景持芳菊凉天倚茂松名山何必去此地有羣峯重過列子廟追感頃年自淮服與居守王僕射同題名于廟壁僕射已為御史余尚布衣自後俱列紫垣繼遊内署兩為夏官之代復聨左揆之榮荷寵多同感涕何極因書四韻奉寄白首過遺廟朱輪入故城已慙聨左揆猶喜抗前旌曵履忘年舊彈冠久要情重看題壁處豈羡棄繻生遙傷茅山縣孫尊師三首蟬蛻遺虛白蜺飛入上清同人悲劒解舊友覺衣輕黄鵠遥將舉斑麟儼未行惟應鮑靚室中夜識琴聲金格期初至飈輪去不停山摧武擔石天隕少微星弟子悲徐甲門人泣蔡經空聞留玉舄猶在阜鄉亭空宇留丹竈層霞被羽衣舊山聞鹿化遺舄尚鳬飛數日奇香在何年白鶴歸想君旋下泪方欵里閭扉尊師是桃源黄先生傳法弟子常見尊師偁先師靈迹今重賦此詩兼寄題黄先生舊舘後學方成市吾師又上賔今茅山宫觀道士並是先生弟子洞天應不夜源樹秪如春此並述桃源事棊客留童子瞿山童即先生弟子桃源得仙人棊子載在傳記山精避直神先生初至茅山童子觸法坐有聲先生疑山神所為書符召至之其靈異如此矣無因握石髓及與養生人僕射相公偶話于故集賢張學士㕔寫得德裕與僕射舊唱和詩其時和者五人惟僕射與德裕皆列高位凄然懷舊輒獻此詩賦感隣人篴詩留夫子牆延年如有作應不用山王顏延年五君詠山濤王戎以貴不得列于五君之數惠泉茲泉由太潔終不畜纎鱗到底清何益舍虛勢自貧明璣難秘彩美玉詎潛珍未及黄波量滔滔豈有津無題松倚蒼崖老蘭臨碧洞衰不勞鄰舍篴吹起舊時悲題冠蓋里在襄州南大山下偶來冠蓋里媿是舊三公自喜無兵術輕裘上閟宫離平泉馬上作十年紫殿掌洪鈞出入三朝一品身文帝寵深陪雉尾武皇恩厚宴龍津黑山永破和親虜烏嶺全阬跋扈臣自是功高臨盡處禍來名滅不由人謫嶺南道中作嶺水爭分路轉迷桄榔椰葉暗蠻溪愁衝毒霧逢蛇草畏落沙虫避燕泥五月畬田收火米三更津吏報潮雞不堪腸斷思鄉處紅槿花中越鳥啼到惡溪夜泊蘆島甘露花香不再持遠公應怪負前期青蠅豈獨悲虞氏黄犬應聞笑李斯風雨瘴昏蠻日月烟波魂斷惡溪時嶺頭無限相思泪泣向寒梅近北枝登崖州城作獨上高樓望帝京鳥飛猶是半年程青山似欲留人住百匝千遭遶郡城歌篇三首鴛鴦篇霜夜對月聽小童薛陽陶吹笛二首闕南梁行和凡二十二江城欎欎春草長悠悠漢水浮清光雜英飛盡空和景綠楊重隂官舍靜此時醉客縱横書公言可薦承明廬青天詔下寵光至頒籍金閨徵石渠重歸山路烟嵐隔巫山未深晚花折澗底紅光奪日燃揺風有毒愁行客杜鵑啼咽花亦殷聲悲絶艷連空山斜陽瞥映淺深樹雲雨飜迷崖谷間山雞錦質矜毛羽透竹穿蘿命儔侶喬木幽谷上下同雄雌不異飛栖處望秦峯逈過商顏浪疊雲堆萬簇山行盡杳冥青嶂外九重鐘漏紫雲間元和列侍明光殿諫草初焚市朝變北闕趍臣半隟塵南梁笑客皆飛霰追思感嘆却昏迷霜鬂愁吟到曉雞故園歲深開斷簡秋堂月曉掩遺袿嗚嗚曉角霞輝粲撫劒當楹一長嘆芻狗無由學聖賢空持感激終昏旦李衞公别集巻四
