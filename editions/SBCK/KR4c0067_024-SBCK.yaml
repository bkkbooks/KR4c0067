front:
  text: 李文饒别集卷第四
  hash: sha256:e98ca09ffa1a3a83a80edbc7520fa5d0607e5d7f28b5f7a9f5de7e421e54b69c
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4c0067_SBCK_024-1a}
body:
  text: 詩下并唱酬共三十五首奉送相公十八丈鎭楊州西川節度使李德裕千騎風生大斾舒春江重到武侯廬共懸龜印銜新綬同憶鱣庭訪􅃇居取履橋邊啼鳥換釣璜溪畔落初今来却笑臨卭客入蜀空馳使者車酬西川尚書淮南節度使王播昔年獻賦去江湄今日行春到始悲三徑尚存新竹樹四隣惟見􅃇孫兒壁間潜認偷光處川上寧忘結網時更見橋邉記名字始知題柱免人􅅓題劒門奇峯百􅌇懸清眺出嵐烟逈若戈囘日高疑劒倚天參差霞壁聳合沓翠屏連想是三刀夢森然在目前頃歲入蜀偶題此詩馬上所成數字未穩今慿連帥尚書盧公再換􅃇石㑹昌三年四月一日守司空兼門下侍郎平章事李德裕漢州月夕遊房太尉西湖丞相鳴琴地何年閉玉徽聞於四海房公以好琴偶因朙月夕重敞故樓扉桃桺豀空在芙蓉客暫依與王仲寳長南史安陸侯水依芙蓉何其䴡也史􅁃杲之書称泛渌誰憐濟川楫長與夜舟歸重題晩日臨寒渚㣲風彂櫂謳鳳池波自閲魚水運難留亭古思宏㨂川長憶夜舟想公高世志祗似冶城遊奉和兵部侍郎鄭澣太尉留琴地時移重可尋徽絃一掩抑風月助登臨榮駐清油騎高張白雪音秪言酬唱美良史記王箴重題靜對烟波夕猶思棟宇精卧龍空有處馴鳥獨忘情顧歩襟期遠參差物象横自宜雕樂石爽氣際青城奉和禮部郎中集賢殿學士劉禹錫木落漢川夜西湖懸玉鈎旌旗還外次舟楫泛中流目極想前事神交如􅃇遊瑶琴久已絶松韻自悲秋重題林端落照盡湖上遠風清水榭芝蘭室僊舟魚鳥情人琴久寂寞烟月冀平生一泛釣潢處再唫鏘玉聲房公􅃇竹亭聞琴緬慕風流神期如在因重題此作流水音長在青霞意不傳獨悲形解後誰􅃪廣陵絃奉和鄭澣石室寒飈警孫枝雅噐裁坐来山水操絃斷吊餘哀奉和劉禹錫尚有竹間露永無綦下塵一聞流水曲重憶飡霞人憶金門􅃇遊奉寄江西沈大夫東望滄溟路幾重無因白􅈡更相逢已悲泉下雙琪樹昌皆已淪没韋申令武元又借天邊一卧龍官南海杜西川謫人事升沉纔十載官遊漂泊過千峯思君逺寄西山藥嘗鎮大夫金丹之術鍾陵兼好歲暮相期向赤松錦城春事憶江南五言三􅈡桐花鳳百花潭憶子夜歌並闕早入中書行公主冊禮事畢登集賢閣成詠朙星入東陌燦燦光層宙皎月映高梧輕風彂凉􅃸金門列葆吹鍾室傳清漏簡冊自中来貂黄添宣授更登天祿閣極眺終南岫遥羡商山翁閑歌紫芝秀晨興念始辱夕惕思致冦傾奪非我心悽然感田竇題羅浮石刻於石上清景持芳菊凉天倚茂松名山何必去此地有群峯重過列子廟追感頃年自淮服與居守王僕射同題名于廟壁僕射已爲御史余尚布衣自後俱列紫垣繼遊內署兩爲夏官之代復聨左揆之榮荷􅃂多同感涕何極因書四韻奉寄白􅈡過遺廟朱輪入故城已慙聨左揆猶喜抗前旌曵履忘年􅃇彈冠久要情重看題壁處豈羡棄繻生遙傷茅山縣孫尊師三􅈡蟬蛻遺虛白蜺飛入上清同人悲劒解􅃇友覺衣輕黄鵠遥將舉班麟儼未行惟應鮑靚室中夜識琴聲金格期初至颷輪去不停山摧武擔石天隕少微星弟子悲徐甲門人泣蔡經空聞留玉舄猶在阜鄉亭空宇留丹竈層霞被羽衣􅃇山聞鹿化遺舄尚鳬飛數日奇香在何年白鶴歸想君旋下泪方欵里閭扉尊師是桃源黄先生傳法弟子常見尊師偁先師靈迹今重賦此詩兼寄題黄先生􅃇舘後學方成市吾師又上賔並是先生弟子今茅山宫觀道士洞天應不夜源樹秪如春桃源事此並述棊客留童子生弟子􅊝源瞿山童卽先載在傳記得仙人棊子山精避直神坐有聲先生疑山神所爲先生初至茅山童子觸法靈異如此矣書符召至之其無因握石髓及與養生人僕射相公偶話於故集賢張學士㕔冩得德裕與僕射􅃇唱和詩其時和者五人惟僕射與德􅁉皆列高位凄然懷􅃇輒献此詩賦感隣人篴詩留夫子墻延年如有作應不用山王以貴不得列於五君之数顔延年五君詠山濤王戎惠泉茲泉由太㓗終不畜纎鱗到底清何益含虛勢自貧朙璣難秘彩美玉詎潜珍未及黄陂量滔滔豈有津無題松倚蒼崖老蘭臨碧洞衰不勞鄰舍篴吹起􅃇時悲題冠盖里在㐮州南大山下偶来冠盖里媿是􅃇三公自喜無兵術輕裘上閟宫離平泉馬上作十年紫殿掌洪鈞出入三朝一品身文帝寵深陪雉尾武皇恩厚宴龍津黑山永破和親虜烏嶺全阬跋扈臣自是功高臨盡處禍來名滅不由人謫仙領南道中作嶺水爭分路轉迷桄榔椰葉暗蠻溪愁衝毒霧逢蛇草畏落沙䖝避燕泥五月畬田收火米三更津吏報潮雞不堪腸斷思鄉處紅槿花中越鳥啼到惡溪夜泊蘆島甘露花香不再持遠公應怪負前期青蠅豈獨悲虞氏黄犬應聞笑李斯風􅀨㢓昏蠻日月烟波魂斷􅁖溪時嶺頭無限相思泪泣向寒梅近北枝登崖州城作獨上高樓望帝京鳥飛猶是半年程青山似欲留人住百匝千遭遶􅇿城歌篇三􅈡鴛鴦篇霜夜對月聽小童薛陽陶吹笛二首闕南梁行和二十二凡江城欝欝春草長悠悠漢水浮清光雜英飛盡空和景綠楊隂重官舍靜此時醉客縱横書公言可薦承朙廬青天詔下􅃂光至頒籍金閨徵石渠重歸山路烟嵐隔巫山未深晚花折澗底紅光奪日燃揺風有毒愁行客杜鵑啼咽花亦殷聲悲絶艶連空山斜陽瞥暎浅深樹雲雨飜迷崖谷間山雞錦質矜毛羽透竹穿蘿命儔侶喬木幽谷上下同雄雌不異飛棲處望秦峯逈過商顏浪疊雲堆萬簇山行盡杳冥青嶂外九重鍾漏紫雲間元和列侍朙光殿諫草初焚市朝變北闕趍臣半隟塵南梁咲客皆飛霰追思感歎却昏迷霜鬂愁吟到曉雞故園歲深開斷簡秋堂月曉掩遺袿鳴鳴曉角霞輝粲撫劒當楹一長歎芻狗無由學聖賢空持感激終昏旦李文饒别集巻第四
