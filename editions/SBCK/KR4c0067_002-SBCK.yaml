body:
  text: 紀功幽州紀聖功碑銘異域歸忠傳序􅃛戞斯朝貢傳序幽州紀聖功碑銘并序奉敕撰幽州盧龍軍師檢校尚書右僕射張公仲武往年修獻捷之禮今年有銘勲之請二者君子韙之豈不以諸矦有四夷之功獻其戎捷春秋􅃇典也宗周納肅慎之貢銘於楉矢天子令德也斯可以爲元矦衆可以爲後代法聖上嘉其動而中禮乃命宰臣採其元功傳於惇史臣德􅁉敢颺言曰夫兵者􅀁以除暴害也愛人則惡其爲害禁暴則惡其爲亂雖睿智不殺化之以神至德允懐招之以禮然書有搰夏之戒傳有脩刑之訓虞舜四罪乃成大功文王一怒以至無侮非德教之􅂇歟仁聖文武章天成功神德明道大孝皇帝熙我文典煥乎光明極象外之㣲臻於至道鼓天下之動致於中和慮必鈎深退而藏宻故能神機獨照伐未兆之謀威光遠震制不覊之虜當其時也烽燧迭警羽書狎至人心大揺群師沮氣皇帝以軒后之威神漢髙之大畧光武之雄㫁魏祖之機權合而用之以定王業此議臣􅀁以不敢望於淸光也倬㦲天地應而品物生君臣應而功業成故龍躍而雲從䳽鳴而子和方􅅩伐獫狁蠻荆来威安遠撃車師西域振服宜有良將殿于朔邉張公禮閱戰噐書成傳癖張仲孝友子􅃭塞泉流落不偶光景未耀明主雅聞竒志將帥而拝將軍遥推赤心築壇而命元帥非自雄武授之薊門果能精誠奮彂䇿慮偪億千里獻籌一心憂國則知龍顔善將任人傑而不疑日角好謀歎敵國而强意回鶻者本北狄之裔也或曰獯狁或曰山戎五帝􅀁不能臣三王􅀁不能制前史載之詳矣暨薛延陁之敗也莤帥吐迷度率衆欵塞太宗幸靈武納降立回鶻部落置瀚海都􅇂因我封殖遂雄北方肅宗之戡內難也葉䕶以射鵰之士親護戎旌亦由􅆧髳率師以翼周北貊梟騎以􅂇漢既殄大憝乃疇厥庸特拝葉䕶司空􅀊賜繒二萬疋厥後飾宗女以配之立宫室以居之其在京師也瑶祠雲構甲第棊布棟宇輪奐衣冠縞素交利者風偃挾邪者景附其翎矦貴種則被我文繢帶我金犀恱和音猒珍膳蝎蠧上國百有餘年既而傑鷔無親天命不祐僣侈極欲神道惡盈本國荐飢畜産耗半黠戞斯因利乗便遂焚龍庭區落蕭條隂燐青焚今之烏介可汗亡逃失國竊號沙漠非我冊命自爲假王其来也羨漫隂山睥睨髙闕玄塞之下氛霧蔽天質貴主以前驅傾大國而求援或丐我米糒捄其飢人或邀我甲兵復其故地外雖柔服內有桀心因行人致詞徵呼韓故事願居光禄塞急保受降城其下有二部曰赤心宰相那頡啜特勒赤心者天性忿鷙戎馬尤盛初與名王嗢沒斯首謀內附俄而負力怙氣潜圖厲階為嗢沒斯所給誘以俱謁可汗戮於帳下其衆大潰東逼漁陽上乃賜公璽書授以方畧公以室􅅊悍亟之兵近我邉鄙俾其偵邏且禦内侵尋以徵役不供爲虜􅀁敗由是介馬数萬連亘幽陵伏精甲於松布穹廬於磧鹵散􅀂飛鳥止如長雲火燎於原不可嚮邇公激義氣以虹貫彂精誠而石開竒計兵權宻授髦俊乃命介弟仲至與禆将游奉寰王如清左敵萬李君慶張自榮髙守素李志操率銳兵三萬建斾而前介胄雪照戈矛林植命以義殉壮由師直聲隆隆而未􅂥欲逐逐而不食戢以􅃪命嚴而有威公曰險道傾反且馳且射胡兵所以無敵也致之平原勒以方陳我師可以逞志也於是㨿于莽平環以武剛首尾蛇伸左右翼張輕騎既合竒鋒横䳱如摧枯株如摶畜兎攝讋者弗取陸梁者皆仆虜王矦貴人計以千數然後盡羅服􅃪悉數系纍谷静山空靡有孑遺槖駞駃騠風澤而散旃墻􅄢幕野馬牛㡬至於谷量虜血殆同於川决徑路寳刀祭天金人竒貨珍噐不可殫論乃命從事李馳傳上奏又命牙門將國從紀􅁇獻戎俘皇帝受而勞之群臣畢賀昔長平七征驃騎一舉竇憲合氐戎之衆陳湯㩜城郭之兵或生靈减耗士馬物故或邀功捄罪矯命專征然猶告􅁼上帝薦功淸廟願視二漢不其恧歟以公威動蠻貊功在漏刻因命公爲東靣招撫回鶻使先是奚契丹皆有虜使監護其國貴以􅀊遺且爲漢諜自回鶻嘯聚靡不鴟張公命禆將石公緒等諭意兩部戮回鶻八百人雖介子討罪於􅀛茲班超行誅於鄯善未足儔也回鶻又遣宣門將軍等四十七人詭辭結歡僣伺邉􅂩公宻賂其下盡得隂謀且欲馳入五原大􅇌雜虜公逗留其使緩彼師期竟得人病馬瘏縮衂而退挫銳解紛􅂃公善計今烏介自絶皇澤莫敢近邉并丁令以圖安依康居而求活盡􅑫餘種屈意黒車􅀉託遠道流離飢凍黒車亦􅀝其威重迫脅諸戎造謀藉兵解仇交質自謂約齎深入漢將取而未期渡幕輕留三師往而非利公以壯猷逺馭長討覊縻不媮避慊之便終致盡敵之術将時動而得雋豈􅀊數而勝㣲矧乎明主仗將師爲􅀲牙視戎狄爲䑕彘方獵猛敵不翫細娱非周宣無以成召虎之勲非漢宣無以􅃪營平之計朂哉上將光我中興公前後受降三萬人特勒二人可汗姊一人都􅇂外宰相四人其他矦王騎將不可備載王褒以日逐歸德稱爲人瑞班固以稽落盪寇大振天聲孰􅀂天子神武百蠻振慴乗其慼困臨以兵鋒刈單于之旗納休屠之附非萬里之伐無三年之勤巍乎成功輝焯後代宜刻金石以揚鴻休銘曰大和之初赤氣宵興開成之末彤雲暮凝異鳥南来胡徴之㓕北夷颷掃厥國土崩逼迫遷徙震我邉鄙長蛇去宂奔鯨失水上都薊門兵連千里曽不畏天猶爲驕子丐我邉􅂖邀我三師假我一城建彼旙旗歸計强漢郅支嫚詞狼顧朔野伏莽見誅鴈門之北羗戎雜處濈濈群羊茫茫大鹵縱其梟騎驚我牧圉暴􅀂豺狼疾如風雨皇赫斯怒羽檄徵兵謀而淵黙㫁乃雷聲沉機變化動􅀂神明沙漠之北虜無隠情漁陽突􅀐燕歌壯氣赳赳元戎耽耽虎視金鼓誓衆干旄蔽地爰命介弟屬之大事翩翩飛將董我三軍禀兄之制代師之勤威畧火烈胡馬星分戈回白日劍薄浮雲天街之北旄頭已落絶轡之野􅃖尤未縛俾我元矦恢弘遠畧取彼單于係之徽索隂山寢烽亭徼櫜弓萬里昆吾九譯而通蠻夷既同天子之功儒臣篆美刋石垂鴻異域歸忠傳序㑹昌二年四月甲申回鶻大特勒唱没斯率其國特勒宰相尚書將軍凡十二人大首領三十七人􅀐士二千一百六十八人內附制授嗢没斯特進檢校工部尚書左金吾衞大將軍同正封懐化郡王其酋帥徧加戎秩賜之金紫於是穹廬之長盡識漢儀左袵之人咸被王澤矣臣聞書載率服美大舜之功詩列既平􅂋周宣之德暨漢宣帝亦單于慕義呼韓来朝歴紀数千稱者三代則知非常之運必待非常之君誠契感通斯爲難遇伏惟仁聖文武至神大孝皇帝紹髙祖太宗之神武慕玄宗憲宗之遠畧英才天縱武節霆馳靜深之謀淵然􅀂海先難之志屹然􅀂山自嗢没斯歸欵朔邉注心魏闕制置大畧盡出宸算漢高從善能用六竒光武揣情坐知千里諸將無搴旗之効群臣乏借箸之籌夫天以信而成功地以定而載物惟大君懋一德法兩儀故能懐異俗之心盛中興之業嗢没斯者回鶻之貴酋也夙禀正性生知大義識􅀝伏之数明禍福之機回鶻運屬天亡􅀊乆不稔畜産大耗國邑爲虚流亡徧於沙漠僵仆被於草莽由是國之將帥各率支兵或入西戎或歸諸部惟嗢没斯精誠上逹天誘其􅂨拔自狼居之山願拜龍顔之主封章瀝懇指日誓心不奪之誠介如石矣先是有赤心宰相桀傲亂常頗爲邉患嗢沒斯潜布誠欵於天徳軍使田牟暴其罪状梟首以狥歸大國明也戴聖君忠也去亂􅀖智也執醜虜義也其比四夷悉謂誠臣昔仲尼以曽參孝因爲陳君臣父子之義以著孝經今聖主以嗢沒斯忠爰採武義貞烈士以爲歸忠傳則聖人善誘之道又何以加於此乎廼集秦漢以来至聖朝去絶域歸中國獲名節自著功業保終者三十人勒成上下兩卷其不因獻款無迹可稱者今並不載臣又聞善者天報之以福爲不善者天報之以殃神道昭晣應如影響嗢沒斯方欲保大節成大勲宜乎佩服斯文以爲鍳戒臣備位台鉉獲奉睿謀受詔序事冠于篇首黠戞斯朝貢圖傳序昔越裳貢雉薦於宗廟西旅獻􅋙陳以典訓􅀁以感其至而戒其初也仁聖文武至神大孝皇帝御暦之四年天瑞燦爛王道昭焯五材並用六轡斯柔布政宣室以張神化報兵朔野以耀威靈故得天晬而淸日晏而明蟲螟不生嘉榖以成中㝢既安四夷来庭由是龍荒君長黠戞斯遣使注吾合素等上表獻良馬二疋絶大漠而貢赤誠渉流沙而霑赭汗非至德􅀁感孰能臻於此乎皇帝以前有鸞旂焉用􅂹騄不貴龍友帷駕鼓車乃命其使見於内殿賜以珍膳錫之文錦謹按故相魏國公賈耽􅀁撰古今四夷述黠戞斯者本堅昆國也貞觀二十一年其酋長入朝授以將軍印拜堅昆都督逮于天寳季年朝貢不絶暨中國多難爲回鶻隔礙黠戞斯忿其桀鶩乗彼荐飢於是破龍庭焚􅄢慕蕭條萬里地無種落始得出重泉而見白日披氛霧而覩青天臣伏見太宗謂群臣曰南荒西域自遠而至其故何哉宰臣房玄齡對曰殊域来朝者中國乂安帝德遐被􅀁致也太宗曰向中國不安亦何縁而至朕覩此懐懼何者昔秦始皇并吞六國漢武帝威加戎狄今殊方異􅁼無遠不賔竊比秦漢想無多愧亦欲傳之子孫念二王之末途朕􅀁以不能不懼爾臣伏思太宗往日之懼致我唐百代之隆則聖祖詒謀可謂深矣此太宗􅀁以永保鴻名爲受命之祖陛下􅀁以丕承王業為中興之主豈不宜哉天㫖以賈耽有陳平鎮撫之才得􅂶國通知之敏其􅀁述作該明古今乃詔太子詹事􅅊宗卿祕書少監吕述往蒞賔舘以展􅀻覿稽合同異視縷闕遺傳胡貊兠離之音載山川曲折之狀條貫周備文理洽通臣伏以貞觀初中書侍郎顔師古上言昔周武王天下太平逺國歸款周史乃集其事爲王㑹篇今萬國来朝蠻夷率服實可圖寫請撰爲王㑹圖有詔從之臣輒因􅅊宗卿吕述􅀁紀異聞飾以繢事敢叙率服以冠篇首李文饒文集卷第二
