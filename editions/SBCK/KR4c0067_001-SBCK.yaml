front:
  text: 李文饒文集卷第一㑹昌一品制集
  hash: sha256:aef5c4644ddc852b5b5ca9bcf40d7f79bd3981bcc8b80480065a4d5a878194ff
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4c0067_SBCK_001-1a}
body:
  text: 徽冊讃上尊號玉冊文仁聖文武至神大孝皇帝眞容讃并序上尊號玉冊文二年㑹昌奉敕撰維㑹昌二年􅀊次壬戌四月乙丑朔十四日戊寅攝大尉光禄大夫守司空兼門下侍郎同中書門下平章事臣徳􅁉銀青光禄大夫守尚書左僕射兼門下侍郎同中書門下平章事臣夷行金紫光禄大夫尚書右僕射兼中書侍郎同中書門下平章事臣拱銀青光禄大夫守中書侍郎同中書門下平章事臣李紳及文武百官金紫光禄大夫檢校司徒兼太子太保臣僧孺等六十五百七十四人言臣聞羲皇首太古之號成湯􅂋神武之稱我髙祖皇王是憲尊名若古貽厥丕訓爲子孫之法豈不善始善述哉矧乃臣唐受命􅁇體承業理運將至大君以興昊穹所以開至聖也曩者明兩未定帝華不恊捨㣧傳聖深惟至公先后所以昭天命也亦猶堯􅀤於唐矦文興於代邸神明之祚不其難哉伏惟皇帝陛下淸明溥鬯光耿四海玄德莫鄰天休大賚日角見表氣志如神爰初定命正心理物如辰居極而天下無邪矣由是昭德塞違尊賢遠佞禹不自滿成不敢康罔盤于田不邇于色自閨壼以施王教由家道而刑國風去比周覈名實擥乾綱擇聖紀修􅃇典恊誠質扢嘉壇欵泰一進正臣以端治表禮故老以求讜言遠無蔽獄近無留命祈玄祖而膏雨降祀靈岳而嘉穀登省刑罰而蓬孛消彂倉廪而螽螟息去􅀊龍旂承祀大輅親郊捧玉瓉而一獻光靈来格振金石而六變魄寳昭臨然猶古訓是學緝熙于道天文炳煥雲漢其章温㳟敬遜承太任之教和樂愷悌洽戚藩之心德風偃于群黎威霆動乎絶域又以敬養不逮於長樂昭配未升於禰宫毎懐嗣徽烝烝而慕所以奉若慈訓對越兩儀因心立制永錫其教寛䖍劉之罪興惻隠之仁回電􅀵霜爲之反汗及單于慕義景附朔邉耀德戢兵謙臨是受至於備文物展國容莫不先甲而布甘澤丁辰而廓隂羽和景晏温卿靄絪緼斯所謂神祗之心應矣天人之際交矣於是服冕之士戴鶡之倫暨藩矦􅀖伯黃髪鮐背不謀而進曰陛下玄黙天晬輝光日新大矣孝熙四極爰臻誠宜玉版温潤鏤鴻明之德神寳焜耀薦萬斯之年丕夫大典不可辭也陛下猶謙退固拒至于三四群臣不已乃曰俞哉夫徧覆包含之謂仁極深研幾之謂聖憲度著明之謂文蠻夷震懾之謂武感而遂通之謂神無思不服之謂孝臣等不勝大願謹奉玉冊玉寳上尊號曰仁聖文武至神大孝皇帝伏惟陛下乾徤不息謙尊而光樂戒其禽戒其荒夀乃侔於殷宗俗乃厚於成康貽燕後昆受福無疆臣德裕等誠歡誠躍頓首頓􅈡謹言上尊號玉冊文㑹昌五年維㑹昌五年􅀊次乙丑正月已酉朔一日已酉光禄大夫守太尉兼門下侍郎同中書門下平章事臣德􅁉光禄大夫守尚書左僕射兼門下侍郎同中書門下平章事臣悰朝議大夫守尚書右僕射兼中書侍郎同中書門下平章事臣讓夷朝議大夫守中書侍郎兼户部尚書同中書門下平章事臣崔鉉及文武百官太中太夫太常卿臣孫簡等六千二百二人言臣聞在昔周宣撿抁内侵四扗薄伐以定王國則詩人大其功暨于漢宣北夷乖亂呼韓慕義郅支遠遁則簡䇿著其美惟此二代偁爲中興間者開成之未星孛如雲螟飛蔽天先帝戚之黎人懼焉乃授至聖遺大投艱迄茲成功厥有􅁳數伏惟仁聖文武至神大孝皇帝表應龍翼粹合乾剛神全而正氣凝宇定而天光彂智燭千里動必察㣲心鏡萬機物来斯應於是三材用四維張建中和之極綴前聖之綱重樞機脩法制刑御家之理無出壼之言銷讒邪遠佞幸絶背公之黨退好徑之人內嚴體貌増堂陛之峻外絶締交去輔車之勢古􅀁謂受命於天惟舜獨正也又曰一心定而萬物服惟陛下得之􅇮者北狄矜功耗蠧中國種􅁼磐牙根柢封殖異術肺腑縞衣如荼挾邪作蠱浸􅁋宇內倒懸不觧百有餘年既而龍祠埡㓕携國欵塞質帝女蹙海疆有狼頋平城之心鯨吞咸洛之志爰命梟將搴旗剛旃兵鏖穹廬火烈荆榛颺􅄢幙碎䡝六羸遁逃貴王生還剗㓕妖迹剿除醜􅁼故名王結髪冠帶入臣堅昆稽首鞮譯来獻而又姦臣放命二紀陸梁㨿太行之固下窺􅏖邑通故絳之道旁睨近關樹其遺孽以竊兵柄議者僉曰精甲十萬積􅂖十年泉魚不察湯網宜懸陛下雄㫁霆聲群疑氷釋揚淸風而掃雲鼓迅雷而破山任馮異則㧞天井而振上黨仗呉漢則彂突騎而窺邯鄲壺關夫險山東奪魄屬有戍邉叛將竊彂参墟人心揺蕩異議放肆陛下臨朝而言曰二冦獲罪於天予􅀁不捨未三旬而定晋地纔朞年而㓕潞子不以金購稀將多降不勞師克粤首馳報非至德感物孰能臻於此乎由是台宰百辟藩屏將帥上言曰成伐東夷而肅慎来賀景剪七國而王室乃安莫不始於武功終致刑措將以禋上帝薦祖宗宜受鴻名以荅玄貺陛下猶謙遜而五譲之勤請弗已乃屈已以俞之雲漢為章所以昭法度也神明其德所以成教化也巍乎有功帝堯之則也勤于大道玄祖之訓也臣等不勝大願謹奉玉冊玉寳上尊號曰仁聖文武章天成功神德明道大孝皇帝伏惟陛下不有其名以保其成不德其功以戒其盈享殷宗之福致周道之平熙我王度玉振金聲臣德􅁉等誠歡誠躍頓首蝢􅈡謹言仁聖文武至神大孝皇帝真容讃并序仁聖文武至神大孝皇帝御極之五載氣應天和德感人心朝廷四方感一於正以精蕩侵以道勝殘故得風雨時若螽螟嵗息銷逢孛爲休氣驅戎狄爲懐人北荒堅昆重譯而至厥有窘伐憑阻弄兵陸梁􅅊頋既伐夙沙自縛武功既成体德昭明前古未聞百王莫致之事皆葳蕤於圖諜矣皇上以爲大禹叙九疇敬五事豈不曰貌㳟則莊視明則止予欲作繢傳照審其儀形且夫聖人潜心於天以通神明先定其神而萬物理矣昔之訪具茨期姑射在此而已况乎廣成之戒抱一玄元之去多欲予所貴道良謂是矣豈眩夫係風之言竒彼淖冰之術從偓佺之􅀁遺堯舜之令命各哉於是圖輕素冩良金擬鑑形於止水􅀂凝視於淸鏡五彩既彰穆穆皇皇居列仙之舘近玄祖之光蓋以昭燕翼之謀􅂋丕承之德矣臣聞古之至聖必有竒相是以黄熊之瑞應於龍體赤精之符恊於圖表頎然而長文王􅀁以新天命也體貌多竒漢髙􅀁以威海内也然則繢事之㣲極於㣲肖至於天光淸日光明潤非可圖也庻髣髴焉末臣奉詔敢颺言曰唐運中興天授大君軒耀其武堯煥其文北伐撿抁朔漠消氛西伏堅昆稽首稱臣祲生壼􅀜盗起河汾沈機先物雄㫁觧紛克定群慝竟全大勲八表既寧萬機益勤爰命彩繢載模天真崐閬仙岑峻極秋旻蓬瀛白日光照淸晨􅆂育如天尊嚴􅀂神輝赫絪緼爲龍爲雲聖作物覩禎祥以臻宣光孕靈虞熙載甄政建中和金聲玉振太堦既平廟噐乃陳化下以德持盈以仁四瀆宗海衆星拱辰億萬斯年藻朗日新李文饒文集卷第一
