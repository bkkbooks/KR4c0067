front:
  text: 李文饒文集卷第二十㑹昌一品制集
  hash: sha256:c07ce32c1d9c54b33ff0623fb118e2c3b6bfc0b36621f6e9450613132e9f5747
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4c0067_SBCK_020-1a}
body:
  text: 祈告武宗改名告天地文祈􅀕西嶽文賀􅆸毁佛寺徳音表瑞橘賦并序奉和聖制南郊禮畢詩郊壇囘聖慈召至御馬前詩寒食三殿侍宴奉進詩武宗改名告天地文臣讃承丕緒勵翼七年不敢怠荒以思無逸北制强虜東剪叛徒享此鴻名實由􅀇造常欲述帝堯之典欽若昊天修周武之法建用王極成于王道以黜異端釋氏之教興於戎狄悖君臣之禮廢父子之親耗蠧蒸人殫竭物命宣尼垂訓不語怪神因而漸除咸一於正襲前聖之業燦而光明臣之本心諒在於此伏以書載五行當被水上名有五義不以山川之稱名稍違古典今則循漢宣之故事稟皇祖之詒謀採用離明以符上德又臣近因微恙巳及二時感此陽和物皆暢茂未逢勿藥之喜獨有向隅之憂如臣政教不明宜有隂譴刑罰不中未合天心伏願舍臣咎􅄽許臣改悔永保宗廟以安邦家所疾日瘳平復如舊五星度理百福來臻敢不克己厲精祗事上帝洗心齋戒嚴奉神祗懇陳至誠仰望照鑒祈祭西嶽文惟神作鎮中土據于西陲積高炳靈宅神明之粤少隂協德成天地之功恭聞烈祖􅀇宗御暦永年祭必受福秘䃭昭賽金刻猶存近者隂澤稍􅄽宿種未茂精意纔達甘液驟零既紓播種之勤巳獲流根之潤今因報德再竭至誠某纉奉丕圖勤勞七載恭巳思道豈敢怠荒屬黠虜南侵震驚朔野兵鋒一舉毳幕皆焚潞子嬰兒梟􅈡魏􅏱參墟叛將靣縳壘門成此武功無非幽贊又以釋氏之教出於西夷棄五常之典絶三綱之常殫竭財力蠧耗生人黜其異端以正王度庶可復古諒非近名屬以忽於所慎寒暑成􅍚曠時且乖於勿藥昧旦徒切於求衣如某政教不朙宜有隂譴刑罰不中未合大心實希朙神許其改悔永保宗廟以安邦家所疾日瘳平復如􅃇昔成湯自咎者六零雨消災宋景善言者叁法星退舍至誠所感前史昭然誠信不欺恃神正直敢不誓於丹腑嚴奉明靈敬陳忠懇伏望臨鑒賀廢毁諸寺德音表臣某等伏奉今日制拆寺蘭若共四萬六千六百餘所還俗僧尼并奴婢為兩稅户共約四十一萬餘人得良田約數千頃其僧尼令􅀠主客户大秦穆䕶襖二十餘人並令還俗者臣聞仲尼祖述堯舜憲章文武大􅀪聖道以黜異端末季以來斯道乆廢不遇大聖孰能極之臣某等中謝伏以三王之前皆垂拱而理不可得而言也厥後周美成康漢稱文景至化深厚大道和平人自禀於孝慈俗必臻於仁壽豈嘗有外夷之教㸃中夜之風東漢楚王英始盛桑門之饌淪於左道桓帝更増犀盖之飾歸於亂政魏之三祖西晉太康雖君非大聖臣非上折然猶祖尚老莊斯教未行至東晉因呉人之佻薄襲孫權之弊政始建塔廟乃譯梵書齊梁陳其教浸盛好大不經之説陋乃詩書因報拔濟之談隆於仁孝運祚浮促簒奪相尋二百年間五變朝市君無殷宗之福臣靡衞武之年感驗寂寥斯可明矣高宗祖堯皇帝方欲剗除斯弊掃刷中區時屬宰臣蕭瑀本梁氏之子孫尋覆車之軌轍廢格明詔以迄于今遂使土木興妖山林増構一巖之秀必極雕鐫一川之膄已布高刹鬼切不可人力寧堪耗蠧生靈侵減征稅國家大蠧千有餘年伏惟仁聖文武章天成功神德明道大孝皇帝陛下明紹於天粹合於道黜覇圖而功盛入聖域而德優常欲天下之動咸貞於一以一言之蔽思必無邪先定宸心獨發英㫁破逃亡之藪皆列齊人收高壤之田盡歸王稅正羣生之大惑返六合之澆風出前聖之謨為後王之法巍巍功德煥炳圖書臣竊位樞衡莫能禆益愧無將明之効徒懐鼓舞之心千古未逢百生何幸不任抃賀踴躍之至瑞奉表陳賀以聞瑞橘賦清霜始降上命中使賜臣等朱橘各三枚盖靈囿之所植也臣伏以度淮而枳由地氣而不遷吹谷生黍信陽和之所感昔漢武致石榴於異國靈根遐布此西域柔服之應也魏武植朱橘於銅雀華實莫就乃吳人未格之兆也考於前史昭晰可知豈非天地和同靈物効祉去蠻夷之陋䕶近太陽感王化之盛更承膏露草木尚爾況乎人心漢宣帝宫舘山澤意有所感必詔近臣賦之臣㓜學為文忝列樞近稽􅈡獻賦曰美南州之嘉樹受烈氣於炎德固一志於殊方遂不遷於上國貞葉凝碧謁湘岸之夕隂華實變黄動江潭之秋色雜丹楓於溪畔映緑篠於巖側翡翠以之列巢鵷雛於焉棲息雖同霑於雨露竊自得於彫飾終獲譽於皇明豈因人而羽翼感洪鈞之獨運斡造化之􅀇力思六合之同風採孤根而移植播元氣之茂育諒英靈之不測逮乎霜飛天囿風落秦川金莖炫耀於朝日玉樹青䓗於霽天峩方壷之翠島列靈沼之清漣上欝松下秀蓀荃赩朱草與屈軼華靈芝與賓連靈卉畢植而嘉橘在焉氷心獨潤金衣更鮮天漢之華星焜燿閬風之珠樹粲然香若團於野露色疑炫於江煙既而太官獻新奇果列筵飛厥苞之自逺何菲陋之莫傳樹隠方塘比丹墀之効實盤映皎日與赤瑛而共研東鄙孤臣謬陳三事既乏和􅅅之用猶霑可口之味并食不割竊愧晏嬰之知捧之以拜重感桓榮之賜庶不改於霜雪永酬恩於天地奉和聖制南郊禮畢詩磬筦歌大吕冕裘旅天神燒蕭闢閶闔祈穀為蒸人羽旗灑輕雪麥壠含陽春昌運嵗今㑹王猷從此新三臣皆就日萬國望如雲仁壽信非逺羣生方在鈞郊壇囘輿中書二相公䝉聖慈召至御馬前仰感恩遇輒書是詩兼呈二相公七萃和鑾動三條葆吹囘相星環日道蒼馬近龍媒歌馬蒼古詞臣咫尺天顔接光華喜氣來自慙衰且病無以效涓埃寒食日三殿侍宴奉進詩一首宛轉龍日節參差燕羽高風光搖禁柳霽色暖宫桃春露明仙掌晨霞照袍雪凝陳組練林植聳干旄廣樂初蹌鳯神山欲抃鰲鳴笳朱鷺起疊鼓紫騂豪象舞嚴金鎧豐歌耀寳刀不勞孫子法自得太公韜内樂破陣樂巳上四句奉述分席羅􅀇冕行觴舉縹醪糓中時落羽橦末乍升揉瑞景開隂翳薰風散欝陶天顔歡益醉臣節楉矢方來貢雕弓巳載櫜英威揚絶漠神算盡臨洮虜款塞西戎畏威已上四句奉述北赤縣陽和布蒼生雨露膏野平唯有麥田闢又無蒿禄秩榮三事功勲乏一毫寢謀慙汲黯秉羽貴孫敖若遊􅀇圃歡如享太牢輕生何以報祗自比鴻毛李文饒文集卷第二十
