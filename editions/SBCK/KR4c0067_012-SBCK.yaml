body:
  text: 雜狀論儀鳯以後大臣褒贈狀論杜元頴追贈二状論吐蕃維州城副使悉怛謀狀論敕楊嗣復等三狀奏張仲武寄回鶻生日駞馬狀薦胡震狀論河東等道加俸給狀論淮南五道置逰弈舩狀論兩京及諸道悲田坊狀論儀鳯以後大臣褒贈狀故中書令郝處俊右儀鳯元年八月高宗􅀅傳位於天后處俊對曰天下者高祖太宗之天下也非天皇之天下也天皇只合謹守宗廟傳之子孫誠不可持國與人有􅀻於天后其事遂止處俊後子孫為酷吏所害故文昌右相岑長倩右天授初鳯閣舎人張嘉福與王慶之等率數百人連名上表請立武承嗣為皇太子長倩與地官尚書格輔元竟不署名以中宗在東宫不可更立武承嗣言詞切直仍責上書者遣散為承嗣所害故御史大夫同鳯閣鵉䑓平章事格輔元右張嘉福請立武承嗣為皇太子天后問輔元輔元固稱不可為武承嗣所害故右衛將軍李安靖右天授年王公百僚皆勸革命安靖獨義形於色及被收下獄來俊臣詰其反狀安靖謂曰以我是唐家老臣湏殺任殺若問其謀反實無可對為俊臣所害故贈越州都督徐有功右當天后革命之初宗室英賢將相舊老忠於國者相継受誅徐有功自司刑丞累遷至司刑少卿數議大獄務在平恕凢所濟活者數百家前後奏雪枉破家者三經斷死而執志不渝兼朙玄宗外祖母龐氏之􅁈開元中贈越州都督就第吊祭贈物三百叚一子官就第一作就家兼明一作兼雪以前臣等伏見元和以來禇遂良狄仁傑張東之等子孫累有恩制授惟此數家未􅂪甄錄望各訪求子孫承嫡者特授一官如先未有謚者各令有司定謚如無子孫特與追贈所貴百代之下再振清風海内忠良無不感厲未審可否吏部狀准制請復舊官爵故循州司馬杜元頴二狀右臣等商量杜元頴雖失於馭遠致蛮宼內侵然握節嬰城舎生取義圍觧之後懲貶不輕但以蛮夷之情不可開縱若為之報怨以快其心則是不貴王臣取笑戎狄漢景所以聞鄧公之說恨鼂錯之誅元頴長慶之初􅈡居宰弼㓗㢘畏法忠藎小心雖無光赫之名頗著直清之稱既逄昌運合與申􅁈望却還舊官階等仍追贈右僕射未審可否第二狀奉宣令更商量奏来者右臣等商量比聞外議皆以元頴不能綏撫南蠻又無備禦責此二事以為愆尤臣等究其情由實有本末縁韋臯乆在西蜀自固兵權邀結南蠻為其外援親昵信任事同一家此時亭障不修邉防罷警若後人加置一卒繕理一城必有異詞便乖隣好自武元衡以後三十餘年戎備落然不可獨責元頴蠻退後京城傳說驅掠五萬餘人音樂伎巧無不蕩盡緣郭釗無政都不勘尋臣德裕到鎮後差官於蠻經歴州縣一一勘尋皆得来名具在案牘蠻共掠九千人成都郭下成都華陽兩縣只有八十人其中一人是子女錦錦雜劇丈夫兩人醫眼太秦僧一人餘並是尋常百姓並非工巧其八千九百餘人皆是黎雅州百姓半雜獦獠臣德裕到鎮後移牒索得三千三百人兩畨送到與監軍使於龍興大慈寺㸃閱並是南界蠻獠緣朝廷寵待如舊從此蠻心益驕今西川節將惟務姑息臣等所以薄元頴之過謂合追榮頻承顧問不敢不縷悉聞奏况元頴殁後五經大赦下位卑官皆得追復官爵倘聖㫖以贈與為優望只准赦文却還舊爵其贈官落下未審可否論太和五年八月將故維州城歸降准詔却執送本蕃就戮人吐蕃城副使悉怛謀狀右臣頃蒙先朝授劍南西川節度使其悉怛謀雖是吐蕃酋長乆樂皇風將彼堅城降臣當道臣差行維州刺史虞藏儉便領兵馬入㨿其城飛章以聞先帝驚喜其時與臣仇者望風疾臣􅑈興疑言上罔宸􅃪以為與吐蕃盟約不可背之必恐將此為詞侵犯郊境遂詔臣却還北城兼執送悉怛謀等令彼自戮復降中使迫促送還昔白起殺降終于杜郵致禍陳湯見按是為郅支報仇感歎前事愧心終日今者幸逢英主忝被台司􅂺敢追論伏希省察且維州據髙山絶頂三靣臨江在戎虜平州之衝是漢地入邉之路初河隴盡沒唯此州獨存吐蕃潜將媍人嫁與此州門子二十年後兩男長成竊開壘門引兵而入遂為所㓕號無憂城從此得併力於西邉更無虞於南路慿陵近甸旰食累朝貞元中韋臯以經略河湟此城為始盡銳萬旅急攻数年吐蕃愛惜既甚遣其舅論莽熱来救雉堞髙峻臨衝難及於層霄鳥徑屈蟠猛士多麋於􅓓石莫展公輸之巧空擒莽熱而還及南蛮負恩掃地驅刼臣初到西蜀衆心未安外􅀭國威中緝邉備其維州熟臣信令乃送款與臣臣告之以湏俟奏報貴探情偽其悉怛謀等尋帥城兵并州印甲仗塞途相繼空壘來歸臣即大出牙兵受其降禮南蠻在列莫敢仰視况西山八國隔在此州比帶使名都成虛語諸羗乆苦畨中徴役願作王人自維州降後皆云但得臣信牒帽子便相率内屬其蕃界合水捿雞等城旣失險阻自湏抽歸可减八處鎮兵坐􅀵千餘里舊地臣見此有莫大之利為恢復之機所以靣許奏聞各加酬賞臣自與錦袍金帶顒俟朝㫖且吐蕃維州未降以前一年猶圍逼魯州以此言之豈守盟約况臣未嘗用兵攻取彼自感化来降又沮議之人豈思事實犬戍遲鈍土曠人稀每欲乗秋犯邉皆湏数嵗聚食臣得維州逾月未有一使入疆自此之後方應破膽豈有慮其復怨鼓此㳺詞臣受降之初指天為誓寧忍􅀅三百餘人性命棄信累表陳論乞垂矜舎答詔嚴切竟令執還加以體被三木輿於竹畚及􅀅即路􅁈呌嗚呼􅀅吏對臣無不隕涕其部送者更遭蕃帥譏誚云既以降彼何湏送来乃却􅀅此降人戮於漢界之上恣行残忍周固携離至乃擲其嬰孩承以槍槊臣聞楚靈誘殺蠻子春秋明譏周文􅀵送鄧叔簡冊致貶况乎大國負此異族塞忠款之路快㐫虐之情從古以來未有此事伏惟仁聖文武至誠大孝皇帝陛下振睿聖之宏圖得懐猍之上策故南蠻申請朝之願北虜效欵塞之誠臣實痛惜悉怛謀等舉城向化觧辮歸義而未加昆邪之爵不賞庶其之功翻以忠愛屠為仇讐所快身遭此酷名又不彰軄由愚臣䧟此非罪雖時更一紀而運屬千年臣所以具陳根本不憚繁細冀蒙睿鍳追奬忠魂伏乞宣付中書各加褒贈冀華夷感德幽顕伸􅁈警既往之倖心激􅀅來之峻節臣德􅁉無任懇願之至謹録奏聞伏候敕㫖論救楊嗣復李珏陳夷直二状右臣等聞向外傳說紛然陛下皆遣中使未測其由臣等相顧憂惶不知死所嗣復等所渉論實負聖朙臣等所以顕書其罪不為末减只望上於竄逐用戒群邪古人稱刑人於市與衆共棄陛下若以嗣復等罪狀必不可容伏望且降使臣就彼鞫問待得其罪顕戮不遲如便遣使必貽後悔文宗只緣貶宋申錫更不按問至今人以為􅁈臣等於嗣復等實無情故所利者宗社所惜者聖朙不欲令一事駭􅃪失天下之望若使四方􅀅相或以此為詞臣等避罪不言無以塞責伏望陛下特回宸慮下納愚忠臣等餘年方敢自保陛下若以臣等事君不盡情渉容奸先罪臣等實所􅅴分􅂺陳肝血不避嚴誅不任懇切兢皇之至謹俯伏待罪望速降敕㫖第二狀右臣等適以有狀論奏未奉聖㫖今向外之心驚駭不知所為臣等若茍務偷安不更冒死陳奏必恐旬月之後人情皆以為􅁈陛下此時追悔無及臣等昨者商量之初只以嗣復等所渉議論不可令在藩鎮止於貶責足以塞辜如更過於此實摇動天下之心必損聖朙之德如以臣等情渉顧望伏望先罪責臣實所􅅴分臣等專在中書伏望特開延英賜對得靣陳肝血死無所恨第三狀右臣等適再已陳奏未奉聖㫖伏見貞元初宰臣劉晏緣德宗在東宫時渉動摇之論竟以此坐死旋則朝廷中外皆以為􅁈兩河不臣之地悉恐亡惧德宗尋亦追悔官其子孫近則宋申錫渉交通藩邸貶官文宗尋又追悔至于流涕如嗣復等螻蟻之命至細至㣲特賜矜全必彰聖德天下臣子孰不上感天慈不爾恐四海人情自此憂惧臣等亦兢危不暇無以禆􅂇聖朙伏望特開延英賜臣等靣陳血誠以安中外如䝉聖慈納臣等愚懇伏望更重貶官所冀人心􅁢愜張仲武􅀉回鶻生口駞馬狀右臣等􅃇讀實錄不至遺忘伏思累聖以来未有此例謹按左傳諸侯不相遺俘昔魯受齊俘見譏左氏諸侯尚為非禮况在台臣臣等忝備鈞衡湏謹䋲墨若苟受􅀻遺不守舊章則何以上戴聖君儀刑百辟伏望聖恩盡許却還從此便為故事仍望許臣與一書報荅令其深諭國體其書草續撰進上以聞前試宣州溧水縣尉胡震右胡震博通六經華皓一志家在海郡筋力未衰臣童㓜之時於震受業豈謂年逾四紀位列三公雖自君恩亦因儒訓臣伏以元和二年前􅀭州士曹􅂙軍薛玄造緣與臣亡父授經具表論薦憲宗授越州諸暨縣令臣幸因家門舊事􅂺敢薦聞伏希聖慈特受浙東管內一官所冀臣報其舊恩獲繼先志既顕蓽門之士實為儒者之榮臣不任懇欵兢皇之至謹錄奏聞伏􅃪敕㫖奉宣卿官至將相不忘本師朕深所嘉歎冝依所奏論河東等道比逺官加給俸料狀右河東等道或興王舊邦或陪京近地州縣之軄人合為樂只緣俸祿寡薄官同比逺元和六年閠十二月十二日及元和七年十二月二十四日敕河中鳯翔鄜坊邠州易定等道令户部加給俸料錢共當六萬二千五百貫吏曹出得平㽞官數百員時議以為至當自後訪聞户部所給零碎兼不及時觀察使以為虚折皆别將破用徒有加給不及官人近地好官依前比逺伏望今日以後户部却與實物仍及時支遣諸道並委觀察判官專判此案随月加給官人不得别將破用如有違越觀察判官逺貶觀察使奏取進止又選人官成後皆於城中舉債到任填還致其貪求罔不由此其今年河東隴州鄜坊邠州新授比逺官等望許連狀相保户部各借兩月加給料錢至支給時除下所冀初官到任不帶息債衣食稍足可貴清㢘請淮南等五道置遊弈􅊑狀淮南令出三百人縁疆界闊逺請浙西宣歙江西鄂岳百人各岀二右訪聞自有還僧以来江西劫殺比常年尤甚自上元至宣池地界商旅絶行緣所在長吏掩閉道路頗甚怨嗟望每道令㨂前件人解弓弩及諳江路者每一百人置遊弈􅀅一人湏清白強幹稍有見會者􅂶如法造遊奕􅊑船五十隻一百人分為兩番長湏在江路来往淮南遊弈至池州界􅈡浙西遊弈至宣州界􅈡江西遊弈至鄂州界􅈡常湏每月一度於界􅈡交牌各知界内平安申報本使其下畨人便於㳂江要害處置营不得抽歸使下其糧餉春冬衣使司差人就營􅀁支給如三度以下擒捉得賊委使司超與軄名其官健以下便以賊贓物賞給務令優厚如兩度有賊不覺察遊弈將科責差替如容縱賊盜不問有贓無贓並委本道差人所在集衆决殺如賊大叚巢穴去處仰数道計會一時掩捉倘去根本軍將授官酬賞所貴鄰接之地同心叶心江路盗賊因此斷絶臣等今月二十五日已於延英靣奏伏􅀩聖恩允許未審可否論兩京及諸道悲田坊右䘏貧寛疾著於周典無告常餼存於王制國家立悲田養病置使專知開元五年宰臣宋璟蘇頲奏所稱悲田乃関釋教此是僧尼軄掌不合定使專知請令京兆按此分付其家玄宗不許至二十二年十月斷京城乞鬼悉令病坊􅀵管官以本錢􅀵利以給之今緣諸道僧尼盡以還俗悲田坊無人主領必恐病貧無告轉致困竆臣等商量緣悲田出於釋教並望更為養病坊其兩京及諸州各於子錄事耆夀中㨂一人有名行謹信為鄉閭所稱者專令勾當其兩京望給寺田十頃大州鎮望給田七頃其他諸州望委觀察使量貧病多少給田五頃三二頃以充粥飯如州鎮有羡餘官錢量與置本􅀵利最為穏便若可如此方圓不在更給田之限各委長吏處置訖聞奏李文饒文集巻第十二
