body:
  text: 評史夷齊論三良論張辟疆論爰盎以周勃爲功臣論漢昭論漢元論荀恱論高祖武宣論荀恱哀王商論張禹論三國論羊祜留賈􅂶論宋齊論夷齊論昔夷齊不食周粟餓于􅈡陽之下仲尼稱其仁孟軻羙其德孟子􅁛伯夷聖人之清者盖以取其節而激貪也所謂周粟者周王所賦之禄是也諌而不從不食其禄可矣至於聞淑媛之言輟飱􅅔蕨斯可謂不智矣夫􅅔蕨者元氣之所彂生四時之􅀁順成日月之所燭風雨之所育周焉得而有之㢤􅀂以粟者周人之播殖則夷齊得非周人乎反覆其道盡未當理然夷齊之行實誤後人於陵仲子慕夷齊者也乃至不義其兄之禄㓗則㓗矣仁豈然㢤厥後商洛四友畏秦之酷避秦之禍豈止㓗其身而巳然飱紫芝以爲糧飮清泉以爲􅄴終老南山以養其夀斯可謂仁智兼矣三良論秦穆之殺三良詩人刺之矣春秋譏之矣今不復議唯三良許之以􅂮而前代無譏何也且臣道莫􅂋於咎繇孝友莫盛於周公咎繇尚不殉於舜禹二后周公尚不殉於文武二王三良詎可許之死乎如三良者所謂殉荣樂也非所謂殉仁義也可與梁丘㨿安陵君同譏矣焉得謂之百夫特㢤昔荀息許􅀳献以言􅁇之以死君子猶歎斯言之玷不可磨也豈得以生同荣樂殁共埃塵以爲忠乎晏平仲言君爲社稷死則􅂮之斯言得之矣自周漢迄於巨唐殺身成仁代有髦傑莫不􅂋一身之義烈未有繋一國之存亡唯紀信乗黃屋以誑楚赴丹熖而存漢数千年間一人而巳漢􅍈四百繇此而興余謂漢祖封建紀氏宜在蕭曹之上報德木稱良可悲也張辟􅆠論楊子羙辟強之覺陳平非也􅀂以童子膚敏善揣吕氏之情竒之可也􅀂以反道合權以安社稷不其悖㢤授兵産禄幾危劉氏皆因辟強啓之向使留侯尚存必執戈逐之􅀅爲戮矣觀高祖遺言吕后制其大事可謂謀無遺䇿矣以王陵有廷諍之節置以爲相謂周勃堪􅀉託之任令本兵柄况外有齊楚淮南磐石之固內有朱虚東牟肺腑之親是時産禄皆匹夫耳吕后雖心不在哀􅀅相何至危惧必當􅁨傷不食自促其夀豈能爲􅀅相之害㢤高祖曰非劉氏而王者天下共撃之此慮屬吕宗矣何可背之厥後稱制八年産禄之封殖固矣􅀂平勃二人溘先朝露則劉氏之業必歸吕宗及吕后之殁刼􅐱商以紿吕禄計亦窘矣周勃雖入北軍尚不敢公言誅諸吕豈不艱㢤頼産禄皆徒􅀠之人非英傑之士儻才岀於世豈受其紿􅀃㢤嗟乎與其圖之於難豈􅀂制之於易由是而言平勃用辟強之計斯爲謬矣留矦破産以報韓結客以徂秦招四皓以安太子所謂必伏義居正由此知不尚權譎明矣爰盎以周勃爲功臣論爰盎對文帝曰絳侯所謂功臣非社稷臣夫社稷臣者主在與在主亡與亡盎見勃自德其功有以激之也非至理篤論此言足以惑文帝聰朙傷仁厚之政俾其君有薄宗臣之意竟使周勃大功皆棄非罪見疑可爲長歎息也當吕后之世惠帝巳殂少帝非劉氏陳平用辟强之計􅁠王産禄絳侯􅀂不與之同心而制其兵柄必由此而階亂矣劉氏安危未可知也盎甘諸吕用事檀相王大尉本兵柄弗能王也然磨而不磷􅄺而不淄未常不心存社稷志在劉氏外雖順遜內守忠貞得不謂之社稷臣乎其後絳侯繋請室盎雖朙其無罪所謂䧟之死地而後生之徒有救焚之力且非曲突之義楊子偁盎忠不足而談有餘斯言當矣善㢤賈生之􅀃喻堂陛之峻高者難攀卑者易陵文帝感悟養臣下有節有以見賢人用心致君精識􅀂􅀽公者難與並爲仁矣盎唯有正慎夫人席塞梁王求嗣此二事守正不撓忠於守奉害錯之罪虐貫神朙安陵之禍知天道不昧矣漢昭論人君之德莫大於至朙朙以照奸則百邪不能蔽矣漢昭帝是也年十四而知燕王書詐後有譛霍光者上􅂺怒者敢有僣毁者坐之周成王有慙德矣高祖文景俱不如也成王聞管蔡流言覩召公不􅀃遂使周公狼跋而東鴟鴞之詩作矣漢高聞陳平去魏背楚欲捨腹心臣漢文惑季布使酒難近罷歸股肱郡疑賈生擅權紛亂欲踈賢士景帝信讒誅鼂錯兵觧遂戮三公所謂執狐疑之心来讒賊之口使昭帝得伊吕之佐則成康不足侔矣惜㢤霍光不學亡術未稱其德然輕徭薄賦與人休息匈奴和親百姓􅂶實議塩䥫而罷榷酤任忠臣之效也􅅻弱冠而殂功德未盡良可痛矣漢元論漢元帝習武帝游宴後庭又隆好音樂與弘㳟石􅂋圖議帷幄之中進退天下之士史臣賛曰􅄖游不㫁漢宣之業衰焉余以班固之言未盡其癖盖懦而不才權移所嬖非不㫁也夫帝王者天也天以剛徤爲氣粹精爲體氣剛而徤則三光不昏軆粹而精則四氣不亂剛也者不息之謂也故權衡獨運四時不忒粹也者不雜之謂也故乖氣消散隂陽不謬􅀂運動不在於權軸鎔鑄不由於太冶蕩蕩上帝復何爲㢤書曰天聰朙自我民聰朙又曰天視自我民視天􅃪自我民􅃪豈尭舜之時上下皆公讒􅀃不行人與其其聰朙㢤豈幽厲之君上下盡邪讒言相蔽人不與其聰朙㢤元帝自稱􅁋亂之君各賢其臣令皆覺悟天下安得危亡之君元帝盖自以㳟􅂋爲賢而任之不疑也荀恱論高祖武宣論荀恱論畧曰高帝天下初起庻事草創文帝躬行玄黙遂至昇平而古典未備制度多􅆣武帝內修文學外耀武威而不盡其術不克其終宣帝任灋審刑採覈名實而不用儒術理化不成歴数三代以及元帝曰崇尚儒業從諌如流引班固賛賔禮故老􅄖游亮直又曰貢薛􅅊匡迭爲宰相其㫖以爲專用儒術莫盛於此班固荀恱皆文雅之士以元帝好儒徴用儒生故以玆爲羙而深罪石􅂋痛心泣血稱詩人投􅂌豺虎嫉之甚也異乎余之所聞也任㳟􅂋始於宣帝當宣帝之世石􅂋豈能􅈥其大業㢤則知􅁖不在於􅂋矣蕭望之周堪皆廊廟之噐有師傳之恩石􅂋所忌􅆸而不用朋龍上書遂致于理其後劉向􅆸錮張猛自殺豈得謂之􅄖游亮直乎賈􅂢之京房雖不終其身亦皆英特雋才道術竒士於元帝可謂忠矣亦因諧而死惑於讒邪豈得謂之牽於文義乎於讒邪則不㫁於髦俊則用灋亦不得謂之􅄖㳺矣貢薛雖能忠諌止於諷諭㳟儉未嘗禦姦觸邪矣􅅊匡從容守位未嘗犯顔干色矣所以得乗時而進乆安其位昔桀紂殺一龍逢比干而得天下之􅁖歸焉桀紂以拒諌而殺之其悖巳甚元帝以信讒而殺抑又甚焉王業既衰至成哀陵替􅅻三世而王莽篡奪而宣帝稱亂吾家者太子也知子莫􅀂父信㢤是言荀恱哀王商論荀恱論曰夫獨智不用於世獨行不蓄於時昔人所以自退猶不得自免是以離世深藏又曰以六合之大一身之㣲而匹夫無所容焉豈不哀㢤余三復斯論澘然出涕仲尼聖人也猶羙顔子之行藏與我同志稱寗武愚不可及歎􅕋瑗卷而懐之則聖人遵養時晦可謂至矣以仲尼之德足以塞叔孫之毁以仲尼之仁足以免陳蔡之困以仲尼之智足以避斥人之辱以仲尼之道足以容魯哀之世而逼迫多惧殆於危亡由是思之無非命也况王商者㢤世人皆以貌􅆍質薄爲数竒敦厚碩大爲多福樂昌威重真漢相容貌懾單于而遘愍於時遇讒而殞豈命之否也龍虎不能免於患及命之泰也蛭蟥皆得保其生余又聞之國之衰也忠賢先去故管仲知隰朋不乆而齊國亂范爕令祝宗祈死而􅀳主􅁨伍胥戮而夫差亡汲黯出而劉安悖徒歎新都之奪孰救樂昌之禍昔秦繆以三良爲殉君子曰秦繆之不爲盟主也宜㢤棄善人之謂也張禹論夫社稷之計安危之機人君不能獨㫁者必啓於所敬之臣然臣有忠邪時有險易交有淺深義有厚薄范睢山東之匹夫也入虎狼之秦履不測之險可謂交踈義薄矣而能尊昭王去穰侯開秦覇業之基以安固後嗣可謂忠於昭王矣夫能獨㫁者英主也古人言謀之欲多㫁之在獨盖爲此矣天有震雷之怒龍有逆麟之恨所以人君在於能㫁耳然親戚之際恩義之重㫁之於已可也張敞所謂朙詔以恩不􅃪群臣以義固爭而後許而令朙詔自親其文非䇿之得也漢文帝誅薄昭㫁則朙矣於義則未安也周宣餞申伯有孔碩之詩􅀳康送文公興如存之感况太后尚存唯一第薄昭㫁之不疑非所以慰母氏之心也漢成帝車馬至張禹第辟左右親問禹以天變禹以年老子弱與曲陽有􅂩乃言新學小生亂道誤人主宜無信用帝雅信愛禹山此不疑王氏致漢室之亡成王莾之篡皆因禹而彂可謂漢之賊也國之妖也雖虵闘於鄭鷁退於宋妖不甚於禹矣朱雲欲以上方斬馬劒㫁侒臣頭斯言當矣後代有􅁼於此者其臣可以范睢爲師表張禹爲鍳戒三國論魏蜀吳三分天下而亡有先後非形􅀔有輕重積累有厚薄察其政柄所歸則亡之先後可知也蜀政在於黃皓皓􅀠人也內不能修武侯之􅃇典外不能制姜維之黷武紀綱日壊君子不服所以先亡也魏自朙帝之後政歸仲逹齊王已䧏唯守空宫亡之淹速繋於師昭之志􅀅移神噐之重湏服天下之心未立大功亦不敢取所以蜀㓕而魏亡也孫皓雖驕奢極欲殘虐用刑而自專生殺之柄不牽惟墻之制運盡天亡而後夷㓕由是而知人君不可一日失其柄也如神龍之脫深泉震雷之無烟氣威靈既露人得制之􅃽濟覩魏文帝與夏侯尚詔曰作福作威爲亡國之言所謂柄者威福是也豈可假於臣下㢤後代覩三國之事可不戒惧㢤羊祜留賈充論任愷􅁃尹庚爲河南尹名犯廟諱字又非使所以不書山以賈􅂶邪僻欲其踈逺勸􅀳武令西鎮長安唯羊祜宻表留之祜豈恱賈􅂶者㢤良以愛君體國彂於至誠耳􅀳氏傾奪魏國初有天下其􅀅相大臣非魏之􅃇臣即其子孫所􅀉心腹唯賈􅂶而巳􅂶亦非忠於君者自以成濟之事與􅀳室當同休戚此羊祜所以願留也昔漢高不去吕后亦近於此漢高嬖戚􅁎愛如意思其乆安之計至於悲歌不樂豈不知除去吕后必無後禍况吕后年長有過稀復進見漢高棄之如去塵垢實以惠帝闇弱必不能自􅄃權綱其將相皆平生故人俱起豊沛非吕后剛強不能臨制所以存之爲社稷也後世翼戴其君者得不念於此㢤宋齊論宋齊以䧏􅁇軆承祧者君德寖㣲王道陵替纉緒之初如革大運䧏宥觧網以恱衆心仁義之風薄骨肉之情􅆸前史評之詳矣然政未得中改之可也如􅃓之高下者抑舉琴瑟之不調者更張此亦天之道也豈獨人事㢤唯用其罪人不可甚矣天下之􅁖一也古人言一心可以事百君百心不可事一君豈有不忠於前朝而能忠於後王者毁泉䑓春秋之所譏先儒之所惡宋齊之君有一于此必爲羙政泉䑓見妖尚不可毁况無妖者乎燕人之思召伯甘棠勿翦楚人之懐叔子望碑堕淚彼人臣也猶見思􅀂此雖時移政改莫匪􅃇臣若伯益賛禹稱大舜之德曹參事惠帝守蕭何之灋魏文帝初受漢禪群臣皆賛魏德唯衞臻獨稱漢羙文帝曰天下之珍當與山陽共之爲人臣者罔念於此可謂有百心矣李文饒外集卷第一
