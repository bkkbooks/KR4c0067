front:
  text: 李文饒外集卷第一窮愁志并序予頃􅀊吏道所拘沉迷簿領今則幽獨不樂誰與晤言偶思當世之所疑惑前賢之所未及各爲一論庻乎箴而體要謂之窮愁志凢三卷篇論四十九􅈡銷此永日􅊃以觧􅁨地僻無書心力乆􅆸每懐多聞之益頗有􅆣疑之恨貽於朋友以俟箴䂓
  hash: sha256:d902143c72c8f86a609f9eb6253aae699c12da522b42a842af3b2e8d6ac5d02f
