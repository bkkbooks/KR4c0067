body:
  text: 進獻進上尊號玉册文狀進上尊號玉册文狀進真容讃狀進幽州紀聖功碑狀進􅃛戞斯朝貢圖傳狀進侍宴詩一首狀進新舊文十卷狀進瑞橘賦狀進西南備邉狀辭讓辭官表讓太尉第二表連批荅讓太尉第三表讓官表讓司空後舉王起自代狀加司徒請停册禮狀請改封衛國公狀爲星變陳乞狀罪成功清和六合雖有鴻筆猶難措辭况臣從吏多年文業久廢克勵疲病莫副殊知祗荷明恩倍懐兢惕謹以撰訖謹連進上不任榮抃惶越之至謹録奏聞伏候敕旨進真容讚狀奉宣令臣撰者臣㓜習儒風莫能勵己長從吏役無所成名雖嘗忝禁林獲掌綸命學既慙於刻鵠文有愧於雕蟲陛下假以恩光常加寵飾賜令撰述益荷殊榮但以談天者豈測其高酌海者莫知㝠廣聖功神武睿德文思雖欲賛􅀭實撰不逮今巳撰訖謹連封上塵黷嚴扆無地自容不任兢惶榮抃之至進幽州紀聖功碑狀奉宣令臣撰述者北狄强悍勇於四夷前代聖王莫能制伏昨者囘鶻雖乗危蹙勢巳内侵豺狼之師尚餘十萬陛下神武雄㫁智出萬方震天威以霆聲碎獯戎而瓦解武功盛烈高頴百王豈比周穆犬戎之征荒服不至漢武馬邑之詐羣帥無功將垂耿光宜命鴻筆臣學藝荒淺久病殘衰紀軒后之功徒知竭思叙唐堯之德終愧難名採其功狀稍似摭實今巳撰訖謹連進上輕黷宸扆不任惶越謹録奏聞進頡戞斯朝貢傳圖狀臣二十一日於延英面奏吕述等准敕訪黠戞斯國邑風俗編為一傳余修撰巳成稍似詳備臣伏見貞觀初因四夷來朝太宗令閻立本各寫其衣服形貌為職貢圖臣謹令畫工注寫注吾合素等形狀列於傳前兼臣不揆淺陋輒撰傳序所兾聖明柔逺之德高於百王絶域慕義之心傳於千古輕黷宸嚴伏増兢惧謹封上進進侍宴詩一􅈡狀伏以六合清和四夷慕義芳春令節錫宴羣臣見膏露之晞陽喜薰風之解愠萬心歡樂累日忘疲伏惟陛下睿德日新文章天縱詞高黄竹思縟白雲含毫而瑞景􅀭光摛藻而非烟動色臣早司綸綍嘗忝内庭雕蟲薄技實感憲宗穆宗文宗知奬不測不揆淺薄輒進詩一􅈡輕黷宸嚴伏増惶惕謹随狀奉進進新舊文十巻狀四月二十三日奉宣令狀臣進來者伏以􅀭雄云童子雕蟲篆刻壯夫不為臣往在弱齡即好辭賦性情所得衰老不忘屬吏職嵗深文業多廢意之所感時乃成章豈謂擊壤庸音謬入帝堯之聴巴渝末曲猥蒙漢祖之知跼蹐慙惶神魂飛越謹録新舊文十巻進上輕黷宸嚴進瑞橘賦狀今月十九日聖恩賜臣朱橘三顆者伏以逺自湘山移根清禦䝉雨露之渥澤比日月之休光始發素荣俄成丹實誠宜奉金華之宴助玉食之甘豈謂恩及賤微獲觀嘉瑞臣久參綸命常効雕蟲仰荷皇慈􅂺獻小賦輕黷宸扆倍積兢惶臣又伏見􅀇宗朝種柑結實宣付史舘祖宗故事敢不奏聞其賦謹随狀上進臣不任感恩踴躍之至謹奉狀以聞進西南備邊録狀伏以犬戎歴代為患國之仇讐南蠻自經負恩常懐反側西蜀兩路實繫安危臣頃在西川講求利病頗収要害之地實盡經逺之圖因著西南備邊録十三巻臣所創立城鎮兼畫小圖米塩器甲無不該備昔蕭何􅀵睿覽第四巻敘維州本末尤似精詳所兾聖慈知臣竭力奉公盡心立事所至之地不敢苟安輕黷宸嚴伏増戰越讓官表臣某言伏以臣之事君猶子之事父若情有所隠志在茍安不自披誠即為冒寵臣某誠皇誠恐頓首頓􅈡伏惟仁聖文武至神大孝皇帝去邪用相有大舜之功柔逺固存臻漢宣之理故得王道正直海内邊朔底寧干戈永戢文朙之化方致雍熙螢爝之光所宜自息豈敢虛矯上負君親臣始自孩童常多疾病逮於壯嵗猶甚虛羸屬亷問江南荏苒八嵗移鎮巴蜀􅈡尾三年暑濕所侵遂成沉痼患風毒脚氣十五餘年服藥過虛又得渴疾毎日自午巳後暝􅅭失常形骸僅存心氣俱竭唯恐晩歸私第盡道途臣伏見國史岑文本受委既深形骸頓竭太宗嘗謂左右知其將盡韋處厚積以虛憊不早退身侍立之時仆於玉堦之下臣竊以二臣為戒不敢遑安所兾陛下􅀪太宗之仁不軫念於無及臣得延處厚之數免自促於明時伏望陛下察臣懇誠矜臣衰耗得罷繁務退守州行稍獲安閑漸自頥養一二年後或兾有瘳臣儻餘齡尚存筋力未朽必當灰身粉骨上報聖慈不任祈恩之至謹奉表批答不録讓太尉第二表録同日更進此表第一表舍人撰不臣某言臣今日巳進讓表驚寵之心不遑啓處再陳恐懇實惧為煩臣某中謝伏見國初巳來授此官唯有匕人尚父子儀猶以懇辭而免近者智興載義皆超拜太傅太保只縁朝廷重惜此官裴度守司徒十年竟不遷授以臣僣越必致顛擠况臣既無汗馬之勞涓塵莫効又有負薪之􅍚曠廢至多唯陛下寵以羙名榮皆過實而臣靦顔自處竊位偷安非止獲朝野之譏實恐受神明之譴輒披丹款猶兾聴從伏望息罷新恩且守舊秩不任祈恩迫切之至謹再奉表以聞臣某云云省表具知我文祖有文貞房社左右前後若日月照臨緝熙帝圖肇􅂋天禄異代同德建勲垂休克相朕躬光集大命功居第一節貫在三神開智謀識洞蓍蔡用䕫龍之道振堯舜之風懸衡不欺朗鑑能燭乃者葷狁狂蹷參剪伐之權頑童侵虐啓平殄之䇿替我獨㫁挺身羣疑子房潛運於先機張華堅執於必克制變兵事訂謨國經晝則共議公朝夜多不寐私室輝發綸綍揣摩典章弼亮五年風雨一志剛徤不倚謙尊益光見呉芮蕭何之心盡食蘖飲氷之節今邊烽息照兇首巳殱允賴疇咨克平夷夏特寵槐庭之拜俾崇鳯沼之榮巍峩三台耀映千古未為寵答繼有讓章體朕至懐宜㫁來表所謝知讓太尉第三表臣某言臣聞廟器不盈周公戒其必覆馬力巳竭顔氏知其必顛臣竊感之以憂以蹙臣某中謝昔子文避祿竟之逃死冶厪辭卿迫於惧禍伏以上公亢極本待勛臣其間或授時賢皆是元老臣既非􅂄艾又乏戰功奉宸筭而曽靡運籌假英威而未嘗推轂有何勞効䝉此殊荣夙夜自思至今戰汗伏見廣德二年九月十七日代宗受尚父汾陽王此官三讓而免至大歴十四年閏五月三日德宗再申前命重受尚父不許陳讓三載而終臣竊思尚父十五餘年得延光寵豈非牢讓而致隲所持昨者恭惟聖奬至深恩意加等秪受典册未敢固辭臣伏念齒髮雖彫心力猶扗實願贊陛下升平之運見萬方仁壽之期東封告成大典咸備然後散金娯老歸守丘園貪全盛時不忍自促所以再陳懇款上凟皇明竭至敬而不敢繁文陳至誠而不為飾讓心懇詞直庶獲聴從伏望特追新恩却守舊秩臣不任懇迫屏營之至省表具之褒德賞功禮經備舉疇庸答効國典攸存昔子儀以外止軍功所宜牢讓今卿以内匡時政非合固辭况道濟公忠才兼文武弼諧五載始終一心頃以虜寇初平纔息戈甲旋又潞童怙亂須議剪除唯卿竭誠與我同志晉武平呉之計全在張華漢髙鎮俗之謀誰先周勃所以舉兹寵秩用答元勛恨更無官以償忠節且三載考績猶進律以甄勞况五兵成功無超位而表異自予遷授非限常程式示恩榮允符公論是宜贊傑用佐經邦王祥之碩德當任楊秉之貞亷稱職未酬萬一無至再三勉服官常宜㫁來表讓官表批答不録臣某言臣聞道不欲盈􅀇祖之至誠人惡其上魯史之明規既以迫於愚衷敢慮動而生悔臣某中謝臣頃居宰弼獲戾於時既望汨以懐沙􅅴赴湘而溺死自謂永違白日莫覩青天雖文宗墜履不遺驟分圭瑞而微臣傷弓是惧常蹈春氷伏值陛下大朙初升臨照四海知臣常忝禁署逮事穆宗念巳廢之舊物憫既傷之弱羽召自滄海擢授黄閣明德每覆其瑕疵至仁常矜其衰疾參贊萬務倐巳六年裘冕禋郊再覩配天之禮干戈問罪三見拘原之功所謂百生遭逢千載際㑹徵倚伏之數惟恐罹灾思存亡之幾所宜知止非慕三公乞骸之請敢希二疏解組之風忍去盛時自貽深戚實以久嬰沉痼年漸衰遅宗族孤單兄弟衰落先臣松檟近在東國家屬數人皆居上國不欲逺離京闕只願歸老田園伏望陛下深鍳孤忠特遂丹懇察臣上報聖德不必須在鼎司改授閑官優游暮齒所兾自知稅駕無李斯之歎音便保懸輿復韋賢之故事進退惶灼伏地涕零不任兢惶感切之至謹奉表陳乞以聞臣某云云上司空後舉太常卿王起自代狀伏准建中元年正月五日敕常參官上後三日舉一人自代者昔東漢以陳蕃為三公其讓表曰不􅄽不忘率由舊章臣不如太常胡廣臣伏見前件官五朝舊老一代名臣孔門四科實居其􅈡臯繇九德無不備包足以燮和隂陽允叶人望當唐虞讓德之舉副陛下則哲之知伏望察臣至誠之非飾請所兾虞丘無蔽賢之咎臧文免竊位之譏謹録奏聞伏候敕㫖加司徒請停册禮狀臣伏見今月二十二日制書制授臣司徒仍令所司擇日備禮册命者臣竊位妨賢允宜黜免聖慈寛宥擢授中台跼蹐慙惶若臨泉谷伏以明庭授册上路乗軒豈可以靦冒之容再塵清廟不稱之服重列天衢為衆目之所􅅓致處士之横議臣且自愧况在周行人以伐叛之時所宜務簡炎蒸之候不可勞人伏見大和四年裴度受司徒平章事故辭册禮竟獲允從既有近例足得循守伏望陛下察臣懇款皆自至誠册命之禮特賜停罷臣不任請改封衛國公狀臣今日䝉恩進封趙國公承命哀惶不任感涕臣亡父先臣憲宗寵封趙國先臣與嫡孫寛中小名三趙意在傳嫡嗣不及支庶臣前年恩例進封合是趙郡臣以寛中之故改就中山亡祖先臣曽居衞州汲縣解進士及第儻家聖恩改封衞國遂臣私誠庶代受殊榮免違先志如䝉允許望賜帖麻施行臣不任悲懇屏營之至謹奉狀奏聞為星變陳乞狀臣某言伏以謫見于天以警在位稽於前史皆有朙徵臣某中謝臣才非時須量乖公器因縁門䕃遂沗華資出入蕃宣巳逾三紀早負素飡之責常愧周行老無黄髮之謀空竊髙位夙夜思省氷炭在心近伏見熒惑順行稍逼上相實惧天譴以致身災武德七年熒惑犯左執法右僕射蕭瑀遜位貞觀十五年熒惑犯上相左僕射髙士亷遜位國史之内此例至多臣人微才輕位忝上相倘冒恩寵猶自懐安忽至顛擠必傷􅀇化雖竭誠報國必不愧於明神盡禮事君志實貫於氷雪所慮物忌其滿天與之災跼蹐兢惶不知所㨿伏望聖慈察臣單緒海内孤根百口童䝉仰臣覆露一門宗祀須臣特免上公退歸私第所兾中衢擊壤復比於堯君舊里懸車不慙於漢相臣不任祗恩皇迫之至張仲武與臣書四紙内一紙信物數今古月曰仲武判官華封輿到臣宅送前件書并信物等巳聞奏訖臣素具懇誠實非飾讓臣登朝序垂二十年未曽為宰相撰碑所悉盖縁雕䖝薄伎巳忝榮名不願鬻文更受財貨比見文士或巳居重位或巳是暮年矻矻為文只望酬報臣心鄙耻所不樂聞大和中幽州刺史李載又撰碑歛取大過軍亂之際怨詞頗甚况今陛下聖明御㝢風教鼎新文德邁於羲軒武功高於周漢河朔節將皆竭忠誠尤宜示以典章令知法度臣忝居台􅉗過受殊恩若不守亷隅坐厚賂何以仰裨􅀇化表率庶僚倘以仲武之情不可全阻許臣量受一千匹巳是乖臣本心伏希聖慈鑒臣丹懇仲武書謹封進上臣不任云云再讓仲武寄信物狀右高品孟公度至奉宣聖㫖縁河朔體太令臣即受者伏以浩蕩之功生靈共載擊壤之内謳歌必歸昨者藩臣拜章願紀貞石臣謬當臣願獲聖功才力至㣲神武難備莫能相質空愧雕䖝豈敢廣受縑素増其蕪鄙虧於事體乖臣本心昨日進狀懇辭誠非飾讓實以文至淺陋巳慙黄絹之工取又不亷益昧素系之節愚衷上啓宸鑒未囘特降王人重宣聖㫖捧戴慙惧進退徬徨臣事君之心實無所隠終希允臣誠懇獲守典章使亷儉興行皇風遐暢謹再狀以聞臣不任云云李文饒文集卷第十八
