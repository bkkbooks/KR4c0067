body:
  text: 論朝廷大政等狀請尊憲宗章武孝皇帝為不遷廟狀宰臣等再議􅄈徽號狀宣懿皇太后祔陵廟狀第二狀第三狀附請立昭武廟狀請立東都太㣲宫狀請立東都太廟狀奉宣今日以後百官不得於京城置廟狀論侍講奏孔子門徒狀論朝廷事體狀請尊憲宗章武孝皇帝為不遷廟狀右臣等伏聞開成中文宗甞顧問宰臣欲褒崇憲宗功德其時宰臣莫能推順美之心明尊祖之義臣等至愚切􅀁歎息伏思國家受命二百二十五年矣列聖之功德區宇之廣大王化之盛興禮樂之備具過殷周逺矣而未有中興不遷之廟臣等􅀁以夙夜彂憤也禮祖有功宗有德夏之祖宗經傳無聞殷則一祖三宗成湯為始祖太甲為太宗太戊為中宗武丁為髙宗劉歆曰天子七廟苟有功德則宗之􅀁以勸帝者功德博矣故周公作無逸舉殷之三宗以勸成王漢景帝詔曰孝文皇帝德厚侔天地利澤施四海廟樂不稱朕甚惧焉其為孝文皇帝廟為昭德之舞以朙休德然後祖宗之功德施於萬代其與丞相列侯中二千石禮官具禮儀奏丞相申屠嘉等奏曰功莫大於髙皇帝德莫盛於文皇帝髙皇帝廟冝為帝者太祖之廟孝文皇帝廟冝為帝者太宗之廟天子冝代代獻祖宗之廟又漢宣帝詔夙夜惟念孝武皇帝躬履仁義選朙將討不服功德茂盛不能盡宣而廟樂未稱其議奏有司奏請尊孝武為世宗廟奏盛徳又始五行之舞天子代代獻此則子孫褒崇祖宗之朙㩀也自大寶以後兵宿中原强侯締交髖髀甚衆貢賦不入刑政自出包荒含垢以至於貞元德宗懲奉天之難厭征伐之事戎臣優以不朝終老于外其卒則以幕吏將校代之故長武城在王畿之内斥逐主將矣河中居股肱之郡坐邀符節韋臯因備邉之􅀔自擅靈関李錡竊煮海之資專制澤國而兩河蕃鎮或倉卒易師甚於奕棊或陸梁弄兵同於拒轍憲宗感祖宗之宿憤舉升平之典法始命將師順天行誅元年僇惠琳暨闢錡季年梟元濟及師道其他或折簡而召或執珪請覲獻其名城割其愛子不可遍舉豈有去天下之害不享其名致生人之安不受其報臣伏見元和初議遷廟之禮而史官偁中宗不得號中興之君凢非我失之自我復之謂之中興漢光武􅀳元帝是也臣等切思此議實􅀁未盡中宗朝自以政事多釁權移后妃􅀁以未得稱為中興恐議者復以此為疑夫興業之與隆道事實不同漢光武再造邦家不失􅃇物􅀳元帝雖在江左亦能纂緒此乃王業中興可謂有功矣殷髙宗躳行大孝求賢俾乂周宣王㣲而後興衰而復盛此乃王道中興可謂有德矣故詩云車攻宣王復古也宣王能內修政事外攘夷狄復文武之境土又烝民美宣王任賢使能周室中興焉又江漢美宣王能興衰撥亂命召公平淮夷又漢書宣帝賛曰功光祖宗業垂後嗣可謂中興侔德殷宗周宣之美若皆如漢光武􅀳元帝則殷宗周宣並不得稱中興矣臣等伏思任賢使能內修政事平淮夷之叛復祖宗之土皆憲宗有之􅀁謂隆道中興與殷髙宗周宣王漢宣帝侔德矣臣等敢遵古典請尊憲宗章武孝皇帝為百代不遷之廟上以昭陛下大孝之德廣貽謨之訓下以表臣等思古之憤申欲報之誠如合聖心伏望令諸司清望官四品以上尚書兩省御史䑓與禮官叅議聞奏謹錄奏聞會昌元年三月十一日司空兼門下侍郎平章事右僕射兼門下侍郎平章事右僕射兼中書侍郎平章事中書侍郎平章事奉宣卿等􅀁論至好待續施行其表留中不出宰相再議添徽號狀右奉批出已􅂪允許今欲頒下制命昭布萬方伏以軒屈崆峒堯期姑射未有不心遊於至道而能功濟於生靈暨漢之文景尊奉黄老理致刑措時偁太康開元中玄宗經始清宫追尊玄祖闡繹道要遂臻治平六合晏然四十餘年今者陛下蹈軒后之靈蹤修開元之故事進道不遺於尺璧澄心巳得於玄珠聖夀必過於殷宗景化方躋於漢代臣等􅀁上徽號義雖盡美意有未周今謹上尊號為仁聖文武章天成功神德明道大孝皇帝􅀁兾冠皇王之髙號盡臣子之至誠伏希聖慈容鍳丹懇謹錄奏聞伏候敕㫖樞密使稱中㫖欲得有道字所以奏攺宣懿皇后祔陵廟狀第二第三狀附奉宣宣懿皇太后祔光陵同玄宫及不移福陵只祔廟何者為便商量奏来右臣等伏以園􅃦已安神道貴靜光陵因山乆固僅二十年福陵近又修崇足彰嚴奉今若再因合祔湏啟二陵或慮聖靈不安未合先㫖又以隂陽避忌亦有􅀁疑不移福陵實合禮意伏以照臨在天光靈未遠合食清廟於禮無違足以申陛下大孝之心表先后昭配之德既遵舊典尤愜衆情臣等商量祔太廟不移福陵實為允便臣等不任感切之至第二狀奉宣宣懿皇太后祔廟事令更審商量奏来右臣等伏以陛下孝極因心感深追逺敬慎禮典彂於至誠臣等仰奉聖情旁詢物議經旬思慮敢不精詳並請依前狀只祔太廟不奉陵􅃦實為合禮謹再奏狀以聞謹奏第三狀宣懿皇太后祔廟事右臣等訪求典禮敢不詳慎伏以太廟合食非臣子􅀁議苟不由禮必為後代􅀁譏漢書云古人㩀正守順不敢􅀻其君如此之難也臣等若輕為献議不守禮經非惟上負聖德固亦自貽物論􅀁以前者附欽義承慶口奏假以太皇太后之意即於禮至順人無異詞制中云近因慶誕太皇太后追感先帝乆曠配食之禮便及先太后母德慈仁合配先聖陛下秪承聖㫖詔臣下行之於禮無違可爲後代之法若捨此商量便湏出於聖意降敇情禮至重實難措詞伏望陛下察臣等愛君之心約臣等秉禮之至特允􅀁奏必合群情臣等不勝懇切之至請立昭武廟狀孟州汜州縣髙祖太宗塑像右汜水武牢関是太宗擒世充竇建德之地関城東􅄘有二聖塑像在一堂之内伏以山河如舊城壘猶存威靈皆畏於軒䑓風雲還疑於豊沛誠冝百代嚴奉萬邦􅀁瞻西漢故事祖宗嘗􅀁行幸皆令郡國立廟今緣定覺寺例合毁拆望􅂑寺中大殿材木於東峰攺造一殿四靣兼置宫墻伏望號為昭武廟以昭聖祖武功之盛委孟懐節度使差幹事判官一人勾當修造緣聖像彩色頗巳故暗望令李石於東都差揀絶好盡手就加嚴飾初興功日望令東都差分司郎官一人薦告至功畢日别差使展敬未審可否奉宣今日以後百官不得於京城置廟狀右伏見禮記云君子將营宫室宗廟為先廏庫為次宫室為後又韋􅊮五禮精義對曰古之制廟必中門之外吉㓙大事皆告而行􅀁以親而尊之不自專也今令城外置廟稍異禮文書於史策必􅃜聖政伏以朱雀門至朙徳門凢有九坊其長興坊是皇城南第三坊使有朝官􅀻廟實則逼近宫闈自威遠軍向南三坊俗稱圍外地至閑僻人鮮經過於此置廟無所妨礙臣等商量今日以後皇城南六坊內不得豈􅀻廟其朱雀街緣是南郊御路至朙德門夾街兩靣坊及曲江側近亦不得置餘圍外深僻坊並無所禁􅀁貴不違禮意感恱人心臣等頻奉聖㫖有事許再三論奏􅂺罄所見庻禆聰朙謹具奏聞伏􅃸敕㫖論侍講奏孔子門徒事狀右今月十三日於延英殿陛下謂臣等云侍講稱孔子其徒三千亦可謂之朋黨臣等自元和以来甞聞此說幸因聖慈下問􅂺敢覼􅈁而言西漢劉向云昔孔子與顔回子貢更相稱譽不為朋黨禹稷與臯陶轉相汲引不為比周何則忠於為國無邪心也臣嘗以鯀共工驩兠與舜禹雜處堯朝共工驩兠則為黨舜禹則不為黨何者共工驩兠相與比周迭為掩蔽也如賢人君子則不然忠於國則同心聞於義則同志退而各自行已不可交以􅀻是以趙宣子隨會継而納諌司馬叔矦向比以事君不爲黨也公孫􅀪每與汲黯請問黯先彂之􅀪推其後武帝所言皆聴汲黯雖與公孫􅀪並進然庭詰云齊人少情譏其布被爲詐則知先彂後継不爲黨矣國史稱太宗甞與房玄齡圖事則曰非杜如晦莫能籌之及杜如晦至竟以玄齡之策此又同心圖國不爲黨也何者爲黨漢書稱朱慱陳咸相爲腹心背公死黨東漢周福房植各以其黨相傾議論相軋故漢朝朋黨始於甘陵二部及其甚也謂之鈎黨繼受誅夷以王制言之非不幸也魏朝何晏丁謐依附曹爽祖尚浮虚使有魏風俗由兹大壊此皆為朋黨也畧舉数節以朙其類至於歴代朋黨不可殫言仲尼知季路之不免子游識子張之未仁曾子罪卜商喪親無聞夫子罪宰我鑚燧為乆惡既不掩善固冝稱此又不為黨也班固稱周室既㣲由是列國公子魏有信陵趙有平原齊有孟嘗楚有春申抵掌而游談者以四豪為偁首於是背公死黨之議成守軄奉上之義􅆸矣此四豪者各有門客三千而謂之黨仲尼三千則不為黨盖仲尼之徒惟務仁義不以爵祿為貴四豪之門惟務譎詐常以勢力相髙今侍講欲以奔走權􅀔之徒攫挐名利之軰比方孔門上哲實罔聖聦臣未知元和以来􅀁謂黨者為國乎為身乎若以為國則隨會叔向汲黯房玄齡之道可得行矣不必聚黨成群以臣􅀚之今􅀁謂黨者進則誣善蔽忠附下罔上歙歙相是態不可容退則車馬馳驅唯務權勢聚於􅀻室朝夜合謀清美之官盡湏其黨華要之選不在他人隂附者羽翼自生中立者抑壓不進孔門顔冉豈有是哉陛下以此察之則奸偽自見臣恐更有小人妄陳此說􅂺舉事例庶禆聦明伏望陛下留臣此狀時賜覽閱􅀁兾小臣瞽􅀃免惑聖心臣不任懇激之至謹錄奏聞論朝廷事體狀右臣等每􅂪延英召對獲聞聖言常欲朝廷尊臣下肅此則是陛下深究為理之本伏以管仲古之大賢朙於理國其言可以為百代之法管仲云凢軍國之重器莫重於令令重則君尊君尊則國安故安國在乎尊君尊君在乎行令朙君察於理人之本莫要於令故曰虧令者死不從令者死五者死而無赦又曰令雖在上而論可與不可者在下是威下繫於人也自大和以来風俗大壊令出於上非之者在下此弊不除無以理國韋􅀪質􅀁論宰相不合兼領錢穀臣等敢以事體聞奏昔匡衡云大臣者國家之股肱萬姓􅀁瞻仰也明王所慎擇也傳曰下輕其上爵賤人圖柄臣則國家動摇而人不靜矣今韋弘質受人敎導􅂺献封章則是賤人圖柄臣矣臣等又以蕭望之是漢朝名儒重德為御史大夫奏云今嵗首日月少光咎在臣等上以望之意輕丞相乃下侍中御史中丞詰問又貞觀中監察御史陳師合上書云人之思慮有限一人不可總数軄太宗云此人妄有毁謗止欲離間我君臣流師合千嶺表又賈􅁩云人主之尊譬如堂群臣如陛衆庶如地故陛九級上廉逺地則堂髙陛無級廉近地則堂卑亦由將相重則君尊其􅀔然也如宰相有奸謀隠慝則人人皆得上論至於制置軄業固是人主之柄非小人􅀁得干議古者朝廷之士尚各守官業思不出位况韋弘質賤人豈得以非所冝言上黷朙主此是輕宰相矣後漢太學諸生頗干時政其時謂之處士横議皆是亂風俗深要懲絶伏望陛下知其邪計從朋黨而来每事明察遏絶將來之漸則朝廷安靜邪黨自銷臣等不勝感憤􅂺具聞奏伏望特賜省覽謹錄奏聞謹奏李文饒文集卷第十
