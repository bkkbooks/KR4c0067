front:
  text: 李文饒文集卷第五㑹昌一品制集詔敕上者請翰林􅄈奬餙語他㫮倣此詔書凡有敕字者使行無敕字
  hash: sha256:10ccf154257cac8d2aef349e0ed97dc51507506341b1a92c5f688081d53114e5
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4c0067_SBCK_005-1a}
body:
  text: 賜回鶻可汗書賜回鶻書意賜回鶻可汗書意賜回鶻可汗書并宫主及九姓宰相詔書賜太和公主敕書賜背叛回鶻敕書賜回鶻嗢沒斯特勒等詔書賜回鶻嗢沒斯等詔書賜思忠詔書賜回鶻可汗書敕我國家統臨萬寓列塞在隂山之南先可汗悊率本部建牙於大漠之北各安土宇二百餘年此天􅀁以限隔内外不可逾越近聞爲紇扢斯所敗加以飢荒國邑為墟屍僵道路今可汗稍􅀵離㪚漸近邉城將議遠圖舎先文誥故兹命使宜􅃪朕言可汗累代以来推誠嚮國仼者中原有誰􅂇剪群􅇯列聖念功毎加優寵寧國咸安二公主降嫁龍庭爰及先朝復以今公主好又以土無絲纊􅀊遺縑繒恩禮轉深諸蕃稱羡乆保誠信兩絶猜嫌但以國家􅃇章蕃漢殊壌稍逾經制豈朕􅀁安去􅀊嗢沒斯特勒巳至近昇邉􅀅憤激便請袪除朕念其無主可歸且令安撫今可汗既立彼又降附便合率漸復舊疆漂寓塞垣殊非良計又得宰相頡干伽思等表借振武一城權與可汗公主居住中國之制與外蕃不同湏守前代規模祖宗法度昔漢朝單于乖亂呼韓欵塞宣帝送單于出朔方雞鹿塞唯賑以米粟國初大宗皇帝命李思摩建牙於漢南遺址並存事皆可驗未有深入漢界借以一城與退渾党項㣲小雜種同爲百姓實亦屈可汗之尊貴亂中國之舊規􅀂以未復本蕃或欲别遷善地求大國聲援戢諸部交爭亦湏率思歸之人且於漠南駐止朕當許公主朝覲親問事宜儻湏應接必無􅀁悋冀今􅀍國從此輯寧豈不謂去危就安轉禍爲福朕縁公主􅀅可汗丹誠来告深感于􅂨制置之間湏存逺大故遣右金吾衞大􅀅軍兼御史大夫王㑹宗正少卿兼御史中丞李師偃馳往喻懐爰定所居便申誓約神明是質豈可食言可汗並保一心自求多福賜回鶻書意奉宣撰朕想可汗公主以乆修隣好累降嘉姻望我國家如歸親戚朕毎弘容納之意固無纎芥之嫌但以將相大臣累陳公議以可汗代居絶漠臨長諸蕃名聲既雄部伍甚衆今逗留塞上逼近邉城百姓不安人心疑惑耕種盡􅆸士馬疲勞朕二年以来保䕶可汗一國內阻公卿之議外遏􅀅帥之言朕於可汗心亦至矣可汗亦湏深見事體早見歸還􅀁求種粮及安存摩尼尋勘退渾党項刼掠等事並當應接處置必遣得宜惟是擬借一城自古以来未有此事天地以沙漠山河限隔南北想蕃中故老亦合備知只如長安東有潼関西有散関南有藍田関北有蒲関今四海一家天子所都猶有限隔况蕃漢殊壌豈可通同且天下者髙祖太宗之天下朕守祖宗成業常懐兢畏豈敢上違天地之限中隳祖宗之法毎欲彂一號施一令皆告于宗廟不敢自專􅀁借一城理絶言議想可汗便湏息意勿更披陳其餘令楊觀專往視喻朕意賜回鶻可汗書意楊觀至覧表欲求粮食牛羊糧食已許自已馬價絹就振武和糴三千石縁中國以農為本最貴耕牛百姓所蓄無多常斷屠殺羊則産於北土不出中華惟塞土蕃渾各有畜牧朝廷未甞徵率務使安存今之所求難允来意又􅀁請束縛嗢没斯送歸者嗢没斯比自投邉􅀅屡猒誠欵自本國破亡之初奔迸先至塞上不随可汗公主已是二年慮彼猜嫌自懐憂懼竆廹歸命望朕保持未甞有交構之言離間兩國前可汗已縁失制馭之道無兼愛之仁侵擾諸蕃肆為暴虐所以親屬內叛部落外離國破家殘實由於此今可汗失地遠客危難之中尤湏追悔前非以安反側􅀂又仁爱不至骨肉相殘可汗左右信臣誰敢自保朕綂萬國非止一蕃未附者頃務懐柔歸誠者因宜存撫儻狥可汗之意殊乖覆育之恩今已特許歸降止於存其種族必不别有任使授以腹心在可汗不失恩慈於朝廷免􅃜信義豈不兩全事體深叶良圖况前代以来盡有故事漢朝呼延邪單于欵塞其下大􅀅鳥厲屈烏厲温敦並来降附漢宣帝封以列侯又國初頡利可汗之破敗也降者甚衆酋豪首領至朝廷皆拜將軍僅百餘人無不撫納想可汗深明朕意勿更再論摩尼教天寳以前中國禁㫁自累朝縁回鶻敬信始許興行江淮数鎮皆令闡教近各得本道申奏縁自聞回鶻破亡奉法者因茲懈怠蕃僧在彼稍似無依呉楚水鄉人性囂薄信心既去翕習至難且佛是大師尚随縁行教與蒼生縁盡終不力爲朕深念異國遠僧欲其安堵且令於兩都及大原信嚮處行教其江淮諸寺權停待回鶻本土安寧即却令如􅃇賜回鶻可汗書并公主及九姓宰相詔書朕自臨寰區爲人父母惟以好生爲德不願黷武爲名故自彼國不幸紇扢斯􅀁破来投邉境已歴􅀊年撫納之間無􅀁不至初則念其飢歉給其糇糧旋則知其破傷盡還馬價前後遣使勞問交馳道路小小侵擾亦盡不計今則可汗尚屯近塞未議還蕃朝廷大臣與四方節將皆懐疑忿盡請興師雖朕切務含弘亦􅀁未喻日昨数使卻回皆言可汗只待馬價及令交付之次又聞所止屡遷或侵掠雲朔等州或讐掣羗渾諸部未知此意終欲何如􅀂以未交馬價且近塞垣行止之間亦宜先告邉􅀅豈有倐来忽去遷徙不常雖云随逐水草動皆逼近城柵遥揣深意似恃姻好之情毎觀蹤跡實懐馳突之計况昨到横水柵下煞戮至多蕃渾牛羊豈悋驅掠黎庻何罪皆被傷夷所以中朝大臣等皆云回鶻近塞已是違盟更戮邉人實乖大義咸願因此翦逐以雪殂謝之寃然朕志在懐柔情深屈巳寧可汗之負德終未忍於幸災石誡直乆在京城備知仁作人一本心憤惋彂於誠懇固請自行嘉其深見事機所以不能違阻可汗審自詢問速擇良圖無至不悛或貽後悔賜太和公主敕書奉宣撰敕姑遠嫁絶域二十餘年䟦履險難備罹屯苦朕毎念於此良用惘然㳟惟太皇太后春秋已髙慈愛深厚比者望姑朝謁再叙悲􅂬倐已􅀊暮寂無音耗想姑見舊國之城邑能不銷䰟望漢將之旌麾必當流涕今朔風既至霰雪已零絶國蕭條固難乆處旃墻罽幕何以禦冬肉飯酪漿且非適口朕撫臨萬㝢子育群生一物未安終食三歎况姑累年漂泊何日忘懐想姑髙明必是懸鑒姑承宗廟之餘慶爲三室之懿親先朝割愛降婚義寧家國謂回鶻必能侮禦安靜塞垣使邉人子孫不見兵革射獵者不敢西向畏軒轅之䑓今回鶻所爲甚不循理蕃渾是朕之人百姓牛羊亦國家􅀁有因依漢地遂致蕃孶回鶻託以􅀻讐恣爲侵掠毎馬􅈡南向姑得不畏髙祖太宗之威靈欲侵擾邉疆姑得不思大皇大后之慈愛為其國母足得指揮􅀂回鶻能不禀命則是棄絶姻好今日以後不得以姑爲詞􅀂恃我爲親禀姑教令則湏便自戢歛以􅁇舊􅂬想姑以朕此書喻彼將相令其知分更不徇非塞外祈寒且無絲纊朕毎御裘服則思彼未授衣豈可回鶻譸張遂忘親愛今􅀉冬衣􅀂干具如别録賜背叛回鶻敕書奉宣撰近数得邉將奏報知卿等本國自有離亂可汗遇禍雖未委虚實良深震悼我國家與卿等本國代結姻好乆爲親戚恊德同心常爲諸蕃􅀁羡故得邉􅀱不聳封疆晏然卿等忽領師徒漠南屯集又数至天德侵掠頗擾邉人聚師無名忠義俱失既乖舊好良用憮然􅀂卿等本國􅀁立新主非可汗至親人心不從擾亂未定卿等只合自申方畧竭效忠誠安靖本蕃以圖勲績亦合遣使告朕具述此心􅀂新立可汗是中國至親人已歸附卿等便合早自相率保國寧家與可汗恊心以修舊好豈得􅀉命塞上乆勞師人朕縁與卿本國情義至深事同一軆又縁公主在彼未知存亡故遣使臣魏謩往諭朕意卿宜備陳誠􅅃不得虚詞兼禁戢師徒勿爲侵軼近聞天德遊奕軍將曽有交鋒卿等既犯塞垣亦是邉將常事今已各令諸鎮不許交兵卿宜曉諭部落各令知悉賜回鶻嗢沒斯特勒等詔書奉宣撰勅回鶻嗢沒斯特勒那頡啜特勒頡干伽思於解亦阿躭于思莫賀逹干宰相伊難朱密伽諦畧摩咄將軍諦畧等天德軍逓􅀁奏表至再三省覧憂屬良深彼蕃自忠義毗伽可汗以来代爲親隣連降愛主恩禮持異古今莫及君臨萬國撫育殊方苟有未安則宜来告况特勒等乃祖乃父歸誠累朝昨遣嗣澤王溶吊冊先可汗回始聞卿國中䘮亂諸部乖離捄患䘏隣豈忘令典方圖鎮撫以命使臣今又知堅昆等五族深入凌虐可汗被害公主及新可汗播越他􅀁未歸城邑特勒等力不能制思存逺圖相率遁逃萬里歸命又知欲奉公王朝覲忠謀不從已踰大漠之南同􅅃五原之塞彂此單使布其赤心言念艱危惻然軫歎料卿等皆英酋貴族覊寓沙場懐土之情如何可處豈非欲討除外冦匡復本蕃抱此至忠託於大援但縁未知指的難便聴從又慮邉境守臣見卿忽至或懐疑阻不副朕心故遣鴻臚卿張賈馳住安撫朕既奨卿忠款報以信誠雖隔塞垣已如相見卿湏深明朕忠盡吐所懐一一言於使臣令其速還聞奏佇聞誠願續有指揮必當副彼急難固不惜於事力勉於謀度用保忠勲秋熟卿及部下諸官并左相阿波兀等部落黒車子逹怛等平安好遣書指不多及賜回鶻嗢沒斯等詔奉宣撰敕回鶻嗢没斯特勒那頡啜特勒悉勿啜特勒烏離思特勒赤心宰相等張賈等回知卿等欲遠赴闕庭自申忠款眷言深志豈忘于懐聞卿等本國頃因飢荒遂至離散親屬內叛諸部外侵新立可汗猶未安定既是國中所奉則爲卿等君親古人云未有仁而遺其親者義而後其君者想卿等本心必思推戴况回鶻代雄朔漠威服諸蕃今已破傷足堪悲憤􅀂皆自爭雄長不顧其君各㨿一隅必更衰弱深慮從此之後爲諸蕃􅀁輕與卿等本國代結姻親乆修隣好毎念於此良用惻然與卿等爲謀湏務遠大莫􅀂自相率勵同奉可汗興復本蕃再圖强盛朕欲召卿赴闕親諭此懐又恐可汗聞知謂朕幸其艱危因有招納盖欲深全國軆兼為卿等避嫌以此思之難遂於請卿等宜早歸本國不更滯留卿等表請噐甲朕君臨萬國非止一蕃祖宗􅃇章不敢逾越國家未曽賜諸蕃噐甲卿等亦合備知􅀂一處開恩必自茲援例朔州般次􅃇例湏待可汗遣駞馬迎聖方令進彂可汗信使未至難於遣行今有賜物具在别録以卿等率先向彂特示優恩縁新立可汗未受朝廷冊命数降使至卿等部落亦恐非宜所有賜賚止於此度想卿等明識深諒朕懐便令髙品魏敬休宣諭想宜知悉賜思忠詔書奉宣撰吕衞等至知卿與可汗不能戢下頗擾邉􅆠既告諭不浚湏兵􅀔驅逐卿忠誠奮彂願立竒功請退渾沙陁等部落合􅀔及戰馬噐甲等並已允卿􅀁奏各有别敕處分今令左衞將軍何淸朝蔚州刺史契苾通分領蕃渾部落取卿指揮朕已切戒何淸朝等令其恊盡心力副卿忠誠進取之時一切取卿方畧卿宜毎事與弘順等商量審度事機勿爲輕進但得可汗抽退不敢稽留塞上安寧即是卿之勲力必不可落其奸計以損國威兼令髙品駱遂泰權監行營將士卿與之籌慮續續奏聞五卷終
