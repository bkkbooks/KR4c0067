body:
  text: 詔敕下賜石雄詔賜劉􅃆詔意賜李石詔意賜王元逵詔意賜李石詔意賜王宰詔意賜張仲武詔意賜劉􅃆詔意賜王宰詔意賜石雄詔意賜王元逵何弘敬詔意二首賜㳂邉諸鎮宻詔意停歸義軍敕㫖置孟州敕㫖李回宣慰三道敕賜王宰詔意賜石雄詔意敕石雄古者有必勝之將無必勝之人欲立奇功實在謀師朕所以求鷙鳥於累百得飛將於無􅀟總率諸軍以臨賊境况卿受尺一之詔初無辦嚴盤丈八之矛果能盪冦眷言勛績深注余懐近聞從諌時百姓相驚云卿以七千兵至數告於衆魄兆於人今天䇿向晨已及成軍之􅀱龍􅋮建斾必叶渡江之謡􅃇史昭然􅁳符可騐加以天道在乎西北順􅀊有功福星煥乎龍庭爲國大慶勉弘方畧契此休徵昔鍾㑹以二十萬兵頓於劍閣鄧艾􅅻一萬衆直抵成都只在决機豈由衆寡知卿能辦故諭此懐然聞卿毎自履軍常先士卒既有輕敵未足耀奇朕借卿一舉之功以定必擒之計至於小陣不可自行魏武帝嘗戒夏侯妙才曰爲􅀅當有怯時不可但恃勇也當以勇爲本行之以智計但無知任勇一匹夫敵耳張遼單身入昌狶家魏武責曰此非大將法今卿爲萬人之帥啓千乗之行舉必責謀動資持重報國在於平賊不在䡖身爲將本於坐籌寧劳陷陣卿宜以朕之戒甞自書紳務建功名副茲委遇賜劉􅃆詔意縁卿二年在外城府久虚今残虜未平南北皆有戎事欲令卿却歸本鎮應接兩隅行營諸軍未知􅀁付聞王逄頗有武用卿􅀁素知今已追赴大原欲令􅂶本道行营都知兵馬使又縁例偏禆日近官秩尚卑指揮諸軍未即宜稱今縁石雄王宰皆欲進兵得卿一軍齊入足分賊勢卿宜審自籌度歸本鎮後在朝及側近武臣誰人堪付行營兵事宜宻狀具一兩人進来如卿離行营後兵力事􅀔深入未得亦湏審具事實聞奏不要隠情今取决於卿切在審詳賜李石詔意訪聞近日賊中轉更竆蹙自相殺戮人心不安即目軍權多在郭誼因此誘動必應事機李丕是郭誼親宻尤合相信卿宜暫追赴使令與郭誼書論以利害遣其自圖劉稹早務歸降倘效誠款必重酬賞卿宜靣㸔李丕手䟽兼令便自封題分付王逢遣宻作計召軍人百姓送入澤潞其書草卿宜封進賜王元逵詔書材幹筋革出自江淮除進奉之外並敕令􅀁禁盖以有國之制固湏立防朝廷法度理當畫一卿國之懿戚時之信臣方進勁兵坐淸残孽誠宜假以利噐壯軍威朕之於卿固無愛惜但以河朔数鎮事体應同􅀂一度賜卿必傳相援例恩信不一非撫御之逺圖賜與頻繁􅈥朝廷之􅃇制卿是朕之心腹必合樂守憲章故示至懐想當知悉賜李石詔意省􅀁奏劉稹令賈群齎李恬書與卿將兵屬同赴闕庭兼請歸􅁙東都事宜具悉比者河朔諸鎮惟淄靑變詐最多劉悟随来􅃇將皆習見此事察其情僞深要精詳盖縁四面王師尅期石雄王宰巳㨿天井卿當道又得石㑹既失重関之嶮􅀅弋在宂之妖鎮衞勁兵皆臨境上城孤援絶情計巳竆􅀁以宻􅀅款詞歸命上相恐是偷安旬月潰緩王師稍得自完復来侵軼况饋運日有􅀁費春作漸已及時勞我師徒恐非至計卿與其要約令靣縳来降卿即馳至界首親自受納苟不如此且湏進軍必不得因此遷延令其得計仍不得先受章表便與奏聞今賜與劉稹書白想宜知悉賜王宰詔意省所奏差張公輔入澤州潞州亦粗得賊中軍情􅀂許招誘乞賜詔命事宜具悉劉稹䘮父之初已拒朝命旋又焚爇晋綘廬舎侵逼萬善孤軍罪惡貫盈言詞甚悖自卿全師壓境頻挫其􅀔尋得天井重関下臨髙平危壁邇来頗自知惧方献僞詞然天奪其心鬼迷其志宋人已病不告析骸之情朱鮪乞降曽無靣縳之效尚聞張皇叛卒覬望鴻恩不戢群􅇯徒云􅁇襲想卿忠憤必志梟夷况自去年以来頻奄畢今又福星煥燿正臨天駟東漢書云畢爲天網網羅不善之人房爲明堂方集重華之慶懸象昭晰前史􅀁書朕奉天道以行誅守祖宗之成法顧茲小冦終不貸刑亦知晏實是卿之愛弟將申大義在抑􅀻懐豈無鴒原固慎名噐今料其初通信使必謂卿且駐軍想彼叛徒猶希洗雪乗此討襲必有竒功韓信襲歴下之軍李靖翦隂山之冦皆因敵心懈弛故得機討不遺想卿久習兵符備詳虜態便湏覆其巢穴不可更有招携劉稹縱有表章請自靣縳不得便自報荅亦湏奏聞當務遠圖勿拘小信速宜攻討以副朕懐想宜知悉賜張仲武詔意昨以李石文吏不可自赴行營令在太原應接戎事縁親兵在外城府空虚楊弁糺合征師衆􅅻一旅迫逐主帥擅領兵權尋詔近地行营量抽兵馬便令翦撲計日梟夷縁鎮州地接土門最爲便近已詔元逵出師五千人馬向南諸軍聲援顧茲小冦未足劳卿大軍縁何淸朝下河水官健曾經楊弁将領乆與亂軍同處恐其自思家屬因此揺心宜速與卿本道都頭宻意動靜與淸朝計㑹椅角相應如萬一淸朝官健禁戢不定抽歸太原已令把絶鴈門遏其歸路卿便湏出軍掩襲勿遣漏失􅇯徒毎事與淸朝商量務從權便應機在速不更待奏聞賜劉􅃆詔意敕自古出師莫重謀帥李廣臨塞威動殊鄰呉漢理軍允如敵國舉茲制勝方見成功往者羯胡亂華伊洛未靖光弼以上勛元宰移守盟津即知急病捄艱因事爲重以卿近破狂虜已著英名河内當賊咽喉爲吾雄屏爰求威望將以撫寧昔漢光武謂冦恂曰頴川廹近京師當以時定惟念卿獨能平之從九卿復出憂國可知也卿勿以累換雄藩輕此寄任䇿勛之日遷擢必殊詔到便宜擇精兵二千人自領赴鎮直扺萬善震耀威聲壮忠武捕鹿一本作掎角之形分常蛇首尾之􅀔今屬水潦􅀅至農事已興􅅯武息人固難淹乆勉弘方畧副朕誠懐賜王宰詔意將帥大畧前史備書保境者以守險自固進攻者以過險必尅制其死命務湏批亢今賊在網羅只守巢穴廣立虚柵多設疑兵盖謂自防豈暇侵軼且欲偷安嵗月以老王師卿分兵相守果中奸計况卿已得天井尋扼咽喉逰刅其間更何顧慮聞天井前後寨柵二十餘􅀁以備奔衝如此費兵固湏寡力料賊四靣設備兵数可知卿進大軍便湏拒捍何暇更於諸路敢軼封疆以近事明之足可爲㨿昨者榆社兵馬盡赴大原自沁至儀五百餘里賊已却得石㑹其間細路至多数旬無備竟不馳突卿以此揣度可見其情又諸軍都頭各守一寨遷延避冦苟務過時卿􅀂更廣詢謀取其自便必恐撓卿思慮難見成功卿宜宻度事機自爲心計其賊路逼近州縣及當卿腹背受敵之處即湏留兵防守用備冦虞其他抽随大軍併力攻討如此則出其不意必覆妖巢國家無徵彂之劳計司减饋運之費足得制勝豈在濟師又聞毎度出兵傷夷不少待其瘡痛皆復不免戰闘闕人今爲卿方圓無􅀁愛惜其陣没官健如無子弟便别擇少壯者充替其亡殁家粮賜亦許不停其傷夷校重有妨役使者亦任擇人􅂶替其傷夷者仍不停粮非惟感勵士心亦冀漸完兵力卿宜以此宣示各使聞知故令中使專往㸔卿處置湏待事了方得遣回賜石雄詔意與王宰詔同於奸計字下云聞冀氏翼城寨柵有一十八所以備奔衝自此以後又與王宰詔同至各使聞知下云又聞將士有苟避兵鋒全不得力者卿宜便令守寨不要將行其彦佐随使衙隊自大將至宴設及工巧之徒除卿先令歸本道外聞在者尤多卿既領節旄自有土地並宜曉諭彂遣不要更留仍具人数奏聞雖卿善於撫衆皆自樂從然亦在割情不令撓事故令中使專往㸔卿處置卿湏待了方得遣回賜王元逵何弘敬詔意後别各存處分與彦佐等詔同何比縁暑􅀬未退固難進軍想卿至誠豈安終食今淸商已至􅎏皷聲雄白露􅀅凝戈鋋氣肅撃隼應節而逾厲代馬嘶風而自豪順天行誅正在今日近者天井冀氏頻有交鋒盖縁卿等當軍未抵邢州莫分賊􅀔併有精卒得以奔衝今四靣王師一十萬鎭魏兩軍自當其半屯集在境已及􅀊期雖罰罪除残誠無􅀁悋然生人膏血杼軸其空朕既爲父母豈可坐延􅀊月想卿忠憤固不懐安况卿當道頃爲盧從史劉從諌􅀁敗與澤潞素是深讐卿之騎兵海內精勁將䖍劉残憤士有闘心宜乗此機豈可玩冦想詔到之後速抵邢州但得綴其精兵不合併力西向朕當詔王宰石雄齊心攻討破此残冦决在今秋故令中使往諭朕意想卿勿更疑惑副茲朕懐何弘敬詔中攺未抵邢州爲未過漳河况字以下攺爲卿奉親之孝朕􅀁深知想陟岵有懐循陔思養違離周􅀊固切歸心當早决機豈宜玩冦賜王元逹何弘敬詔意近頻捉得賊界生口及􅀵得投降人等毎知賊中精卒数亦無多只是應急旋抽併當一靣破其此計實在共攻縁王宰即過乾河便抵澤州城下恐賊併取山東兵馬抗拒南靣王師卿宣詔到日便湏深入綴其精卒不遣東西旬月免有捄兵王宰必能成事如因此掎角便克澤州則卿之功勛更髙王宰朕毎念陳兵原野又屬炎􅀬由此孽童致茲暴陵然獫狁孔亟周宣興六月之師淮夷未寧公旦有三年之役事非獲已諒匪劳人卿當深躰朕懐早圖戡翦上薦功於宗廟下息患於生靈則卿之子孫永受休禄朕之酬賞必極寵榮布告三軍咸令知悉賜縁邉諸鎮宻詔意近者冦孽初平海内無事方欲永櫜􅃓矢保义生人圖遠開邉誠非朕志然盛衰􅀝伏皆有其時古人云聖人無巧時變是守盖惜其時也昔漢武帝命􅀅出師輕齎深入耗中國三十餘年竟不得臣伏匈奴蕩定沙漠此未得其時也至宣帝值匈奴百年之運因懐亂危亡之機單于稽首三代偁籓烽燧不設邉城晏間此遭遇其時也近則回鶻常以兵􅂇中國有戡難之功朝廷累降姻親􅀊致繒絮因我爲援振服諸蕃百有餘年最爲强盛及本國衰亂種落流離景附北邉猶爲桀鷔因其入塞暫舉偏師遂大破穹廬却􅀵公主歸降甚衆梟戮至多一國銷亡易於拉朽豈非得其時也今吐蕃未立賛普已是三年􅀅相猜携自相攻撃縁邉兵馬頗已抽歸想其城鎮皆空守備多闕儻彼闘戰未定自有黨讎一國之中疑惧相半則備邉城守固有異心計卿軍鎮必有􅃇人諳練邉事深入窺探来往是常易知隠伏之情足見存亡之兆宜精意選練務得其人切湏識見精專誠信可保資以財帛俾其隂通自隴山天寧関北至蕭関原州安樂州烏蘭橋等皆是賊之險路入冦要津各要知兵馬多少何人主領如兵数寡少人心動揺乗此危機必易爲計多設反間宻用竒謀使自歸心豈劳兵力觀釁而動取若拾遺此兵法􅀁謂不戰而屈人之兵善之善也國家河西隴右四鎮一十八州皆是吐蕃因中國有難相継陷沒今當其破滅之􅀔正是􅀝伏之期取亂侮亡聖人遠畧斯乃以直報怨非是不守和盟想卿精忠必逹此㫖故令劉濛專往親諭朕懐卿宜選練師徒多蓄軍食使噐甲犀利烽火精明尺籍伍符盡無虚数務修實效勿􅂋事機制置之間尤湏宻靜詔書有􅀁不盡皆已指示使臣勉建良圖副茲委遇停歸義軍敕書敕李思忠首率蕃兵歸誠向闕念其忠款特許来朝而又乆慕華風願㽞京邑俾參環衞用報勛庸其歸義軍使宜停將士等同叶義心􅀁宜優寵况聞諸道軍鎮皆置馬軍選擇蕃渾尤不易得縁此將徤乆工􅀐射頗出常倫列於牙旗足壯戎閫宜分諸道節度使團練􅀵􅃹便給本道衣糧稍加安存務令得􅀁置孟州敇㫖敕昔馮異之守盟津已建軍號近光弼之保伊洛先㨿三城盖以河有造舟之危山有摧輸之險左右機軸表裏金湯既當形勝之地實爲要害之􅇿令􅀁置制豈限常規積萬􅁃於敖前尤資地利列二矛於河上湏壯軍聲其河隂縣宜割屬孟州仍攺爲望縣其河淸縣却還河南府縣官等並准前敕處分其東都鎮遏兵馬依前屬東都防禦使鄭滑汝州防戍兵各一千人令弘敬權指揮事平後續有處分李回宣慰三道敕㫖敕成德軍魏愽皆出兵甲俯臨賊境秋氣已至攻取是時元逵弘敬制勝伐謀必有成筭固湏命使遠訪嘉猷又回鶻雖已遁逃尚存餘燼今朔風始勁塞草具腓猶慮未革梟音敢懐狼顧迫於飢窘復擾邉城仲武乆欲蕩除俾無噍􅁼成其志業壮彼威聲亦在使臣往喻朕意各宜奮厲早建殊勛解甲劳還免及祁寒之􅀱止戈除害庻臻仁夀之期咨爾帥臣副予委遇宜令刑部侍郎兼御史中丞李回􅂶幽州鎮魏等道宣慰賜王宰詔意卿頃蒞澤州頗彰惠政彼之黎庻自合有情申以恩威正在今日卿宜大布誠信且務綏懐不得焚其室廬翦其桑梓自當壼漿塞路襁負而歸兼招取丁壯三五千人不要分給噐械毎至填壠攻壘皆遣先驅料澤州城內非其父兄即其子弟必合自相愛惜豈願交接兵鋒兼領遣使逼其軍城再三號令若能捨逆效順速自歸降非但生全仍加優賞克城之後不􅂎秋毫如堅守危巢坐待撲㓕必當不存噍􅁼務極兵威料其聞此先聲皆自感厲勉於方畧副朕深懐李文饒文集卷第七
