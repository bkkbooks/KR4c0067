body:
  text: 箴丹扆箴六􅈡并序舌箴一􅈡并序銘聖祖院石磬銘鹿跡山銘劔門銘賛圯上圖賛大迦葉賛丹扆箴并序臣聞詩云心乎愛矣遐不謂矣此古之賢人所以篤於事君者也夫迹踈而言親者危地逺而意忠者忤然臣􅀼念㧞自先聖偏􅀝寵光􅀂不愛君以忠則是上􅀒靈鍳臣頃事先朝屬多隂診常獻大朙賦以諷頗􅂪先朝嘉納臣今日盡節朙主亦猶是心昔張敞之守逺􅇿梅福之在遐徼尚竭誠盡規不避􅀹悔况臣嘗學􅃇史頗知官箴雖在踈逺猶思献替謹稽􅈡上丹扆六箴具列于後仰塵睿覧伏積兢惶一宵衣箴先王􅃪政昧爽以俟雞鳴旣盈日出而視伯禹大聖寸隂爲貴光武至仁反友不忌無俾姜后猶去簮珇彤管記言克念前志二正服箴聖人作服灋􅁚可觀雖在宴逰尚不懐安汲黯莊色能正不冠楊阜毅然亦譏縹紈四時所御各有其官非此勿服惟辟所難慨然矣毅然一作三罷獻箴漢文罷獻詔還騄駬鑾輅徐驅安用千里厥后令王亦能㳟巳翟裘旣焚筒布則毁道德爲麗慈儉爲羙不過天道斯爲至理四納誨箴惟后納誨以求厥中從善如流乃能成功漢驁沉􅊺舉白浮鍾魏叡侈㑀凌霄作宫中雖不忤而善亦從以視爲瑱是謂塞聰五辯邪箴居上處深在察㣲萌雖有讒慝不能蔽朙漢之孝昭叡過周成上書知詐照姦得情燕盖旣折王猷洽平百代之後乃流淑聲六防㣲箴天子之孝敬遵王度安必思危乃無遺慮亂臣猖獗非可􅃍􅁆玄黃莫辨觸瑟始仆栢谷㣲行􅉘豕塞路覩貌獻飱斯可誡懼舌箴并序戊辰􅀊仲春月戊申夜余􅀫於洞庭西夢與中書令姚公偶坐如􅃇相識問余曰君見僕所作口箴乎余對曰去􅀊居守東周於公曾孫諌議某處覩金石之刻遂莞爾而􅀏曰孫子猶能記之余以仲夏月逹于海曲嘗􅀼思之聖哲之言上可以動天地成典謨次可以正人倫朙得失黙而不言後代何述焉繫辭云不善則千里之外違之在植其所言而巳矣豈不緘其口銘其背以矯當世㢤楊子稱孰有書不由筆言不由舌張儀以舌存而交亂亦善不善之效也余感姚公之夢乃爲舌箴云粵有帝舜洎於殷宗龍命惟允允以龍岀內朕命故舜命九官自禹至龍命曰龍􅀃言乃雍代子言故曰􅀃言殷高宗夢傅􅀃其周有良弼王之喉舌鼓舞而生渙汗乃發傳以言旋作義易以講習施恱天以卷舌屏讒儒以金口駕􅀃伯陽之誡柔存剛缺言貴無瑕辯貴􅀂訥則知門猶閉嚢不在括是以楊雄悼讒者之􅁈梅福痛忠臣之結善乎先聖之言既朙且清國之以寧人之不朽犯無􅀮情無恃爾言駟馬不及嗟爾君子念玆在玆勿以寤一言而取宰相以舌三寸而爲帝師徒見娄敬掉而􅀗爵不知魏其齰以可悲雖言必有中而適其時子房能用其䇿難以爭立愛奉春善建不㧞無以免係縲衞無警夫莫椚叔向哀於是出惟敬仲之難朙由匠石之無質楊子曰重則有灋輕則招􅁨言能如是可以寡􅀹聖祖院石磬銘有羙浮石凄􅀂銅音笙竽合奏鸞鷟在林淸越盈耳和愉感心懸之玉宇永託僊岑鹿跡山銘不動者山不死者仙山在僊存真訣不傳猗歟先生耽道體玄騰駕素鹿遨逰紫烟時憇蓬壺下視桑田一往茲山于今㡬年兹山岑寂先生是宅淸泉緑蘿獨與世隔我居洞宫人見崖壁空留鹿跡永存幽石劔門銘群山西来波積雲屯地險所㑹斯爲蜀門層岑峻壁森􅀂戈㦸萬壑奔東􅀟飛高􅆣翠嶺中橫黵然黛色樹玆雄屏以衞王國􅀂列屏此一峯最竒而􅀃者未劍門當中有一峯峻嶺橫峙望也嘗及峯㧞井幹溪囘溝洫嚴守重扄􅀮如臨敵運有隆替地無險阨閉于昏頑開于有德馬錯西伐蜀矦敗績艾出隂平禪亦来格粤在憲祖英威四克始剪蜀妖遂清卭􅁄蠻夷􅁤道諸侯述軄武臣銘之金石乃刻圯上圖賛夫天所以睟淸者其氣理也故能四時變化萬物粲然倦則隂陽爲灾光景不耀而况於人乎人亦肖圜方之形禀淸濁之氣存神索至極物竆情則􅀝伏之先見其如視矣子房潜心於神而逹之見其圓狀如得其粤則有女子之粹羙嬰児之專和粹所以含至精專所以研至􅄨散萬金之資柔毅也祖萬乗之􅄷仁勇也學禮履方也變名圯上避世也􅀂乃五日爲期三往增敬則尾生之信違道矣退不離國心不忘君則鴟夷之遁非忠矣合時變以蟬蛻望僊路以鴻􅁳􅄖㳺於綺皓之門髣髴乎赤松之際豈不善始善終㢤黃石者其天地之藴神朙之璽歟不然則無以覺悟于房輔翼天漢嗟乎䘮亂既定韜匱而葆祠之生也奉符歿而同穴有以見子房之神交不渝矣大迦葉賛頭陀第一惟大迦葉依無上智初分寳坐終授宻記晚遇金粟乃知平地潜形雞足以待慈氐李文饒别集卷第八
