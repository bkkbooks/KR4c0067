front:
  text: 李衞公集補
  hash: sha256:0de32a2b907a28d2d004729a0f27c8b9b0f6c04bfa9372283482911ab5002778
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4c0067_SBCK_036-1a}
body:
  text: 文賜新授太子太師杜衍制以下九首明本原缺据全唐文錄補卿道崇德茂體方行正業成廊廟心存邱壑往以時事來還宰旅秉此難進確然莫奪雖違乂辟之望實有鎭浮之益深惟元老想見高風師範之尊東宮莫二舉茲崇秩明昭有德公器斯在雅道有光宜略常謙卽膺成制與黠戞王書皇帝敬問黠戞王時及陽和想比佳適注吾合素等至省表并進馬事具悉國王陰山雄勁朔野英雄包智略以周身推誠明而有衆聲高夷落威重藩疆專遣使臣遠獻名馬嚮化之誠旣展輸忠之効頗明臨軒省章輟食嘉歎眷言忠藎寧忘寢興頃於貞觀中彼國常奉朝貢亦授官爵寵賜而還爾後但訝音耗久乖不知中爲回鶻所隔及覽來表方嘉壯圖蓄銳多年乘機大舉快雪􅁈憤豁開心懷回鶻之營壘旣平國家之山河不間旣爲鄰境遂閱貢章又知破回鶻之時取得太和公主特遣專使送歸闕庭雖聞行至中途却爲回鶻所奪在國王遵以禮義推之和寧遠同族之譏嫌厚親鄰之恩信賢明如此愧慰難名回鶻頃以失國爲詞款塞相託朕以勳親是念拯卹屢加曾不知恩漸開稔惡賤棄公主侵㬥平人日尋干戈時竊牛馬朕爲全舊好不下明誅歲月滋深邊防將倦各用長策繼彰殊勳焚帳幕而公主歸還透網羅而元惡逃遁顧其餘類何所寄生國王遠聞想同深慰然猶恐奔竄尙有凶姦又慮侵彼封疆將復讐怨國王亦須嚴爲備擬善設機謀同務討除盡其根本無貽後患勉繼前修親仁善鄰惟彼與此勿謂遐遠常存寤思因注吾合素回且先詔示其他禮命續專遣使宣慰想宜知悉薦處士李源表臣伏見賈誼云守圉捍敵之臣誠死城郭封疆故曰聖人有金城者此物此志也自天寶之後俗尙浮華士罕仗義人懷苟免至有棄城郭委符節者其身不以爲恥當代不以爲非臣恐風俗旣成紀綱皆廢此當今之急務教化所宜先也臣訪聞處士李源卽故禮部尙書東都留守贈司徒忠烈公憕之少子天與貞孝嗣茲忠烈以父死國難哀纒終身自司農寺主簿絕心祿仕垂五十年放懷山澤罕至人落曁於衰暮多依慧林佛寺以其本憕別業就寓殘生從僧住持不舉烟爨隨僧一食以至五十餘年嗜欲靡窺精麤同衆寺之舊殿則憕之寢堂源過必敬趨未嘗登踐其端心執孝無有不至忘形患苦絕意貪緣迎斥浮虚就專志節則孰能挺操不易沈身無聲處薄自頤終老彌篤且憕之忠烈實冠古今當逆羯屠陷飈驅響從而憕抗節誓心約義同列居朝守位抵刃就終臣節之光繇憕益勸而源名銷迹滅徵訪不加實主於居方之臣歷政之闕也况源嘗守沈默不語是非或心交靜求理契深要一言開析百慮洗然致君阜時指􅁚如見抱此貞用棄於清朝臣竊爲陛下深惜伏乞就授一官召赴京闕仍以事迹宣付史館則聖代有求賢之盛朝廷美得材之難憕之貞烈如存源之承荷不墜忠孝之美并集憕門光嗣德於一時激爲臣於千古請宣賜鶴林寺僧諡號奏潤州鶴林寺故禪師元素傳牛頭山第五祖智威心法是徑山大覺之師伏請依釋門例賜諡號大額請罷呈榜奏舊例進士未放榜前禮部侍郎遍到宰相私第先呈及第人名謂之呈榜比聞多有改換頗致流言宰相稍有寄情有司固無畏忌取士之濫莫不繇斯將務責成在於不撓旣無取舍豈必預知臣等商量今年便任有司放榜更不得先呈臣等仍向後便爲定例如有固違御史糾舉停進士宴會題名疏奉宣旨不欲令及第進士呼有司爲座主趨附其門兼題名局席等條疏進來者伏以國家設文學之科求貞正之士所宜行敦風俗義本君親然後升於朝廷必爲國器豈可懷賞拔之私惠忘教化之根源自謂門生遂成膠固所以時風寖薄臣節何施樹黨背公靡不由此臣等商量今日已後進士及第任一度參見有司向後不得聚集參謁及於有司宅置宴其曲江大會朝官及題名局席並望勒停緣初獲美名實皆少雋旣遇春節難阻良遊三五人自爲宴樂並無所禁惟不得聚集同年進士廣爲宴會仍委御史臺察訪聞奏謹具如前論喪葬踰制疏應百姓厚葬及於道途盛陳祭奠兼設音樂等閭里編甿罕知教義生無孝養可紀没以厚葬相矜器仗僭差祭奠奢靡仍以音樂榮其送終或結社相資或息利自辦生產儲蓄爲之皆空習以爲常不敢自廢人戶貧破抑此之由今百姓等喪葬祭奠並請不許以金銀錦繡爲飾其陳設樂音者及葬物稍涉僭越者並勒毀除結社之類任充死亡喪服糧食等用使如有人犯者並準法律科罪其官吏已上不能糾察請加懲責仍請委出使郎官御史察訪臺司伏請令文及故實不載者令更條檢校官令文不載令請檢校官一品二品請同五品五品已下並請同九品如有曾任正官依本官品第儀則其准敕試官亦仝九品儀如升朝官者請據本官品第升降闕例凡喪皆有品第恐或無知之人妄稱官秩自今以後除升朝官見任官亡殁外餘官去事前五日須除將告語或敕牒於本巡使呈過判押文狀行人方可供應佐命殊功當朝立功名傳遐邇特敕優旨准會典例本品數十分加三分不得別爲華飾右具本朝舊本例如前今後令兩巡使祗據官秩品級與判狀其餘一物已上不得增加兼勒驅使官與金吾司并門司同力轄鈐如有大段踰越卽請據罪科斷行人兼不得追領喪葬之家別有勘責奉敕如過制度不許尺寸事數其假賃行人徒二年喪葬之家卽不問罪仍付所司次柳氏舊聞序太和八年秋八月乙酉上於紫宸殿聽政宰臣涯以下奉職事上顧謂宰臣曰故內臣高力士終始事迹試爲言之臣涯謹奏云上元中使臣柳芳得罪竄黔中時力士亦從事巫州因與周旋力士以舊嘗司史爲芳言先時禁中事皆芳所不能知而芳亦有質疑者芳默識之及還編次其口語號曰問高力士說上曰令訪史氏取其事書之臣涯等旣奉詔乃詣芳孫度支員外璟詢事璟曰某祖芳前從力士問覼縷未竟復著唐歷採摭義數尤相近者以傳之其錄或秘不敢宣或怪奇非編錄所宜及者不以傳今按求其書甚實臣德裕亡父先臣與芳子吏部郎冕開元初俱爲尙書郎後官亦俱東出道相與語遂及高力士說且曰彼皆目覩非出傳聞信而有徵可爲實錄先臣每爲臣言之臣伏念所臆授凡有十七事歲祀久更遺稿不傳臣德裕非黃瓊之練習愧史遷之該博唯次舊聞懼失其傳不足以備大君之問謹錄如左以補史官之缺云太和新修辨謗略序臣聞行險而言闕上者非謂謗也是實之所招也蹈仁而被誣者非己所召是盜之所憎也夫理身絕嫌人臣止謗之術膚受不納人君辨謗之明然則正者邪之所仇􅀡者曲之所矯有能爲不才所忌有功爲無庸所嫉四者苟立四謗必隨况僞必亂眞佞實似智鑠金之口不謀而同唱成雷之蚊未響而先合以羣陰而蔽孤陽以衆比而排獨立結其禍患咸本謗言莫不巧中於隱伏之微善成於疑似之際忠賢被之無以自辨亦良可哀哉伏維皇帝陛下體乾坤簡易之德合日月無私之照視聽自天神明其化惡淫哇之亂聽疾紫色之眩目堲其讒說常詠格言臣等將順天聰綴緝舊典發東觀藏書之室得元和辨謗之文辭過萬言書成十卷以其廣而寡要繁則易蕪方鏡情僞之源尤資詳略之當遂再加研考所以理昔賢被誣之狀表前王善鑒之明實願視則倚衡居則宥坐絕其根枿永杜其來必也視之於未形鑒之於無􅁚方夏后盤盂之誡比周王玉几之銘測深慮遠取爲殷鑒使播揚有所消其􅁚萋菲無以成其文忠臣得納其誠武臣得盡其力矣於是徵之周秦覃及聖代必極精簡有合箴規特立新編裁成三卷謹繕寫封進臣等上奉宸謀竭其鑽仰敢不虔序聖旨冠于篇首云奏回鶻事宜狀以下二首明本有目無文据陸心源唐文拾遺錄補右臣等見楊觀說緣回鶻赤心下兵馬多散在山北恐與奚契丹室韋同邀截可汗所以未敢遠去今因華封迴輿望賜仲武詔令差明辨識事宜軍將至奚契丹等部落諭以朝旨緣回鶻曾忠效又因殘破歸附國家朝廷事體須有存恤令奚契丹等與其同力討除赤心下散卒遣可汗漸出漢界免有滯留如蒙允許望付翰林約此意撰詔兼詔克恭未審影宋本會昌一品集請發陳許軍馬狀右臣等商量賊中人心久合自變猶恐顧望河朔旬月偷安陳許累有戰功軍聲甚振王宰年力方壯才略可稱委之征行必有殊效非惟破賊稹之膽足以堅鎭魏之心倘有先聲必當自潰望詔王宰自揀當軍馬步精兵除合留在鎭外並取河陽相衞路􅀡抵磁州其在鎭兵馬委行敏權知仍差幹事判官一人留務未審會昌三年八月十一日同上賜王宰詔意明本原缺据陸心源唐文拾遺錄補用兵之難在於過險旣收要害便合成功故出井陘而趙師虜過成臯而吳寇殄得略陽而隴坻服入大峴而廣固平近則破鹿頭而翦蜀克郾城而定蔡卿初取天井大振威聲皆謂計日而取澤州指期而擒劉稹頓兵危坂已涉二時日費殆過於千金途隘有逾於九折士不宿飽人已吿勞在朝公卿繼陳讜論皆云卿之血屬質在賊中此一人之常情固當無隱昔樂羊食子文侯見疑愛旣及於懿親義豈後於君上若慮危害晏實未忍急攻但卿披誠朕必深恕卽當與卿移鎭必使兩全如能大義滅親至誠體國捨爾所愛建茲殊勳繼先王鐘鼎之榮傳子孫帶礪之慶卽須厭塞公議早覆妖巢朕之報卿必異羣帥暑潦將至農事已興偃武息人固難淹久深思朕意勿更食言又知卿比留支兵守備萬善旣分武力尤費機謀今授劉沔河陽日臨寇境俾爲聲援常據要衝卿旣進攻必無後慮勉當協力副朕至懷同上詩鴛鴦篇明本有目無詩据全唐詩錄補君不見昔時同心人化作鴦鴦鳥和鳴一夕不暫離交頸千年尙爲少二月草菲菲山櫻花未稀金塘風日好何處不相依旣逢解佩游女更値凌波宓妃精光搖翠蓋麗色映珠璣雙影相伴􅀟心莫違淹留碧沙上蕩漾洗紅衣春光兮宛轉嬉遊兮未反宿莫近天泉池飛莫近長洲苑爾願歡愛不相忘須去人間羅網遠南有瀟湘洲且爲千里遊洞庭無苦寒沅江多碧流昔爲薄命妾無日不含愁今爲水中鳥頡頏自相求洛陽女兒在靑閣二月羅衣輕更薄金泥文彩未足珍畫作鴛鴦始堪著亦有少婦破瓜年春閨無伴獨嬋娟夜夜學織連枝錦織作鴛鴦人共憐悠悠湘水濱淸淺漾初蘋菖花發艶無人識江柳逶迤空自春唯憐獨鶴依琴曲更念孤鸞隱鏡塵願作鴛鴦被長覆有情人上巳憶江南禊事以下七首明本原缺据全唐詩錄補黃河西繞郡城流上巳應無祓禊遊爲憶淥江春水色更無宵夢向吳州北固懷古自有此山川於今幾太守近世二千石畢公宣化厚丞相量納川平陽氣衝斗三賢若時雨所至躋仁壽畢構政事爲開元第一陸丞相象先平陽齊幹三賢皆爲此郡汨羅遠謫南荒一病身停舟暫弔汨羅人都緣靳尙圖專國豈是懷王厭􅀡臣萬里碧潭秋景靜四時愁色野花新不勞漁父重相問自有招魂拭淚巾嶺外守歲一作李福業詩冬逐更籌盡春隨斗柄回寒暄一夜隔客鬢兩年催訪韋楚老不遇昔日徵黃綺余慚在鳳池今來招隱士恨不見瓊枝題柳郎中故居下馬荒堦日欲曛潺潺石溜靜中聞鳥啼花發人聲絕寂寞山窗掩白雲盤陀嶺驛樓嵩少心期杳莫攀好山聊復一開顔明朝便是南荒路更上層樓望故關失題明本原缺据席刻唐詩百家全集錄補肉視具寮忘七箸氣吞同列削寒溫當時誰是承恩者肯有餘波達鬼村畫閣不開梁燕去朱門罷掃乳烏歸千巖萬壑應惆悵流水斜傾出武威句明本原缺据全唐詩錄補檢經求綠字憑酒借紅顔君不見秋山寂歷風飈歇半夜靑崖吐明月寒光乍出松篠間萬籟蕭蕭從此發忽聞歌管吟朔風精魂想在幽巖中霜夜聽小童薛陽陶吹笛銀花懸院榜神撼引鈴縧題學士院葳蕤輕風裏若銜若垂何可擬以上並事文類聚自從一夢高唐後可是無人勝楚王賦巫山神女見雲溪友議牛羊具特俎武昌詩見東觀餘論心悟覺身勞雲中棄寶刀久閑生䏶肉多壽長眉毫有懷甘露寺自省上人京口志書空蹺足睡路險側身行徳裕嘗吟此句云是先達詩附記見桂苑叢談誰家幼女敲筯歌何處丁妻點燈織魚蝦集橘市以下並海錄碎事休咎占人甲挨持見天丁洛下推年少山東許地高世上文章士誰爲第一人老生誇隱拙時輩毀尖新濴寒泉深百尺奇觚率爾操諷諫欣然納
