body:
  text: 書碑與桂州鄭中丞書一􅈡與姚諌議書三􅈡劉公神道碑馬公神道碑與桂州鄭中丞書某當先聖御極再參樞務兩度冊文及宣懿太后祔廟制聖容賛幽州紀聖功碑討囘紇制討劉稹制五度黠戞斯書兩度用兵詔敕及先聖攺名制吿吴天上帝文并奏議等勒成十五卷正觀初有顔岑二中書代宗朝常相元和初某先太師忠公一代盛事皆所潤色小子詞業淺近􅀗􅁇家聲武宗一朝冊命典誥軍機羽檄皆命受撰述偶副聖情伏恐製序之時要知此意伏惟詳悉謹狀與姚諌議邰書三􅈡閏冬極寒伏惟諌議十五郎尊軆動止萬福即日某悲緒外䝉差趙押衙至奉示問不任悚荷無由拜伏陪積瞻戀謹因使囘奉狀不次閏十二月二十八日從表文崖州司戸叅軍同正李某狀上天地窮人物精所弃無復音書平生􅃇知無復吊問閣老至仁念􅃇盛德矜孤再降專人逺逾溟漲兼賜衣服噐物茶藥至多槁木暫榮寒灰稍暖開緘感切涕咽難勝大海之中無人拯䘏資儲蕩盡家事一空百口熬然徃往絶食塊獨窮悴終日苦飢惟恨垂殁之年頓作餒死之􅀑自十月末得疾伏枕七旬屬纊者數四藥物陳裛又無醫人委命信天幸而自活羸憊至甚生意方㣲自料此生無由再望旌棨臨􅁓涕戀不勝逺誠病後多書不得伏惟恕察謹狀伏􅀩又賜口箴不任感戴東都日所惠本留洛中無人檢得兼以道路艱阻二年来不曾有人至洛以此前狀諮請倍深惶悚小生舌箴更攺三五字不欲兩本流傳今謹録新本献上􅃇本伏望封還如不能逺􅀉伏惟必賜焚却下情切望趙總管知廣州時多此吕下旬方此至伏惟照察謹狀唐故左神䇿軍護軍中尉兼左街功德使知內侍省事劉公神道碑宸極正位運四時者璇樞太㣲啓扉分兩垣者上將其或道兼文武勲著旂常禀嶽立之神姿藴泉渟之深識存也岀忠入孝爱敬同歸歿也灑澤漏泉始終一貫求之前古不亦難㢤公諱弘䂓前京兆雲陽人也派流甚逺珪組相承炳焯周􅀖光揚史牒曾祖恩官止同州白水縣令祖信終于漢中􅇿折衝都尉父英皇左武衞中卽􅀅歴階勲至游擊􅀅軍上枉國皆績前緖踐履夷途或朙恕而行俾人歸厚或強毅以立顧敵必摧不􅂋當時冝生逹者公十有五乃應選用冲和之羙暢茂於四肢喜愠之来不塵於絶境亦由崑岫片玉嶧陽孤桐生禀異姿終成重噐始署雲􅀐尉賜緋累遷內侍省內僕寺丞宻侍赤墀飛聲紫禁值操不逾於䂓矩抗志巳在於丹霄無何丁郎􅀅憂苴枲服䘮杖而後起不辭王事是謂從權俄授徴事郎內侍省府局令屬劉闢逆命禁旅徂征護汧隴梟􅀐之鋒平井絡鴟張之虜始以義擊俄焉凱歸由是有輕車都尉之授旋又􅀅命撫循自靈州以屇于邉搞軍五城勤役萬里􅅷乃休績簡于天心加銀印赤紱之賜充天威軍使奉詔蠻方再女憬俗俶儻扶義有叱馭之風感激捐軀忌跕鳶之苦恩禮浹洽要荒宴如㝷自奚官局丞擢翰林院使僊署重深天顔咫尺導才臣之啓沃廣睿哲之聰朙公學富丘墳智參神化叶機賛命彂揮王猷故事藹然內庭繄頼爰加內侍伯貳副軍中尉副左街功德之任紫艾􅀛印之寵以昭其庸武旅鳬藻之師實爲之佐檢校司空王公諤之授􅃏河東也攺内給事爲之護軍以金蘭之契睦於元帥以泉海之量接于賔僚三軍照愛日之和列􅇿靡淸風之悳洎振武失守主將遁逃朝庭軫憂慮焉邉患因命尚書張煦節制是􅀖詔公領歩􅀐五千爲之聲援公內運秘計外示閑安詭以巡邉掩其無備長驅猛銳深入壘門乃以宣劳之名俾其少長皆㑹然後擒執魁􅈡寘之典刑戮三百餘人闔城股悚昔武安之阬趙卒莫辯幽􅁈韓信之戰井陘徒聞疾闘未􅀂公德刑具舉威惠皆宣乗馹上聞班師􅃇鎮司徒既歿承乏總戎而高平公弈葉相門一時盛悳與公虚舟相待朱瑟諧音淡然而成去如始至㝷又奉詔巡邉以觀軍實北至鉤注東逹飛挀道里曲折不遺於掌握兵機竒正盡在於􅁭靈士懐挾纊之恩人感投醪之醉壷􅄴塞路㓜艾争先爰寫山河存於繪事憲宗恱而加歎嘗置座隅得李恂之圖書乃知聚落觀千秋之畫地盡見山川加朝議大夫内侍省內常侍復歸􅃇鎮報忠劳也上以公噐能可以居重任機權可以參宻勿遂發中詔俾還京師攺內飛龍使換右神策軍副使飛龍掌天􅂹之閑古太僕之職也禁旅總蘭錡之兵古上卿之􅀉也公或爲長或爲副盖選衆而舉惟材是擇翌日命知樞宻公揣摩心術練逹國章謀無不成􅏒有餘􅁉當神武經緯之際王師戡定之初一日萬機晝嘗三接忠猷􅀮於聞􅃪嘉謀秘於宫闈畧而不書盖温樹不言之義也真拜内常侍知內侍省事旌其忠力賜名弘規弘者光大之偁規者規範之謂合此二義表玆一心俄而淄青干紀兵集淮海以公累護戎事􅀹䆳武經出爲淮南監軍委以攻討鳴鐘鼓以問罪運籌䇿以出竒方厲志於戈矛􅃍纒哀於風樹抱終身之痛自逹神朙當赴難之辰敢避金革起復寧逺􅀅軍依前充監軍使元􅁖既殱復掌樞宻憲宗慿几大漸召公受遺穆宗膺圖御民繄公定䇿捧日而昇黃道翼龍而上赤霄名節功勛光昭圖史遷忠武將軍內侍省少監賜上柱國進雲麾􅀅軍服闋授銀青光禄大夫監門衞將軍知內侍省事封彭城縣開國子累封沛國公食邑三千戸賜以長戟列之朱門守約鳴謙不有其貴屬幽鎮􅈡禍趙魏挻災公內竭謀猷定指蹤之計外緝機務當政賦之源慮不及􅀻居嘗慎獨懸水鏡而情無􅀮伏持㩲衡而心靡重輕嶷然如山以鎮群動逮長慶季􅀊穆皇戾巳彌留公志仗神朙心存王室請立先后以爲副軍雪涕抗詞􅈡陳大計舉觴􅄋款衆議皆從延年離席而社稷巳安趙喜橫堦而尊卑乃定惟公方之諒無慙徳公以名遂身退舉能進善人之高躅也乃推同志固繁機遷左監門衞上􅀅軍知省事復爲河東監軍使拜泣玉墀寵錫金帶雖魏后深恩授劉稹之部落吳君宻渥賜陸遜之金環煥赫煇榮莫逾於此穆宗厭代先后嚮朙公懇請㑹朝旋奉俞詔拜特進行右武衞上將軍公以子牟之戀常懐魏􅆣汲黯之志惟在漢庭懇辭北轅上不能奪㝷除內宅使鴻臚禮賔等使前代特進位次三公居驃􅀐儀同之上非荗勛俊悳􅂚以處之遷左神䇿軍中尉兼左街功德使漢氏京師有南北軍之屯武帝旣平百粤內増七校今之中尉寔司其任公閱禮敦詩深知􅀅帥之體安人和衆實有經武之材以清凈禮緇黃以慈惠親戎旅西方之教不肅而成北落之衞􅀮然難犯􅄍論必援於經史耽翫惟志於圖書遇物而涇渭自分立誠而風􅀨如晦權雖侔於魏霍主意益親寵雖盛於金張人心咸恱非全才曠度豈能臻於此歟公志氣方􅆠春秋甚富􅀅欲揚威瀚海耀武龍庭展報國之壮圖恢致君之逺畧劳而生疾懇請辭榮天子􅁨吕􅂪之未瘳委丹景之卧鎮近臣挾醫而駢至中使賜藥以交馳心徒傾於太陽命巳迫於朝露洒血懐感啓手歸全以十一月二十八日薨於長安来遲里第享年五十二遺表献名馬雕鞍寳噐犀帶臣子之戀不其至乎敬宗當宁流􅁭􅆸朝三日贈開府儀同三司贈絹一千匹布四百端錢三千貫上擬三台之耀下管九泉之荣禮命所加冠於當代朝廷碩臣聞必興歎和壘故校相視澘然昔李將軍之殂人皆流涕以其信結於士大夫公近之矣况公瞑目之後曾未經旬變起林光災纒霄極則知日磾巳歿何羅之舋遂成許褚旣終徐地之媛莫遏惟公峯巒聳㧞挺秀色於晴霞律吕含和流清音於大厦志必存於經濟量莫挹其冲深思􅀂涌泉智如炙輠决勝千里通知四夷察情僞之端逹㡬㣲之際故天子虚巳以􅃪詢謀允諧道不􅂑於荀容言必歸於中正居平而􅀶厚泛愛臨事而感㮣立名體征虜之奉公得亞夫之守節公之掌樞也屬穆皇􅆍疾逾年公之總戎也屬敬宗朝廷多事公恊和􅀅相安靖􅀖家勁草不揺喬松自直傳偁公家之利知無不爲忠也送往事居俱無怍色貞也惟公有之矣惜乎未及中夀俄歸杳􅄀景巳戢於虞泉名空留於簡冊可不悲㢤夫人宻國夫人李氏懿行蘭薰貞風玉瑩榮封石􅐎寵章全德悳禮茂於宗姻洵羙光於內則悲深畫哭痛結泉扉有子五人長曰行立朝散大夫內侍省宫闈局令上柱國彭城􅇿開國伯賜緋魚袋次曰行深中散大夫內侍省給事賜紫金魚袋次曰行元賜緑次曰行先朝散大夫內府局丞上柱國次曰行咸以珪璧之姿藻身文囿鴻鵠之志矯翼禁林朱紫連華閨門雍睦忠岀於孝􅀒五龍之俊才喪過乎哀有二連之深戚粤以太和元年十一月十四日即幽􅉎於川滻之西禮也青烏啓兆悲壟樹之長隂白鶴臨風嗟吊賓之􅃍返永圖丕績乃􅂐貞珉銘曰皇王神化仰灋星樞始自絲忽風行八區誰參其任公實帝俞出􅄍君命入讃臣謨一其惟后建􅀖外分蕃岳粤則淮壤雄惟朔漠誰護其軍公多智畧􅁪瀚旣寧王猷允􅀂二其漢家宫室上應太㣲布列環衞恢張武威誰司其柄公逹戎機英王流眄忠賢是依三其內外之􅀉安危所注惟公全德乃暢機務羙璧良珪瑞質凝素霜㦸寳刀森然輝庫四其天挺竒志貞􅀂渾金出入三紀賢朙一心寒松在巘霜霰寧侵皇澤之厚川流比深五其趙孟愒景光音遂逺長卿病痟藥石皆晩靈芝難駐竒香莫􅝭光碎珠泉芳消蘭畹六其鹵簿詔􅁙城􅆣之東列旌旗於素滻凝簫挽於朔風落槭槭之霜葉呌離離之晚鴻時一往􅀆舟壑逝魂歸来􅀆松栢中七其唐故開府儀同三司行右領軍衞上將軍致仕上柱國扶風馬公神道碑銘并序夫隴坻長松必備朙堂之制荆岑璞玉終爲大國之寳士或起漁釣而遭時㑹亦有披荆榛而賛王業求之古何代無賢大和六年開府儀同三司右領軍衞上將軍致仕上柱國􅄮山公實封三百戸扶風馬公以侯印罷歸至開成六年九月四日薨於永嘉里第享年六十三詔贈楊州大都督朙年二月八日以鹵簿鼓吹􅁙於京兆㶚陵之原馬公即國之盡忠衞主之臣也公諱存亮字季朙大父瑾皇銀靑光禄大夫考操皇朝議郎房州長史公之先族趙奢嘗以百萬勁兵號爲馬服制秦吞魏因而氏焉厥後文武派分英華不絶武則伸威百蠻鑄銅而表海文則研道六經施帳而授業公􅁇前業蔚爲茂噐終始一貫貞朙六朝德宗時弱冠筮仕風儀夙成帝欲分綺季之劳翼皇儲之重於是暫離武帳出侍龍樓賛蘭英結珮之馨規桐葉剪圭之戯此則史冊之保護也帝欲秩出納之司紏梯航之貢於是副洪羊而實天庫佐安國而禆水衡此又孔僅之方畧也帝欲具飾車旂宣朙衣服公於是典其寮寀重立䂓模疊烟霞以散王侯卷虹蜺而給妃后卿靄施彰於五輅日華揺裔於九游此又叔孫通之文物也帝欲順時巡以察風俗先品實以奉園陵公於是廣靈囿以樹農功来頖宫以列珍饌灋后稷播殖之道遏嗇夫捷給之詞此又􅁲式之理上林也帝欲昆夷即序士馬無譁公於是視秩視玉鈐榮加金鈕以竒謀而恊上將以忠懇而暢皇猷尺籍五符之勤訓馬簡士之要雖程功於衞霍終歸羙於程李此又許歴之副趙奢也元和十三年公自神䇿軍副使詔受雲麾將軍左監門衞􅀅軍知內侍省事兼左街功德使公於是金湯天壘雷電皇威斥㳺堕於五营取材能於七萃備牙􅆶則數逾十萬竭心膂則酬必九遷􅆛貅虎豹之師鵝鸛魚麗之訓文茵貝胄之盛羽葆靈旂之飾奉元㑹則雪霜委積於殿廷侍郊丘則錦綉施張於原野公珪璋挺噐禮樂資身輦下無睚眦之徒轅門多温㳟之士知吕􅀩於行陣重卻縠於詩書􅀳代名卿咸授趙襄之舉漢朝武畧多由去病之門此又方召之佐宣王也敬宗時宫掖無虞蜂蠆暴起塵驚王座熊突彤闈良媛以羅􅃑當衝侍臣以藥囊捍患宸慮未經於細柳天行俄及於穹皇何羅之釁始萌日磾之心已動公於是覧羲皇之轡駐豊隆之馭関壁而納日闢獸落而留六龍指麾殄㓂之兵調停太官之膳群􅇯既成於京觀庻官方及於乘輿公乃率玄甲而清紫㣲奉翠華而入黃道此文耿弇安君父淸妖孽也於是真食井賦紀功旂常文錦玉帶綢繆蕃錫公辭榮畏滿名遂身退坐罇爼而監淮海衞瓘之忠勤也馳軺車而欵天􅆣子牟之誠戀也捐寵綏而授松檟揚王孫之逹命也歸郷里而散金帛蘇季子之行義也慶忌嫉邪之心萬石周慎之志保貞廉而碎􅈡惡讒慝而忘身思患覩漏河之初知機見履霜之漸士君子所以推公之朙識也公始罷淮南監軍使詔除內飛龍使荏苒一紀劬勞六閑朝習華騮莫巡棧皂無竊轡詭銜之患遂翹足交頸之安瘁精爽於北辰播芳烈於来代旋以股肱近地河関要津爰輟信臣再監戎旅繡衣晝行於阡陌金爼暮奠於松楸爲子爲臣忠孝備矣旣而以疾告老乞還京師累表抗辭留中未下天下眷懐耆􅃇注意貞良乆而乃從不奪其志此又終始之大節古今之至人長慶􅀄某泰職內庭􅀗覩公之儀表玉山峻嶺瓊樹高柯霍子孟資性端荘進有常處張子孺小心畏忌毎逺權勢御札盈几天香滿衣􅆖八駿而幸玄洲捧六釣而殪靑兕勛名光焯當代莫儔夫人岐國夫人王氏寳劔早沉於淸渭珠光先閟於黃泉嗣子瓊林使朝議大夫行內侍省奚官局令上柱國扶風􅇿開國公食邑二千戸襲重封一百五十戸賜紫金魚袋元某夙禀英才早聞詩禮守公灋度以紹家風次子幽州監軍使朝議大夫行內侍省內僕局令上柱國賜緋魚袋元貫朝議大夫奚官局令上柱國賜緋魚袋元償儒林卽守內侍省內府局丞上柱國元眞等金貂相映朱紫交輝鳯毛歸羙於一門􅂹足皆期於萬里以某知公故事見託斯文刻石路隅庶紀佳績俾後代知天子聞鼔鼙而憶名將鍳丹靑而思老臣乃爲銘朙堂巍巍天駟前施木帝乗馬是能星馳鳴噣車馬是司趙秦同出後有馬服生趙戰國更覇迭相盛衰趙困長平秦始開基劉累逺孫剪秦無遺劉即范氏累乃龍師厥􅉽緜緜㝷源乃知貞元年中公侍丹墀一善及物知無不爲進退諤諤行無越思朙朙六聖信任不疑赫赫貞臣顛危必持理身淸靜成國雍熈實本兵柄左右皇威内訓七萃七萃如􅆛外遏百蠻百蠻以綏冬有愛日人心所歸疾風勁草輿論欽之始去禁衞萬夫涕洟逮總天廐六閑允釐盡瘁事國形神乆疲監視諸矦琴書自怡金印組綬去之􅀂遺陶徑潘園􅄖㳺在斯長慶云年詔樹豊碑上將刻字文以好辭後十六年藎臣其萎原阡松檟􅀆霜露巳滋􅁐池䑓榭􅀆榛蕪可悲覩塵根􅀆空嗟蔓草􅂐貞珉􅀆攸媿色􅁝李文饒别集卷第六
