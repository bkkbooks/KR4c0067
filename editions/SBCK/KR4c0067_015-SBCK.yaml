body:
  text: 論用兵三譯語人狀請更彂兵山外邀截回鶻狀殄㓕回鶻事宜狀李靖傅事狀討襲回鶻事冝狀昭義三軍請劉􅍬勾當軍務事狀李彦佐翼城駐軍事狀請賜澤潞四靣節度使詔狀幽州鎮魏使狀請賜引敬詔狀請彂陳許軍馬狀論彦佐劉􅃆下諸道客軍狀論陳許兵馬狀論河陽事冝狀奉宣王宰直磁州商量奏狀請賜仲武詔請授王宰兼行营諸軍攻討使石雄請添兵狀請問薄重荣賊事宜狀請問生口取賊計策狀請諸道進軍狀論劉稹送誠款與李石狀論譯語人狀右緣石佛慶等皆是囘鶻種類必與本國有情紇扢斯專使到京後恐語有不便於囘鶻者不為飜譯兼潜將言語輒報在京囘鶻望賜劉沔忠順詔各擇解譯蕃語人不是與囘鶻親族者令乘遞赴京兾得互相參騐免有欺蔽未審正月十日㑹昌二年請更發兵山外邀截囘鶻狀右緣囘鶻既巳討除湏令殄滅今可汗窮蹙正可梟擒忽萬一透入黑車子部落必恐延引歲月勞師費財望速詔忠順令進軍於山外黑車子去路邀截恐振武軍馬數少其李思忠下沙陀五百騎易定軍馬一千騎便令何清朝押領同去如至隂山北蕃知囘鶻猶在舊處便令從北進軍取背則前後受敵必無所迯未審月二十五日㑹昌三年正殄滅囘鶻事宜狀右臣等商量回鶻衰殘取之在速一切須令三月巳前事了陛下若欲早見功効須激勸人心自古用兵皆懸賞格以此誓衆人必輕生今因景度等往幽州太原振武望三道各賜敕書如兵馬使巳下大將取得可汗便授金吾小將軍及大郡刺史賞錢一萬貫如取得宰相便授兼御史大夫賞錢五千貫若是小將軍長行取得白身授兼御史中丞賞並准此今可汗與宰相只有四人直依此酬賞只用二萬五千貫文比一月供軍所費五分之一如此即得義知勸黠虜無逃伏望出自宸􅂨早賜朙敕處分未審年正月㑹昌二日二十李靖傳事狀貞觀三年突厥諸部離叛朝廷將圖進取以靖為定州道行軍總管率驍騎三千自馬邑出其不意宜趍惡陽嶺以逼之頡利可汗不虞於靖見官軍掩至於是大惧四年靖進擊定襄破之可汗僅以身遁頡利可汗退保鐵山遣使入朝謝罪請本國内附又以靖為定襄道行軍總管往迎頡利頡利雖外請朝謁而潜懷猶豫其年二月太宗遣鴻臚唐儉將軍安修仁慰之靖揣知其意謂副將公謹曰詔使到彼虜必自寛遂選精騎一萬齎二十日糧引兵自别道襲之公謹曰詔許其降行人在彼未宜討擊靖曰此兵機也時不可失韓信所以破齊也如唐儉軰何足可惜督軍疾進司師進隂山遇其斥候千餘帳皆俘以随軍頡利見使者大悅不虞官兵至靖兵將逼牙帳十五里虞始覺頡利畏威先走部衆因而潰散靖斬萬餘級頡利乘千里馬將走投吐谷渾西道行軍總管張寳相擒之以獻討襲回鶻事宜狀右臣等伏見李靖再破頡利可汗方始擒得望付翰林錄李靖傳詔示劉沔曉諭云比者未取却公主與回鶻接戰朝廷力稍不及舎之即易今既取却公主又與回鶻接戰即須翦除令盡不得遺生後患兼令揀退渾沙陀共三千騎摐排比兼曬取三千人十日乾粮及乾蒸餅聞塞上五百錢買得一頭牛亦令約人數曬取牛肉乾脯且如此排比待景度幽州使回令劉沔專差信實軍將至景度數探問事情如仲武便肯出軍討襲即須且讓仲武不得爭功如仲武不詞言悠慢未有去思即須及塞草未青虜馬羸弱便令蕃軍掩襲必見成功其李靖傳事謹連奏上伏希聖明採納五月五日㑹昌二年論昭義三軍請劉稹勾當軍務狀右伏以元和中李師道自擅一方乆為桀逆及王師壓境天網四陳劉悟頗識轉禍之機乃有納忠之効朝廷奬其歸命寵遇渝渥待以信臣委之雄鎮從諫因父殁自揔兵權屬寶歴中政務因循事歸苟且與其符節以紊國章然猶恭守詔條咨􅓪善道亦修覲禮一至􅏱庭驟陟台階實非公議爰自近歲頗聚甲兵招致亡命之徒遂成逋逃之藪􅇶於邪說自謂雄豪及寢疾弥留罔思臣節又令紀綱舊校誘動軍情樹置騃童再圖兵柄陛下以澤潞􅀇宗歴試舊地有上黨故風俗和平人心忠義艱難以後多用儒臣又以劉悟功著先朝欲全其宗族特令供奉官薛士幹宣諭示以聖情而將校繼有表章未從明命臣等伏思劉悟以師道之逆親自梟夷誠合示一軍大順之源置子孫於無過之地而乃繼師道覆車之􅁤襲怙亂之風此而可容孰不可忍固須廣詢庭議以盡羣情臣等商量望令兩省御史臺并文官四品以上武官三品以上於尚書省集議奏未審五月二日㑹昌三年李彦佐翼城駐軍事宜狀右彦佐即至翼城計賊中軍人百姓必有歸降來者彦佐務推恩信必盡綏懷臣等深慮賊中潜奸人許為降附人數漸廣必有異謀臣等商量望付翰林詔示彦佐如有百姓歸降量事優䘏各令復業如軍歸降者亦須各有優賞便令將朝廷意㫖轉相招誘逐旋踈理處置不得留在翼城如軍人已歸降者不許却入賊中即望於界上别立一营令屯集委彦佐揀幹事軍將别將三五百人主領仍不與器械並不得令在晉絳界内屯集未審六月五日㑹昌三年請賜澤潞四面節度使右臣伏見後漢秦豐叛光武令朱祐盡力攻之至窮困豐乃將其母子九人降祐光武不舎其罪至洛陽斬之大司馬吳漢劾奏祐違詔受降失將帥之任伏以兵未交鋒便能歸順湏存大信猶可曲全今劉稹告論不悛加兵自備逆命之罪天地不容若至窮蹙歸降並不得受臣等謹録漢朝故事如前望付翰林録示元逵彦佐劉沔茂元弘敬及義逸行周等詔令准此處分未審月十九日㑹昌三年六幽州鎮魏使右緣秋氣已至將議進兵幽州須早取可汗鎮魏須速平劉稹各要遣使諭㫖兼濳探三鎮軍情今日延英面奉聖㫖欲令張賈充使臣等續商量張賈幹濟有才甚諳軍中事體然性稍負氣不安恬恐不如且輟李回充使如以綱臺不可暫􅏱即兵部侍郎鄭涯久充戎鎮判官性甚精敏雖無詞辨言亦分朙官重事閑最相宜稱未審十一日㑹昌三年七月請賜􅀪敬詔又緣令王宰自領陳許兵直抵邢州要詔示元逵􅀪敬諭以河陽太原皆隔山險進軍未得緣卿等已東面進軍賊中慴惧近日頻入晉絳焚燒村舎地邇關輔深要防虞恐昭義知西面進軍稍難偷安旬月今令王宰自領全師直抵磁州以分賊勢望付翰林約此意撰詔未審月十一日㑹昌三年八論彦佐劉沔下諸道客軍狀右訪聞諸道客軍皆自有都頭常相顧望不肯効命請依河朔軍法委彦佐劉沔每三二千人分為一團如有應急使用處便㸃一團令去一切成敗責在都頭如此則人必齊心將皆惧法臨機赴敵不敢因循如䝉允許望付翰林各賜詔處分未審月十五日㑹昌三年八論陳許兵馬狀右緣魏博討賊遷延頗招物議昨令陳許兵馬直抵磁州此是制敵深謀攻心上策徐廼文到京之後方知陳許發兵便云􅀪敬全軍自取磁州則是畏惧陳許須待􅀪敬出軍表到方得委知若便遣王宰罷行亦是姑息太過只緣河陽山險攻討艱難王宰頓軍虚費饋運望密詔示王宰但令從容排比未要速便道途賊中聞此軍聲必合破膽魏博若全師自出續止陳許不遲如䝉允許望付翰林約此意賜詔處分未審月二十日㑹昌三年八論河陽事宜狀右緣河陽奏事官髙從真到稱十八日陳後遍山遍谷盡是賊軍茂元兵力寡少頗似危急若賊勢更甚便要退守懷州非惟損挫威聲必恐驚動東洛皆由魏博未有陳戰陳彦佐又隔深山所以併力南攻不得不慮自元和以來賊中用衆皆取軍寡弱處即併兵用力一處不敵後即移向他處計王宰排比已有次第倘遣全軍便發救援河陽不止捍蔽洛京足以臨制魏博如恐全軍費損饋運計王宰必見先鋒望今日降中使賜詔令宜發先鋒五千人便赴河陽所兾免落奸計事幾至切不可更遲如䝉允許望賜茂元王宰行敏詔處分月二十四日㑹昌三年八第二狀右訪聞河陽兵力巳竭弓矢皆盡地邇東洛實係安危向外人情無不憂恐切望詔王宰發先鋒五千人後須自領全軍繼進仍望今日内發使賜詔處分河陽所貯諸道進助軍器械並望且搬賜茂元猶恐器械數少兼望内賜甲一千副弓三千張并􅁌箭三萬隻陌刀二千口兼聞河陽軍用罄竭賞給不充自出軍以來並未有恩賜望賜絹三萬匹且以河隂見在物委度支差脚速搬送未審月二十八日㑹昌三年八奉宣王宰欲令直抵磁州得否宜商量奏来者右臣等商量昨者緣魏博久未進軍兼渉物議所以請王宰全軍直扺磁州以分賊勢所兾昭義破膽􅀪敬不敢逗留今既收平恩殺傷不少便許􅀪敬自當一面必見成功然河朔軍情常須以威臨制􅀪敬一心雖至忠順終慮將校異端况中外人心皆憂河陽寡弱王宰巳排比兵又頒恩賜且令全軍赴河陽兼得遙制魏博兩面事勢皆得機宜未審九月一日㑹昌三年請賜仲武詔右臣等見李回說仲武似疑劉稹未有罪狀及見李回說從諫積􅁖僣侈便忠憤感激告若罪狀如此朝廷固合誅夷臣等商量因處分邉事望賜仲武書諭以深意要云從諫入覲之初茂元縱得痊復且要留鎮河陽行營諸軍須便有所委茂元疾雖加重朝廷亦免它虞前月二十九日延英面奉聖㫖亦以兩道節度同在一處非便臣等商量望授王宰兼行營諸軍攻討使如䝉允許望加劉􅃆張仲武招撫使例降黄敕處分未審九月四日㑹昌三年論石雄請添兵狀右訪聞兾氏去潞州最近纔二百里已下於此進兵最當要害翼城亦是大路須備賊奔衝石雄雖兵數已多終是分張處廣須初允所請方可責其成功今緣西備蕃戎邉鎮不可抽減向東抽發又不及幾訪聞奏事軍將張􅀪慶云陳許徐泗兵初到行營軍外子弟有一萬人已上緣未有戰陣聞不得已稍却歸本道今猶有少壯堪充戰卒五六千人皆是父子兄弟人心齊一臨時使用絶勝諸軍兾氏去賊最近石雄又至驍勇假其兵力事必速成陛下方集大勲不可更惜小費臣等商量望賜石雄義逸詔令與陳許徐泗軍外子弟各召二千人並須揀少壯有武藝堪入戰陣者充仍望約陳許長行制與鄭注交結因緣貨賄濫授鈞衡及歸鎮後又與李訓結託所謀狂險中外具悉自訓注夷滅心不自安頗恃甲兵轉懷悖慢先朝外雖優寵中實懐疑及從諫疾病之時曾無誠款昨遣中使臨問兼借名醫矯託異端竟不相見便樹置劉稹令將校繼獻章表不待朝㫖便令継襲以澤潞一鎮有啓聖舊宫艱難巳來多用文吏如抱真首創軍幕於國兼有大功身殁之後其子皆赴京闕此謂劉稹愚騃廹於軍情望其愛惜家門稍能悛悔頻敢馳突晉絳侵軼河陽近李丕投降及魏博收平恩縣得劉稹牓帖並巳進來皆呼官軍為賊逢着即湏痛殺悖逆如此天地不容想卿逺聞因當奮激卿宜速諭諸蕃部落同滅可汗卿但北邉立功劉稹必當自潰䇿勲命賞以卿一道為先卿深軆此懷兼示將校如䝉允許望付翰林約此意撰詔未審昌㑹月二日三年九請授王宰兼行营諸軍攻討使狀右緣王茂元雖是將家久習吏事深入攻討非其所長訪聞東畿自聞抂寇侵軼尚未安定茂度支權給衣粮徐泗緣有醬菜望以兩處兵馬皆在行營事體須同不可獨給如䝉允許望速賜詔示未審年九月㑹昌三四日二十請問薄仲榮賊中事宜狀右臣等昨於延英奏請降中使問薄仲英生口四十人内幾人是赤頭郎聖意以元逵之故不欲更問臣等商量緣薄仲榮是賊之心腹必盡知謀計終要遣使出城勘問賊中兵馬多少諸界布置防備何處今欲入兵何處最當要害兼問賊中人情還思歸順否直對鎮州押衙軍將仔細勘問不要回避必得事情因此不妨便知生口赤頭郎數元逵知勘赤頭郎賊請諸道進軍狀右縁王宰兵巳深入湏取澤州又恐賊於萬善向東衝突須更尅期齊進正月六日並是良日一日雖是歲首亦合軍機緣軍在行營歲日與常日無異賊中有州縣村閭随分必須作歲乘其無備必易成功其兩日伏在聖朙裁定戎事尚密所降中使望計行程令取事前兩日到行營即待又恐賊中困蹙即自有變望密詔王宰石雄義忠等聞彼有變便須星夜進兼先差專使與彼大将書具云初經變革須得王師應接以安人心兵馬並不入潞州只在三數十里内下营並不驚擾村閭即當秋毫不犯直湏待丘功軍岀潞州新節度使入後處置大叚公事了方得抽軍其元逵弘敬縁隔山東又恐漏􅂥此意並望不賜詔示如􅀩􅁢許望付翰林各賜詔處分月二十二日㑹昌三年十二論劉稹送款與李石狀右臣等得李石狀報劉稹潛有款誠伏以王師壓境巳是六月賊境累經侵軼頗肆猖狂今事勢困窮人心思變困此請命兾逭靈誅望詔李石且與李恬書不得云巳與聞奏但遣將兵屬直界首方敢上聞以此邀之更觀旬月仍望詔元逵􅀪敬王宰石雄便令齊入切料旬朔之内必有變生今饋運之費計至春末並足如二月已來尚未殄滅然議納其代款事亦不遲如䝉允許望付翰林各賜詔處分李文饒文集卷第十五
