  text: 李文饒别集卷第七
  hash: sha256:152d2094d404b09783b7fcc1c14cfcfa050d07e206cfafbf1b95a485cd74fffe
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4c0067_SBCK_027-1a}
body:
  text: 紀六首掌書記􅈦壁記丞相鄒平公新置資福院記三聖記重冩益州五長史真記懐构楼記玄真子漁歌記祭文祭唐叔文祭韋相文崖州掌書記􅈦壁記續漢書百官志偁三公及大将軍皆有記室主上表章報書記雖列於上宰之庭然本爲從軍之軄故楊雄偁軍旅之際飛書馳檄用枚臯非夫天機殊徤學源濬彂含思而九流委輸揮毫而萬象駿奔如庖丁提刄爲之滿志師文鼓瑟效不可窮則不能偁是軄也昔安豊矦竇融徴還京師光武問曰所上表章誰與参之融曰皆從事班彪所爲及竇憲貴寵班固傅毅之徒皆置之戎幕以典文章憲邸文章之盛冠於當代魏氏以陳琳阮瑀管記室自東漢以後文才高名之士未有不由於是選其簡才之用亦金馬石渠之亞况河東精甲十萬提封千里半雜胡騂遥制邉朔惟師旅之威容爲列藩之儀表典玆羽檄代有英髦閒者呉少㣲富嘉謨王翰孫逖咸有制作存於是邦其所不知盖闕如也暨太尉臨淮王總節制之師德𥙿叔父嘗興斯軄㝷以才識英妙肅宗召拜監察御史厥後僕射高貞公今河陽節度令挀公以人文掌宸翰國子司業鄭公給事河南尹杜公以才華豋貴仕繼斯躅者不亦盛歟丙申歲丞相高平公始自樞衡以膺謀帥以右拾遺杜君爲主記朙主惜其忠䂓復拜舊軄㝷參内庭視草之列次用殿中侍御史崔君德𥙿獲接崔君之後文學空虚才術莫迨繼淸塵於吾祖挹芬烈於前賢先是廡廊之下有豊碑紀其名氏而不書職業今再刋斯記于本署西垣以高平公綂戎爲始元和十四年四月十一日記丞相鄒平公新置資福院記夫威鳯之炳然非海晏則不至卿雲之靄然非氣和則不至故君子藏噐抱璞含忠毓德不遭遇其時則光名不曄是以干木之退也高於千乗君曼容之仕也止於六百石先僕射佩虎符而知足視蟬冕而蔑如由斯志矣先僕射苞文武之道有清直之德良玉羙潤徒蓄寳於荆岑喬木幽深不呈材於廊廟知者所以歎息也丞相鄒平公鍾是餘慶爲唐寳臣公天挺竒表角犀特秀居五嶽也禀太華削成之狀方四時也得清秋爽朗之氣森矛㦸以耀頴粲珪璋而洞照盖人之傑歟憲宗皇帝以神武之姿墾除菑害睿慮澹以泉黙英威赫而電㫁竒權秘計皆中詔决之參宸筭者惟公與二三麾士揣摩潤色繄公偁首旣平淮夷盪齊㓂四罪咸服八表晏然雖則武力之拘原亦由謀臣之决䇿洎今上之宅憂也衮龍未襲嚮朙未位召公於東宫含春殿歔欷前席付以大柄公乃請偃武論道與天下休息上若渉水而得舟檝馭馬而有銜轡始拜言以命咎即其時而相說君臣之遇古無儔也公之爲政貞以制動平以偁物其志在於識相體弘簡易而巳嘗以爲用京房之灋則煩碎而亂理聽嗇夫之辨則捷給而傷化由是遵坦夷之路窒邪枉之門不勤人以務逺耻竭澤以言利矧夫洞虚朙之境應必以誠端不言之蹊孰不歸我故奉聖者偁公爲良相焉公之趍丹啓侍紫垣名冠近臣寵加贈典先僕射自弭貂而升左揆先夫人由趙郡而啓大國金印石􅐎當代榮之建中初先僕射以柱下史叅梓潼軍計典昌榮二部益部之內有林居一門里庾氏誅茅始傷於寄寓仲長樹果終見於繁蔚年公纔佩觹志拾青紫方覃思於經籍未馳鶩於文章游焉息焉必在於是及鍾家難乃入爲官暨韋太尉鎮是邦也公釋褐從事在賔幄之間逮玆抗戎旌佩相印曾未一紀繼爲三公下車逾月訪于舊舘卲伯之樹未剪武矦之廬猶在干公邑里遂見高車龍驤門閎竟容長㦸公瞻搆灑泣循陔永思以爲徴壊壁者夫子之居尚毁固朽宅者如来之乗斯逺孰若歸於净土環以香林乃購之於官以爲精舎又以桑門之上首者七人居之所以證迷途而資夙植也殿堂層立軒房四柱鎔金作繪髣髴諸天况乎蜀山葱蒨下臨於雉堞錦江朙㓕近繚於郊垌紅樹倚檻靑蕖傍砌海雛乍来靈草長秀彼之聽和音者不惟於寂慮聞異香者自入於禪薰公之孝思永代作則豈止何充之宅獨入檀那將與文公之堂俱爲不朽某藐焉孤生流落於代辱公感舊遂不見遺公自內庭升台司居視草之列二三年間位偕先逹由是議人倫者歸公之盛德不倍宻坐驟變寒暑迂懸榻之念沗授簡之思且嘗典綸綍獲備官寮報德不讓惧斯文之闕焉長慶二年十月二十二日朝議大夫御史中丞上柱國賛皇縣開國男食邑三百戸賜紫金魚袋李德𥙿撰三聖記大聖祖玄元皇帝有唐寳歴二年歲次丙午八月丙申朔十五日庚戌玉清玄都大洞三道弟子正議大夫使持節潤州諸軍事守潤州剌史兼御史大夫克浙西道都團練觀察處置等使上柱國賛皇縣開國男食邑三百戸賜紫金魚袋李德𥙿上爲九廟聖主次爲七代先靈下爲一切含識於茅山崇元觀南敬造老君殿院及造老君孔子尹真人像三軀皆按史籍遺文庻垂不朽老君按史記孔子適周將問禮於老子老子曰子所言者共人與骨皆巳朽矣擉其言在耳且夫君子得其時則駕不得其時則蓬累而行吾聞之良賈深藏若虚君子盛德容貌若愚去子之驕氣與多慾態色與淫志是皆無益於子之身吾所告子若是而巳孔子去謂弟子曰鳥吾知其能飛魚吾知其能游獸吾知其能走走者可以爲網游者可以爲綸飛者可以爲矰至於龍吾不知其乗風雨而上天吾今日見老子其猶龍耶尹真人按史記老子居周乆之見周之衰乃遂去至関関令尹喜曰子將隠矣疆爲我著書於是老子乃著書上下篇言道德之意五千餘言而去列僊傳曰関令尹喜者周大夫也喜內學星宿服精華隠德行仁時人莫知也老子西逰喜先見其氣知真人當過物色而迎之果得老子老子亦知其竒爲著書與老子俱之流沙西服巨勝實莫知所終重冩前益州五長史真記益州草堂寺里去浣花亭三里成都記云在府西七列畫前長史一十四人長史非今賔佐也節度職不帶尹則帶代稱絶筆余嘗於數公子孫之家獲見圖狀乃知草堂績事靡不造真者昔巖野旁求徒聞審像稽山高遯惟上鎔金孰若記之丹靑妙盡神照楚國祠廟魯王宫室洎此邦文翁舊舘皆圖歴仗卿相粲然可觀雖有慕於前良曾莫究於形似豈與夫年仗巳逺遺像猶存入虚室而烟霞暫披拂浮埃而瑶林斯覿余以精舎甚古貌像將傾乃選其功德尤盛者五人模於郡之聽所追維二漢䑓閣皆有圖冩黃覇于定國雖宰相名臣不得在畫像之列卓子康德行君子而在功臣之右今之所取意在斯乎旣新光靈可想儼若神對吾将與歸因叙其事詔諸来哲大和四年閏十二月十八日西川劍南節度副太使知節度事銀靑光禄大夫檢校兵部尚書兼成都尹御史大夫賛皇縣開國伯李德裕記懷崧樓記懐崧思觧組也元和庚子歲予獲在內庭同僚九人丞弼者五數十年間零落將盡今所存者惟三川守李公而已海路公吏部沈公左丞廋公舎人李公已殘者西川杜公武昌元公中書韋公鎮洎大和已丑歲復接舊老同升台階或纔歎止輿巳恊白雞之夢或未聞稅駕遽有黃犬之悲向之榮華可以悽愴况余憂傷所侵疲薾多病嘗驚北叟之福豈忘東山之歸此地舊隠曲軒傍施僻塊竹樹隂合簷檻晝昏喧雀所依凉飈罕至余盡去危堞敞爲虚樓剪榛木而始見前山除宻篠而近對嘉樹有大辛􅈦事前木所蔽夷樹亦焉草延清輝於月觀留愛景於寒榮晨憇宵逰皆有殊致周視原野永懐崧峯肇此佳名且符夙尚盡庾公不淺之意冩仲宣極望之心貽於後賢斯乃無愧丙辰歲丙辰月銀青光禄大夫守滁州剌史李德𥙿記玄真子漁歌記德𥙿頃在內庭伏覩憲宗皇帝冩真求訪玄真子漁歌歎不能致余世與玄真子有舊早聞其名又感朙主賞異愛才見思如此每夢想遺跡今乃獲之如遇良寳於戯漁父賢而名隠鴟夷智而功高未若玄真隠而名彰顕而無事不竆不逹其嚴光之比歟處二子之間誠有𥙿矣長慶三年甲寅歲夏四月辛未日潤州剌史兼御史大夫李德𥙿記漁歌如左煙波釣徒玄真子張志和西塞山邉白鷺飛桃花流水鱖魚肥靑箬笠緑簔衣斜風細再不湏歸右一釣䑓漁父楬爲裘兩兩三三舴艋舟能緃櫂慣乗流長江白浪不曾憂右二霅溪湾裏釣漁翁舴艋爲家西復東江上雪浦邉風反着荷衣不歎窮右三松江蟹合主人歡菰飵蓴羔亦共飡楓葉落荻花乾醉泊漁舟不覺寒右四靑草湖中月正圓巴陵漁父櫂歌連釣車子掘頭船樂在風波不用僊右五祭唐叔文維元和十二年歲次丁酉六月巳未朔二十一日巳卯河東節度使檢校吏部尚書平章事張弘靖敢昭告于晉唐叔之靈惟神娠母彂祥手文爲信殪徒林之兕以啓夏墟受宻湏之皷以疆戎索豈止削桐無戯歸禾有典冝在晉蕃育與周盛衰况式瞻西山神靈是宅毎廷烟夜簇嵐氣朝隮必膚寸而合油然以遍蓄泄在我神冝主之屬淮雨爲災粢盛将廢是用率玆祀典以榮閟宫伏碩䧏福蒸人撤玆隂沴俾三農有望萬庾斯豊永儲犧牲以荅神祝尚饗奈元和中掌記戎幕時因晉祠止雨太保高平公命余爲此文嘗對諸從事偁賞以爲徴唐叔故事迨無遺漏今遇尚書博陵公移鎮北都輒敢寄題廟宇㑹昌四年三月十五日司徒兼門下侍郎平章事李德𥙿祭韋相執誼文維大中四年月日趙郡李德𥙿謹以𬞞禮之奠敬祭于故相韋公僕射之靈嗚呼皇道咸寧藉于賢相德邁臯陶功宣吕尚文學世雄智謀神貺一遘讒疾投身荒瘴地雖厚兮不察天雖高兮難諒野掇澗蘋晨薦秬鬯信成禍深業崇身䘮某亦竄跡南陬從公舊丘永泯軒裳之顧長爲㨬鶴之愁嘻吁絶域寤寐而周儻知公者測公無罪不知我者謂我何求其心若水其死若休臨風敬吊願與神逰尚饗李文饒别集卷第七
