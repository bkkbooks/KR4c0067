body:
  text: 奉宣代諸道節度使書下代李石與劉稹書代盧釣與昭義大將書代李丕與郭誼書代石雄與劉稹書宰相等書并誅罪人敕宰相與李執方書宰相與劉約書宰相與王宰書宰相與盧鈞書處置楊辨書誅郭誼等敕誅張谷等告中外敕代李石與劉稹書賈群至承二十八日書晦承郎君自知愆負思保生全望闕披誠祈天請命逺述迷復聊慰石懷以石思之郎君為子為臣忠孝並棄居喪未襲阻命專權數遣亂軍侵軼鄰境比者河陽晉絳未有重兵侵犯顔行屢焚廬舍又疆埸之吏牧得彼管簿書皆呼官軍為賊來即痛殺可謂悖言肆口逆節滔天今欲自新誠為善意伏思聖上屈纍朝之法實亦至難在將相等懷忿惋之心豈宜延納然須得實事並見忠誠則聖上矜貸有名群臣陳請有路惟有盡率國屬靣縛來降石即馳詣界首親自受納然後承詔解縳送赴闕庭則在朝公卿豈有異議臨境將帥皆得息詞如擬先求解兵次望洗雪則此暫延旬月之命以偷頃刻之安苟懷是心誰敢保信石屬忝宗室任極台階將身族保人豈是小事况國家自元和以來纍翦叛臣至於事迫計窮潛輸密欵偽詞變詐無不備諳今欲行之必恐非計夫魯陽回日鄒子動天更無其他只在誠信如未從鄙見空獻表章石忝帥臣豈敢容受時不可失幸少詳思不宣石白代盧鈞與昭義大將書鈞謬承寵寄獲撫雄藩實欲布時雨潤物之仁昭蘇合境揚薰風解愠之德安輯疲人想衆心必當感懷况昭義艱難之後常保忠名興元之初又著勳力穆宗以劉稹祖宗乘機變歸欵朝廷委以節義之軍授以腹心之寄豈謂移淄青舊染之俗汙上黨為善之人日往月來群情如醉今王師問罪捋及嵗期憫彼一方迷而不返皆以奉劉稹為義實所懵然且封壤城池莫非王土軍人黎庶莫非王臣劉稹祖父竊我憲章質爾家族蔑棄大義顯負於君親將何詭詞自固於軍旅且夫示衆以大順求人以盡心而五郡從之終乃不悟昔晉侯重耳曰君父之命不校校者吾讐公等豈無誠心見此事理又公等貴劉稹祖者必以識君臣之義審逆順之心濯身滄波上覩白日以此為是遂能樂從今則自遭其時足以行志近者楊辨起於卒伍敢亂晉陽康政孫制等皆是耆將已居右職一旦狂惑助其凶威曾不再旬果就擒縳僇於都市罪及妻孥公等覩此禍機得不深戒李丕中丞能全徑節自拔亂邦曾未一年驟歷三郡已分苑土為國功臣公等見其光榮得不健羡成敗利害昭然可知禍福無門行之即是鈞所以不引古事不飾虛詞直指目前易於取信公等倘梟戮劉稹自建功名大則别領將旄次則不失符竹身受爵祿福及子孫去危就安事同反掌又得戎旅解甲黎庶歸耕老幼無焚灼之虞閭井得宴安之樂再洽恩化豈不美哉先布至懷各當信納代李丕與郭誼書夏首初熱伏惟十三叔動止萬福丕自歸朝廷頗獲優寵三領大郡榮列中司想十三叔逺聞必深喜慰頃嵗寓遊上黨與主公素未相知十三叔翦拂提携遂叨右職尋蒙見哀羈旅申以婚姻託繫援於髙門實光榮於鄙族每懷恩遇刻骨銘肌去年初投國家便蒙聖上於三殿召對此時丕具奏云臣是十三叔遣密歸國先布𣢾誠十三叔久受劉家厚恩未忍便棄留待挾持不得勢力稍衰必擒剪軍中惡人率先歸國聖上深賜信納已記十三叔姓名自後緣丕除授欣州去彼疆界遙遠常抱深恨無由自申今蒙攺授晉州兼充右尚書副使密邇封壤瞻望不遙若不披露赤誠實負姻好回鶻可汗士馬已盡一身歸投黑車子近黠戞斯國王遣將軍百餘人入朝請彂本國兵四十萬衆襲逐可汗擒送京闕又西蕃贊普近亡新立贊普才年十嵗國中至今未定兩蕃宰相以下進表請託附大唐今國家邉塞底寧八表無事須將國力平殄五州除有司饋運之外聖上不惜內府金帛頻以出賜又諸道兵馬微有損傷即徵兵填替必作數年討伐之意十三叔自料形勢必當坐見危亡幸因丕在鄰近朝廷委信必須早圖攻效自取寵榮保衰老之年全一門之命書名竹帛豈不美哉丕只在冀氏相去咫尺只要十三叔有一明據得聖上密知此狀到後且望惠數行手示潛布忠款丕便遣人進上必請密詔安存此事石尚書並不知丕指天誓心逹此誠意幸垂延納不至遲疑禍機在身豈得顧望古人云宴安鴆毒不可懷也蓋以偷安比於鴆毒切望思之臨𥿄零涕此情何極不宣丕再拜代石雄與劉􅍬書雄白比者牙內字一有兵馬使棄纍代之勛業為四海之罪人寄命網羅坐待夷滅將謂迫於將校未遂本心今則將校盡離軍心日駭若不見幾而作必恐受僇於人昨打暮宿寨收得文書云陳許遊奕使賀喜密報云官軍二十五日齊進雄牒報王尚書請勘虛實近得王尚書報云追到賀意勘責𣢾稱曾在昭義效職與彼軍遊奕使唐再清情分至深每因遊奕相見彼此説軍中密事並已承伏王尚書便已按軍令訖賀意又𣢾稱唐再清隔乾河密説云朝廷若與郎君節須從西靣來若從南靣來緣劉公直心懷兩端必恐自取又云二郎疾病絶重命在朝夕軍中已别有凖擬不久即是王人忠武軍何必苦相殺傷又收得彼處投降軍將髙文端等皆云回西諸寨兵馬商量欲立安全慶替兵馬使文端等不願更事全慶所以歸國雄雖久在行間不與先相公交接然俱是河朔軍將臭味略同將覩覆亡不無深惜今聖上方示大信以安危疑倘能自新必舍罪釁况兩靣主兵大將皆有賊心事迫圖全必自救禍兵馬使若不早決大計束身歸降更欲遷延即無所及涼風已至白露將凝弓徑馬豪視險如砥糧儲豐足器甲精堅並是諸道強兵近訪抽到士皆宿飽人有鬪心大兵一交立見憔爛輒申愚慮幸納至懷不具雄白宰相與李執方書宣撰並是奉何司徒頃因軍中擾攘起授翰垣推體國之誠動遵朝典罄守藩之禮終保令名遽此淪亡深可悼惜聞以監軍朝覲貴安物情軍府事權令後嗣勾當本於忠順固匪循私伏以聖上君臨惟新景化施王者之號令事貴有名奉祖宗之法度不可輕易旋觀臣節豈惜恩榮今公卿之議皆請别命戎帥聖上恩深悼往義在安人以司徒之盡忠方垂茂軌想後嗣之善繼必有令圖只在鄰近將帥成其美志元和初兩河跋扈之勢尚未可懷朝廷制置之宜難於今日李師道兵鋒物力足以自強猶悉獻吏員請頒貢賦管內鹽法皆歸有司􅅹款披肝乃授留務王承宗迷而知復尋自納忠進德棣兩州以效誠節故得舉族榮盛一門保安望尚書以朝廷公議兩鎮舊體令速效忠款自求寵榮不使河朔鄰封誤其大計尚書潘方重寄宗室信臣報國之忠仰思展用成人之美必當為忠謀望早布嘉言勤於善誘邀其實效勿受詭詞臨事制宜固在明略若未獲要領無憚再三待知赤誠方可聞奏但出於雅意不可云某等令布此懷其間若須商量者望於判官大將中㨂忠信有才識人令充使至此伏希鑒悉不宣某等狀宰相與劉約書張判官至奉問具承情者尚書以幽薊頻有叛亂志在澄清遠陳嘉猷益見忠懇况先侍中纍代繼美功德在人尚書自按鄰封日彰惠政想彼人情瞻望芬若椒蘭聖上天縱英明文武並用正是忠良報國之日將帥展力之時聖意又以幽薊一方頻害節將懲其汚俗未欲加恩張絳固頓首變亂風恭俟朝旨若擬作三軍章表坐望兵符竊料聖情未必允許倘不早圖良計先效赤誠計不日之間必又致變聞彼軍大將多是舊人感先侍中深恩聆尚書美政導其善意必合遵承且望密遣腹心大布誠信令張絳自求多福以保永安若能請朝廷命帥舉尚書領鎮便自歸闕必不失二畨金吾若欲外任即商量宋亳大郡便與亞相軍中兼與二十萬匹物充賞大將以下皆酬以官榮令此一軍永為朝廷心腹儻不思大義姑務因循即三數月間且不問著既未降朝命何以保安望尚書審更籌度早施方略必不可費國家財力致他日興師儻成此功永光史䇿張判官到後且詳觀事勢密自揣摩可之與否速望報示不宣某等狀上宰相與王宰書近聞遊奕使更收得劉稹章表竊以王太尉武俊有安國之大勳藏於清廟至於孫承宗阻命在鎮猶遣親弟承恭自太原詣張相上表祈哀憲宗不許旋又遣男知感知信入朝屬淄青殄滅因制使楊僕射檢得文案方知危害武相本在淄青承宗無盜殺之罪方獲昭雪今劉稹父子無功皆負重釁既不詣尚書靣縛又不遣家屬祈哀置章表於衢路之間望朝廷降非常之澤悖慢無禮前古未聞逰奕將不便毁除實恐非是况楊辨遣親姪入潞州潛通情計劉稹並不擒送又石會關將楊珍却還石會關兼投賊界劉稹便敢受納已加兵固守比令逆將賈群送表至太原少傳李相公奏聞旋屬軍中有變竟未有進止處分楊辨潛送賈群却歸劉稹亦便受領校童逆狀如此不知進表何為昔漢宣帝將圖霍禹名臣張敞云不合明詔自親其文只合明詔以恩不聽群臣以義固爭令將帥大臣容其章表即是私惠歸於臣下不赦在於朝廷事體之間交恐不可切慮尚書以疆埸之事皆須上聞惟此事抑而不奏未為乖當望向後更有章表便令將校所在焚之惟靣縛而來然後可受領輒此披陳幸垂鑒納不宣某等狀上宰相與盧鈞書聖上以尚書廉簡奉公和惠恤下所至之地皆有能名以昭義乘僣侈之餘非廉簡無以革弊當掊克之後非惠和無以安人故輟自漢南撫寧上黨承入境之日煦然如春壷漿塞途幼艾相慶甚善甚善近頻見章表救雪罪人姑務和寧以安反側竊循雅旨備見深懷然周書云刑亂國用重典蓋以汙染之俗終須蕩滌雖唐虞之際至理之極猶投放四罪天下乃定且以近事明之頃嵗劉總送幽州大將二十人當時執政以苟且為意奏請放還其後朱克融之徒皆是其數朝廷深懲前弊不得不然尚書公忠簡儉皆以具美惟稍闕威斷實願彌縫昔子産戒太叔以政莫如猛夫火烈人望而畏之故鮮死焉水懦弱人狎而玩之則多死焉太叔為政不忍猛而寬鄭國多盜太叔悔之曰吾早從夫子之言不及此諸葛入蜀刑法至峻法正諌曰君初有其地未垂惠恤且客主之義宜相降下願緩刑弛禁以慰其望亮答曰寵之以位位極則殘順之以恩恩竭則慢吾今威之以法法行則知恩限之以爵爵加則知榮榮恩並濟上下有節為理之道於此而著尚書以子産諸葛亮何如人也尚不以寬而理斷可知矣切望寬猛相濟仁勇並施仗義而行臨事必斷不以小惠撓茲至公待一方之人皆明大順然後漸布仁德平之以和斯為得也輒陳至言幸垂信納不宣某等狀上處置楊辨敕敕楊辨起於卒伍獲在福禆方屬徂征敢為桀逆迫遂戎師嘯聚叛徒朕姑務苟安未加顯戮舍其悖亂令赴行營遂駐南轅之軒已盜北門之管戰備符璽并而竊之啓石會重關潛輸逆稹釋賈群縲絏俾逺姦謀惑榆社之義心召橫水之同惡蠆毒近彂於懷袖蟻壞幾漏於江河康政等被枌邑之遺風習華墟之有禮遽忘臣節仍助凶威撫弦登陴曾不興歎以邜投石自取滅亡雖禁暴除殘國之大典然俾其陷辟終用愧懷誅郭誼等敕敕理髖髀者不可以芒刃圖蔓草者必絶乎本根故前代甲兵以正其刑鐘鼓以聲其罪爰用重典庶清亂邦逆賊郭誼等挀鼠之妖依丘穴而自固牛羊之力得水草而逾凶久從叛臣皆負逆氣頃自劉從諌背德反義掩賊藏姦稽其怙亂之謀無非親吏之計劉公直安全慶各慿地險屢抗王師每肆悖言靡懷革靣吳寇將敗周丘尚務於陸梁隴坻向平王揵猶稱於必死况郭誼王協聞邢洺歸款懼覆妖巢賣孽童以圖全據堅城而請命擐甲以祈於撫納要君以蓋其前愆天地神祗所難容舍昔伍被詣吏不免就誅延岑出降終亦夷族致之大辟無所愧懷郭誼王協劉公直安全慶李道德李佐堯劉武德董可武各冝處斬其餘反黨各從别敕處分誅張谷等告示中外敕敕頃者劉從諌與李訓鄭注結刎頸之交濟其姦謀以圖不軌張皇兵力脅制朝廷自擅一方外為三窟張谷陳揚庭等皆凶險無行狡譎多端比在京師人皆嫌惡無地庇身投迹戎藩寄命從諌久懷怨望得肆隂謀或妄設妖言成其逆志或為草章表飾以悖詞既無禮於君親曾不愧於天地自朕君臨萬宇姑務含容而怙亂益堅苞藏未息誘受亡命招聚逆徒志猶恃於金湯心不利於王室近又敢為狂計挾助孽童汚我忠義之軍叶其豺豕之黨天之所棄神得誅之逆賊劉稹弟曹九等張谷并男涯等陳揚庭并男窠郎等張沿并男歡郎等門客甄伐伎術人鄭諗蔣黨逆賊李訓兄仲京郭行餘男台王涯姪孫羽約男茂章王璠男涯並就昭義梟斬訖夫為善者天報以福為惡者天報以殃今沴氣既消逆節咸服方布和於四海庶自戢於五兵宣示中外各令知悉李文饒文集卷第九
