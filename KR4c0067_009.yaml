body:
  text: 奉宣代諸道節度使書下代李石與劉稹書代盧釣與昭義大將書代李丕與郭誼書代石雄與劉稹書宰相等書并誅罪人敕宰相與李執方書宰相與劉約書宰相與王宰書宰相與盧鈞書處置楊弁書誅郭誼等敕誅張谷等告中外敕代李石與劉稹書賈群至承二十八日書晦承郎君自知愆負思保生全望闕披誠祈天請命逺述迷復聊慰石懐以石思之郎君為子為臣忠孝並棄居䘮未襲阻命專權数遣亂軍侵軼鄰境比者河陽晉絳未有重兵侵犯顔行屢焚廬舎又疆埸之吏牧得彼管簿書皆呼官軍為賊來即痛殺可謂悖言肆口逆節滔天今欲自新誠為善意伏思聖上屈累朝之法實亦至難在將相等懐忿惋之心豈宜延納然湏得實事並見忠誠則聖上矜貸有名群臣陳請有路惟有盡率國屬靣縛來降石即馳詣界首親自受納然後承詔觧縳送赴闕庭則在朝公卿豈有異議臨境將帥皆得息詞如擬先求觧兵次望洗雪則此暫延旬月之命以偷頃刻之安苟懐是心誰敢保信石屬忝宗室任極台階将身族保人豈是小事况國家自元和以來累翦叛臣至於事廹計窮潜輸宻欵偽詞變詐無不備諳今欲行之必恐非計夫魯陽回日鄒子動天更無其他只在誠信如未從鄙見空獻表章石忝帥臣豈敢容受時不可失幸少詳思不宣石白代盧鈞與昭義大將書鈞謬承寵寄獲撫雄藩實欲布時雨潤物之仁昭蘇合境揚薰風觧愠之德安輯疲人想衆心必當感懐况昭義艱難之後常保忠名興元之初又著勲力穆宗以劉稹祖宗乗機變歸欵朝廷委以節義之軍授以腹心之寄豈謂移淄青舊染之俗汙上黨為善之人日往月來群情如醉今王師問罪捋及嵗期憫彼一方迷而不返皆以奉劉稹為義實所懵然且封壤城池莫非王土軍人黎庶莫非王臣劉稹祖父竊我憲章質爾家族蔑棄大義顕負於君親将何詭詞自固於軍旅且夫示衆以大順求人以盡心而五郡從之終乃不悟昔晋侯重耳曰君父之命不校校者吾讐公等豈無誠心見此事理又公等貴劉稹祖者必以識君臣之義審逆順之心濯身滄波上覩白日以此為是遂能樂從今則自遭其時足以行志近者楊弁起於卒伍敢亂晋陽康政孫制等皆是耆将已居右軄一旦狂惑助其兇威曾不再旬果就擒縳僇於都市罪及妻孥公等覩此禍機得不深戒李丕中丞能全勁節自㧞亂邦曾未一年驟歴三郡已分苑土為國功臣公等見其光荣得不健羡成敗利害昭然可知禍福無門行之即是鈞所以不引古事不飾虚詞直指目前易於取信公等倘梟戮劉稹自建功名大則别領將旄次則不失符竹身受爵禄福及子孫去危就安事同反掌又得戎旅解甲黎庶歸耕老㓜無焚灼之虞閭井得宴安之樂再洽恩化豈不美㢤先布至懐各當信納代李丕與郭誼書夏首初熱伏惟十三叔動止萬福丕自歸朝廷頗獲優寵三領大郡荣列中司想十三叔逺聞必深喜慰頃嵗寓遊上黨與主公素未相知十三叔翦拂提携遂叨右軄尋䝉見哀覊旅申以婚姻託繋援於髙門實光荣於鄙族毎懐恩遇刻骨銘肌去年初投國家便䝉聖上於三殿召對此時丕具奏云臣是十三叔遣宻歸國先布𣢾誠十三叔乆受劉家厚恩未忍便棄㽞待挾持不得勢力稍衰必擒剪軍中惡人率先歸國聖上深賜信納已記十三叔姓名自後縁丕除授忻州去彼疆界遥遠常抱深恨無由自申今䝉攺授晋州兼充右尚書副使宻邇封壤瞻望不遥若不披露赤誠實負姻好回鶻可汗士馬已盡一身歸投黒車子近黠戞斯國王遣將軍百餘人入朝請彂本國兵四十萬衆襲逐可汗擒送京闕又西蕃賛普近亡新立賛普纔年十嵗國中至今未定兩蕃宰相以下進表請託附大唐今國家邉塞底寧八表無事湏將國力平殄五州除有司饋運之外聖上不惜內府金帛頻以出賜又諸道兵馬㣲有損傷即徵兵填替必作数年討伐之意十三叔自料形勢必當坐見危亡幸因丕在鄰近朝廷委信必湏早圖攻效自取寵荣保衰老之年全一門之命書名竹帛豈不美㦲丕只在冀氏相去咫尺只要十三叔有一朙㩀得聖上宻知此狀到後且望惠数行手示潜布忠款丕便遣人進上必請宻詔安存此事石尚書並不知丕指天誓心逹此誠意幸垂延納不至遲疑禍機在身豈得顧望古人云宴安鴆毒不可懐也盖以偷安比於鴆毒切望思之臨𥿄零涕此情何極不宣丕再拜代石雄與劉􅍬書雄白比者牙內字一有兵馬使棄累代之勛業為四海之罪人寄命網羅坐待夷㓕将謂廹於將校未遂本心今則將校盡離軍心日駭若不見㡬而作必恐受僇於人昨打暮宿寨收得文書云陳許游奕使賀喜宻報云官軍二十五日齊進雄牒報王尚書請勘虚實近得王尚書報云追到賀意勘責𣢾偁曾在昭義效職與彼軍㳺弈使唐再清情分至深毎因㳺弈相見彼此說軍中宻事並已承伏王尚書便已按軍令訖賀意又𣢾偁唐再清隔乾河宻說云朝廷若與郎君節湏從西靣来若從南靣来縁劉公直心懐兩端必恐自取又云二郎疾病絶重命在朝夕軍中已别有凖擬不乆即是王人忠武軍何必苦相殺傷又収得彼處投降軍將髙文端等皆云回西諸寨兵馬商量欲立安全慶替兵馬使文端等不願更事全慶所以歸國雄雖乆在行間不與先相公交接然俱是河朔軍將臭味略同将覩覆亡不無深惜今聖上方示大信以安危疑倘能自新必舎罪釁况两靣主兵大將皆有賊心事廹圖全必自救禍兵馬使若不早决大計束身歸降更欲遷延即無所及凉風已至白露将凝弓勁馬豪視險如砥糧儲豊足噐甲精堅並是諸道强兵近訪抽到士皆宿飽人有闘心大兵一交立見憔爛輒申愚慮幸納至懐不具雄白宰相與李執方書宣撰並是奉何司徒頃因軍中擾攘起授翰垣推體國之誠動遵朝典罄守藩之禮終保令名遽此淪亡深可悼惜聞以監軍朝覲貴安物情軍府事權令後嗣勾當本於忠順固匪循私伏以聖上君臨惟新景化施王者之號令事貴有名奉祖宗之法度不可輕易旋觀臣節豈惜恩荣今公卿之議皆請别命戎帥聖上恩深悼往義在安人以司徒之盡忠方垂茂軌想後嗣之善繼必有令圖只在鄰近將帥成其美志元和初兩河䟦扈之勢尚未可懐朝廷制置之宜難於今日李師道兵鋒物力足以自強猶悉獻吏員請頒貢賦管內塩法皆歸有司􅅹款披肝乃授留務王承宗迷而知復尋自納忠進德棣两州以效誠節故得舉族荣盛一門保安望尚書以朝廷公議兩鎮舊體令速效忠款自求寵荣不使河朔鄰封誤其大計尚書潘方重寄宗室信臣報國之忠仰思展用成人之美必當為忠謀望早布嘉言勤於善誘邀其實效勿受詭詞臨事制宜固在明畧若未獲要領無憚再三待知赤誠方可聞奏但出於雅意不可云某等令布此懐其間若湏商量者望於判官大將中㨂忠信有才識人令充使至此伏希鍳悉不宣某等狀宰相與劉約書張判官至奉問具承情者尚書以幽薊頻有叛亂志在澄清遠陳嘉猷益見忠懇况先侍中累代繼美功德在人尚書自按鄰封日彰惠政想彼人情瞻望芬若椒蘭聖上天縱英朙文武並用正是忠良報國之日將帥展力之時聖意又以幽薊一方頻害節將懲其汚俗未欲加恩張絳固頓首變亂風恭俟朝㫖若擬作三軍章表坐望兵符竊料聖情未必允許倘不早圖良計先效赤誠計不日之間必又致變聞彼軍大將多是舊人感先侍中深恩聆尚書美政導其善意必合遵承且望宻遣腹心大布誠信令張絳自求多福以保永安若能請朝廷命帥舉尚書領鎮便自歸闕必不失二畨金吾若欲外任即商量宋亳大郡便與亞相軍中兼與二十萬疋物充賞大將以下皆酬以官荣令此一軍永為朝廷心腹儻不思大義姑務因循即三數月間且不問着既未降朝命何以保安望尚書審更籌度早施方畧必不可費國家財力致他日興師儻成此功永光史䇿張判官到後且詳觀事勢宻自揣摩可之與否速望報示不宣某等狀上宰相與王宰書近聞游弈使更收得劉稹章表竊以王太尉武俊有安國之大勲藏於清廟至於孫承宗阻命在鎮猶遣親弟承恭自太原詣張相上表祈哀憲宗不許旋又遣男知感知信入朝屬淄青殄㓕因制使楊僕射檢得文案方知危害武相本在淄青承宗無盗殺之罪方獲昭雪今劉稹父子無功皆負重釁既不詣尚書靣縛又不遣家屬祈哀置章表於衢路之間望朝廷降非常之澤悖慢無禮前古未聞逰弈将不便毁除實恐非是况楊弁遣親姪入潞州潜通情計劉稹並不擒送又石會關將楊珍却還石會關兼投賊界劉稹便敢受納已加兵固守比令逆將賈群送表至太原少傳李相公奏聞旋屬軍中有變竟未有進止處分楊弁潜送賈群却歸劉稹亦便受領校童逆狀如此不知進表何為昔漢宣帝将圖霍禹名臣張敞云不合朙詔自親其文只合朙詔以恩不聽群臣以義固爭令將帥大臣容其章表即是私惠歸於臣下不赦在於朝廷事體之間交恐不可切慮尚書以疆埸之事皆湏上聞惟此事抑而不奏未為乖當望向後更有章表便令將校所在焚之惟靣縛而来然後可受領輒此披陳幸垂鍳納不宣某等狀上宰相與盧鈞書聖上以尚書㢘簡奉公和惠恤下所至之地皆有能名以昭義乗僣侈之餘非㢘簡無以革弊當掊克之後非惠和無以安人故輟自漢南撫寧上黨承入境之日煦然如春壷漿塞途㓜艾相慶甚善甚善近頻見章表捄雪罪人姑務和寧以安反側竊循雅㫖俻見深懐然周書云刑亂國用重典盖以汙染之俗終湏蕩滌雖唐虞之際至理之極猶投放四罪天下乃定且以近事朙之頃嵗劉總送幽州大將二十人當時執政以苟且為意奏請放還其後朱克融之徒皆是其數朝廷深懲前弊不得不然尚書公忠簡儉皆以具美惟稍闕威斷實願彌縫昔子産戒太叔以政莫如猛夫火烈人望而畏之故鮮死焉水懦弱人狎而翫之則多死焉太叔為政不忍猛而寛鄭國多盗太叔悔之曰吾早從夫子之言不及此諸葛入蜀刑法至峻法正諌曰君初有其地未垂惠恤且客主之義宜相降下願緩刑弛禁以慰其望亮荅曰寵之以位位極則残順之以恩恩竭則慢吾今威之以法法行則知恩限之以爵爵加則知榮榮恩並濟上下有節為理之道於此而著尚書以子産諸葛亮何如人也尚不以寛而理斷可知矣切望寛猛相濟仁勇並施仗義而行臨事必斷不以小惠撓茲至公待一方之人皆明大順然後漸布仁徳平之以和斯為得也輒陳至言幸垂信納不宣某等狀上處置楊弁敕敕楊弁起於卒伍獲在福禆方屬徂征敢為桀逆廹遂戎師嘯聚叛徒朕姑務苟安未加顕戮舎其悖亂令赴行營遂駐南轅之軒已盗北門之管戰備符璽并而竊之啓石㑹重關潜輸逆稹釋賈群縲絏俾逺姦謀惑榆社之義心召横水之同悪蠆毒近彂於懐袖蟻壊幾漏於江河康政等被枌邑之遺風習華墟之有禮遽忘臣節仍助㓙威撫弦登陴曾不興歎以邜投石自取㓕亡雖禁暴除殘國之大典然俾其䧟辟終用愧懐誅郭誼等敕敕理髖髀者不可以芒刃圖蔓草者必絶乎本根故前代甲兵以正其刑鐘鼓以聲其罪爰用重典庻清亂邦逆賊郭誼等挀䑕之妖依丘穴而自固牛羊之力得水草而逾㓙乆從叛臣皆負逆氣頃自劉從諌背德反義掩賊藏奸稽其怙亂之謀無非親吏之計劉公直安全慶各慿地險屢抗王師毎肆悖言靡懐革靣吴宼將敗周丘尚務於陸梁隴坻向平王揵猶偁於必死况郭誼王協聞邢洺歸款惧覆妖巢賣孽童以圖全據堅城而請命擐甲以祈於撫納要君以盖其前愆天地神祗所難容舎昔伍被詣吏不免就誅延岑出降終亦夷族致之大辟無所愧懐郭誼王恊劉公直安全慶李道德李佐堯劉武德董可武各冝處斬其餘反黨各從别敕處分誅張谷等告示中外敕敕頃者劉從諌與李訓鄭注結刎頸之交濟其奸謀以圖不軌張皇兵力脅制朝廷自擅一方外為三窟張谷陳揚庭等皆㐫險無行狡譎多端比在京師人皆嫌悪無地庇身投迹戎藩寄命從諌乆懐怨望得肆隂謀或妄設妖言成其逆志或為草章表飾以悖詞既無禮於君親曾不愧於天地自朕君臨萬宇姑務含容而怙亂益堅苞藏未息誘受亡命招聚逆徒志猶恃於金湯心不利於王室近又敢為狂計挾助孽童汚我忠義之軍叶其豺豕之黨天之所棄神得誅之逆賊劉稹弟曹九等張谷并男涯等陳揚庭并男窠郎等張㳂并男歡郎等門客甄伐伎術人鄭諗蔣黨逆賊李訓兄仲京郭行餘男台王涯姪孫羽約男茂章王璠男涯並就昭義梟斬訖夫為善者天報以福為悪者天報以殃今沴氣既消逆節咸服方布和於四海庻自戢於五兵宣示中外各令知悉李文饒文集巻第九
