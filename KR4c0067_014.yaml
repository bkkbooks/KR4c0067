body:
  text: 論用兵二論回鶻事冝狀請發陳許徐汝襄陽等兵狀論回鶻石誡宜狀奏振武以北事冝狀奏回鶻事冝狀要條疏邉上事冝狀驅逐回鶻事冝狀公卿集議未盡處分析聞奏狀牛僧孺等集議謹連如前狀徴彂鎮州馬軍事狀請市蕃馬狀葜苾通分領沙陀退渾馬軍狀李思忠畨騎狀河東奏請沙陀馬軍狀請何清朝等分領李思忠下蕃兵狀請賜劉沔詔狀請彂河中馬軍五百騎赴振武狀請彂李思忠進軍於保大柵屯集狀論回鶻事宜狀右臣等纍自精慮回鶻自到把頭烽北已是數日奏報寂然更無侵輪察其情狀只與天德振武界首不殊前日尚書丞郎鄭肅等皆見臣等懇説且欲曲全恩信告諭丁寧縱要驅除只可出於邊將常令曲在於彼未要便與交鋒望更詔劉沔令遣使邀約若事非獲已驅逐不遲恐劉沔撰書敘朝廷意不盡望付翰林賜劉沔書白臣等今月一日所商量遣石雄斫營事今且駐更審候事勢仍望兼賜遂泰詔處二年會昌七日八月十請發陳許徐汝襄陽等兵狀右臣等昨日已於延英靣奏請太原振武天德各加兵備向後不更往來救援伏蒙聖恩許臣等以進狀請更徴發陳許徐汝襄陽等兵今回鶻雖已抽退康志亮稱退渾走捉嵐石等州臣等料其必歸靈夏又河曲黨項回與回鶻有讐至河氷合時深慮可汗突出過河兼與吐蕃連結則為患不細深要防虞其所徴諸道兵恐不可停須要及氷水合時前各到所在謹突具聞奏未審八月十日會昌二年論回鶻石誡直狀右自兩日來臣等竊聞外議云石誠直久在京城事無巨細靡不諳悉昨緣收入鴻臚懼朝廷處置內求奉使意在脫身又云石誡直先有兩男逃走必是已入回鶻料其此去豈其肯盡心臣等伏以自可汗在邊已使苖緽王會楊觀三度告諭又曾領常照安魯卿同往逗留塞上終不悛心石誡直是一卑微首領豈能有所感窹况自今夏已來兩度點檢摩尼回鶻又寵待嗢沒斯至厚恐誡直之徒必懷疑怨此去豈止於無益實慮生姦伏望速詔劉沔所在勒回實為允愜仍望兼賜崔巨玄詔月十八日會昌二年八論振武以北事冝狀右緣回鶻牙帳漸移向東去振武疆界稍近今以草青馬壯深慮有意窺邊望令劉沔於雲伽關及邊界要害添兵嚴加警備先令鄭許陳滑兩道兵馬於代州就糧今緣把頭烽北一川皆是散地若回鶻萬一馳突更無重兵備禦則退渾部落先被破傷太原北境不免騷擾望付翰林賜劉沔詔令酌量事機審探回鶻情偽更於把頭烽北添置令速詳利害聞奏如蒙允許伏望約此意撰詔處分未審十月十日會昌二年要條疏邉上事宜狀一回鶻猶在雲州頗擾邊境據二州蹤迹必無深遠之謀所慮邊上姦人走投回鶻為其設計今在雲朔等州斷天德振武驛路切須有備防患未萌望速令度支差使於河西路潛為準擬一元和八年回鶻回邊磧南支取柳谷路打吐蕃天德防禦使周懷義奏到朝廷未測其故人情無不憂恐陳德裕先臣奏請自夏州至天德復置廢館十一所以通急驛又請發夏州兵士五百人於故經略軍應接驛路兼護黨項臣等未知此路舊館今已廢毁為復猶有存者望使忠順詔於此路量事再修舊館以通天德奏事疾路一訪聞麟勝兩州中間地名冨谷人至殷繁蓋藏甚實望令度支揀幹事有才人充和糴使及秋收就此和糴於所在貯蓄且以和糴為名兼令與節度使潛計會設備如萬一振武不通便改充天德軍運糧使勝州隔河去東受降城十里自東受降城至振武一百三十里此路有糧東可以壯振武西可以救天德所兾先事布置即免臨時勞擾驅逐回鶻事冝狀右臣等纍日商量且如八月九日處分太原三道各嚴兵守備更令劉沔遣使告諭待至來春回鶻人馬羸困之時計會驅逐則漢兵免冒寒苦易為施力臣等思慮量為得計若如此可行即幽州兵馬望且令於夲界屯集待候處分入太原界後即須供出界糧未有用處日費殊廣恐度支物力供饋不辦若慮氷合後回鶻更有馳突事當及早驅逐即須速為計會至十月已後寒凍轉甚恐施力不得須便三五日內方及事機又緣太原步兵鈍弱素為河朔所輕兼本道奏事官孫寮孫儔自稱太原兵敵回鶻不得即須於河朔側近别徴兵滿取萬人方可濟事須令一兩月內便見成功如此即免費資財得早安邊境伏以自兩漢每四夷有事必令公卿集議蓋以國之大事最在戎機元和中征討王承宗李師道長慶中征討李並令集議况聞向外議論不一互有異同若不一度遍詢羣情終為間詞所撓望令公卿集議兩日內聞奏所兾博盡羣議猒服衆心未審八月二十會昌二年日七公卿集議須便施行其中有未盡處須更令分祈聞奏謹具一一如後一議狀云選將練卒未甚得人今緣邊節鎮將下羣守誰人最不稱職文武班中誰人堪任將帥須指陳其事不得泛言一又云守禦要害未甚有備掎角之設不相輔車之謀不相依今何處置兵即為要害何處加備即為相應並須指言去處一又云來即驅逐去亦勿追昨所令集議出師驅逐去亦勿追如此相守何時得了軍糧日有所費邊境終無安寧此最關取舍大計須便堪行用一又云部落能自攻討者不須止遏而邊上諸蕃多者一二千帳少者力又不足各有家口畜産常自護惜昨者回鶻暫到雲州諸蕃奔逃不暇雜虜既無統一誰肯盡心今欲將何部落討逐亦須指言去處一又云各敕邊將遣自招收其逺征戍卒請漸令抽罷此事朝廷非不素知只緣去年將江淮六道衣糧召募天德官健僅經一年更無一人應募李忠順請自招召經半年只得六百人塞上守偹處召得一二千人都未濟事戍卒如何抽罷亦須更别陳方略以前謹具如前昨所降敕旨云且須切應事機不得更為虛論今詳議狀並未切事機臣等商量望令牛僧孺與夷行同議仔細分析兩日內聞奏未審九月二十會昌二年牛僧孺等奉敕公卿集議須便施行其中有未盡處須更令分析謹連如前右臣等伏詳公卿所議猶未切要狀云邊將不聞以攻守之術上聞朝廷則將略可知也又諸道徴兵其數不少烏合之衆號令不齊又近者回鶻攻劫雲州漸入內地節級城守莫能式遏亦未見鄰近堡柵首尾救援者竊詳此意只是見大段形勢實未切事機朝廷比來待遇回鶻惟推恩信諭其職分使自退歸所徴戍兵只令守備都未嘗有攻討之意昨來回鶻迫於飢困至雲州劫奪牛羊已為侵暴事須與城柵鬪敵兵法所謂疾雷不及掩耳便云莫能式遏亦似過誣堡柵既無重兵合須自守令其首尾救援亦是虛談自古所云烏合之衆皆謂臨時召募未經訓習如韓信驅市人而戰即是烏合陳許淄清等兵並是節制之師久經戰伐但令一處指揮自然號令齊一固不可謂之烏合又云漢兵逺襲恐遺虜擒兵法云善用兵者致人之師不可自致所謂致人者是令其自來况虜騎倐忽以來疾如風電固不合將兵遠襲今可以計者緣其有家口輜重不離漢境二三百里逺去未得既有定所便可為謀魏武破烏丸李靖擒頡利皆用此計公卿等都不議及亦似未見叱勢非令集議只緣問驅逐守備二計何先今既云守備過冬方圖進敢斯為上䇿便可施行即與昨來加劉沔招撫使且令告諭理亦相近恐不暇更有訪問未審九月七日會昌二年請發鎮州馬軍狀右太原奏事官孫儔適到云回鶻移營近南四十里劉沔料必是緣契丹不同恐襲其背所以移營又幽州進奏官孫方造云仲武破回鶻之時收得室韋部落主妻兒昨室韋部落主欲將羊馬金帛贖妻兒仲武並不要只令殺回鶻監使即還妻兒室韋使己領幽州軍將同去殺回鶻監使緣軍將未回仲武未敢聞奏據此事勢正堪驅除臣等問孫儔與幽州合勢向前移營驅除得否更要添多少兵馬孫儔答云若係移營亦不要添大段兵馬只緣大同軍兵少得易定一千人助大同即得其鎮州馬軍臣等商量不用徴發穩便未審月十二日會昌二年九請市蕃馬狀右訪聞蕃渾羊馬多在渾河川恐啓戎心更來侵掠回鶻未退尤須備邊朝廷比來所乏最在戎馬因此收市深得事機宜收壯馬令入東保無散失臣等商量望委劉沔誘論畨人緣回鶻常有意劫奪恐畨人作主不得應堪服衣甲壯馬並與收市其以太原見貯户部物充賞價如市收得後旋送樓煩監收管諸道若有欠闕即量賜與如蒙允許望付翰林賜劉沔詔處分未審月十一日會昌二年九請葜苾通等分領涉陀退渾馬軍共六千人狀右奉宣旨思忠請前件馬軍合勢令商量奏來者臣等商量令劉沔與幽州振武天德合出大軍置營柵漸移向前逼蹙即令思忠領蕃渾馬軍深入計思忠兵勢相及可汗牙帳必自有變兼令招其降者即易成功其蕃兵分為兩廂各令蕃將押領至為穩便何清朝葜苾通是蕃人各令管一廂所兾諸識虜情易為指使如蒙允許其何清朝計行李永遠望便以中書門下帖追未審月十三日會昌二年九李思忠下蕃騎狀右臣等訪聞退渾與回鶻久為讐怨恐合勢後不與思忠叶心或生别事須令遂泰審與劉沔商量如有可疑即便假發遣其興唐感義奉臣誠等軍及契苾退渾等部落先各有本管都使都督須令部領自去即得兵將各相諳識易於指揮望付翰林賜劉沔忠順遂泰等詔處分月二十七日會昌二年九河東奉請留沙陀馬軍右思忠本請蕃騎緣言語相通易於指使若令易定兵去恐不相當魏楚又稱向北進軍每頭軍事須得蕃兵一二百騎引行若全令抽却進軍不得臣等商量沙陀兵望許劉沔量留一半其一半依前令與思忠合勢如蒙允許望賜劉沔詔處分十月五日會昌二年請何清朝等分領李思忠下蕃兵右臣等前日商量令契苾通等不受思忠指揮何清朝分領部落臨事取思忠指揮昨日奉宣恐契苾通等不受思忠指揮不要分領臣等亦有深慮不敢不再陳論沙陀部落此在太原衙內性至循良於人情押熟不令别人管領亦得所虜退渾昨者張獻節才欲責罰便凝為惡忽恐思忠制御不得却自因此生事契苾通本是蕃中王子先在蔚州且遣分領必上下情通更無所慮又思忠雖志誠效順然使用之初亦未可獨任漢將分領事亦得冝契苾通等雖是蕃人任使已熟切更誡勵豈敢不順思忠臣等所見如此伏望聖明裁斷未審十月八日會昌二年請賜劉沔詔右訪聞劉沔頗練兵機惟臨機決䇿不免遲疑兵書云用兵只聞拙速不聞巧遲深恐過為慎重漸失事機望賜劉沔詔比緣回鶻未為擾侵且務綏懷今既殺僇邊人驅劫牛馬頻已有詔速令驅除自度便冝臨機應變不得過懷疑慮皆待指揮朝廷既假以使名令為諸軍節制邊境之事皆以責成向後或要移營進軍一切自取機便不必皆候進上未審年十月會昌二日十七請發河中馬軍五百騎赴振武右臣德裕得忠順狀請自至界上親臨賊營專看事機首為撲滅緣當道軍馬數少請馬軍一二千騎臣等商量緣可汗移營已近振武忠順勇於戰鬪必可指蹤河中地間馬軍有朔方舊法都虞候川防戎臣素所諳知望發馬軍五百騎令王縱部赴振武取忠順指揮今當回鶻衰殘亦要及時驅逐事有應變不可憚煩仍望賜絹一千八百匹內三百匹充職掌人優賞以戶部物充度支差綱發遣兼望令中使送如蒙允許望付翰林賜詔處分兼詔示忠順守志其賜忠順狀謹連封未審二月十日會昌二年十李思忠請進軍於保大柵屯集狀右伏以今年八月制置待諸道進軍移營逼可汗衙帳即李思忠領衍蕃騎深入覆其巢穴續緣劉沔張仲武確稱冬寒進軍未得請待正初今已及期望詔劉沔張仲武一時進軍以壯思忠兵馬恐不令往中受降城令在保大柵屯集稍焉穩便望付翰林賜思忠遂泰詔處分其劉沔仲武詔意謹同封進二年會昌十七日十二月二李文饒文集卷第十四
