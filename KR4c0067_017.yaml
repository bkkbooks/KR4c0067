body:
  text: 密狀論遊幸狀論討襲回鶻狀論幽州事宜狀論田群狀論劉稹狀論鎮州奏事官高迪密陳意見二狀進任畹李丕狀奏續問得高文端賊中事宜四件狀論天井兾氏事冝狀論沼州事冝狀論回鶻事宜狀進振武節度使李忠順狀論潞府事宜狀論昭義軍事冝狀論遊幸狀人君動法於日右臣竊見近日陛下畋遊稍逺還宫近夜伏以人君動法於日故日出視朝日入宴息古人云將旦清風發羣隂伏君以臨朝不牽於色日將入侍君就房有常節伏望陛下深察古人之言向後遊幸不至侵夜人君動敬天道古以人君天之所豫常宜奉順天道亦猶人臣之事陛下常須戒慎臣雖暗昧不知天道近頻見中朝人說自秋已來五星所行稍失常度此皆天意殷勤警戒陛下毛詩云敬天之渝無敢馳驅又古人云動人以行不以言應天以實不以文伏惟陛下稍節馳驅以順天意以前臣伏蒙陛下自逺鎮授之鈞衡若畏避不言實負恩德不敢對諸宰臣論奏謹具密狀以聞不任惶懼迫切之至討襲回鶻事宜狀右臣頻奉聖㫖緣回鶻漸逼把頭烽早須討襲兼如何取得公主者臣久經思慮非不精詳回鶻皆騎兵長於野戰若在磧􅒾難與交鋒雖良將徑卒無以制勝臣比聞戎虜不解攻城則知除馬上馳突其他並不慣習臣料必無遊奕伏道又未會斫營倘令石雄以義武馬軍一千騎兼揀退一千騎精選步卒以為羽翼銜枚夜襲必易成功臣夙夜籌度無出此計如以為允伏望各賜密詔處分臣伏望留中不出論幽州事宜狀右臣伏見報狀見幽州雄武軍使張仲武已將兵馬赴幽州雄武軍使今日奏事官吳仲舒到臣宅臣扶疾與之相見細問雄武只有兵士八百人在此外更有土團子弟五百人臣問兵馬至少如何去得仲舒答臣云只繫人心歸向若人心不從三萬人去亦無益據此說即是仲武得幽州人心又云張絳初處置陳行泰之時巳曾喚仲武欲讓與留務是衙門內一二百人未肯仲武行至昌平縣去幽州九十里却令歸鎮臣又問萬一入不得即有何計仲舒云幽州軍糧並貯在媯州及向北七鎮若萬一入未得却於居庸關守險絶其糧道幽州自存立不得伏以陳行泰張絳皆是邀求符節固不可比仲武先布𣢾誠候朝廷指揮因此拔用必能盡節加之恩寵亦似有名緣在假未獲面奏謹先密奏伏望留中不出論田羣狀右臣數日來竊聞外議云田肇緣田羣抵法不食而終義動人倫無不傷歎伏見後漢時河間尹入頴川人史玉皆坐煞人當死尹次兄初史玉母渾皆詣官曹來代其命因縊而物故漢帝哀之並赦其死既有故事敢不密陳臣若於中書公論必外為人傳說臣對諸宰臣不敢議及此事今手狀陳奏實願發自天慈必兾中外人心無不感悅臣與田肇兄弟唯識其面未嘗交言班行具知非敢謬妄况臣年近六十位忝上公唯願竭肺肝上禆聖德豈敢稍涉情故罔惑聖聰此伏願留中不出論劉稹狀太原狀附右臣適見度支報狀王宰巳似納其情欵發使之時不以先聞便受表章欲自擅招撫之功昔韓信破田榮李靖擒頡利皆是納降之後潜兵掩襲只可令王宰失信豈得損朝廷武威建立竒功實在今日必不可以太原小擾失此事機緣內養尋常充使恐節將未便承禀伏望降供奉官今日便赴行營自看進軍掩其無備兼許三軍儻立除勳必比諸軍倍加賞賜如劉稹巳出潞府須令全家面縳兼郭誼劉公直張谷陳揚庭李仲京等面縳即受領如劉稹自來却令送回輒不得受兼要降供奉官至晉絳行營密諭石雄若王宰巳納劉稹即石雄無功可紀纍經大陳自當矢石垂成之際須自取竒功便看齊入勿失此便太原右太原只是貧虛犒賞不足從前人心忠順况一千五百人豈足為事必不可姑息寬縱况兵事未罷深慮所在動心望賜李石詔且令身赴行營於側近徴兵討亂兼遣義忠却赴太原許罪其首惡其餘一切不問若兵力可及便須翦戮頃年張延賞在西川因張朏作亂走至漢州却得入成都今令李石且依有兵處却入則不損朝廷威命兼不妨榆社有兵望降使處分以前件臣緣假日兵機切速不暇與李紳等參議謹密狀奏聞如䝉允許便望今日論鎮州奏事官髙迪陳意見二事狀回避偷請官軍不戰兵處右髙迪稱賊中更無他計只是潜抽兵併向一處排陳引官軍索戰官軍即須探知若攻城寨來即要與戰如不來並不要將兵逼逐緣偷兵併來停住三日不得即須却歸本處但三四數度不與戰即賊知官軍覺其情計自然喪氣如此不得便宜後必軍人别有變故每度出軍排陳官軍便逼逐與鬪皆是落賊奸計一度小得便宜後知官軍三箇月瘡痍未復即徹兵又向别處切要王宰石雄義忠常密遣細作探偵知諸處抽兵來即不要戰知抽兵却兵虛處即入兵攻討但常如此支敵萬萬不落便宜請令鎮州魏博深入下營要分賊勢右髙迪稱鎮州魏博兵馬至多並未分得賊勢緣不離舊處下營一兩箇月一度將兵深入燒掠村閭驅討牛馬與乞火相類賊中並固守城邑外有村閭牛馬賊亦不惜今須令鎮州兵馬移軍下寨扼其要害每移三二十里即得魏博即須令早過漳河若且如今日下營處賊中都未忙忽灼然分賊勢未得又云河北節度使朝廷若會其情甚易驅使每賜詔切要好言語優奬彼此不要令知與元逵詔即須云一切委任元逵與弘敬詔即云一切委任弘敬但稍示親信必自盡心以前謹具如前髙迪雖是河北軍將臣每度與言頗似忠信盡望付翰林約此意賜元逵弘敬王宰石雄義忠詔所兾速平殘寇謹録奏聞謹處任畹李丕與臣狀共三道右臣緣小寇未殄前月未與河中留後任畹委曲令轉問李丕有何方略一一條疏報今得任畹書并封送李丕狀兩道並謹封上進其李丕狀一道論請依前敢黃澤嶺路斷賊要害臣近訪知魏城路又狗脊嶺東西經五月十四日陳被賊掘坑塹至深必恐進兵不得古人云戰不勝則易地而處伏望密詔義忠朝清潜移兵取黃澤路掩其不備得否令子細籌度如可去便候進止事貴神速須務至密機計儻漏還備隄防其一狀請令諸軍各齎十日乾糧深入過險此亦是用竒之計伏望約此意賜石雄王逢詔令如此排比石雄就河府王逢就絳州各曬乾糧緣日色猶烈數日可致兼各賜度支側近軍糧米一二千石尤兾集事臣緣寇孽未剪每得四逺文狀皆願一一上聞頻瀆宸嚴不任惶惕伏望留中不出續得髙文端賊中事宜四狀一髙文端稱直下打澤州城恐損官軍兵馬緣賊兵緣有一萬五千人常出一半巳上於四面山谷埋伏待官軍打城困乏即四面齊來救援恐落賊奸計其陳許軍請過乾河北逼澤州更下一寨城連接便築鹿項夾城但從一面起手圍繞澤州每日常須大兵排陳四面扺敵賊救兵賊心危急恐被圍合必有大戰待賊軍退敗乘勢便收澤州如此則不損官軍免落奸計伏望依此詔示王宰一請令王逄進軍取賊回鎮兩寨但兩嶺上排陳直抵賊固鎮寨當川亦須著兵亦抵賊寨緣固鎮兩寨四面懸崖官軍便打必恐損人難收其賊寨更無井水盡喫泉水在寨東南澗內約一里巳來但逼賊寨三兩日絶其取水路賊軍無水可喫即須拔寨退走官軍便可進固鎮東十五里是青龍寨在嶺北側上四面並是懸崖取水亦在寨外還依固鎮寨絶其取水路即得青龍寨東去沁州十五里城寨至牢固賊兵約一千五百人內五百人土軍團練全安慶自領伏望依此詔示王逄一長橋賊都頭王釗約將一萬兵今在沼州城內緣劉稹處置却失天井關都頭茂卿一門又處置却邢洺兩州救援兵馬使談朝清兄弟三人王釗自此疑懼劉稹差親器仗官賈少遇追王釗入潞州並不伏追官健一時呌闞王釗巳持兩端必不肯為劉稹用命本是潞州子弟見有兄弟數人在軍材能最出於衆若招降至多必恐願惜家口又官健投降後為諸軍所殺亦恐非願唯密將意與王釗令將一萬人却入潞州處置得劉稹别與一道節度使兼與檢校髙官更别賜錢物髙文端云官健受苦日久朝夕難過家屬盡在潞州若遣回軍必皆情願臣恐弘敬不知王釗不伏劉稹追呼伏望專降中使密賜詔示令依此速致意與王釗取其回意聞奏河朔多異色人若遣傳意計合必逹一臣問髙文端賊中誰人作急髙文端云潞州城內即有郭誼王協張谷向外即劉公直臣先得元龜狀稱劉公直曾事王晏平常依倚於王宰伏望詔王宰令百方將意與劉公直若肯回戈却取劉稹亦許别與重官酬仍别賜錢物以前謹具如前昨日髙文端到宅辭臣因子細問得賊中事宜兼共商量計策皆似可謹録奏聞謹奏天井兾氏事宜狀右臣昨日晚見鎮州奏事官髙迪云向前巳曾向臣言軍中密事今更有切事要言於臣請不令王助知今山東三州歸降巳平了天井兾氏却須令堅守城寨不得與戰不二十日內必自變生緣賊巳窮蹙不可更逼著恐其計窮必為濟河焚舟之計一人敵十人之命官軍與戰必恐不利若萬一小衄却恐延賊旬月之命緣臨洺巳投魏博當道兵馬過來不得請召弘敬速撥兵取臨洺路便扼武安潞府知山東兵來必梟擒劉稹向聞臣伏見髙迪之言至忠至切伏望速賜弘敬王宰石雄詔處分謹密狀奏聞伏留中不出洺州事宜狀右適徐乃文將弘敬委曲呈臣似憂朝廷處置洺州亦未得所臣細問其故徐乃文云安王巳送啓狀與王釗髙元武又歸投王釗即日有二萬六千人甚得軍心都頭盡皆畏伏取郭誼未得巳前且要令在洺州勾當緣歸降人皆未甚安忽恐惜留王釗未肯放出萬一有此終不如無伏望速降使賜弘敬詔看彼事宜如王釗出彼未得且令勾當待盧鈞到後令赴聞不遲崔叔途是王釗下都頭甚有膽略昨來首謀歸國盡是叔途王釗未出巳前弘敬意且欲留叔途今在闕下伏望於安省安置其弘敬委曲謹封進上委曲中所云中丞是李回謹録奏聞謹奏回鶻事宜狀右自劉稹平後臣久欲奏聞請降職事情中使宣諭仲武令早滅却殘虜兼探仲武見劉稹平後有何言說兩度緣延英論事校多未及陳奏昨日奏事官論博言到傳仲武語與臣近稍得回鶻消息人心頗有離異緣可汗欲得投安西其部落百姓皆云骨肉盡在向南願投國家又云與室韋巳不得所據此時勢即合歸降不然自相破滅伏望因此機便特降供奉官有才識者充使兼賜仲武詔諭以劉稹巳平天下無事唯殘虜未滅常繫聖心仲武猶帶北面招討使合為國家了却殘虜成此功業令超於鎮魏朝廷酬報必極優崇料仲武企羡兩道立功皆加寵位又知朝廷內無寇孽足得捍邉仲武是見機之人必思自效令取嵗內百計招降兼示以優待可汗必令得所緣國家與回鶻久為敵國結怨巳深雖近方戢兵終須早有經略且令招誘最謂得宜臣謹密狀聞奏此狀望留中不出振武節度使李忠順與臣狀一道右今日振武奏事官間丘弘到云却收到河東沒落官健楊惟清等二人稱回鶻可汗在天德北三百里巳下臣昨日巳見李思忠下軍將閻顒說思忠意緣朝廷冊命黠戞斯恐回鶻可汗必懷疾妬與諸小蕃合勢遮截漢使請令漢兵且於天德住待計會黠戞斯兵馬迎接方可進發今忽近天德巳似有驗其邉界事宜李思順皆自有表進訖李思順别有狀一道稱回鶻合祿等一人投降賫得欵云可汗見在兵只有一千五百人衣甲約六七十領角有三隻鼓有四面每度與諸蕃打得羊馬數亦至少旋自分却據此通欵事皆詣實李忠順疑蕃人詐妄未敢奏聞其别狀謹封進上伏望聖慈早加警備以戒不虞臣此狀請留中不出潞府事宜狀右臣伏見報兵馬不肯發赴振武閉城呌反古人云敗軍之氣沒世不復今潞府乘破敗之後又失天險只是憚於征役豈敢更為逆命亦恐是盧鈞姑息太過軍人知其畏懦因此生心然亦須及其事初預為之備臣比見叛亂之地皆是置制太遲及朝廷徴發賊巳處處設備兵法云疾雷不及掩耳又云用兵只聞拙速不聞巧遲去春楊辨便是速討之力旬日而平望賜王宰密詔令府城下揀四千人樅樅排比如巳聞作亂不要更待詔㫖令一千人守石會關令三千人取儀州路把斷武安緣軍糧兵馬多在山東但遺邢州不通自然駐旬月不得邢洺之心未可保亦望密詔王縱溫士各令自守不得出兵唯要與武安路太原兵馬遙為聲援最切在令山東斷絶即立可知剪縱萬一無事不妨且賜密詔王宰先知石雄勇於赴敵計亦知警急必便澤州亦要賜澤州詔守並須用河陽兵馬不得用昭義舊人亦要賜恭甫詔知有警急發馬步一千人赴晉州屯集以防越軼臣纍慮所及不敢不便奏聞伏望留中不出論昭義軍事宜狀右適魏博奏事徐乃文見臣云昨日聞三道使出城一道往魏博恐令弘敬出軍却慮三州不安實非穩便臣當時說向聖意只令石雄至潞州界首搜索惡人恐三州未諭朝㫖知弘敬忠盡故令中使先往遣弘敬安存三州並不徴發乃文稱若如此處置至為切當緣涉縣正當山東系口絶是要地有鎮兵五百人巳下去潞府一百六十里軍糧至多潞州官健月糧皆在此請受恐潞府叛兵急則投竄涉縣搖動三州切要國家先遣兵把捉此鎮有昭義舊都押衙焦長楚是本軍舊人劉從諫降黜令往山東今在邯鄲若朝廷特賜一詔令鎮守涉縣兼把捉潞河徽子口至為穩便如焦長楚不可委信朝廷專揀一武將速去亦得古人云耕當問奴織當問婢蓋以其雖是下賤能識耕織之故臣不諳澤潞界內山川見乃文所說稍似有理不敢不便密狀聞奏望賜留中不出李文饒文集卷第十七
