front:
  text: 李文饒外集卷第一窮愁志并序予頃歲吏道所拘沉迷簿領今則幽獨不樂誰與晤言偶思當世之所疑惑前賢之所未及各爲一論庻乎箴而體要謂之窮愁志凢三卷篇論四十九首銷此永日聊以觧憂地僻無書心力乆廢每懐多聞之益頗有闕疑之恨貽於朋友以俟箴䂓
  hash: sha256:cce02428999f2e848cf9d3cb2c74a74fc9dd1795b9e22853a421a16b5621ac5d
