front:
  text: 李文饒外集卷第一窮愁志并序豫頃歲吏道所拘沉迷簿領今則幽獨不樂誰與晤言偶思當世之所疑惑前賢之所未及各為一論庶乎針而體要謂之窮愁志凡三卷篇論四十九首銷此永日聊以解憂地僻無書心力久廢每懷多聞之益頗有闕疑之恨貽於朋友以俟針規
  hash: sha256:3f568dad86264489211c55a8e8d6a4b720311de810f2fa5c390c9bed789c309c
