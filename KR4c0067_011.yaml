  text: 李文饒文集卷第十一會昌一品制集
  hash: sha256:444d2b1ec37b65011501c6eaeed74bc1dad0cb7df92ace27e02060563e1adb8f
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4c0067_SBCK_011-1a}
body:
  text: 釐革故事請增諌議大夫等品秩狀論時政記等狀論九宫貴神壇狀論九宫貴神合是大祠狀論冬至歲朝賀狀論復中書舍人故事狀議禮法等大事改單于大都護狀論公主上表狀請增諌議大夫等品秩狀右據大唐六典隋氏門下省置諌議大夫七人從四品下今正五品上自大曆二年升門下中書侍郎為正三品兩省遂闕四品建官之制有所未備謹按左氏傳云衮職有闕惟仲山甫補之能補過也仲山甫則周之大臣漢書汲黯稱願出入禁闥補過拾遺後漢書張衡為侍中嘗居帷幄從容諷諌拾遺左右皆大臣之任故其秩峻其任重則君敬其言而用其道况謇諤之地冝用老成之人秩不優崇則難用耆德其諌議大夫望依隋氏舊制升為從四品分為左右以備兩省四品之闕向後與丞郎出入迭用以重其選御史中丞右中丞為大夫之二緣大夫秩崇官不常置中丞常為憲臺之長今九寺少卿及祕書少監國子司業京兆少尹等並省寺之二皆為四品惟御史中丞官業雖至品秩未崇望升為從四品為大夫之二令不隔品亦為丞郎出入迭用以重其選以前臣等商量緣事關朝廷典制須行之可久必在博盡群議詢謀僉同望令兩省御史臺五品以上尚書省四品以上太子太保太常卿參議聞奏未審可否論時政記等狀右長夀二年宰臣姚璹以為帝王謨訓不可闕於紀述史官踈遠無因得書請自今以後所論軍政國要宰臣一人撰録號為時政記厥後因循多闕紀述臣等商量向後每坐日聖言如有慮及生靈事關典替可昭示百代貽謀後昆者及宰臣獻替謀猷有益風教並請依國朝故事知印宰相撰録連署名封印至嵗末送史館起居注右起居注比者不逐季撰録至有去官三五年後猶未送納者伏以每度延英奏事後向外傳説三事猶兩事虛謬豈有起注居皆三二年後採於傳聞耳目已隔固非實事向後起居注記望每季初即送納向前一季文字與史館納訖具狀申中書門下史館受訖亦申報中書門下其起居攺轉便望以注記遲速為殿最如有軍國字一本有大政傳聞疑誤者仍許於政事堂都見宰相等臨事酌量如事巳施行非關機密者並一一向説所冀書事信實免有傳疑修史體例右臣等伏見近日實録多云禁中言者伏以君上與宰臣及公卿言事皆須衆所聞見方合書於史䇿禁中之語向外何由得知或得於傳聞多出邪妄便載史筆實纍鴻猷向後實録中如有此類並請刋削更不得以此紀述又宰臣及公卿論事行與不行須有明據或奏議允愜必見褒稱或所論乖僻固有懲責在藩鎮獻表者必有答詔居要官啓事者自合著明並當昭然在人耳目或取舍存於案堂或與奪形於詔敕前代史書所載奏議無不由此近見實録多載密疏言不彰於朝聽事不顯於當時得自其家未足為信向後所載群臣奏議其可否得失須朝廷共知者方可紀述密疏並請不載如此則書必可法人皆公愛憎之志不行褒貶之言必信矣以前臣等伏見近日實録事多紕繆若詳求托實須舉舊章謹件如前論九宫貴神壇狀右準天寶三載十月六日敕九宫貴神實司水旱功佐上帝德庇下民冀嘉穀嵗登災害不作每至四時初節令中書門下攝祭者準禮九宫次昊天上帝壇在太清宫太廟上用牲牢幣璧類於天地神祗天寶三載十二月玄宗親祀乾元元年正月肅宗親祀伏以纍年以來水旱愆侯恐是有司禱請誠敬稍虧今屬孟春合修祀典望至明年正月癸日差宰臣一人祈請向後四時祭並差僕射少卿尚書等官所兾稍重其事以申嚴敬臣等去月二十五日已於延英靣奏伏奉聖旨令檢舊儀進來者今欲及祭時伏望令有司崇飾舊壇務於嚴潔謹録奏聞伏侯敕旨論九宫貴神合是大祠狀右既經兩朝親祀必是祈請有徴伏以自太和以來水旱愆候陛下常憂稼穡每念蒸人臣等所以上副聖心以修墜禮伏見大和三年禮官御史等狀或言縱司水旱兵荒品秩不過列宿今者五星悉是從祀日月猶在中祀又云太一天一此九神於天地猶子男也竊觀其意皆是以星辰不合比於天地曾不知統而言之則為天地而在天成象自有尊卑謹按後魏五均志大辰第二星盛而常明者為天皇露寢大帝常居始由道粵而陳變通之迹又天皇大帝其精耀魄寶蓋萬神之祕圖與河洛之命紀皆稟焉此則上帝是星之明據也天一掌八氣九精之政令以佐天極微明而有常則隂陽序而大運興太一掌十有六神之法度以輔人極微明而得中則神人和而王道平又北斗有衡權二星天一太一參居其間所以財成天工輔相神道也若一槩以列宿論之實為乖謬又按漢書天神貴者天一太一佐曰五帝古者天子以春秋祭太一則列於祀典其來久矣今五帝猶為大祀則太一豈冝降禮稍重其祀固為得所劉向言祖宗所立神祗舊位誠未易動又曰古今異制經無明文至尊至重難以疑説正也以劉向慱通尚難攺作况臣等學不究於天人禮尤懵於祀典妄為參酌恐未得中伏望更令太常卿與禮官詳定庶獲明據議合為大祀太常卿等奏論冬至嵗朝賀右伏以近例其日若遇有敕權停朝賀惟詣興慶宫賀太皇太后義安太后積善太后不詣闕庭恐乖嚴敬臣子之禮實不遑安臣等商量向後冬至嵗如遇有敕權停朝賀者其日中書門下與百寮先詣東上閣門拜表稱慶望內降髙品宣答百寮受宣畢然後赴興慶宫庶為得禮仍望永為常式未審可否謹録奏聞伏候敕旨請復中書舍人故事右以見天寶以前中書舍人六員除機密遷授之外其他政事皆得商量宰臣姚崇奏云事有是非理均與奪人心既異所見或殊抑使雷同情有不盡臣既是官長望於狀後略言事理優劣奏聞進止自艱難以來務從權便政頗去於臺閣事多系於軍期決遣萬機專在宰弼伏以陛下神武功成昧旦思理精核庶政在廣詢謀詩云不愆不忘率由舊章前漢魏相好觀故事以為古今異制方今務在奉行故事而已數條漢興以來國家便冝行事奏請施行臣等商量今日以後除機密及諸鎮奏請戎事有司支遣錢穀等外其他臺閣常務關於沿革州縣奏請系於典章及刑獄等並令中書舍人依故事商量臣等詳其可不聞奏議禮法等大事右按史記仲尼在位獄訟之詞有可與人共者不獨有也伏以漢魏以來朝廷犬政必令公卿奏議講求理道慱盡群情所以政必有經人皆務學著在史䇿􅙾然可觀臣等商量如有事關禮法群情凝滯者各望令本司申尚書都省下禮官學官詳議意見不同者任為别狀如是刑獄亦令法官同議然後丞郎以下詳具可否聞奏如郎吏有能駮難者皆許上聞並須先據經義其次取正史䇿故事不得自為意見言涉浮華如禮官學官才識出人議論精當者向後擢授臺省官郎吏别與遷擢所冀漢魏之風復行今日以前臣等今月二十五日巳於延英靣奏奉聖旨令條疏將狀來者謹具如前請攺單于大都護狀石訪聞塞北諸蕃皆云振武是單于故地不可存其名號以啓戎心臣等謹詳國史武德平突厥後於振武置雲州都督麟德三年攺為單于大都督聖曆元年攺為安北都護開元八年復為單于都護其安北都護木在天德自貞觀二十一年以來移在甘州遷徙不定今單于都護望攺為安北都護如此制置稍循故事未審可否公主上表右臣等伏見公主上表稱妾李者伏以臣妾之義取其賤稱家人之稱亦要别嫌因循舊章恐未為得臣等商量今日以後公主上表從大長公主以下並望令稱某邑公主第幾女上表仍不令稱族所冀臣千之道因此正名郡主縣主亦望準此未審狀不出李文饒文集卷第十一
