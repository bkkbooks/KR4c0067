front:
  text: 李文饒别集卷第五
  hash: sha256:2e7b86aaef85684b7d0c87cca0580eca330f680180b878707af72909f6efcf08
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4c0067_SBCK_025-1a}
body:
  text: 疏狀諫敬宗搜訪道士疏駙馬不許至要官私第狀代高平公進書畫二狀奏銀裝具狀奏繚綾狀亳州聖水狀玉智興度僧尼狀諌敬宗搜訪道士疏臣聞道之高者莫若廣成玄元人之聖者莫若軒皇孔子昔軒皇問廣成子理身之要何以長久廣成子云無視無聽抱神以靜形將自正神將自清無勞子形無搖子精乃可長生愼守其一以處其和故我修身千二百歲矣吾形未嘗衰又云得吾道者上為皇而下為王玄元語孔子云去子之驕氣與多欲態色與淫志是皆無益於子之身吾所告子者是已故軒皇發謂天之歎孔子興猶龍之感前聖之道不其至乎伏惟文武大聖廣孝皇帝陛下稽玄祖之訓修軒皇之術凝神間館物色異人將以覿水雪之姿屈順風之請恭惟聖感必降真仙若使廣成玄元混迹而至語陛下之道授陛下之言以臣度思無出於此臣所慮赴召者必怪迂之士苟舍之徒使物淖氷以為小術衒耀邪僻蔽欺聰明如文武五利無一可驗臣所以三年之內四奉詔書未嘗以一人塞詔實有所懼臣又聞前代帝王雖好方士未有服其藥者故漢書稱黃金成以為飲食器則益壽又高宗朝劉道合玄宗朝孫甑生皆成黃金二祖竟不敢服蓋以宗廟社稷之重不可輕易此事炳然具載國史以臣微見儻陛下睿思精求必致真隱惟問保和之術不求藥廟靈鍳誰不歡心臣思罄愚衷以禆玄皇駙馬不許至要官私第狀伏見國朝故事駙馬緣是親密不合與朝廷要官往來玄宗開元中禁止尤切臣訪聞近日駙馬公至宰相要官私第此輩無他才技可以延接惟是漏泄禁密交通中外群情以為甚弊其朝官素是雜流則不妨往來若職在清列豈可知聞伏望宣示宰相其駙馬諸親今後公事即於中書見宰相不令詣私第代高平公進書畫二狀鍾張衛索真蹟各一卷二王真蹟各五卷晉魏宋齊梁陳隋冥蹟各一卷顧陸張鄭田楊董洎國朝名畫各卷伏以前代帝王多求遺逸朝觀夕覽取鍳於斯陛下睿聖欽明凝情好古聽政之暇將以怡神前件書畫歷代共寶是稱珍絶其陸探微蕭史圖妙觀一名居上品所􅛽睿鍳别賜省覽進玄宗馬射圖狀伏以玄宗皇帝天縱神武藝冠前王凡所畋遊必存繪事豈止雲夢殪兕楚人美旅蓋之雄潯陽射蛟漢史稱舳艫之盛前件圖臣瞻奉光靈素所寶惜陛下旁求珍迹以備石渠祖宗之美敢不呈獻奏銀粧具狀臣有生多幸獲被昌期受寄名藩每憂曠職孜孜夙夜上報國恩數年以來災旱相繼罄竭微慮粗免流亡物力之間尚未完復臣伏凖今年三月初三日赦文常貢之外不令進物此則陛下至聖至明細微洞照一恐聚斂之吏緣以成奸雕瘵之人不勝其弊上弘儉約之德下敷惻憫之仁萬國群氓鼓舞未息昨奉五月二十三日詔書令訪茅山真隱將欲師處謙守約之道敦務實去華之美雖無人上塞丹詔實率王已偃玄風豈止微臣獨懷忙賀况進獻之事臣子之常心雖有赦不許亦合竭力上貢惟臣當道素號富饒近年以來比舊則異貞元中李錡任觀察使日職兼鹽鐵百姓除實出榷酒錢外更置官酤兩重納榷獲利至厚又訪聞當時進奉亦兼用鹽鐵羡餘貢獻繁多自後莫及至薛蘋任觀察使時又奏置榷酒上供之外頗有餘財軍用之間實為優足自元和十四年七月三日敕却停榷酤又准元和十五年五月七日赦文諸州羡餘不令送使惟有留使錢五十萬貫支用猶缺十三萬貫不足須是諸事節用百計補填經費之中未免懸闕至於綾紗等物猶是本州所出易於方圓金銀不出當州皆須外處回市去年二月中奉宣令進盝子計用銀九千四百餘兩其時貯備都無三二百兩乃諸頭收市方獲製造上供昨又奉宣旨令進粧具二十件計用銀一萬三千兩金一百三十兩尋令併合聖節進奉金銀造成兩具進納訖今差人於淮南收買旋到旋造星夜不輟竭力營求深憂不逮臣若因循不奏則負陛下任使之恩若分外誅求則又纍陛下慈儉之德伏乞陛下覽前件榷酤及諸州羡餘之目則知臣軍用短闕本末有由伏料陛下見臣論奏必賜詳悉知臣竭愛君守官之節盡納忠罄直之心伏乞聖慈宣令宰臣商議何以遣臣得上不違宣旨下不闕軍儲不困疲人不招物議前後詔敕並可遵承輒冒宸嚴不任戰汗之至奏繚綾狀臣昨緣宣索已具軍資歲計及近年物力聞奏伏料聖慈必垂省覽又奉詔㫖令織定羅紗袍假及可輻盤絛繚綾一千匹伏讀詔書倍增惶灼臣伏見太宗朝臺使至凉州見名鷹諷李大亮令獻之大亮密表陳誠太宗賜詔報云有臣如此朕復字一本有何憂再三嘉歎事載史書又玄宗令中使於江南採鵁鶄諸鳥汴州刺史倪若氷作若水一本皆陳論玄宗亦賜詔嘉納其鳥即時皆放又令皇甫詢於益州織半肩子琵琶銲撥鏤牙合子等蘇頲不奉詔書輒自停織玄宗皆不加罪欣納所陳臣竊以鵁鶄鏤牙至為微細若氷等尚以勞人損德瀝款效忠當聖祖之朝有臣如此豈明王之代獨無其人蓋有蔽者弗言蔽而不聞而已本傳作蓋有位者非陛下拒而不納又伏覩四月二十三日德音云侯伯有位之士無或棄豫謂不可者諫字一本作其有違道傷理徇欲懷安靣刺廷爭無有隱諱則是容納善道增光祖宗不盡忠規過在臣下况立鵝天馬蹙豹盤絛文彩珍奇只合聖躬自服今所織千匹費用至多臣愚亦所未曉昔漢文衣弋綈之衣元帝罷輕纎之服仁德慈儉至今稱之伏乞陛下近覽太宗玄宗之容納遠思文帝孝元之恭已以臣前表宣示群臣酌臣當道物力所宜更賜節减則海隅蒼生無不受賜臣不勝繚綾罷進優詔報之其亳州聖水狀臣訪聞此水本因妖僧誑惑狡計丐錢數月以來江南之人奔走塞路每三十家都顧一人取水擬取之時病者斷食葷血既飲之後又二七日蔬飯危疾之人俟之病愈其水斗價三千斗三十千本傳作水而取者益之他水弥字一本作路轉以市人老疾飲之多至危篤昨㸃兩浙福建百姓度江者日三五千人臣於蒜山已加捉搦若不絶其根本終恐無益黎氓昔吳時有聖水宋時有聖火並皆妖妄古人所非乞下本道觀察使令狐楚速令填塞以絶妖源王智興度僧尼狀王智興於新屬泗州置僧尼誡壇自去冬於江淮以南所在懸榜招置江淮自元和二年後不敢私度聞泗州有壇户有三丁必令一丁落髮意欲規避王徭影庇資産自正月以來落髮者無慮數萬臣令於蒜山度㸃其過者一旦百餘人勘問惟十四人是舊人沙彌於是蘇常百姓亦無本州文榜尋已勒還本貫訪聞泗州置壇次凡髠夫到人納二千給牒即回别無法事若不特行禁止比至誕節計江淮以南失却六十萬丁壯此事非細繫於朝廷法度下闕文李文饒别集卷第五
