  - {type: variant, offset: 1493, length: 449, content: 三聖記大聖祖玄元皇帝有唐寳歴二年歲次丙午八月丙申朔十五日庚戌玉清玄都大洞三道弟子正議大夫使持節潤州諸軍事守潤州剌史兼御史大夫克浙西道都團練觀察處置等使上柱國賛皇縣開國男食邑三百戸賜紫金魚袋李德𥙿上爲九廟聖主次爲七代先靈下爲一切含識於茅山崇元觀南敬造老君殿院及造老君孔子尹真人像三軀皆按史籍遺文庻垂不朽老君按史記孔子適周將問禮於老子老子曰子所言者共人與骨皆巳朽矣擉其言在耳且夫君子得其時則駕不得其時則蓬累而行吾聞之良賈深藏若虚君子盛德容貌若愚去子之驕氣與多慾態色與淫志是皆無益於子之身吾所告子若是而巳孔子去謂弟子曰鳥吾知其能飛魚吾知其能游獸吾知其能走走者可以爲網游者可以爲綸飛者可以爲矰至於龍吾不知其乗風雨而上天吾今日見老子其猶龍耶尹真人按史記老子居周乆之見周之衰乃遂去至関関令尹喜曰子將隠矣疆爲我著書於是老子乃著書上下篇言道德之意五千餘言而去列僊傳曰関令尹喜者周大夫也喜內學星宿服精華隠德行仁時人莫知也老子西逰喜先見其氣知真人當過物色而迎之果得老子老子亦知其竒爲著書與老子俱之流沙西服巨勝實莫知所終, WYG: ''}
