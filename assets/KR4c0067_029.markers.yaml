  - {type: indent, offset: 905, content: 　　　, id: KR4c0067_krp_029-bkkind4}
  - {type: variant, offset: 905, length: 0, content: '', WYG: 劇談録李徳裕東都平泉莊去洛城三十里卉木臺榭若造仙府有虚檻對引泉水縈回疏鑿像巫峽洞庭十二峯九𣲖迄於海門江山景物之狀以間行逕有平石以手磨之皆隱隱見雲霞龍鳯草樹之形初徳裕營平泉逺方之人多以異物奉之有題平泉詩曰隴右諸侯供語鳥日南太守送名花賈氏談録賛皇公平泉莊周圍十里構臺榭百餘所今基址猶存天下竒花異草珍松怪石靡不畢致其間故徳裕自製平泉草木記今悉蕪絶唯鴈翅檜珠子柏蓮房玉藻等葢僅有存焉鴈翅檜葉婆娑如鴻鴈之翅珠子栢栢實皆如白珠子藂生葉上香聞數十步蓮蘂跗蕚上花分五朶而實同一房怪石名品甚衆多為洛城有力者取去石上皆刻女道二字唯禮星石及師子石今為陶學士徙置梨園别墅禮星石縱廣一丈厚尺餘有文理成斗極之象師子石髙三四尺孔竅千萬逓相通貫其狀如師子首尾眼鼻皆具足河南志河南長殿南有婆娑亭貯竒石處世傳李徳裕醒酒石以水沃之有林木自然之狀今謂婆娑石葢以樹名五代史張全義字國維監軍嘗得李徳裕平泉醒酒石徳裕孫延古因託全義復求之監軍忿然曰自黄巢亂後洛陽園池無復能守豈獨平泉一石哉全義嘗在巢賊中以為譏已因大怒奏笞殺監軍者}
