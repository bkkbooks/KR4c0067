  - {type: variant, offset: 7104, length: 2, content: 言詩, WYG: 庫全書李衛公外集巻}
  - {type: variant, offset: 7107, length: 767, content: 十四首寄正議大夫行尚書兵部侍卽集賢殿學士賜紫金魚袋裴潾動復有原進退有期用在得正朙以知㣲夫惟哲人㑹且有歸靜固勝熱安毎慮危将憇於盤止亦先機右一植慶在根鍾福有兆珠潜巨海玉藴崐嶠披室生白照夜成晝揮翰飛文入侍左右出納帝命弘玆在宥右二歴難求試執憲成風四鎮咸人三階以融捧日柱天造膝納忠建儲固本樹屏息戎彼狐彼䑕窒穴掃蹤右三我力或屈我躬莫沔三黜如飴三起惟惧再賓爲龍一麾爲飫昔在治繁常思歸去今則合契行斯中慮右四有鳯自南亦􅔘其羽好姱佳麗于伊之滸五彩含章九苞合矩佩仁服義鳴中律吕我来思卷薄言遵渚右五鑿龍中闢伊原右奔下有秘洞豁起石門竹澗水橫松架雪屯岫環如壁巖虚若軒朝昏含景夏淸冬温右六南溪廻舟西嶺望踈水遠如空山㣲似二室峯連四山駢聳玉女乍欹玉華獨踊雲翔日耀如戴如拱右七飛泉挂空如决天潯萬仭懸注直貫潭心月正中央洞見淺深群山無影孤鶴時吟我嘯我歌或眺或臨右八鳥之在巢風起林揺退翔城顛翠亂捫天雨止雲旋亦息于淵人皆知進我獨止焉人皆務朙我獨晦焉邈矣其山黙矣其泉右九寝丘之田土山之上孫既貽謀謝亦遐想儉則爲福華固難長寜若我心一泉一壤造適爲足超然孤賞右十其風自西言彂帝庭飄彼黃素墮於山楹公拜稽首靡敢受荣宸嚴再臨俾撫百城戀此莫處星言其征右十一公昔南邁我不反覩言旋舊觀莫獲安語今則不遑載騫載舉離憂莫寫歡好曷叙愴矣東望泣涕如雨右十二山嵇之舊劉盧之恩舉世莫尚惟公是敦哀我蠢蠢念我諄諄振此鎩翮扇之騰飜斯德未報抵誓子孫右十三迢迢秦塞南望呉門對酒不飮設琴不鼓何以代面寄之濡翰何以冩懐詩以足言無宻玉音以慰我魂右十四開成元年九月相公以太子賓客分司東都九月十九日逹洛下安居於平泉別墅潾輒述公素尚賦四言詩兼述山泉之羙未及刻石其年十一月二十一日除浙西觀察使寵兼八座亞相之重十二月四日彂赴任開成二年有潾自兵部侍郎除河南尹乃於河南𪠘中自書于石立於平泉之山居開成二年九月二十五日河南尹裴潾題諸書載平泉花木劇談録, WYG: 唐}
