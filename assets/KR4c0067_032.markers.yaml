  - {type: variant, offset: 3163, length: 1, content: 夀, WYG: 析秋毫之數小人以為能君子所以不忍為也卜式言天久不雨獨烹𢎞羊天乃雨焉有仲尼之鳴鼓將攻卜式之欲烹致位而反居相位可為之甚痛哉近倖論自古中主以降皆安於近習疎逺忠良其主非不知君子可親小人可去而不改者其蔽有二一曰性相近二曰嗜欲深桓靈之主與小人氣合如水之走下火之就燥皆自然而親結不可解也侯覽張讓所以得蔽君矣元成二后皆有所嗜吹簫撾鼓之娛微行沈湎之樂非倖臣無以承意非近習無以近歡𢎞恭石顯所以得蠧政矣唯人君少欲英明者則能反是如文帝雖有鄧通趙談所信者賈誼張釋之爰盎此所謂少欲也武帝雖有韓嫣李延年而所貴者公孫𢎞倪寛卜式此所謂英明也故君聴不惑政無頗纇近則開元初内有姜皎崔滌以極宫中之樂外有姚盧蘇宋以修天下之政得元成之欲享舜禹之名六合晏然千古莫及其故何也倖臣不得干政事也後代能如漢之文武壽}
