  - {type: variant, offset: 1924, length: 330, content: 是官長望於狀後略言事理優劣奏聞進止自艱難以来務從權便政頗去於䑓閣事多系於軍期决遣萬機專在宰弼伏以陛下神武功成昧旦思理精覈庻政在廣詢謀詩云不愆不忘率由舊章前漢魏相好觀故事以為古今異制方今務在奉行故事而已數條漢興以来國家便冝行事奏請施行臣等商量今日以後除機宻及諸鎮奏請戎事有司支遣錢糓等外其他䑓閣常務関於㳂革州縣奏請系於典章及刑獄等並令中書舎人依故事商量臣等詳其可不聞奏議禮法等大事右按史記仲尼在位獄訟之詞有可與人共者不獨有也伏以漢魏以来朝廷犬政必令公卿奏議講求理道慱盡群情所以政必有經人皆務學著在史䇿􅙾然可觀臣等商量如有事関禮法群情凝滯者各望令本司申尚書都省下禮官學官詳議意見不同者任為别狀如是刑獄亦令法官同議然後丞郎以下詳具可否聞奏如郎吏有能駮難者皆許上聞並湏, WYG: 須}
