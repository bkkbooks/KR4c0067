  - {type: variant, offset: 125, length: 4, content: 出乎功烈, WYG: 貢}
  - {type: variant, offset: 131, length: 3, content: 而文公, WYG: 悉罷進獻此陛下恐聚斂}
  - {type: variant, offset: 135, length: 2, content: 功烈, WYG: 吏緣以成姦彫窶之人}
  - {type: variant, offset: 138, length: 88, content: 在乎文章之下借令衞公當文公時則必以文章顯矣文公得衞公位則必以功烈著矣觀幽州紀聖功碑異域歸忠傳序㑹昌功烈非衞公孰能形容之文公論淮蔡之敗可立而待折王庭湊之兇熖而奪之氣胸中所藴固不止, WYG: 勝其敝也本道素號富饒更李錡薛苹皆𣙜酒}
