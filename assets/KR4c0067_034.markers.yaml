  - {type: variant, offset: 62, length: 0, content: '', WYG: 徳裕字}
  - {type: variant, offset: 64, length: 0, content: '', WYG: 元和宰相吉甫子也少力于學既冠卓犖有大節不喜與諸生試有司以廕補校書郎河東張𢎞靖辟為掌書記府罷召拜監察御史穆宗即位擢翰林學士帝為太子時巳聞吉甫名由是顧徳裕厚凡號令大典冊皆更其手數召見賚奬優華帝怠荒于政故戚里多所請丐挾宦人詗禁中語闗託大臣徳裕建言舊制駙馬都尉與要官禁不往來開元中訶督尤切今乃公至宰相及大臣私第是等無他材直洩漏禁密交通中外耳請白事宰相者聴至中書無輒詣第然之再進中書舍人未㡬授御史中丞始吉甫相憲宗牛僧孺李宗閔對直言策痛指當路條失政吉甫訴于帝且泣有司皆得罪遂與為怨吉甫又為帝謀討兩河叛將李逢吉沮解其言功未既}
  - {type: page-break, offset: 64, content: '', id: KR4c0067_WYG_035-1b, image: WYG1079/WYG1079-0334d.png}
  - {type: variant, offset: 65, length: 4, content: 王楊燕許, WYG: 吉甫卒裴度實繼}
  - {type: variant, offset: 70, length: 11, content: 後儒之可宗者文公韓退之, WYG: 逢吉以議不合罷去故追銜吉甫而怨度擯徳裕不得進至是間帝暗庸訹度使與元稹相怨奪其宰相}
  - {type: 'kr:newline', offset: 82, content: '

      ', id: KR4c0067_krp_034-bkkkrnewl6}
  - {type: line-break, offset: 82, content: '', id: KR4c0067_SBCK_034-1a06}
  - {type: variant, offset: 83, length: 0, content: '', WYG: 代之欲引僧孺益樹黨乃出徳裕為浙西觀察使俄而僧孺入相由是牛李之憾結矣初潤州承王國清亂竇易直傾府庫賚軍貲用空殫而下益驕徳裕自儉約以留州財贍兵雖儉而均}
  - {type: page-break, offset: 83, content: '', id: KR4c0067_WYG_035-2a, image: WYG1079/WYG1079-0335a.png}
  - {type: variant, offset: 84, length: 1, content: 世, WYG: 士無怨再期則賦物儲牣南方信禨巫雖父母癘疾子棄不敢養徳裕擇長老可語者諭以孝慈大倫患難相收不可棄}
  - {type: variant, offset: 86, length: 3, content: 論衞公, WYG: 義使歸相曉勅違約}
  - {type: substitution, offset: 87, original: 衞, replacement: 衛, reason: scribal-variant-collapsed, mapping: {identifier: 'bkk:mapping/variant-fold-v1', hash: 'sha256:9bc9a4233a10ab6fe6494b31262c157187fd580f02a97cad91be81ccd48f7a20', entry: vf-19982}}
  - {type: variant, offset: 90, length: 1, content: 必, WYG: 顯寘}
  - {type: variant, offset: 92, length: 12, content: 功烈言而鮮及於文章論文公, WYG: 法數年惡俗大變又按屬州非經祠}
