  - {type: variant, offset: 227, length: 58, content: 文章也夫道之在天下操之則爲心盡之則爲性持之則爲志養之則爲氣存之則爲神是道也見之設施則爲功烈寓之言語則爲文章易地皆然豈, WYG: 民供}
