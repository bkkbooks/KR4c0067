  - {type: variant, offset: 105, length: 19, content: 必以文章稱而或畧於功烈殊不知衞公之文章, WYG: 毀千餘所撤私邑山房千四百舍寇無所廋蔽天子下詔褒揚敬宗立侈用無度詔浙西上脂盝䊋具徳裕奏比年旱災物力未完乃三月壬子赦令}
