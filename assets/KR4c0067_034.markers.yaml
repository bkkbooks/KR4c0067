  - {type: line-break, offset: 302, content: '', id: KR4c0067_SBCK_034-1b07}
  - {type: variant, offset: 304, length: 0, content: '', WYG: 倪若水言之即見褒納皇甫詢織半臂造琵琶捍撥鏤牙筩於益州蘇頲不奉詔帝不加罪夫鵁鶄鏤牙微物也二三臣尚以勞人損徳為言豈二祖有臣如此今獨無之葢有位者蔽而不聞非陛下拒不納也且立鵝天馬蹙豹盤絛文彩怪麗惟乗輿當御今廣用千匹臣所未喻昔漢文身衣弋綈元帝罷輕纎服故仁徳慈儉至今稱之願陛下師二祖容納逺思漢家恭約裁賜節減則海隅蒼生畢受賜矣優詔為停自元和後天下禁毋私度僧徐州王智興紿言天子誕月請築壇度人以資福詔可即顯募江淮間民皆曹輩奔走因牟擷其財以自入徳裕劾奏智興為壇泗州募願度者人輸錢二千則不復勘詰普加髠落自淮而右户三丁男必一男剔髮規影徭賦所度無算臣閲度江者日數百蘇常齊民十固八九若不加禁遏則前至誕月江淮失丁男六十萬不為細變有詔徐州禁止時帝昏荒數遊幸狎比羣小聴朝簡忽徳裕上丹扆六箴表言心乎愛矣遐不謂矣此古之賢人篤於事君者也夫迹疏而言親者危地逺而意忠者忤臣竊惟念拔自先聖徧荷寵私不能竭忠是負靈鑒臣在先朝嘗獻大明賦以諷頗䝉嘉採今日盡節明主亦由是也其一曰宵衣諷視朝希晩也二曰正服諷服御非法也三曰罷獻諷斂求怪珍也四曰納誨諷侮棄忠言也五曰辨邪諷任羣小也六曰防微諷偽遊輕出也辭皆明直婉切帝雖不能用其言猶勅韋處厚諄諄作詔厚謝其意然為逢吉排笮訖不内徙時亳州浮屠詭言水可愈疾聞南方之人率三十户僦一人使往汲既行若飲病者不敢近葷血危老之人率多死而水斗三十千取者益他汲轉鬻於道互相欺訹往者日數十百人徳裕嚴勒津邏捕絶之且言昔吳有聖水宋齊有聖火皆本妖祥古人所禁請下觀察使令狐楚填塞以絶妄源從之帝方惑佛老禱福祈年浮屠方士並出入禁中狂人杜景先上言其友周息元壽數百嵗帝遣宦者至浙西迎之詔在所馳驛敦遣徳裕上疏曰道之高者莫若廣成𤣥元人之聖者莫若軒轅孔子昔軒轅問廣成子治身之要曰無視無聴抱神以静形將自正無勞子形無揺子精乃可長生慎守其一以處其和故我修身千二百嵗矣形未嘗衰又曰得吾道者上為皇下為王𤣥語孔子曰去子之驕氣與多欲態色與淫志是皆無益於子之身陛下修軒后之術物色異人若使廣成𤣥元混迹而至告陛下之言亦無出於此臣慮今所得者皆迂怪之士使物淖氷以小術欺聰明如文成五利者也又前世天子雖好方士未有御其藥者故漢人稱黄金可成以為飲食器則壽高宗時劉道合𤣥宗時孫甑生皆能作黄金二祖不之服豈非以宗廟為重乎倘必致真隠願止師保和之術慎毌及藥則九廟慰悦矣息元果誕譎不情自言與張果葉静能遊帝詔畫工肖狀為圖以觀之終帝世無他驗文宗即位乃逐之}
