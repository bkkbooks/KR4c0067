  - {type: substitution, offset: 290, original: 㢤, replacement: 哉, reason: scribal-variant-collapsed, mapping: {identifier: 'bkk:mapping/variant-fold-v1', hash: 'sha256:9bc9a4233a10ab6fe6494b31262c157187fd580f02a97cad91be81ccd48f7a20', entry: vf-19431}}
  - {type: variant, offset: 293, length: 0, content: '', WYG: 詔書停𣙜酤又赦令示諸州羡餘無送使今存者惟留使錢五}
  - {type: variant, offset: 294, length: 7, content: 五年文公嘗爲袁, WYG: 萬緡率嵗經費常少十三萬軍用褊急今所須脂盝䊋具度用銀二萬三千兩金百三十兩物非土産雖力營索尚恐不逮願詔宰相議何以俾臣不違詔㫖不乏軍興不疲人不歛怨則前敕後詔咸可遵承不報方是時罷進獻不閲月而求貢使者足相接於道故徳裕推一以諷他又詔索盤絛繚綾千匹復奏言太宗時使至凉州見名鷹諷李大亮獻之大亮諫止賜詔嘉歎𤣥宗時使者抵江南捕鵁鶄翠鳥汴}
  - {type: page-break, offset: 294, content: '', id: KR4c0067_WYG_035-3a, image: WYG1079/WYG1079-0335c.png}
