  - {type: variant, offset: 54, length: 4, content: 末論石雄, WYG: 以佐陽山之運饋者不涉炎月逺民乃安蜀人多鬻女為人妾徳裕為著科約凡十三而上執三年勞下者五嵗及期則歸之父母毀屬下浮屠私廬數千以地予農蜀先主祠旁有猱村其民剔髮若浮屠者畜妻子自如徳裕下令禁止蜀風大變於是二邊寖懼南詔}
