  - {type: variant, offset: 44, length: 9, content: 葉前一行與鄭注交結, WYG: 軍築杖義城以制大度青溪闗之阻作禦侮城以控榮經犄角勢作柔逺城以阨西山吐蕃復卬崍闗徙巂州治臺登以奪蠻險舊制嵗抄運内粟贍黎巂州起嘉眉道陽山江而達大度乃分餉諸戍常以盛夏土地苦瘴毒輦夫多死徳裕命轉卬雅粟以十月為漕始先夏而}
