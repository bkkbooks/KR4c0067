  - {type: variant, offset: 73, length: 4, content: 許長行制, WYG: 出師之利僧孺居中沮其功命返悉怛謀於虜以信所盟徳裕終身以為恨㑹監軍使王踐言入朝盛言悉怛謀死拒逺人向化意帝亦悔之即以兵部尚書召俄拜中書門}
