  - {type: variant, offset: 59, length: 1, content: 添, WYG: 還所俘掠四千人吐蕃維州將悉怛謀以城降維距成都四百里因山為固東北由索叢嶺而下二百里地無險走長川不三千里直吐蕃之牙異時戍之以制虜入者也徳裕既得之即發}
