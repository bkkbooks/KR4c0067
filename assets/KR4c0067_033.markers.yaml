  - {type: variant, offset: 3967, length: 1601, content: 周秦行紀牛僧孺撰余真元中舉進士落第歸宛葉間至伊闕南道鳴臯山下将宿大安民舎㑹暮不至更十餘里一道甚易夜月始出忽聞有異香氣因趍進行不知狀逺見火朙意謂荘家更前驅至一大宅門庭若富豪家黃衣閽人曰郎君何至余荅曰僧孺姓牛應進士落第往家本往大安民舎誤道来此直乞宿無他中有小䯻靑衣出責黃衣曰門外誰何一作門外爲誰黃衣曰有客黃衣入告少時出曰請郎尹入余問誰氏宅黃衣曰第進無湏問入十餘門至大殿殿蔽以珠簾有朱衣紫衣人百數立階下間左右曰拜一有遂拜于字殿下簾中語曰妾漢文帝母薄太后此是廟郎不當来何辱至余曰巨葉苑下将歸失道恐死豺虎敢託命乞宿太后幸聽受太后遣軸簾起席曰妾故漢文君母君子唐朝名士不相君臣幸無簡敬便一作便上殿来見太后着練衣狀貌瑰偉不甚粧飾慰余曰行役無苦乎召坐食頃聞殿内庖厨聲太后曰今夜風月甚善一作佳偶有二女侍一作伴相尋况又遇佳賔不可不成一會呼左右屈兩箇娘子出見牛秀才良乆有二女子從中至從者数百前立者一人挾腰長面多髮不粧衣青衣僅可二十餘太后顧指曰此高祖戚夫人余下拜夫人亦拜更有一人圓題柔臉穩身貌舒光彩射逺近時時好矉多服花繡年低薄后后指顧曰此元帝王嬙余拜如戚夫人王嬙復拜各就坐坐定太后使紫衣中貴人曰迎楊家潘家来乆之空中有五色雲下聞笑語聲䆮近一有太字后曰楊潘至矣忽車音馬跡相雜羅錦綺繡列旁視不給有二女子從雲中下余超侍前立者一人纎腰身修睟容甚閒暇衣黃衣戴黃冠年二十以来太后顧指曰此是唐朝太真妃余即伏謁肅拜如臣禮太真曰妾得罪先帝皇朝不然妾在后妃數中此禮豈不虚乎不敢受却答拜更一人厚肌敏視身小材質㓗白齒極卑被寛博衣太后顧而指曰此齊帝潘淑妃余拜如王昭君妃復拜太后命進饌少焉食至芳㓗萬品皆不得名字粗欲之腹不能足食巳更置酒其噐盡寳玉語太真曰何乆不相㸔太真謹容對曰三郎数幸華清扈從不暇至太后又謂潘妃曰子亦不来何也潘妃匿笑不禁不成對太真視潘妃一有而對曰潘妃向玉奴說懊惱東昏侯二有踈字狂終日出獵故不得時謁太后問余曰今天子一有爲誰余對曰今皇帝名适代宗皇帝長子太真笑曰沈㜑児作天子也太竒太后曰何如主余對曰小臣不足以知君德太后曰然無謙第言之余曰民間傳英朙聖武太后首肯三四太后命進酒加樂樂皆少年女子酒環行数周樂亦随輟太后請戚夫人鼓琴夫人約指以玉環光照手西京雜記云高祖與夫人石錬金環照見指骨引琴而一有鼓字聲甚怨太后曰牛秀才邂逅逆旅到此又諸娘子偶相訪今無以盡平生歡牛秀才盍各賦詩言志不亦善乎遂各授以牋筆逡廵詩成薄后詩曰月寢花宫得奉君至今猶愧管夫人漢家舊日笙歌地煙草幾經秋又春王嬙詩曰雪裏穹廬不見春漢衣雖舊淚長新如今猶恨毛延夀愛把丹靑錯畫人戚夫人詩曰自别漢宫休楚舞不能粧粉恨君王無金豈得迎啇叟吕氏何曽畏木強太真詩曰金釵墮地别君王紅淚流珠滿御床雲雨馬嵬分散後􅌐宫無復聽霓裳潘妃詩曰秋月春風幾度歸江山猶是鄴宫非東昏舊作蓮花地空想曾拖金縷衣再三趣余作詩余不得辭遂應教作詩曰香風引到大羅天月地雲階拜洞仙共道人間惆悵事不知今夕是何年别有善笛女子短鬟衫呉帶貌甚羙多媚與潘氏偕来太后以接坐居之時令吹笛往往亦及酒太后顧而謂曰識此否石家緑珠也潘妃養作妹故潘妃與俱来太后因曰緑珠豈能無詩乎緑珠拜謝作詩曰此地元非昔日人笛聲空起一作怨趙王倫紅牋鈿碎一作紅殘緑碎花枝下金谷千年更不春太后曰牛秀才逺来今夕誰人與伴戚夫人先起辭曰如意成長固不可且不宜如此况實爲非乎潘妃辭曰東昏侯以玉児妃名身死國除不擬負他緑珠辭曰石衞尉性嚴忌今有死不可及亂太后曰太真今朝先帝貴妃固勿言他乃謂王嬙曰昭君始嫁呼韓單于一冇後字復爲姝叅效追一本作爲株絫若䪘單于婦固自用宜苦寒地胡鬼何能爲昭君幸無辭昭君不對低眉羞恨俄各歸休余爲左右送入昭君院會将旦侍人告起得也昭君泣以持别忽聞外有太后命余遂見太后太后曰此非郎乆留地宜亟還便别矣幸無忘何采歡更索酒酒再行戚夫人潘妃緑珠皆泣下竟辭去太后使朱衣人送往大安邸西道旋失使人行往一本作所在字時始朙余就大安里問其人人曰去此十數里有薄后廟余却望廟荒毁不可入非何見者余衣上香經年不歇竟不知其一作如何, WYG: ''}
