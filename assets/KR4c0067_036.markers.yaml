  - {type: variant, offset: 14, length: 2, content: 首明, WYG: 年遂及禍敗是知亟進罷宰相使政在中書誠治}
  - {type: variant, offset: 17, length: 46, content: 原缺据全唐文錄補卿道崇德茂體方行正業成廊廟心存邱壑往以時事來還宰旅秉此難進確然莫奪雖違乂辟之, WYG: 也帝嘗疑楊嗣復李珏顧}
