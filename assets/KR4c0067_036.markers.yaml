  - {type: variant, offset: 180, length: 0, content: '', WYG: 節嬰城不出回鶻乃大掠党項退渾皆保險莫敢拒帝益知不許田牟用二部兵之效乃復問以計徳裕曰杷頭峰北皆大磧利用騎不可以步當之今烏介所恃公主爾得健將出竒奪還之王師急擊彼必走今鋭將無易石雄者請以藩渾勁卒與漢兵銜枚夜擊之勢必得帝即以方略授劉汚令雄邀擊可汗於殺胡山敗之迎公主還回鶻遂敗進位司徒黠戛斯遣使來且言攻取安西北廷帝欲從黠戛斯求其地徳裕曰不可安西距京師七千里北廷五千里異時繇河西隴石抵玉門闗皆我郡縣往往有兵故能緩急調發自河隴入吐蕃則道出回鶻回鶻今破滅未知黠戛斯果有其地邪假令安西可得即復置都䕶以萬人往戍何所興發何道饋輓彼天徳振武於京師近力猶苦不足况七千里安西哉臣以為縱得之無用也昔漢魏相請罷田車師賈捐之請棄珠崖近狄仁傑亦請棄四鎮及安東皆不願貪外以耗内此三臣者當全盛時尚欲棄割以肥中國况久沒甚逺之地乎是持實費市虚事滅一回鶻而又生之帝乃止澤潞劉從諫死其從子稹擅畱事以邀節度徳裕曰澤潞内地非河朔比昔皆儒術大臣守之李抱真始建昭義軍最有功徳宗尚不許其子繼及劉悟死敬宗方怠於政遂以符節付從諫太和時擅兵長子隂連訓注外託効忠請除君側及有狗馬疾謝醫拒使便以兵屬稹捨而不討無以示四方帝曰可勝乎對曰河朔稹所恃以脣齒也如令魏鎮不與則破矣夫三鎮世嗣列聖許之請使近臣明吿以澤潞命師不得視三鎮今朕欲誅稹其各以兵㑹帝然之乃以李回持節諭王元逵何𢎞敬皆聴命始議用兵中外交章固争皆曰悟功高不可絶其嗣又從諫畜兵十萬粟支十年未可以破也他宰相亦媕娿趨和徳裕獨曰諸葛亮言曹操善為兵猶五攻昌霸三越巢湖況其下哉然贏縮勝負兵家之常惟陛下聖策先定不以小利鈍為浮議所揺則有功矣有如不利臣請以死塞責帝忿然曰為我語於朝有沮吾軍議者先誅之羣論遂息元逵兵巳出而𢎞敬逗留持兩端徳裕建遣王宰以陳許精甲假道於魏以伐磁𢎞敬聞遽勒兵請自涉漳取磁路㑹横水戍兵叛入太原逐其帥李石奉裨將楊弁主留事方是時稹未下朝廷益為憂議者頗言兵皆可罷帝遣中人馬元實如太原偵其變弁厚賄中人帳飲三日還謬曰弁兵多屬明光甲者十五里徳裕詰曰李石以太原無兵故調横水卒千五百使戍榆社弁因以亂渠能列卒如此多邪則曰晉人勇皆兵也募而得之徳裕曰募士當以財李石以人欠一縑故兵亂石無以素之弁何得邪太原一鎧一㦸舉送行營安致十五里明光乎使者語塞徳裕即奏弁賤伍不可赦如力不足請捨稹而誅弁遽趣王逢起榆社軍詔元逵趨土門㑹太原河東監軍吕義忠聞即日召榆社卒入斬弁獻首京師徳裕每疾貞元太和間有所討伐諸道兵出境即仰給度支多遷延以困國力或與賊約令懈守備得一縣一屯以報天子故師無大功因請敕諸將令直取州勿攻縣故元逵等下刑洛磁而稹氣索矣俄而高文端歸命稱稹糧乏皆女子挼穟哺兵未㡬郭誼持稹首降帝問何以處誼徳裕曰稹豎子安知反職誼為之今三州巳降而稹窮蹙又販其族以邀富貴不誅後無以懲惡帝曰朕意亦爾因詔石雄入潞盡取誼等及嘗為稹用者悉誅之策功拜太尉進封趙國公徳裕固讓言唐興太尉惟七人尚父子儀乃不敢拜近王智興李載義皆超拜保傅盖重惜此官裴度為司徒十年亦不遷臣願守舊秩足矣帝曰吾恨無官酬公母固辭徳裕又陳先臣封於趙冢孫寛中始生字曰三趙意將傳嫡不及支庶臣前益封巳改中山臣先世皆嘗居汲願得封衛從之遂改衛國公帝嘗從容謂宰相曰有人稱孔子其徒三千亦為黨信乎徳裕曰昔劉向云孔子與顔回子貢更相稱譽不為朋黨禹稷與臯陶轉相汲引不為比周無邪心也臣嘗以共鯀驩兠與舜禹雜處共工驩兠則為黨舜禹不為黨小人相與比周迭為掩蔽也賢人君子不然忠於國則同心聞於義則同志退而各行其巳不可交以私趙宣子隨㑹繼而納諫司馬侯叔向比以事君不為黨也公孫𢎞每與汲黯請間黯先發之𢎞推其後武帝所言皆聴黯𢎞雖並進然廷詰齊人少情譏其布被為詐則先發後繼不為黨也太宗與房𤣥齡圖事則曰非杜如晦莫能籌之及如晦在焉亦推𤣥齡之策則同心圖國不為黨也漢朱博陳咸相為腹心背公死黨周福房植各以其黨相髙議論相軋故朋黨始於甘陵二部及甚也謂之鉤黨繼受誅夷以王制言之非不幸也周之衰列國公子有信陵平原孟嘗春申游談者以四豪為稱首亦各有客三千務以譎詐勢利相傾仲尼之徒惟行仁義今議者欲以比之罔矣臣未知所謂黨者為國乎為身乎誠為國邪隨㑹叔向汲黯房杜之道可行不必黨也今所謂黨者誣善蔽忠附下罔上車馬馳驅以趨權勢畫夜合謀美官要選悉引其黨為之否則抑壓以退仲尼之徒有是乎陛下以是察之則姦偽見矣時韋𢎞質建言宰相不可兼治錢穀徳裕奏言管仲明於治國其語曰國之重器莫重於令令重君尊君尊國安治人之本莫要於令故曰虧令者死益令者死不行令者死留令者死不從令者死五者無赦又曰令在上而論可否在下是主威下繫於人也太和後風俗寖敝令出於上非之在下此敝不止無以治國匡衡曰大臣者國家股肱萬姓所瞻仰明主所慎擇也傳曰下輕其上爵賤人圖柄臣則國家揺動而人不静今𢎞質為人所敎而言是圖柄臣者也且蕭望之漢}
