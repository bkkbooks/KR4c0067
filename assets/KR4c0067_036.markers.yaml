  - {type: variant, offset: 177, length: 0, content: '', WYG: 殺之徳裕知帝性剛而果於斷即率三宰相見延英嗚咽流涕曰昔太宗徳宗誅大}
  - {type: variant, offset: 178, length: 1, content: 遠, WYG: 未嘗不悔臣欲陛下全活之無異時恨使二人罪惡暴著天下共疾之帝不許徳裕伏不起帝曰為公等赦之徳裕降拜升坐帝曰如令諫官論事雖千疏我不赦徳裕重拜因追還使者嗣復等乃免時帝數出畋游暮夜乃還徳裕上言人君動法於日故出而視朝入而燕息傳曰君就房有常節惟深察古誼毋繼以夜側聞五星失度恐天以是勤勤儆戒詩曰敬天之渝不敢馳驅願節田游承天意尋冊拜司空回鶻目開成時為黠戛斯所破㑹昌後烏介可汗挾公主牙塞下種族大飢以弱口重器易粟於邊退渾党項利虜掠因天徳軍使田牟上言願以部落兵擊之議者請可其奏徳裕曰回鶻於國尚有功以窮來歸未輙擾邊遽伐之非漢宣帝待呼韓之義不如與之食以待其變陳夷行曰資盜糧非計也不如擊之便徳裕曰沙陀退渾不可恃也夫見利則進遇敵則走雜虜之常態孰肯為國家用邪天徳兵素弱以一城與勁虜當無不敗請詔牟無聴諸戎計帝於是貸粟二萬斛㑹嗢沒斯殺赤心以降赤心兵潰於是回鶻勢窮數丐羊馬欲藉兵復故地又願假天徳城以舍公主帝不可乃進逼振武保大柵杷頭峰以略朔川轉戰雲州刺史張}
