  - {type: variant, offset: 1063, length: 2, content: 遍到, WYG: 馬植御史中丞魏扶言紳殺無罪徳裕狥成其寃至為黠御史罔上不道乃貶為崖州司戸參軍越明年卒年六十三徳裕既沒見夢令狐綯曰公幸哀我使得歸葬綯語其子滈滈曰執政皆其憾可乎既夕又夢綯懼曰衛公精爽可畏不言禍將及白於帝得以喪還徳裕性孤峭明辨有風采善為文章雖至大位猶不去書其謀議援古為質衮衮可喜嘗以經綸天下自為武宗知而能任之言從計行是時王室㡬中興先是韓全義敗於蔡杜叔良敗於深皆監軍宦人制其權將不得專進退詔書一日三四下}
