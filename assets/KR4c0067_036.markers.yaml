  - {type: variant, offset: 2633, length: 1468, content: 錄補右臣等見楊觀說緣回鶻赤心下兵馬多散在山北恐與奚契丹室韋同邀截可汗所以未敢遠去今因華封迴輿望賜仲武詔令差明辨識事宜軍將至奚契丹等部落諭以朝旨緣回鶻曾忠效又因殘破歸附國家朝廷事體須有存恤令奚契丹等與其同力討除赤心下散卒遣可汗漸出漢界免有滯留如蒙允許望付翰林約此意撰詔兼詔克恭未審影宋本會昌一品集請發陳許軍馬狀右臣等商量賊中人心久合自變猶恐顧望河朔旬月偷安陳許累有戰功軍聲甚振王宰年力方壯才略可稱委之征行必有殊效非惟破賊稹之膽足以堅鎭魏之心倘有先聲必當自潰望詔王宰自揀當軍馬步精兵除合留在鎭外並取河陽相衞路直抵磁州其在鎭兵馬委行敏權知仍差幹事判官一人留務未審會昌三年八月十一日同上賜王宰詔意明本原缺据陸心源唐文拾遺錄補用兵之難在於過險旣收要害便合成功故出井陘而趙師虜過成臯而吳寇殄得略陽而隴坻服入大峴而廣固平近則破鹿頭而翦蜀克郾城而定蔡卿初取天井大振威聲皆謂計日而取澤州指期而擒劉稹頓兵危坂已涉二時日費殆過於千金途隘有逾於九折士不宿飽人已吿勞在朝公卿繼陳讜論皆云卿之血屬質在賊中此一人之常情固當無隱昔樂羊食子文侯見疑愛旣及於懿親義豈後於君上若慮危害晏實未忍急攻但卿披誠朕必深恕卽當與卿移鎭必使兩全如能大義滅親至誠體國捨爾所愛建茲殊勳繼先王鐘鼎之榮傳子孫帶礪之慶卽須厭塞公議早覆妖巢朕之報卿必異羣帥暑潦將至農事已興偃武息人固難淹久深思朕意勿更食言又知卿比留支兵守備萬善旣分武力尤費機謀今授劉沔河陽日臨寇境俾爲聲援常據要衝卿旣進攻必無後慮勉當協力副朕至懷同上詩鴛鴦篇明本有目無詩据全唐詩錄補君不見昔時同心人化作鴦鴦鳥和鳴一夕不暫離交頸千年尙爲少二月草菲菲山櫻花未稀金塘風日好何處不相依旣逢解佩游女更値凌波宓妃精光搖翠蓋麗色映珠璣雙影相伴雙心莫違淹留碧沙上蕩漾洗紅衣春光兮宛轉嬉遊兮未反宿莫近天泉池飛莫近長洲苑爾願歡愛不相忘須去人間羅網遠南有瀟湘洲且爲千里遊洞庭無苦寒沅江多碧流昔爲薄命妾無日不含愁今爲水中鳥頡頏自相求洛陽女兒在靑閣二月羅衣輕更薄金泥文彩未足珍畫作鴛鴦始堪著亦有少婦破瓜年春閨無伴獨嬋娟夜夜學織連枝錦織作鴛鴦人共憐悠悠湘水濱淸淺漾初蘋菖花發艶無人識江柳逶迤空自春唯憐獨鶴依琴曲更念孤鸞隱鏡塵願作鴛鴦被長覆有情人上巳憶江南禊事以下七首明本原缺据全唐詩錄補黃河西繞郡城流上巳應無祓禊遊爲憶淥江春水色更無宵夢向吳州北固懷古自有此山川於今幾太守近世二千石畢公宣化厚丞相量納川平陽氣衝斗三賢若時雨所至躋仁壽畢構政事爲開元第一陸丞相象先平陽齊幹三賢皆爲此郡汨羅遠謫南荒一病身停舟暫弔汨羅人都緣靳尙圖專國豈是懷王厭直臣萬里碧潭秋景靜四時愁色野花新不勞漁父重相問自有招魂拭淚巾嶺外守歲一作李福業詩冬逐更籌盡春隨斗柄回寒暄一夜隔客鬢兩年催訪韋楚老不遇昔日徵黃綺余慚在鳳池今來招隱士恨不見瓊枝題柳郎中故居下馬荒堦日欲曛潺潺石溜靜中聞鳥啼花發人聲絕寂寞山窗掩白雲盤陀嶺驛樓嵩少心期杳莫攀好山聊復一開顔明朝便是南荒路更上層樓望故關失題明本原缺据席刻唐詩百家全集錄補肉視具寮忘七箸氣吞同列削寒溫當時誰是承恩者肯有餘波達鬼村畫閣不開梁燕去朱門罷掃乳烏歸千巖萬壑應惆悵流水斜傾出武威句明本原缺据全唐詩錄補檢經求綠字憑酒借紅顔君不見秋山寂歷風飈歇半夜靑崖吐明月寒光乍出松篠間萬籟蕭蕭從此發忽聞歌管吟朔風精魂想在幽巖中霜夜聽小童薛陽陶吹笛銀花懸院榜神撼引鈴縧題學士院葳蕤輕風裏若銜若垂何可擬以上並事文類聚自從一夢高唐後可是無人勝楚王賦巫山神女見雲溪友議牛羊具特俎武昌詩見東觀餘論心悟覺身勞雲中棄寶刀久閑生䏶肉多壽長眉毫有懷甘露寺自省上人京口志書空蹺足睡路險側身行, WYG: 既}
