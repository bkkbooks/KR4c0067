  - {type: variant, offset: 2169, length: 462, content: 以補史官之缺云太和新修辨謗略序臣聞行險而言闕上者非謂謗也是實之所招也蹈仁而被誣者非己所召是盜之所憎也夫理身絕嫌人臣止謗之術膚受不納人君辨謗之明然則正者邪之所仇直者曲之所矯有能爲不才所忌有功爲無庸所嫉四者苟立四謗必隨况僞必亂眞佞實似智鑠金之口不謀而同唱成雷之蚊未響而先合以羣陰而蔽孤陽以衆比而排獨立結其禍患咸本謗言莫不巧中於隱伏之微善成於疑似之際忠賢被之無以自辨亦良可哀哉伏維皇帝陛下體乾坤簡易之德合日月無私之照視聽自天神明其化惡淫哇之亂聽疾紫色之眩目堲其讒說常詠格言臣等將順天聰綴緝舊典發東觀藏書之室得元和辨謗之文辭過萬言書成十卷以其廣而寡要繁則易蕪方鏡情僞之源尤資詳略之當遂再加研考所以理昔賢被誣之狀表前王善鑒之明實願視則倚衡居則宥坐絕其根枿永杜其來必也視之於未形鑒之於無象方夏后盤盂之誡比周王玉几之銘測深慮遠取爲殷鑒使播揚有所消其象萋菲無以成其文忠臣得納其誠武臣得盡其力矣於是徵之周秦覃及聖代必極精簡有合箴規特立新編裁成三卷謹繕寫封進臣等上奉宸謀竭其鑽仰敢不虔序聖旨冠于篇首云奏回鶻事宜狀以下二首明本有目無文据陸心源唐文, WYG: ''}
