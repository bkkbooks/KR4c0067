  - {type: variant, offset: 329, length: 290, content: 禮義推之和寧遠同族之譏嫌厚親鄰之恩信賢明如此愧慰難名回鶻頃以失國爲詞款塞相託朕以勳親是念拯卹屢加曾不知恩漸開稔惡賤棄公主侵㬥平人日尋干戈時竊牛馬朕爲全舊好不下明誅歲月滋深邊防將倦各用長策繼彰殊勳焚帳幕而公主歸還透網羅而元惡逃遁顧其餘類何所寄生國王遠聞想同深慰然猶恐奔竄尙有凶姦又慮侵彼封疆將復讐怨國王亦須嚴爲備擬善設機謀同務討除盡其根本無貽後患勉繼前修親仁善鄰惟彼與此勿謂遐遠常存寤思因注吾合素回且先詔示其他禮命續專遣使宣慰想宜知悉薦處士李源表臣伏見賈誼云守圉捍敵之臣誠死城郭封疆故曰聖人有金城者此物此志也自天寶之後俗尙浮華士罕仗義人懷苟免至有棄城郭委符節者其身不以爲恥當代不以爲, WYG: ''}
