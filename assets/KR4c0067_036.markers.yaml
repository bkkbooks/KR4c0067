  - {type: variant, offset: 7, length: 1, content: 師, WYG: 傅招所善載酒集宗閔閣酣醉乃去至徳裕則喻御史有以事見宰相必先白臺乃聴凡罷朝由龍尾道趨出遂無輒至閣者又罷京兆築沙堤兩街上朝衛兵常建言朝廷惟邪正二途正必去邪邪必害正然其辭皆若可聴願審所取舍不然二者並進雖聖賢經營無由成功俄而宗閔罷徳裕代為中書侍郎集賢殿大學士始二省符江淮大賈使主堂厨食利因是挾貲行天下所至州鎮為右客富人倚以自髙徳裕一切罷之後帝暴感風害語言鄭注始因王守澄以藥進帝少間又薦李訓使待詔帝欲授諫官徳裕曰昔諸葛亮有言親賢臣逺小人先漢所以興隆也親小人逺賢臣後漢所以傾頽也今訓小人頃咎惡暴天下不宜引致左右帝曰人誰無過當容其改且逢吉嘗言之對曰聖賢則有改過若訓天資奸邪尚何能改逢吉位宰相而顧愛兇回以累陛下亦罪人也帝語王涯别與官徳裕揺手止涯帝適見不懌訓注皆怨即復召宗閔輔政拜徳裕為興元節度使入見帝自陳願留闕下復拜兵部尚書宗閔奏命巳行不可止更徙鎮海軍以代王璠先是大和中漳王養母}
  - {type: page-break, offset: 7, content: '', id: KR4c0067_WYG_035-9a, image: WYG1079/WYG1079-0338c.png}
  - {type: page-break, offset: 7, content: '', id: KR4c0067_WYG_035-9b, image: WYG1079/WYG1079-0338d.png}
  - {type: variant, offset: 9, length: 2, content: 衍制, WYG: 仲陽歸浙西有詔在所存問時徳裕被詔乃檄留後使如詔書璠入為尚書左丞而漳王}
  - {type: punctuation, offset: 11, content: (, id: KR4c0067_krp_036-bkkpn1}
  - {type: variant, offset: 12, length: 0, content: '', WYG: 罪廢死因與户部侍郎李漢共譛徳裕嘗賂仲陽導王為不軌帝惑其言召王涯李固言路隋質之注璠漢三人者語益堅獨隋言徳裕大臣不宜有此讒燄少衰遂貶徳裕為太子賔客分司東都復貶袁州長史隋亦免宰相未㡬宗閔以罪斥而注訓等亂敗帝追悔徳裕以誣搆逐乃徙滁州刺史又以太子賔客分司東都開成初帝從容語宰相朝廷豈有遺事乎衆咸以宋申錫對帝俛首涕數行}
  - {type: page-break, offset: 12, content: '', id: KR4c0067_WYG_035-10a, image: WYG1079/WYG1079-0339a.png}
  - {type: variant, offset: 13, length: 0, content: '', WYG: 曰當此時兄弟不相保獨申錫邪有司為我褒顯之又曰徳裕亦申錫比也起為浙西觀察使後對學士禁中黎埴頓首言徳裕與宗閔皆逐而獨三進官帝曰彼嘗進鄭注而徳裕欲殺之今當以官與何人埴懼而出又指坐扆前示宰相曰此徳裕争鄭注處徳裕三在浙西出入十年遷淮南節度使代牛僧孺僧孺聞之以軍事付其副張鷺即馳去淮南府八十萬緡徳裕奏言止四十萬為鷺用其半僧孺訴于帝而諫官姚合魏謩等共劾奏徳裕挾私怨沮傷僧孺帝置章不下詔徳裕覆實徳裕上言諸鎮更代例殺半數以備水旱助軍費因索王播段文昌崔從相授簿最具在惟從死官下僧孺代之其所殺數最多即自劾始至鎮失於用例不敢妄遂待罪有詔釋之武宗立召為門下侍郎同中書門下平章事既入謝即進戒帝辨邪正專委任而後朝廷治臣嘗為先帝言之不見用夫正人既呼小人為邪小人亦謂正人為邪何以辨之請借物為諭松栢之為木孤生勁特無所因倚蘿蔦則不然弱不能立必附他木故正人一心事君無待於助邪人心更為黨以相蔽欺君人者以是辨之則無惑矣又謂治亂繫信任引齊桓公問管仲所以害霸者仲對琴瑟笙竽弋獵馳騁非害霸者惟知人不能舉舉不能任任而又雜以小人害霸也太𤣥徳憲四宗皆盛朝其始臨御自視若堯舜寖久則不及初陛下知其然乎始一委輔相故賢者得盡心久則小人並進造黨與亂視聴故上疑而不專政去宰相則不治矣在徳宗最甚晩節宰相惟奉行詔書所與圖事者李齊運裴延齡韋渠牟等訖今謂之亂政夫輔相有欺罔不忠當亟免忠而材者屬任之政無他門天下安有不治先帝任人始皆回容積纎微以至誅貶設使雖小過必知而改之君臣無猜則讒邪不干其間矣又言開元初輔相率三考輒去雖姚崇宋璟不能逾至李林甫秉權乃十}
