  - {type: variant, offset: 1324, length: 844, content: 獲美名實皆少雋旣遇春節難阻良遊三五人自爲宴樂並無所禁惟不得聚集同年進士廣爲宴會仍委御史臺察訪聞奏謹具如前論喪葬踰制疏應百姓厚葬及於道途盛陳祭奠兼設音樂等閭里編甿罕知教義生無孝養可紀没以厚葬相矜器仗僭差祭奠奢靡仍以音樂榮其送終或結社相資或息利自辦生產儲蓄爲之皆空習以爲常不敢自廢人戶貧破抑此之由今百姓等喪葬祭奠並請不許以金銀錦繡爲飾其陳設樂音者及葬物稍涉僭越者並勒毀除結社之類任充死亡喪服糧食等用使如有人犯者並準法律科罪其官吏已上不能糾察請加懲責仍請委出使郎官御史察訪臺司伏請令文及故實不載者令更條檢校官令文不載令請檢校官一品二品請同五品五品已下並請同九品如有曾任正官依本官品第儀則其准敕試官亦仝九品儀如升朝官者請據本官品第升降闕例凡喪皆有品第恐或無知之人妄稱官秩自今以後除升朝官見任官亡殁外餘官去事前五日須除將告語或敕牒於本巡使呈過判押文狀行人方可供應佐命殊功當朝立功名傳遐邇特敕優旨准會典例本品數十分加三分不得別爲華飾右具本朝舊本例如前今後令兩巡使祗據官秩品級與判狀其餘一物已上不得增加兼勒驅使官與金吾司并門司同力轄鈐如有大段踰越卽請據罪科斷行人兼不得追領喪葬之家別有勘責奉敕如過制度不許尺寸事數其假賃行人徒二年喪葬之家卽不問罪仍付所司次柳氏舊聞序太和八年秋八月乙酉上於紫宸殿聽政宰臣涯以下奉職事上顧謂宰臣曰故內臣高力士終始事迹試爲言之臣涯謹奏云上元中使臣柳芳得罪竄黔中時力士亦從事巫州因與周旋力士以舊嘗司史爲芳言先時禁中事皆芳所不能知而芳亦有質疑者芳默識之及還編次其口語號曰問高力士說上曰令訪史氏取其事書之臣涯等旣奉詔乃詣芳孫度支員外璟詢事璟曰某祖芳前從力士問覼縷未竟復著唐歷採摭義數尤相近者以傳之其錄或秘不敢宣或怪奇非編錄所宜及者不以傳今按求其書甚實臣德裕亡父先臣與芳子吏部郎冕開元初俱爲尙書郎後官亦俱東出道相與語遂及高力士說且曰彼皆目覩非出傳聞信而有徵可爲實錄先臣每爲臣言之臣伏念所臆授凡有十七事歲祀久更遺稿不傳臣德裕非黃瓊之練習愧史遷之該博唯次舊聞懼失其傳不足以備大君之問謹錄如, WYG: 為}
