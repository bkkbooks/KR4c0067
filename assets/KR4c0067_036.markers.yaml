  - {type: variant, offset: 64, length: 111, content: 實有鎭浮之益深惟元老想見高風師範之尊東宮莫二舉茲崇秩明昭有德公器斯在雅道有光宜略常謙卽膺成制與黠戞王書皇帝敬問黠戞王時及陽和想比佳適注吾合素等至省表并進馬事具悉國王陰山雄勁朔野英雄包智略以周身推誠明而有衆聲高夷落威重藩疆專, WYG: 不忠}
