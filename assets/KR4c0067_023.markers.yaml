  - {type: variant, offset: 2646, length: 0, content: '', WYG: 旌旄渤海以下皆言舉感先恩捧荷新澤等事北望心彌苦西一本有馳字回首屢搔九霄難就日兩浙僅容舠暮竹寒窗影衰楊古郡濠魚鰕集橘市鶴鸛起亭臯越州宅牕户間盡見城郭朽刃休衝斗自謂良弓枉在弢竊論早彎摧虎兕便鑄墾蓬蒿漁艇宜孤棹樓船稱萬艘量才分用處終不學滔滔浙西大夫述夢四十韻并浙東相公繼有酬和斐然繼聲本韻次用劉禹錫位是才能取時因際㑹遭羽儀呈鷟鸑鋩劒試豪曹洛下推年少山東許地高門承金鼎鉉家有玉璜韜呂汲嗣侯海浪浮鵬翅天風引驥髦便知蓬閣秘不識魯}
