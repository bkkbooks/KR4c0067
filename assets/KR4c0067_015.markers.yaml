  - {type: variant, offset: 3420, length: 342, content: 與鄭注交結因緣貨賄濫授鈞衡及歸鎮後又與李訓結託所謀狂險中外具悉自訓注夷滅心不自安頗恃甲兵轉懷悖慢先朝外雖優寵中實懐疑及從諫疾病之時曾無誠款昨遣中使臨問兼借名醫矯託異端竟不相見便樹置劉稹令將校繼獻章表不待朝㫖便令継襲以澤潞一鎮有啓聖舊宫艱難巳來多用文吏如抱真首創軍幕於國兼有大功身殁之後其子皆赴京闕此謂劉稹愚騃廹於軍情望其愛惜家門稍能悛悔頻敢馳突晉絳侵軼河陽近李丕投降及魏博收平恩縣得劉稹牓帖並巳進來皆呼官軍為賊逢着即湏痛殺悖逆如此天地不容想卿逺聞因當奮激卿宜速諭諸蕃部落同滅可汗卿但北邉立功劉稹必當自潰䇿勲命賞以卿一道為先卿深軆此懷兼示將校如䝉允許望付翰林約此意撰詔未審昌㑹月二日三年九請授王宰兼行营諸軍攻討使狀右緣王茂元雖是將家久習吏事深入攻討非其所長訪聞東畿自聞抂寇侵軼尚未安定茂, WYG: ''}
