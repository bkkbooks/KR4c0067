body:
  text: 論賔客論謀議論代國論文章論任臣論人物志論朋黨論虚名論食貨論近倖論竒才論方士論小人論賓客論古人偁周公吐握下士而天下歸心唯周公則可何也文王之子武王之叔父於天下無嫌矣故唯周公則可深知他人言不可故再之禀上聖之姿邪不得入是以好士不爲累也漢武爲太子立博望苑使通賔客多以異端進者始皆欲招賢人而天下賢人少小人多賢人難進小人易合難進者鴻冥易合者膠固矣何以知之劉濞有枚乗鄒陽不周其言而應高田禄伯爲其羽翼劉武有鄒陽韓安國不用其謀而羊勝公孫詭爲其腹心劉安行隂德好文辭雖愛神僊黃白未害爲善終以左呉𬒳敗以是而知雖骨肉之親非周公聖德皆不可也班固偁四豪者六國之罪人也今不復論矣吕不韋習戰國之餘風陳狶值漢網之踈闊逮乎魏其武安終以權勢相傾自武安之後天子切齒衞霍改節則賓客之爲害固可知矣公孫弘起客舘開東閣以延賔客賢人與叅謀議非也然謂之賢人必非黨附朝宰交亂將相者矣其時武帝躬親萬機嚴朙御下人自中灋不敢爲非宰相唯有平津政出一空音孔出㠯覧自然無傾奪之勢其賔客故人不居顯位未足爲朝廷患也然主父偃言朔方地肥饒阻河蒙恬城以逐匈奴㓕胡之本公孫弘以爲不可朱買臣彂十難弘不能得其一又奏人不得挾弓弩吾丘夀王以爲不便上以難丞相丞相詘服則知平津之賔客不及天子之近臣朙矣雖有賔客何益於謀議㢤况世秉大政者常不下三四人而輕薄逰相門與栁槐齊列所謀以傾奪爲首所議以勢利爲先是以魏其武安之徒共成禍敗劉班殷鐡之客不相往来又役姦智献竒計者導其邪徑苟合匪人世道險巇無不由此昔漢武謂田蚡曰君除吏盡未吾亦欲除吏哀帝責鄭崇曰君門如市人何以欲禁切主上皆賔客之害也余謂丞相閉関謝絶賔客則朝廷靜矣謀議論欲知謀議之用捨身名之荣辱觀其立論可知也切於時機朙於利害人主易暁當世可行其謀必用而終有後咎鼂錯主父偃是也何者切時機朙利害皆怨誹所由生享其利而自罹其害謀闊意中言高㫖逺其道可灋其術則踈必有高名而不用於世賈山王陽是也謀議不行故能無患智足應變道可與權言雖切於人情意常䔍於禮義謀不盡用而身無近憂賈誼是也故當漢文之世亦無高位余門客崔世叔即宋廣平之維私也崔世叔名犯廟諱又常預燕公代公之戎幕故知三丞相才業其備曰廣平好言政事燕公好言文學至於經國逺慮意鮮及之與代公言初若渉川未知其止寥郭廣大莫見津涯味之既深思意逾宻代公常爲西北邉將帥論四夷事慮必精逺則崔之言信有徴矣凡侍坐於君子聞其言可以知其才術逺近用此道也代國論自古得代國之女以爲妃未嘗不致危亡之患者何也亡國之餘焉能無怨氣其立基創業之祖宗必皆一時之英傑其社稷山川之鬼神嘗爲一國之所奉受其血食忿其㓕亡故能爲厲矣必生妖羙之色蠱惑當世之君使其骨肉相殘以壊於內君臣相疑以敗於外危亡之兆鮮不由此史蘇所謂必有女戎姝喜妲巳褒姒是也史蘇言之詳矣今不復論是以晉獻得􅌐戎佚女太子有雉經之酷禍及三世符堅納慕容娣弟秦宫有鳯兮之謡敗於五將符堅於五将山破㓕梁武取東昏所幸幾至危國随文嬖陳主之姝終以殞身此皆禍敗之著朙者也又夏姬入荆子反疲於奔命吳人始叛楚矣吳嬪至晉世祖怠於爲政戎狄乃亂華矣所以王珪者可謂識㣲之士朙於禍福矣文章論魏文典論偁文以氣爲主氣之淸濁有體斯言盡之矣然氣不可以不貫不貫則雖有英辭麗藻如編珠綴玉不得爲全璞之寳矣鼓氣以勢壮爲羙勢不可以不息不息則流宕而忘返亦猶絲竹繁奏必有希聲窈眇聽之者恱聞如川流迅激必有洄洑逶迤觀之者不厭從兄翰常言文章如千兵萬馬風恬雨霽寂無人聲盖謂是矣近世誥命唯蘇庭碩叙事之外自爲文章才實有餘用之不竭沈休文獨以音韻爲切重輕爲難語雖甚工㫖則未逺夫荆璧不能無瑕隋珠不能無纇文㫖旣妙豈以音韻爲病㢤此可以言䂓矩之內不可以言文章外意也較其師友則魏文與王陳應劉討論之矣江南唯於五言爲妙故休文長於音韻而謂靈均以来此秘未覩不亦誣人甚矣古人辭高者盖以言妙而適情不取於音韻曹植七言話有囘泥諧旅四韻三粲詩有攀原安三覩班固漢書賛及當時辭賦多用協韻掎於元勛包田舉信是也意盡而止或篇不拘於隻耦文選詩有五韻七韻十一韻十二韻二十一韻者今之文字四韻六韻以至百韻無有隻故篇無定曲辭寡累句譬諸音樂古詞如金石琴瑟尚於至音今文如絲竹鞞鼓迫於促節則知聲律之爲弊也甚矣世有非文章者曰辭不出於風雅思不越於離騷摸冩古人何足貴也余曰譬諸日月雖終古常見而光景常新此所以爲靈物也余嘗爲文箴今載於此曰文之爲物自然靈氣惚恍而来不思而至杼軸得之淡而無味琢刻藻繪珍不足貴如彼璞玉磨礱成噐奢者爲之錯以金翠羙質旣雕良寳所棄此爲文之大㫖也任臣論欲知國之隆替時之盛衰察其任臣而巳非常之才固不常有齪齪廉謹足以從政矣其次愚魯樸鄙之人亦不害國唯異於人者可以懼矣世所謂差人也何者陳侯愛郭紹以興侮楚之怒伯陽任公孫以成謀社之夢屠黍偁國之興也天遺之以賢人國之衰也天與之以亂人是也然此人將至必有異物爲此先兆故知逺君子近小人汙澤所以興利也鶢鶋止於魯郊下展禽之故也鵜鶘集于魏沼不用管寜之應也是以鸜鵒来而師乙歎鵬鳥至而賈生懼戴鷦一本作巢張臻一本作悲㣲禽尚能爲害况異於此者昔殷宗惧而修德以消雉雊之變魏朙樂以酣身不免鷹揚之恨可以儆戒㢤人物志論余嘗覧人物志觀其索隱精㣲研幾玄妙實天下竒才然品其人物往往不倫以管仲商鞅俱爲灋家是不䆒其成敗之術也僧一行偁調盈虚御輕重唯太公管仲雖覇者之佐不及太公亦不宜比商鞅鞅可與呉起同頗耳以子産西門豹俱爲噐能是不辯其精麄之迹也子産多識博聞叔向且猶不及故仲尼敬事之西門豹非其匹也其甚者曰辨不入道而應對資給是謂口辯樂毅曹丘生是也樂毅中代之賢人㓗去就之分朙君臣之義自得卷舒之道深識存亡之機曹丘生招權傾金毁譽在口季布以爲非長者焉可以比君子㢤又曰一人之身兼有英雄高祖項羽是也其下雖曰項羽英分少有范增不能用陳平去之然偁朙能合變斯言謬矣項羽坑秦卒以結怨関中棄咸陽而眷懐舊土所謂倒持太阿授人以柄豈得謂之合變乎又願與漢王挑戰漢王笑曰吾寜闘智不能闘力及將敗也自爲歌曰力㧞山兮氣盖世其所恃者氣力而已矣可爲雄於韓信氣又過之所以能爲漢王敵聰朙睿智不足偁也朋黨論治平之世教化興行群臣和於朝百姓和於野人自砥礪無所是非天下焉有朋黨㢤仲長統所謂同異生是非愛憎生朋黨朋黨致怨讐是也東漢栢靈之朝政在閽寺綱紀以亂風教寝衰黨錮之士始以議論疵物於是危言危行刺譏當世其志在於維持名教斥逺佞邪雖乖大道猶不失正今之朋黨者皆依倚倖臣誣䧟君子鼓天下之動以養交㳺竊儒家之術以資大盗大盗謂倖臣也所謂教揉升木嗾犬害人穴居城社不可薫鑿漢之黨錮爲理世之罪人矣今之朋邪又黨錮之罪人矣仲長統曰才智者亦姦兇之羽翼勇氣者亦盗賊之瓜牙誠如是言然辨之未盡如是者皆小才小勇秪能用詭道入邪徑䑕牙穿屋虺毒螫人如巨海隂夜百色妖露焉能白百爲恠㢤大道之行當韲粉矣虚名論夫與膏盲同病者不可治也與衰亂同風者不可理也劉向上書曰幽厲之際朝廷不和轉相非怨君子獨處守正不撓衆枉勉強以從王事則反見憎毒讒愬故其詩曰宻勿從事不敢告劳無罪無辜讒口嗸嗸又曰分曹爲黨往往群朋将同心以䧟忠臣正臣進者治之表也正臣䧟者亂之機也漢與幽厲之世同風矣于寳晉總論曰朝寡全德之士鄕乏不貳之老進仕者以苟得爲貴而鄙居正當官者以望空爲高而笑勤恪其倚杖虚曠依阿無心者皆名重海内晉文與元成之際同風矣所謂虚曠名重者盖譏山濤魏野之儔耳後之竊虚名者曾不得與山魏徒隷齒而􅌤貌於世未嘗自愧趨之者如飛蛾赴火唯耻不及豈蛩蛩負蟨之謂㢤虚名者以衆多爲其羽翼時不敢害後来者以聲價出其口吻人不敢議以此相死自謂保太山之安可以痛心矣食貨論人君不以聚貨制用之臣處將相弼諧之任則奸邪無所容矣左右貴倖知所愛之人非宰相之噐以此職爲彂身之捷徑取位之要津皆由此汲引以塞訕論領此職者竊天子之財以爲之賂聚貨者所以得升矣貴操其竒嬴乗上之急售於有司以取倍利制用者所以得進矣三司皆有官屬分部以主郡國貴倖得其寳賂多託賈人汚吏處之頗類牧羊而蓄豺養無而縱獺欲其不侵不暴焉可得也故盗用貨泉多張空簿國用日蹙生人日困楊雄上書言漢武運帑藏之財填廬山之壑今貨入權門甚於是矣孟獻子有言與其有聚歛之臣寜有盗臣子輿以利國爲非楊雄以榷酤興歎稱其職者必皆挾工商之術有良賈之才夀昌習分誅之事弘元致理之要雖有倖臣亦何害於理㢤竒才論開成初余作鎮淮甸會有朝之英彦廉問剖符于東南者相繼而至余與之讌言皆曰聖上謂丞相鄭公覃李公固言李公石曰李訓禀五常之性服人倫之教則不及卿等然天下之才卿等皆不如也三丞相黙然而退余曰李訓甚狂而愚曾不及於徒隷焉得謂之竒才也自古天不有常勢不可變也昔陳平之患吕宗而計無所出嘗間居深念陸賈由戸而進不之覺也賈揣知其情言曰將相和則社稷安矣因爲畫䇿陳平乃寤由是以黃金爲絳侯夀將相交歡以敗産禄近世五王之誅二張也漢陽王召大將軍李多祚謂曰將軍爵服隆貴誰人與之曰太一本皆作大字帝與之將軍貲産富侈誰人與之曰太帝與之將軍子弟荣禄誰人與之曰太帝與之因謂曰感太帝恩乎多祚漼然泣下又謂曰今太帝之子深居鶴禁危若綴旒將軍豈有意乎多祚遂感慨受命與之定䇿元載之圖魚朝恩也以崔昭尹神州禆昭日請苑中牢醴以爲朝恩羊析秋毫之數小人以爲能君子所以不忍爲也卜式言天乆不雨獨烹弘羊天乃雨焉有仲尼之鳴鼓將攻卜式之欲烹致位而反居相位可爲之甚痛㢤近倖論自古中主以䧏皆安於近習踈逺忠良其主非不知君子可親小人可去而不改者其蔽有二一曰性相近二曰嗜慾深栢靈之主與小人氣合如水之走下火之就燥皆自然而親結不可觧也侯覧張讓所以得蔽君矣元成二后皆有所嗜吹簫撾鼓之娯㣲行沉湎之樂非倖臣無以承意非近習無以近歡弘㳟石顯所以得蠧政矣唯人君少欲英朙者則能反是如文帝雖有鄧通趙談所信者賈誼張釋之爰盎此所謂少欲也武帝雖有韓嫣李延年而所貴者公孫弘倪寛卜式此所謂英朙也故君聽不惑政無頗纇近則開元初內有姜皎崔滌以極宫中之樂外有姚廬蘇宋以修天下之政得元成之欲享舜禹之名六合晏然千古莫及其故何也倖臣不得干政事也後代能知漢之文武及開饌因與北門大將軍王駕鶴等結歡共籌隂計而朝恩竟敗大舉大事非北門無以成功此所謂天下之常勢也李訓因守澄得幸雖職在近宻而日夕逰於禁中出入無礙此時挾守澄之勢與天子契若魚水北軍諸將望其顧眄與目覩天顔無異若以中㫖諭之購以爵賞即諸將從之勢如風靡矣訓捨此不用而欲以神州靈䑓㳺徼搏撃之吏抱関擁篲之徒以當精甲利兵亦猶霜蓬之禦烈火矣頼中人覺其變未及其亂向使訓計盡行所誅者不過侍從數百人而已其徒尚數千人與北門恊力報怨則天下橫流矣何以知之昔竇武之舉事也以五校士數千人屯都亭下中官矯詔令張奐率营士與陣對陣乃大呼武軍曰竇武反汝皆禁兵當宿衞宫省何故随反者乎自旦至食時兵䧏畧盡由是知自前代以来禁軍唯畏伏中官宰臣焉能使其效死嗟乎焚林而畋朙年無獸竭澤而漁朙年無魚既經李訓猖撅則天下大勢亦不可用也方士論秦皇漢武非好道者也始皇擒㓕六國兼羲唐之帝號漢武剪伐匈奴恢殷周之疆宇皆開闢所未有也雖不能尊周孔之道以爲教化用湯武之師以行吊伐而英才逺畧自湯武以䧏鮮能及矣豈不悟方士之詐㢤盖以享國既乆歡樂巳極馳騁弋獵之力疲矣天馬碧雞之求息矣魚龍角觝之戯倦矣絲竹鞞鼓之音厭矣以神仙爲竒以方七爲玩亦庻幾黃金可成靑霄可上固不在於嗇神錬形矣何以知之苟卿稱千萬人之情一人之情是也百王之道後王是也余聞武宗之言是以知耳嘗於便殿言及方士皆譎詐多不可信也上曰吾知之矣宫中無事以此遣悶耳余嘗覧曹植論言左慈封君逹之類家王及植兄弟以優笑蓄之耳斯言信矣大抵方士皆習靜者爲之隱身巖穴不求聞逹如山鹿野麋是其志也豈樂翹車之召㢤敢自衒其術面欺朙主者亦鮮矣時旣不用逐之可也殺之非也若以共詐而可知則公孫卿欒大無非行詐殺其干勢利以自衒者足以大戒蘭艾同焚斯爲甚矣貞觀末高宗不誅天笁方士那羅邇婆娑寐逐之歸國斯可爲後王灋矣小人論世所謂小人者便僻巧佞飜覆難信此小人常態不足懼也以怨報德此其甚者也背本忘義抑又次之便僻者踈逺之則無患矣飜覆者不信之則無尤矣唯以怨報德者不可預防此所謂小人之甚者背本者雖不害人亦不知感昔傷蛇傳藥而能報飛鴞食椹而懐恩以怨報德者不及傷蛇逺矣背本忘義者不及飛鴞逺矣至於白公負夘翼之德宰噽遺翟漑之恩陳餘弃父子之交田蚡忘跪起之禮此可與叛臣賊子同誅豈止於知巳之義也世以小人比穿窬之盗殊不然矣夫穿窬之盗迫於飢寒莫保性命於高貲者有何恩義於多藏者有何仁愛旣無恩義仁愛則是取資於道拾金於野若能識㢘耻而不爲是有償金者之行矣若能忍飢饉而不食是有蒙𬒮者之操矣所以陳仲弓覩梁上之盗察非惡人以是而言盗賊未爲害矣然操戈鋋挾弓失以衆暴寡殺人取財者則謂之盗比於以怨報德者亦未甚焉何者人之父子兄弟有不相知者有德於人者是巳知之矣焉得負之㢤李文饒外集卷第三
