body:
  text: 論賔客論謀議論代國論文章論任臣論人物志論朋黨論虛名論食貨論近幸論竒才論方士論小人論賓客論古人稱周公吐握下士而天下歸心唯周公則可何也文王之子武王之叔父於天下無嫌矣故唯周公則可深知他人言不可故再之稟上聖之姿邪不得入是以好士不為纍也漢武為太子立博望苑使通賔客多以異端進者始皆欲招賢人而天下賢人少小人多賢人難進小人易合難進者鴻冥易合者膠固矣何以知之劉濞有枚乘鄒陽不周其言而應高田祿伯為其羽翼劉武有鄒陽韓安國不用其謀而羊勝公孫詭為其腹心劉安行隂德好文辭雖愛神仙黃白未害為善終以左吳𬒳敗以是而知雖骨肉之親非周公聖德皆不可也班固稱四豪者六國之罪人也今不復論矣吕不韋習戰國之餘風陳狶值漢網之踈闊逮乎魏其武安終以權勢相傾自武安之後天子切齒衛霍改節則賓客之為害固可知矣公孫弘起客館開東閣以延賔客賢人與參謀議非也然謂之賢人必非黨附朝宰交亂將相者矣其時武帝躬親萬機嚴明御下人自中法不敢為非宰相唯有平津政出一空音孔出以覽自然無傾奪之勢其賔客故人不居顯位未足為朝廷患也然主父偃言朔方地肥饒阻河蒙恬城以逐胸奴滅胡之本公孫弘以為不可朱買臣彂十難弘不能得其一又奏人不得挾弓弩吾丘夀王以為不便上以難丞相丞相詘服則知平津之賔客不及天子之近臣明矣雖有賔客何益於謀議哉况世秉大政者常不下三四人而輕薄逰相門與栁槐齊列所謀以傾奪為首所議以勢利為先是以魏其武安之徒共成禍敗劉班殷鐡之客不相往來又役姦智獻竒計者導其邪徑苟合匪人世道險巇無不由此昔漢武謂田蚡曰君除吏盡未吾亦欲除吏哀帝責鄭崇曰君門如市人何以欲禁切主上皆賔客之害也余謂丞相閉關謝絶賔客則朝廷靜矣謀議論欲知謀議之用捨身名之榮辱觀其立論可知也切於時機明於利害人主易曉當世可行其謀必用而終有後咎鼂錯主父偃是也何者切時機明利害皆怨誹所由生享其利而自罹其害謀闊意中言高旨逺其道可法其術則踈必有高名而不用於世賈山王陽是也謀議不行故能無患智足應變道可與權言雖切於人情意常篤於禮義謀不盡用而身無近憂賈誼是也故當漢文之世亦無高位余門客崔世叔即宋廣平之維私也崔世叔名犯廟諱又常預燕公代公之戎幕故知三丞相才業其備曰廣平好言政事燕公好言文學至於經國逺慮意鮮及之與代公言初若涉川未知其止寥郭廣大莫見津涯味之既深思意逾密代公常為西北邉將帥論四夷事慮必精逺則崔之言信有徴矣凡侍坐於君子聞其言可以知其才術逺近用此道也代國論自古得代國之女以為妃未嘗不致危亡之患者何也亡國之餘焉能無怨氣其立基創業之祖宗必皆一時之英傑其社稷山川之鬼神嘗為一國之所奉受其血食忿其滅亡故能為厲矣必生妖美之色蠱惑當世之君使其骨肉相殘以壞於內君臣相疑以敗於外危亡之兆鮮不由此史蘇所謂必有女戎姝喜妲巳褒姒是也史蘇言之詳矣今不復論是以晉獻得􅌐戎佚女太子有雉經之酷禍及三世符堅納慕容娣弟秦宫有鳯兮之謡敗於五將符堅於五將山破滅梁武取東昏所幸幾至危國隨文嬖陳主之姝終以殞身此皆禍敗之著明者也又夏姬入荆子反疲於奔命吳人始叛楚矣吳嬪至晉世祖怠於為政戎狄乃亂華矣所以王圭者可謂識微之士明於禍福矣文章論魏文典論稱文以氣為主氣之淸濁有體斯言盡之矣然氣不可以不貫不貫則雖有英辭麗藻如編珠綴玉不得為全璞之寶矣鼓氣以勢壯為美勢不可以不息不息則流宕而忘返亦猶絲竹繁奏必有希聲窈眇聽之者恱聞如川流迅激必有洄洑逶迤觀之者不厭從兄翰常言文章如千兵萬馬風恬雨霽寂無人聲蓋謂是矣近世誥命唯蘇庭碩敘事之外自為文章才實有餘用之不竭沈休文獨以音韻為切重輕為難語雖甚工旨則未逺夫荆璧不能無瑕隋珠不能無纇文旨既妙豈以音韻為病哉此可以言規矩之內不可以言文章外意也較其師友則魏文與王陳應劉討論之矣江南唯於五言為妙故休文長於音韻而謂靈均以來此祕未覩不亦誣人甚矣古人辭高者蓋以言妙而適情不取於音韻曹植七言話有回泥諧旅四韻三粲詩有攀原安三覩班固漢書贊及當時辭賦多用協韻掎於元勛包田舉信是也意盡而止或篇不拘於隻耦文選詩有五韻七韻十一韻十二韻二十一韻者今之文字四韻六韻以至百韻無有隻故篇無定曲辭寡纍句譬諸音樂古詞如金石琴瑟尚於至音今文如絲竹鞞鼓迫於促節則知聲律之為弊也甚矣世有非文章者曰辭不出於風雅思不越於離騷摸寫古人何足貴也余曰譬諸日月雖終古常見而光景常新此所以為靈物也余嘗為文針今載於此曰文之為物自然靈氣惚恍而來不思而至杼軸得之淡而無味琢刻藻繪珍不足貴如彼璞玉磨礱成器奢者為之錯以金翠美質既雕良寶所棄此為文之大旨也任臣論欲知國之隆替時之盛衰察其任臣而巳非常之才固不常有齪齪廉謹足以從政矣其次愚魯朴鄙之人亦不害國唯異於人者可以懼矣世所謂差人也何者陳侯愛郭紹以興侮楚之怒伯陽任公孫以成謀社之夢屠黍稱國之興也天遺之以賢人國之衰也天與之以亂人是也然此人將至必有異物為此先兆故知逺君子近小人汙澤所以興利也鶢鶋止於魯郊下展禽之故也鵜鶘集于魏沼不用管寧之應也是以鸜鵒來而師乙歎鵬鳥至而賈生懼戴鷦一本作巢張臻一本作悲微禽尚能為害况異於此者昔殷宗懼而修德以消雉雊之變魏明樂以酣身不免鷹揚之恨可以警戒哉人物志論余嘗覽人物志觀其索隱精微研幾玄妙實天下竒才然品其人物往往不倫以管仲商鞅俱為法家是不究其成敗之術也僧一行稱調盈虛御輕重唯太公管仲雖霸者之佐不及太公亦不宜比商鞅鞅可與吳起同頗耳以子産西門豹俱為器能是不辨其精粗之迹也子産多識博聞叔向且猶不及故仲尼敬事之西門豹非其匹也其甚者曰辨不入道而應對資給是謂口辨樂毅曹丘生是也樂毅中代之賢人潔去就之分明君臣之義自得卷舒之道深識存亡之機曹丘生招權傾金毁譽在口季布以為非長者焉可以比君子哉又曰一人之身兼有英雄高祖項羽是也其下雖曰項羽英分少有范增不能用陳平去之然稱明能合變斯言謬矣項羽坑秦卒以結怨關中棄咸陽而眷懷舊土所謂倒持太阿授人以柄豈得謂之合變乎又願與漢王挑戰漢王笑曰吾寧鬪智不能鬪力及將敗也自為歌曰力拔山兮氣蓋世其所恃者氣力而已矣可為雄於韓信氣又過之所以能為漢王敵聰明睿智不足稱也朋黨論治平之世教化興行群臣和於朝百姓和於野人自砥礪無所是非天下焉有朋黨哉仲長統所謂同異生是非愛憎生朋黨朋黨致怨讐是也東漢柏靈之朝政在閽寺綱紀以亂風教寢衰黨錮之士始以議論疵物於是危言危行刺譏當世其志在於維持名教斥逺佞邪雖乖大道猶不失正今之朋黨者皆依倚幸臣誣陷君子鼓天下之動以養交遊竊儒家之術以資大盜大盜謂幸臣也所謂教揉升木嗾犬害人穴居城社不可薰鑿漢之黨錮為理世之罪人矣今之朋邪又黨錮之罪人矣仲長統曰才智者亦姦凶之羽翼勇氣者亦盜賊之瓜牙誠如是言然辨之未盡如是者皆小才小勇秪能用詭道入邪徑鼠牙穿屋虺毒螫人如巨海隂夜百色妖露焉能白百為怪哉大道之行當韲粉矣虛名論夫與膏盲同病者不可治也與衰亂同風者不可理也劉向上書曰幽厲之際朝廷不和轉相非怨君子獨處守正不撓衆枉勉強以從王事則反見憎毒讒訴故其詩曰密勿從事不敢告勞無罪無辜讒口嗸嗸又曰分曹為黨往往群朋將同心以陷忠臣正臣進者治之表也正臣陷者亂之機也漢與幽厲之世同風矣于寶晉總論曰朝寡全德之士鄉乏不二之老進仕者以苟得為貴而鄙居正當官者以望空為高而笑勤恪其倚杖虛曠依阿無心者皆名重海內晉文與元成之際同風矣所謂虛曠名重者蓋譏山濤魏野之儔耳後之竊虛名者曾不得與山魏徒隸齒而􅌤貌於世未嘗自愧趨之者如飛蛾赴火唯耻不及豈蛩蛩負蟨之謂哉虛名者以衆多為其羽翼時不敢害後來者以聲價出其口吻人不敢議以此相死自謂保太山之安可以痛心矣食貨論人君不以聚貨制用之臣處將相弼諧之任則姦邪無所容矣左右貴幸知所愛之人非宰相之器以此職為彂身之捷徑取位之要津皆由此汲引以塞訕論領此職者竊天子之財以為之賂聚貨者所以得升矣貴操其竒嬴乘上之急售於有司以取倍利制用者所以得進矣三司皆有官屬分部以主郡國貴幸得其寶賂多託賈人汚吏處之頗類牧羊而蓄豺養無而縱獺欲其不侵不暴焉可得也故盜用貨泉多張空簿國用日蹙生人日困楊雄上書言漢武運帑藏之財填廬山之壑今貨入權門甚於是矣孟獻子有言與其有聚斂之臣寧有盜臣子輿以利國為非楊雄以榷酤興歎稱其職者必皆挾工商之術有良賈之才夀昌習分誅之事弘元致理之要雖有幸臣亦何害於理哉竒才論開成初余作鎮淮甸會有朝之英彥廉問剖符于東南者相繼而至余與之宴言皆曰聖上謂丞相鄭公覃李公固言李公石曰李訓稟五常之性服人倫之教則不及卿等然天下之才卿等皆不如也三丞相默然而退余曰李訓甚狂而愚曾不及於徒隸焉得謂之竒才也自古天不有常勢不可變也昔陳平之患吕宗而計無所出嘗間居深念陸賈由戶而進不之覺也賈揣知其情言曰將相和則社稷安矣因為畫䇿陳平乃寤由是以黃金為絳侯夀將相交歡以敗産祿近世五王之誅二張也漢陽王召大將軍李多祚謂曰將軍爵服隆貴誰人與之曰太一本皆作大字帝與之將軍資産富侈誰人與之曰太帝與之將軍子弟榮祿誰人與之曰太帝與之因謂曰感太帝恩乎多祚漼然泣下又謂曰今太帝之子深居鶴禁危若綴旒將軍豈有意乎多祚遂感慨受命與之定䇿元載之圖魚朝恩也以崔昭尹神州禆昭日請苑中牢醴以為朝恩羊析秋毫之數小人以為能君子所以不忍為也卜式言天久不雨獨烹弘羊天乃雨焉有仲尼之鳴鼓將攻卜式之欲烹致位而反居相位可為之甚痛哉近幸論自古中主以降皆安於近習踈逺忠良其主非不知君子可親小人可去而不改者其蔽有二一曰性相近二曰嗜欲深柏靈之主與小人氣合如水之走下火之就燥皆自然而親結不可解也侯覽張讓所以得蔽君矣元成二后皆有所嗜吹簫撾鼓之娛微行沉湎之樂非幸臣無以承意非近習無以近歡弘恭石顯所以得蠧政矣唯人君少欲英明者則能反是如文帝雖有鄧通趙談所信者賈誼張釋之爰盎此所謂少欲也武帝雖有韓嫣李延年而所貴者公孫弘倪寬卜式此所謂英明也故君聽不惑政無頗纇近則開元初內有薑皎崔滌以極宫中之樂外有姚廬蘇宋以修天下之政得元成之欲享舜禹之名六合晏然千古莫及其故何也幸臣不得干政事也後代能知漢之文武及開饌因與北門大將軍王駕鶴等結歡共籌隂計而朝恩竟敗大舉大事非北門無以成功此所謂天下之常勢也李訓因守澄得幸雖職在近密而日夕逰於禁中出入無礙此時挾守澄之勢與天子契若魚水北軍諸將望其顧眄與目覩天顔無異若以中旨諭之購以爵賞即諸將從之勢如風靡矣訓捨此不用而欲以神州靈臺遊徼搏擊之吏抱關擁篲之徒以當精甲利兵亦猶霜蓬之禦烈火矣賴中人覺其變未及其亂向使訓計盡行所誅者不過侍從數百人而已其徒尚數千人與北門協力報怨則天下橫流矣何以知之昔竇武之舉事也以五校士數千人屯都亭下中官矯詔令張奐率營士與陳對陳乃大呼武軍曰竇武反汝皆禁兵當宿衛宫省何故隨反者乎自旦至食時兵降略盡由是知自前代以來禁軍唯畏伏中官宰臣焉能使其效死嗟乎焚林而畋明年無獸竭澤而漁明年無魚既經李訓猖撅則天下大勢亦不可用也方士論秦皇漢武非好道者也始皇擒滅六國兼羲唐之帝號漢武剪伐胸奴恢殷周之疆宇皆開闢所未有也雖不能尊周孔之道以為教化用湯武之師以行吊伐而英才逺略自湯武以降鮮能及矣豈不悟方士之詐哉蓋以享國既久歡樂巳極馳騁弋獵之力疲矣天馬碧雞之求息矣魚龍角抵之戲倦矣絲竹鞞鼓之音厭矣以神仙為竒以方七為玩亦庶幾黃金可成靑霄可上固不在於嗇神錬形矣何以知之苟卿稱千萬人之情一人之情是也百王之道後王是也余聞武宗之言是以知耳嘗於便殿言及方士皆譎詐多不可信也上曰吾知之矣宫中無事以此遣悶耳余嘗覽曹植論言左慈封君逹之類家王及植兄弟以優笑蓄之耳斯言信矣大抵方士皆習靜者為之隱身巖穴不求聞逹如山鹿野麋是其志也豈樂翹車之召哉敢自衒其術面欺明主者亦鮮矣時既不用逐之可也殺之非也若以共詐而可知則公孫卿欒大無非行詐殺其干勢利以自衒者足以大戒蘭艾同焚斯為甚矣貞觀末高宗不誅天笁方士那羅邇婆娑寐逐之歸國斯可為後王法矣小人論世所謂小人者便僻巧佞翻覆難信此小人常態不足懼也以怨報德此其甚者也背本忘義抑又次之便僻者踈逺之則無患矣翻覆者不信之則無尤矣唯以怨報德者不可預防此所謂小人之甚者背本者雖不害人亦不知感昔傷蛇傳藥而能報飛梟食椹而懷恩以怨報德者不及傷蛇逺矣背本忘義者不及飛梟逺矣至於白公負卯翼之德宰噽遺翟溉之恩陳餘棄父子之交田蚡忘跪起之禮此可與叛臣賊子同誅豈止於知巳之義也世以小人比穿窬之盜殊不然矣夫穿窬之盜迫於飢寒莫保性命於高資者有何恩義於多藏者有何仁愛既無恩義仁愛則是取資於道拾金於野若能識廉耻而不為是有償金者之行矣若能忍飢饉而不食是有蒙𬒮者之操矣所以陳仲弓覩梁上之盜察非惡人以是而言盜賊未為害矣然操戈鋋挾弓失以衆暴寡殺人取財者則謂之盜比於以怨報德者亦未甚焉何者人之父子兄弟有不相知者有德於人者是巳知之矣焉得負之哉李文饒外集卷第三
