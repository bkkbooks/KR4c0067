body:
  text: 詔敕下賜石雄詔賜劉沔詔意賜李石詔意賜王元逵詔意賜李石詔意賜王宰詔意賜張仲武詔意賜劉沔詔意賜王宰詔意賜石雄詔意賜王元逵何弘敬詔意二首賜沿邉諸鎮密詔意停歸義軍敕旨置孟州敕旨李回宣慰三道敕賜王宰詔意賜石雄詔意敕石雄古者有必勝之將無必勝之人欲立奇功實在謀師朕所以求鷙鳥於纍百得飛將於無雙總率諸軍以臨賊境况卿受尺一之詔初無辦嚴盤丈八之矛果能蕩冦眷言勛績深注余懷近聞從諌時百姓相驚云卿以七千兵至數告於衆魄兆於人今天䇿向晨已及成軍之候龍􅋮建斾必叶渡江之謡舊史昭然冥符可驗加以天道在乎西北順歲有功福星煥乎龍庭為國大慶勉弘方略契此休徵昔鍾會以二十萬兵頓於劍閣鄧艾才一萬衆直抵成都只在決機豈由衆寡知卿能辦故諭此懷然聞卿每自履軍常先士卒既有輕敵未足耀奇朕借卿一舉之功以定必擒之計至於小陳不可自行魏武帝嘗戒夏侯妙才曰為將當有怯時不可但恃勇也當以勇為本行之以智計但無知任勇一匹夫敵耳張遼單身入昌狶家魏武責曰此非大將法今卿為萬人之帥啓千乘之行舉必責謀動資持重報國在於平賊不在輕身為將本於坐籌寧勞陷陳卿宜以朕之戒嘗自書紳務建功名副茲委遇賜劉沔詔意緣卿二年在外城府久虛今殘虜未平南北皆有戎事欲令卿却歸本鎮應接兩隅行營諸軍未知所付聞王逄頗有武用卿所素知今已追赴大原欲令充本道行營都知兵馬使又緣例偏禆日近官秩尚卑指揮諸軍未即宜稱今緣石雄王宰皆欲進兵得卿一軍齊入足分賊勢卿宜審自籌度歸本鎮後在朝及側近武臣誰人堪付行營兵事宜密狀具一兩人進來如卿離行營後兵力事勢深入未得亦須審具事實聞奏不要隱情今取決於卿切在審詳賜李石詔意訪聞近日賊中轉更窮蹙自相殺戮人心不安即目軍權多在郭誼因此誘動必應事機李丕是郭誼親密尤合相信卿宜暫追赴使令與郭誼書論以利害遣其自圖劉稹早務歸降倘效誠款必重酬賞卿宜靣看李丕手疏兼令便自封題分付王逢遣密作計召軍人百姓送入澤潞其書草卿宜封進賜王元逵詔書材幹筋革出自江淮除進奉之外並敕令所禁蓋以有國之制固須立防朝廷法度理當畫一卿國之懿戚時之信臣方進徑兵坐淸殘孽誠宜假以利器壯軍威朕之於卿固無愛惜但以河朔數鎮事體應同若一度賜卿必傳相援例恩信不一非撫御之逺圖賜與頻繁墮朝廷之舊制卿是朕之心腹必合樂守憲章故示至懷想當知悉賜李石詔意省所奏劉稹令賈群齎李恬書與卿將兵屬同赴闕庭兼請歸葬東都事宜具悉比者河朔諸鎮惟淄靑變詐最多劉悟隨來舊將皆習見此事察其情偽深要精詳蓋緣四面王師尅期石雄王宰巳據天井卿當道又得石會既失重關之嶮將弋在冗之妖鎮衛徑兵皆臨境上城孤援絶情計巳窮所以密將款詞歸命上相恐是偷安旬月潰緩王師稍得自完復來侵軼况饋運日有所費春作漸已及時勞我師徒恐非至計卿與其要約令靣縳來降卿即馳至界首親自受納苟不如此且須進軍必不得因此遷延令其得計仍不得先受章表便與奏聞今賜與劉稹書白想宜知悉賜王宰詔意省所奏差張公輔入澤州潞州亦粗得賊中軍情若許招誘乞賜詔命事宜具悉劉稹喪父之初已拒朝命旋又焚爇晉綘廬舍侵逼萬善孤軍罪惡貫盈言詞甚悖自卿全師壓境頻挫其勢尋得天井重關下臨髙平危壁邇來頗自知懼方獻偽詞然天奪其心鬼迷其志宋人已病不告析骸之情朱鮪乞降曽無靣縳之效尚聞張皇叛卒覬望鴻恩不戢群凶徒云繼襲想卿忠憤必志梟夷况自去年以來頻奄畢今又福星煥耀正臨天駟東漢書云畢為天網網羅不善之人房為明堂方集重華之慶懸象昭晰前史所書朕奉天道以行誅守祖宗之成法顧茲小冦終不貸刑亦知晏實是卿之愛弟將申大義在抑私懷豈無鴒原固慎名器今料其初通信使必謂卿且駐軍想彼叛徒猶希洗雪乘此討襲必有竒功韓信襲歷下之軍李靖翦隂山之冦皆因敵心懈弛故得機討不遺想卿久習兵符備詳虜態便須覆其巢穴不可更有招携劉稹縱有表章請自靣縳不得便自報答亦須奏聞當務遠圖勿拘小信速宜攻討以副朕懷想宜知悉賜張仲武詔意昨以李石文吏不可自赴行營令在太原應接戎事緣親兵在外城府空虛楊辨糾合征師衆才一旅迫逐主帥擅領兵權尋詔近地行營量抽兵馬便令翦撲計日梟夷緣鎮州地接土門最為便近已詔元逵出師五千人馬向南諸軍聲援顧茲小冦未足勞卿大軍緣何淸朝下河水官健曾經楊辨將領久與亂軍同處恐其自思家屬因此搖心宜速與卿本道都頭密意動靜與淸朝計會椅角相應如萬一淸朝官健禁戢不定抽歸太原已令把絶鴈門遏其歸路卿便須出軍掩襲勿遣漏失凶徒每事與淸朝商量務從權便應機在速不更待奏聞賜劉沔詔意敕自古出師莫重謀帥李廣臨塞威動殊鄰吳漢理軍允如敵國舉茲制勝方見成功往者羯胡亂華伊洛未靖光弼以上勛元宰移守盟津即知急病救艱因事為重以卿近破狂虜已著英名河內當賊咽喉為吾雄屏爰求威望將以撫寧昔漢光武謂冦恂曰頴川迫近京師當以時定惟念卿獨能平之從九卿復出憂國可知也卿勿以纍換雄藩輕此寄任䇿勛之日遷擢必殊詔到便宜擇精兵二千人自領赴鎮直扺萬善震耀威聲壯忠武捕鹿一本作掎角之形分常蛇首尾之勢今屬水潦將至農事已興偃武息人固難淹久勉弘方略副朕誠懷賜王宰詔意將帥大略前史備書保境者以守險自固進攻者以過險必尅制其死命務須批亢今賊在網羅只守巢穴廣立虛柵多設疑兵蓋謂自防豈暇侵軼且欲偷安嵗月以老王師卿分兵相守果中姦計况卿已得天井尋扼咽喉逰創其間更何顧慮聞天井前後寨柵二十餘所以備奔衝如此費兵固須寡力料賊四靣設備兵數可知卿進大軍便須拒捍何暇更於諸路敢軼封疆以近事明之足可為據昨者榆社兵馬盡赴大原自沁至儀五百餘里賊已却得石會其間細路至多數旬無備竟不馳突卿以此揣度可見其情又諸軍都頭各守一寨遷延避冦苟務過時卿若更廣詢謀取其自便必恐撓卿思慮難見成功卿宜密度事機自為心計其賊路逼近州縣及當卿腹背受敵之處即須留兵防守用備冦虞其他抽隨大軍併力攻討如此則出其不意必覆妖巢國家無徵彂之勞計司減饋運之費足得制勝豈在濟師又聞每度出兵傷夷不少待其瘡痛皆復不免戰鬪闕人今為卿方圓無所愛惜其陳沒官健如無子弟便别擇少壯者充替其亡殁家糧賜亦許不停其傷夷校重有妨役使者亦任擇人充替其傷夷者仍不停糧非惟感勵士心亦冀漸完兵力卿宜以此宣示各使聞知故令中使專往看卿處置須待事了方得遣回賜石雄詔意與王宰詔同於姦計字下云聞冀氏翼城寨柵有一十八所以備奔衝自此以後又與王宰詔同至各使聞知下云又聞將士有苟避兵鋒全不得力者卿宜便令守寨不要將行其彥佐隨使衙隊自大將至宴設及工巧之徒除卿先令歸本道外聞在者尤多卿既領節旄自有土地並宜曉諭彂遣不要更留仍具人數奏聞雖卿善於撫衆皆自樂從然亦在割情不令撓事故令中使專往看卿處置卿須待了方得遣回賜王元逵何弘敬詔意後别各存處分與彥佐等詔同何比緣暑熱未退固難進軍想卿至誠豈安終食今淸商已至􅎏鼓聲雄白露將凝戈鋋氣肅擊隼應節而逾厲代馬嘶風而自豪順天行誅正在今日近者天井冀氏頻有交鋒蓋緣卿等當軍未抵邢州莫分賊勢併有精卒得以奔衝今四靣王師一十萬鎮魏兩軍自當其半屯集在境已及歲期雖罰罪除殘誠無所吝然生人膏血杼軸其空朕既為父母豈可坐延歲月想卿忠憤固不懷安况卿當道頃為盧從史劉從諌所敗與澤潞素是深讐卿之騎兵海內精徑將虔劉殘憤士有鬪心宜乘此機豈可玩冦想詔到之後速抵邢州但得綴其精兵不合併力西向朕當詔王宰石雄齊心攻討破此殘冦決在今秋故令中使往諭朕意想卿勿更疑惑副茲朕懷何弘敬詔中攺未抵邢州為未過漳河况字以下攺為卿奉親之孝朕所深知想陟岵有懷循陔思養違離周歲固切歸心當早決機豈宜玩冦賜王元逹何弘敬詔意近頻捉得賊界生口及收得投降人等每知賊中精卒數亦無多只是應急旋抽併當一靣破其此計實在共攻緣王宰即過乾河便抵澤州城下恐賊併取山東兵馬抗拒南靣王師卿宣詔到日便須深入綴其精卒不遣東西旬月免有救兵王宰必能成事如因此掎角便克澤州則卿之功勛更髙王宰朕每念陳兵原野又屬炎熱由此孽童致茲暴陵然獫狁孔亟周宣興六月之師淮夷未寧公旦有三年之役事非獲已諒匪勞人卿當深躰朕懷早圖戡翦上薦功於宗廟下息患於生靈則卿之子孫永受休祿朕之酬賞必極寵榮布告三軍咸令知悉賜緣邉諸鎮密詔意近者冦孽初平海內無事方欲永櫜弓矢保義生人圖遠開邉誠非朕志然盛衰倚伏皆有其時古人云聖人無巧時變是守蓋惜其時也昔漢武帝命將出師輕齎深入耗中國三十餘年竟不得臣伏胸奴蕩定沙漠此未得其時也至宣帝值胸奴百年之運因懷亂危亡之機單于稽首三代稱籓烽燧不設邉城晏間此遭遇其時也近則回鶻常以兵助中國有戡難之功朝廷纍降姻親歲致繒絮因我為援振服諸蕃百有餘年最為強盛及本國衰亂種落流離景附北邉猶為桀鷔因其入塞暫舉偏師遂大破穹廬却收公主歸降甚衆梟戮至多一國銷亡易於拉朽豈非得其時也今吐蕃未立贊普已是三年將相猜携自相攻擊緣邉兵馬頗已抽歸想其城鎮皆空守備多闕儻彼鬪戰未定自有黨讎一國之中疑懼相半則備邉城守固有異心計卿軍鎮必有舊人諳練邉事深入窺探來往是常易知隱伏之情足見存亡之兆宜精意選練務得其人切須識見精專誠信可保資以財帛俾其隂通自隴山天寧關北至蕭關原州安樂州烏蘭橋等皆是賊之險路入冦要津各要知兵馬多少何人主領如兵數寡少人心動搖乘此危機必易為計多設反間密用竒謀使自歸心豈勞兵力觀釁而動取若拾遺此兵法所謂不戰而屈人之兵善之善也國家河西隴右四鎮一十八州皆是吐蕃因中國有難相繼陷沒今當其破滅之勢正是倚伏之期取亂侮亡聖人遠略斯乃以直報怨非是不守和盟想卿精忠必逹此旨故令劉濛專往親諭朕懷卿宜選練師徒多蓄軍食使器甲犀利烽火精明尺籍伍符盡無虛數務修實效勿顯事機制置之間尤須密靜詔書有所不盡皆已指示使臣勉建良圖副茲委遇停歸義軍敕書敕李思忠首率蕃兵歸誠向闕念其忠款特許來朝而又久慕華風願留京邑俾參環衛用報勛庸其歸義軍使宜停將士等同叶義心所宜優寵况聞諸道軍鎮皆置馬軍選擇蕃渾尤不易得緣此將健久工騎射頗出常倫列於牙旗足壯戎閫宜分諸道節度使團練收𬋩便給本道衣糧稍加安存務令得所置孟州敇旨敕昔馮異之守盟津已建軍號近光弼之保伊洛先據三城蓋以河有造舟之危山有摧輸之險左右機軸表裏金湯既當形勝之地實為要害之郡令所置制豈限常規積萬庾於敖前尤資地利列二矛於河上須壯軍聲其河隂縣宜割屬孟州仍攺為望縣其河淸縣却還河南府縣官等並準前敕處分其東都鎮遏兵馬依前屬東都防禦使鄭滑汝州防戍兵各一千人令弘敬權指揮事平後續有處分李回宣慰三道敕旨敕成德軍魏博皆出兵甲俯臨賊境秋氣已至攻取是時元逵弘敬制勝伐謀必有成算固須命使遠訪嘉猷又回鶻雖已遁逃尚存餘燼今朔風始徑塞草具腓猶慮未革梟音敢懷狼顧迫於飢窘復擾邉城仲武久欲蕩除俾無噍類成其志業壯彼威聲亦在使臣往喻朕意各宜奮厲早建殊勛解甲勞還免及祁寒之候止戈除害庶臻仁夀之期咨爾帥臣副豫委遇宜令刑部侍郎兼御史中丞李回充幽州鎮魏等道宣慰賜王宰詔意卿頃蒞澤州頗彰惠政彼之黎庶自合有情申以恩威正在今日卿宜大布誠信且務綏懷不得焚其室廬翦其桑梓自當壼漿塞路襁負而歸兼招取丁壯三五千人不要分給器械每至填壠攻壘皆遣先驅料澤州城內非其父兄即其子弟必合自相愛惜豈願交接兵鋒兼領遣使逼其軍城再三號令若能捨逆效順速自歸降非但生全仍加優賞克城之後不𣏌秋毫如堅守危巢坐待撲滅必當不存噍類務極兵威料其聞此先聲皆自感厲勉於方略副朕深懷李文饒文集卷第七
