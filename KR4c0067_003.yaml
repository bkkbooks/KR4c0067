front:
  text: 李文饒文集卷第三會昌一品制集
  hash: sha256:477fff598138c865bfdc4d8a1239ec2480d047d612a5b654ee0b6453b4c9ccc6
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4c0067_SBCK_003-1a}
body:
  text: 制宣懿皇太后祔太廟制宣帝改名制遣王會等安撫回鶻制討回鶻制討劉稹制授王宰兼克河南諸軍攻討使制授劉沔招撫回鶻使制授張仲武東靣招撫回鶻使制宣懿皇太后祔太廟制奉敕撰門下朕近因載誕之日展承顔之敬太皇太后謂朕曰天子之孝莫大於丕承人倫之義莫重於嗣續穆宗睿聖文惠孝皇帝厭代已久星霜屢遷禰宫曠合食之禮惟帝深濡露之感宣懿皇太后長慶之際德冠後宫夙表沙麓之祥實茂河州之範先朝恩禮之重中壼莫偕况誕我嗣君纘承宣宗已協華於先帝方延祚於後昆思廣詒謀庶弘博愛爰遵舊典以慰孝思當以宣懿皇太后祔太廟穆宗睿聖文惠孝皇帝室率是彞訓其敬承之朕祗奉慈旨載深感咽宣示中外咸使知聞主者施行仁聖文武章天成功大孝皇帝改名制王者照臨萬寓名豈尚於難知敬順五行理宜避於勝伏徵諸前史義實炳然昔炎漢之興洛滂去水所都名號猶乃避之况我國家運昌土德豈可以王氣勝於君名所以憲宗繼明之初實已捨水必有冥數叶於禎祥漢宣帝柔服北夷弘宣祖業功德之盛侔於周宣御曆十年乃從美稱朕逺惟大漢之事近稟聖祖之謀爰擇嘉名式遵令典敬承天意永保鴻休宜攺名為炎仍令所司擇日分命宰臣告天地宗廟其舊名中外表章不得更有回避布告遐邇咸使聞知遣王會等安撫回鶻制奉敕撰敕自古令王撫寧荒服忠於國者則有繼絶之恩順於道者則有固存之義所以厚其嚮化優以報功回鶻纍代姻親久修臣禮服我聲教保茲信誠嘗以國難識其忠良嚴霜見其貞松疾風知其徑草永言勳力豈忘豫懷如聞為紇扢斯所攻兵折衆叛畜産大耗國人荐飢流離轉徙逺踰沙漠近因太和公主遣使入朝已知新立可汗寓居塞下告窮請命未有所歸每念艱危載深憫惻今欲救恤窮困撫慰瘡痍使四方知朕不忘舊勳保其大順昔胸奴乖亂呼韓欵塞漢宣帝轉粟賑救權而施宜故得三代稱藩北邉罷警前令典可不務乎宜令右金吾衛大將軍兼御史大夫王會持節充安撫大使宗正少卿兼御史中丞李師偃充副使專往慰問仍賑米粟二萬石俾期安輯離散漸就漢南再復舊強永保恩好宣示中外宜體朕懷討回鶻制奉宣撰門下夫天之所廢難施繼絶之恩人之所棄當用侮亡之道朕每思前訓豈忘格言回鶻比者自恃兵強久為桀鷔凌虐諸部結怨近鄰紇扢斯潛師彗掃穹廬瓦解種族盡膏於原野區落遂至於荆榛今可汗亡逃失國竊號自立逺逾沙漠寄命邉郵朕深念衰殘尋加賑恤每陳章表多詐諼之詞接我使臣如全盛之日無傷禽哀鳴之意有困獸猶鬪之心去歲潛入朔川大掠牛馬今春掩襲振武逼近城池可汗皆自率徑兵首為冦盜不耻破敗莫顧姻親河東節度使劉沔料敵伐謀乘機制勝彂胡貊之騎以為前鋒搴翎湯傳搴歙侯之旗一本作翎漠世陳侯之旗戈彼在穴短兵鏖於帳下元惡軼於彀中况乘匪六騾衆才一旅儲糧已竭計日可擒太和公主居處不同情義久絶懷土多畏函聞黃鵠之歌失位自傷寧免緑衣之歎念其羈苦常軫朕心今者脫於豺狼再見宫闕上以攄宗廟之宿憤次以慰太皇太后之深慈永言歸寧良用欣感其回鶻既以破滅義在剪除宜令諸道兵馬並同進討河東立功將士以下優賞續次條流處分應在京外宅及東都修功德回鶻並勒冠帶各配諸道收𬋩其回鶻及摩尼等莊宅錢物等並委功德使與御史臺京兆府各差精強幹事官點檢收録不得容諸色職掌人及坊市富人輒有影占如有犯者並當極法錢物納官摩尼寺僧委中書門下即時條疏聞奏於戲昔漢宣帝值胸奴乖亂推亡固存呼韓單于携國歸命入朝保塞漢后所以有擁護之恩郅支單于背叛禮義傷毁威重漢史所以明可誅之罪二虜禍福皆自取焉四夷百蠻宜以為鑒布告中外深體朕懷主者施行討劉禛制奉宣撰門下定天下者致風俗於大同安生人者齊法度於畫一雖晉之欒趙家有舊勳漢之韓黥身為佐命至於干紀亂律罔不梟夷禁暴除殘古今大義劉悟填居海岱嘗列牙爪屬師道阻兵六師問罪三面開網一境離心乘此危機遂能歸命憲宗嘉其誠欵授以南燕穆宗待以腹心委之上黨招致死士固護一方逮於末年已虧臣節劉從諌生稟戾氣動扇剛風因跋扈之資以專封壤恃紀綱之律以逞驕恣暫展執圭之儀終無上綬之請隙駒為樂魏豹姑務於絶河井蛙自居孫述頗聞於巴蜀大受亡命妄作妖言中詗朝廷潛圖左道輒謀動戎師屢奏隂謀顧苕卵之可矜豈泉魚之是察暨乎沉痼曽靡哀鳴猶駐將盡之魂恣行邪僻之志罔惑舊校樹立狡童中使挾醫莫覩其朝服近臣銜命不入於壘門逆節甚明人神共棄其贈官及先所授官爵并劉稹在身官並宜削奪成德軍節度使王元逵魏博節度使何弘敬或姻連王室或任重藩維懇陳一志之誠願揚九伐之命吳漢任職受詔而初無辦嚴卜式朴忠未戰而義形於內况成德軍嘗以驍騎橫衝首破朱滔戰勢方酣再回魯陽之日鼓音不息三周不注之山魏博軍亦以大斾涉河竟殱師道建十二郡之旗鼓以列降人削六十年之厲階盡歸王化士賈餘勇軍有雄名必能稟鄼侯之指蹤成葛亮之心伐咨汝二師朕尤注懷元逵守本官充北靣招討澤潞使弘敬守本官充東靣招討澤潞使潞府曩者烈祖在藩先啓聖符瑞昭晣繢事煥於泗亭鑾輅巡遊金石烈於代邸實為可封之俗久為仁夀之鄉艱難以來頗著誠節必非同惡咸許自新其昭義軍舊將士及百姓等如保初心並赦而不問昭義軍舊大將等如能舍逆效順以州郡兵衆歸降者必厚加封賞如能擒送劉稹者别授土地以振勳庸其村鄉百姓如所在團結歸順者亦加爵賞劉悟下鄆州舊將校子孫及劉從諌近招致將士等喻以善道宜聽朕言凡秉義立名須明太順未有忠於所奉上悖君親昔郤至有言受君之祿是以聚黨有黨而爭命罪孰大焉田橫能得士心人多致命伏於海島莫敢猖狂及漢髙召之奔走向闕豈嘗違拒漢使留止田橫唯慕殉以成仁不相挺而作亂故得其王殁延殊寵光顯令名爾等既有義心宜思改悔如能感喻劉稹束身歸朝必當待之如初特與洗雪爾等舊校亦並甄酬仍委夷行劉沔茂元各務進兵同力攻討其諸道進軍並不得焚燒廬舍彂掘丘墓擒執百姓以為俘囚桑麻田苖皆許本户為主罪止元惡務安生靈於戲藩維大臣抗疏於外髦雋舊老昌言於朝戒朕以祖宗之法不可私一族刑賞之柄所以正萬邦宜用甲兵陳於原野雖朕以恩不聽群臣以義固爭詢自僉謀諒非獲已布告中外明體朕懷主者施行授王宰兼充河陽行營諸軍攻討使制奉敕撰敕淮南徑兵伏灌夫之勇河內雄屏委冦恂之忠各用所長俾專大任以茲制勝斯為良圖忠武軍節度使銀青光祿大夫檢校工部尚書兼許州刺史御史大夫上柱國王宰結髮從軍擁旄為將一劍橫陳萬算皆全隂則難窺勇能重閉亞夫急緩之任繼父綘侯祭彤禦侮之才為吾子路近者狂寇慿阻屢犯顔行茂元莫遑定居驟聞三捷願言奮旅方展六竒遽屬爽秋暫嬰寒泄誠威重之可倚顧卧護之未任是用改爾乘軒總齊諸校隱如敵國禦彼奔衝昔韓信建旗出井陘之隘鄧艾束馬越隂平之艱皆立竒功稱為名將爾宜自厲無愧前良授劉沔招撫回鶻使制奉宣撰昔東漢中夏既寧胸奴飢饉臧宫請命將臨塞圖刻石之功光武報云柔能制強且傳聞之事常多失實雖滅大冦不如息人朕每覽前史為之興歎又以大禹修德有苗歸心周穆徂征荒服不至固存取亂在擇良圖回鶻頃以本國荐飢落種携二紇扢斯乘其衰亂遂覆危巢既焚老上之庭盡剪名王之族可汗失地逺害來附塞垣朕言念姻親不忘勳力諭以呼韓欵塞漢氏舊章戎不亂華國之大典且分兵食救彼飢人令歸溟南方議賑贍屬可汗久嬰沉痼酋長異心雖隨畜荐居固無定所而控弦深入頗亦渝盟邉將戎臣屢抗章疏策慮逼臆咸請驅除朕以王者之師以全取勝胸奴見短嘉婁敬之善籌馬邑設權戒王恢之兵首推誠含垢亦以喻時况朔夜沍寒有皸瘃之患隂山遙路多曲折之艱宜以德綏豈勞兵碎某官劉沔久臨沙漠頗識虜情既啓十乘之行必致六騾之遁委之告諭方俟成功可守本官充招撫回鶻使如不自改悔終須驅逐其諸道行營兵馬使權令指揮主者施行授張仲武東靣招撫回鶻使制奉宣撰門下古人云兵者所以明德除害也故舉得於外則福生於內朕每念戎事務安生靈既獲逺圖宜恢長算回鶻可汗寄託塞上未歸虜庭近者遣使薊門懇陳誠欵宋人病告於子反朝鮮心附於樓船繄我信臣實得要領幽州盧龍軍節度副使知節度事觀察處置押奚契丹兩蕃經略盧龍軍等使銀青光祿大夫檢校工部尚書兼幽州大都督府長御史大夫蘭陵郡王食邑三千户張仲武風雲感契鳬藻協誠自升將壇首剪狂冦戈鋋亟聞於彗掃牛馬殆至於谷量故能望影揣情巳探致虜之術豈止聞風破膽益堅慕義之心遽奏封章願申告諭彼既率服寧忘懷柔况虜騎往來疾於風電沙場敻邈介以山川臨敵應機固難統一昔衛霍之襲葷允異道而征辛趙之繫罕羌兩從其志成豫廟勝之䇿在舉髦傑之臣俾爾鷹揚挫其狼顧將復蠻夷之叛固在七擒勉思將帥之風無忘無利崇以夏官之秩委其統制之權當竭一心敬茲休命可檢校兵部尚書兼充東靣招撫回鶻使其當道行營兵馬使及奚契丹室韋等並自指揮餘如故主者施行李文饒文集卷第三
