body:
  text: 李衛公集訂正明本錯簡六首据全唐文訂正文集卷十五請賜仲武詔第十葉前三行入覲之初下應接第十一葉前一行與鄭注交結至末論石雄請添兵狀第十一葉前一行仍望約陳許長行制下應接第十一葉後九行度支權給衣糧至末請授王宰兼行營諸軍攻討使狀第十一葉後九行尚未安定茂下應接第十葉前三行茂元縱得痊復至末案明本衍一茂字外集卷三食貨論第九葉後三行壽昌習分誅之事弘下應接第十葉後二行羊析秋毫之數至末奇才論第十葉後二行以為朝恩下應接第十一葉前十行饌因與北門大將軍王駕鶴等結歡至末近幸論第十一葉前十行及開下應接第九葉後三行元致理之要至末
