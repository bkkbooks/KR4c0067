body:
  text: 制詞授嗢没斯可特進行左金吾衞大將軍員外置仍封懐化郡王制授嗢没斯檢校工部尚書兼歸義軍使制授歴支特勒以下官制授嗢没斯賜姓李名思忠制授回鶻內宰相爱耶勿歸義軍副使兼賜姓名制授何淸朝左衞將軍兼分領蕃渾兵馬制奉宣代諸道節度使書上代劉沔與回鶻宰相頡子伽思書代忠順報回鶻宰相書意代劉沔與回鶻宰相書白代符澈與幽州大將書代弘敬與澤潞軍將書代彦佐與澤潞三軍書授嗢沒斯可特進行左金吾衞大將軍員外置仍封懐化郡王制敕昔秩訾獻籌歸忠於大國日逐避禍納款於明庭宣帝嘉其一心寵以優禮或存故王之印綬或賜歸德之美名爰舉舊章式崇新命回鶻嗢沒斯特勒倜儻慕義深沉有謀駃騠之生超千里鷙鶚之擊厲九秋屬献款誠布于邉將尋執醜虜不遺君親戢其餒殍之徒曾靡秋毫之犯旋觀所履大節甚明朕與回鶻代結和親久敦鄰好念其乖亂義在固存莫若撫其酋豪顯其大順使諸蕃知我招携之禮更逾往昔之恩仍加帯礪之封俾授爪牙之寄服茲休寵可不敬哉授嗢沒斯檢校工部尚書兼歸義軍使制敕回鶻代雄絶漠名振北蕃而乃厭金革之強慕朝廷之禮願襲冠帯思覩漢儀蟬蛻自致於㓗清豹變獨蔚其文彩不有髦傑孰啓壯圖嗢沒斯禀氣隂山降精斗極生知忠孝神授兵鈐自強之心隱如敵國衞士之氣森若戈矛果能因亂布誠覩幾立節深叶懐柔之志不因告諭之詞昔者取士殊鄰秦能致覇得賢異壤晋實用材是用優以寵光處之權貴褒納忠之顕效錫歸義之美名俾建斾於新軍示絶席於諸將勉修臣節服我官常授歴支特勒以下官制敕國家與回鶻乆修鄰好重以姻親視其酋豪猶吾赤子屬本蕃乖亂種落未安君長之間自相疑阻竆而歸款得不撫寧况爾等生戴斗之鄉精能貫日負射鵰之藝氣乃凌雲忠而善謀勇則能斷率其驍騎來附北邉願削祍以圖全且櫜弓而俟命矢其一志之死靡他既投我以誠則招之以禮昔徐盧欵塞即受漢封比能入朝仍䟽魏爵今則解其被毳荣以彯纓爰嘉介石之心式寵銜珠之命宅侯忠孝可保於克終安上子孫方期於必貴勉茲師律為我信臣授嗢沒斯攺姓李名思忠制昔項伯歸義奉春建䇿賜之劉氏列在漢宗爰寵茷勛仰惟前典嗢沒斯代雄沙漠勇冠天山早稱良將之材甞佩明王之紱附於絶塞嵗以再期秉是一心竟全大節今則解其毳服制列牙旗自我加恩益聞厲志驥登呉坂感顧盻而長鳴劍出豐城因拂拭而増煥朕以漢北平守廣北狄避之號為飛將顧其苖裔頗在龍庭美瓜瓞之所興因而命氏念棣蕚之方曄當使同榮夫思在無邪忠為徳令嘉其立志用以錫名爾宜念之無替休命授回鶻内宰相愛耶勿歸義軍副使兼賜姓名制自古軍制必有佐貳逮至漢氏亦循舊章既得將材俾叅戎政實資謀䇿用正紀綱愛耶勿往在龍庭常為貴相乗其乖亂遂投迹於殊鄰加以懐柔竟歸心於上國而又推誠所奉果恊良圖毎獲異謀必来獻款旋觀深志可謂竭情昔戎狄請盟良由孟樂呼韓率服始有秩訾言念茂功所宜異等因其請族錫以嘉名漢錫秺侯尚採祭天之義魏親程昱用疇捧日之心寵以貂璫冠於禆校服茲新命宜保厥終可檢校右㪚騎常侍兼歸義軍副使乃賜姓李名弘順授何清朝左衛将軍兼分領蕃渾兵馬制敕新授金紫光禄大夫檢校太子賔客使持節都督銀州諸軍事兼銀州刺史充本州押蕃落使及度支銀州監牧馬副使何清朝漢用駱甲則灌嬰副於騎將魏得関羽則張遼挾以前驅故能挫強楚之鋒芒取顔良於麾盖爾夙負智勇備甞艱難精誠彂而石開志氣作而虹貫朕以思忠伏義倜儻秉心堅正且聞誓剪讎㓂不以賊遺君父委之兵柄庶展拘原舉駭電之鋒期於盡敵得射鵰之騎未足偁功宜勉一心成予九伐俾參環衛用壯軍聲可檢校太子賔客兼左衛將軍侍御史㪚官如故仍分領河東道蕃渾兵馬赴振武界取思忠㫖揮代劉沔與回鶻宰相頡于伽思書會昌三年八月二十日大唐河東節度使檢校右僕射劉沔致書于九姓回鶻頡于相公閣下曩者回鶻因延陀之亂歸心中國太宗親幸靈武納彼降人置瀚海都督列於内地爰初封植自我深恩回鶻立國立家莫非唐德皇帝自聞回鶻乖亂繼以災荒為紇扢斯所攻國已殘㓕可汗率傷痍之衆席巻而來朝廷遣告諭之使轂擊於外誠宜㳟聽詔命漸歸漠南國家得以施拯救之恩成招携之禮昔呼韓單于亦以離亂歸附漢廷定計之初則遣子入侍欵塞之後又來朝京師既得為臣之義實展外藩之敬然後漢家擁護出塞救恤加恩况回鶻累代稱藩乆修臣禮只合先請朝謁自陳艱危太和公主是帝室愛女太皇太后夙所鍾念可汗亦宜遂其情禮便遣入朝雖皇帝不許當勤固請為可憐之意陳自託之誠豈不感明主之心塞華夷之望則我之捄恤無所愧懐而乃睥睨邉城桀驁自若邀求過望如在本蕃遐邇之人無不驚歎今又深入邉境殘虐生人以退渾為名侵暴未已黎庶伏竄莫敢定居秋稼盈疇不遑收刈夫欲求大國之援繼􅊚好之情當務交懽豈宜如是來書又云蕃人易動難安如忿怒後不可制得只如回鶻為紇扢斯所困豈可一日慙忘舉國將相遺骸棄於草莽累代可汗墳墓隔在天涯固宜泣血枕戈甞膽思報大雪冤耻告謝幽魂回鶻忿怒之心合施於彼而欲㓕棄仁義逞志中華天地神祗豈容此事詩云剛亦不吐柔亦不茹回鶻以紇扢斯之強不敢報復可謂吐剛矣輕退渾之弱惟務傷煞可謂茹柔矣又詩云君子如怒亂庶遄沮君子怒以止亂不聞生亂望相公深思此義勿更輕言今弊邑恃回鶻之信不憚回鶻之怒若外與中國結怨内為紇扢斯所排遷集鳥徙流離蓬轉以沔揣度終難取濟前代郅支單于不事大漢寄命堅昆尋又逺託康居自成夷㓕往事之戒得不在懐昔呼韓之敗也其君伊秩訾勸呼韓偁臣事漢從漢求節呼韓納用其䇿竟保安全又戎子駒支将預晋盟執政以其有二親数於朝駒支乃自偁不侵不叛何悪能為執政嘉之遽命即事今相公以偉才宏畧匡弼可汗既無秩訾之明謹於事大又無駒支之辨自逹其誠而欲絶累代之􅌚興二國之禍偁雖釋憾何以戴天又古人云失之東隅收之桑榆倘自改悔實未為晩恐未甞思此聊布所懐信之與否幸垂見示不具沔白代忠順報回鶻宰相書意來牒云未得般次歸國不知今日推明日回鶻聞此事盡頭悶者國家富有四海豈惜㣲細資財比在京交付藥羅葛九政氏也藥羅葛之時已不管領只縁可汗都無定所來去不常又無大叚駞馬自取般次恐諸蕃刼奪湏稍安詳欲令送至東北嶺外忽慮萬一㪚失又以詞語見尤望依前自遣駞馬般運此令兵馬護送又云嗢沒斯王子不合親近我國家統御四夷皆同赤子倘順於國盡合綏懐如天地之廣無不覆載如江海之大無不包容况嗢沒斯是先可汗子孫今可汗兄弟竆而歸命尤所矜憐若棄其款誠何以柔逺回鶻湏自愧不恤兄弟令其不安更欲追尋是何道理彼酋長如迫於飢渇願歸國家優待之禮必與嗢沒斯無異想知朝廷眷遇回鶻之深也如可汗早依聖㫖不入邉疆但歸漢南候命朝廷豈有所惜又云回鶻往前蕃人易動難安不可制得朝廷只要回鶻承順國家常為好事惟行仁義不作尤違則朝廷欲踈隔回鶻一日不得若只務侵擾漢界刼奪牛羊以此為强實所不憚如此行事與諸小部落何如欲偁回鶻强大豈肯敬貴忠順邉將麄才性本愚直輒此忠告幸垂三思代劉沔與回鶻宰相書白紇扢斯専使將軍踏布合祖逹千悉禾亥義判官元因娑拽汗阿已時等七人至天德上表云破㓕回鶻之時收得皇帝女公主縁與大唐本是同姓之國固不敢留公主差都呂施合將軍送至南朝至今不知信息不和得逹大唐為復被奸人中路隔絶縁此使不回今出四十萬兵尋覔若彼别人㽞連不放請子細報即差人就彼尋覔上天入地終湏覔得送公主使若入吐蕃國去即至吐蕃皇帝自覽表章頗深軫念縁與回鶻可汗乆修鄰好加以姻親艱難之時常展勛力情義至重休戚是同今紇扢斯讐怨可汗兼求公主必慮大興兵甲紏合諸蕃長馳南行直至塞上今可汗人衆飢饉兵数無多强敵倘來將何禦捍非惟大唐之力救助至難兼恐邉城之民因此罹患可汗湏與將相熟議早務良圖依倚側近山川深自蔵匿且送公主歸國以避責言且紇扢斯雖來足得免禍又踏布合祖云紇扢斯即移就合羅川居回鶻舊國兼以得安西北庭逹怛等五部落又云昨者二千騎送踏布合祖至磧北今累路逢着回鶻即煞踏布自夲國至天德西城更不逢着回鶻一人無可煞戮又恐回鶻與吐蕃通信已令兵馬把斷三河口道路則籌略兵馬之勢揣度可知且興廢在天否泰有運紇扢斯以寡為重以弱為疆豈止人謀固是天賛古人云大福不再來盖以天亡之後終難再振若欲且依黒車子延引嵗時不惟雄豪所耻實亦諸蕃輕笑倘紇扢斯逼逐則黒車子之心焉可保信不如早歸大國自保安全順天命以去危恃姻好而求福皇帝寵待存恤必更加恩輒献良箴幸垂採納恐要見紇扢斯表本今亦録往代符澈與幽州大將書意某月日河東節度使符澈致書幽州大將周都衙以下比聞海内之論幽州師有紀律人懐義心河朔諸軍以為模楷今之所覩異於是矣竊知大將以下初上表舉陳行恭尋又舉張絳皆云文武全才軍情恱服今又不容張絳斥逐而来取舎之間蒼黄驟變且舉棊不定春秋所譏遠近聞之莫不嗤咲旬月之內移易三人不可謂師有紀律矣不俟朝㫖專自樹置不可謂人懐義心矣今遇蝢雪前耻再取美名莫若謝罪朝廷别請戎師如此則一軍盛美千古流芳澈沗在近鄰素欽風義輒陳鄙見實謂良圖幸大將等三思不至疑惑代弘敬與澤潞軍將書昨覽大將等陳情表未知迷復頗事游詞弘敬任忝專征兼許招諭思欲布朝廷大信解彼深疑指事而言更無文飾只如公等本使疾病緜惙既以上聞便湏請監軍權知兵馬以俟朝㫖豈有表章未彂邪計已萌遽遣劉稹衙内决事不令常侍父疾既虧子道深紊國章逺近聞知無不駭聽姜崟四月十三日到城至三十三日聖上驚異此事要知端的遂令追聞冀得實情姜崟狀偁四月六日大衙宅內小聽實本使至八日晩後劉稹傳本使處分令入城請醫並不見本使又云女壻李全方四月五日降軄至十將妹壻王再晟彂遣山東充邯鄲鎮佐軍虞候崟見女壻軰皆被降黜遂懐憂惧求郭誼覔使入城至四月三十日追問梁叔乂亦只縁公等本使不見宣慰問疾使又不見醫官梁叔乂自通狀云劉守義扶劉稹時叔乂對都押衙郭誼向守義道且莫如此若擬扶郎君待國家處分不可依河朔自專劉守義因此懐恨叔乂詐傳本使處分令入奏謝醫藥方便奪叔乂軄事姜崟梁叔乂是彼心腹尚不得靣見本使於朝廷通狀偁本軍盡云已亡軍中法嚴不知委細宣慰使既不得靣見固難辯朙今公等章表仍云故使初奏病疾姜崟梁叔乂並云被䑓司收繫軍人聞此消息自是公等行詭譎之計誣㒺朝廷凢所施為事多矯詐在朝廷湏知事實焉得不一一追問及奏公等本使喪亡聖上三日廢朝寵贈師傅方欲遣使弔祭以備哀荣尋屬薛常侍回知不入衙門不受敕又鎮州史省方回及常道軍將樊琮回知公等拒命之心必無悛改聖上曲為含忍詢訪百寮朝廷大臣藩翰戎師切齒憤惋如報私讐聖上事非獲已方降明制始終恩禮可謂無遺公等湏知罪惡貫盈神人共棄更不得扇虚妄之說歸怨朝廷聊布所懐各當深悉代彦佐與澤潞三軍書自天寳以後兵起山東惟澤潞一軍不虧臣節李司徒抱玉以元勛上將初領戎韜李相公抱真武略忠誠復揔戎柄教習歩射振起軍聲為列鎮之雄皆李公之力及說諭太尉武俊首破朱滔擊韓師於武安屋瓦皆振剪符㓂於淮服草木為兵六十年間忠名尚在及李相公殂謝朝廷以王尚書䖍休代之追李緘令居䘮東洛一軍受命莫敢借㽞致澤潞功勛成澤潞節義邇代節相誰繼李公彼軍尚不顧私恩以隳王制豈有從諌䟦扈既乆忠孝無聞於彼一軍有何恩澤若委心澤潞將校即不合别置紀綱刼脅人心自圖身計柰何拒君親之命從逆亂之謀近者盧從史首䑕两端貪狼成性苞隠奸慝逗撓兵機彼大將烏司徒與王憲等因事圖之尋就束縛破朱滔之功未朽擒從史之效又彰誠動上玄忠貫白日一軍盛美可不惜哉比聞從諌志在猖狂招致亡命逆人親黨遊客布衣皆在公宴之中列於大將之上一軍憤愧固已積年豈可舎累代之美名忘近嵗之深耻將性命家族以狥騃童生為不忠之人死為不臣之鬼彦佐忝受明命總彼成師感歎之懐寢食忘次願將忠素宣布皇恩俟彼英豪見幾而作爵秩荣寵身自取之豈得臨難因循為人受禍勉思竒䇿以副深心李文饒文集巻第八
