body:
  text: 論用兵四請遣制使至天井兾氏宣慰狀奏晋州剌史李丕狀李克勤請官軍一千二百人自引路取涉縣斷賊三州道路狀魏城入賊路狀天井兾氏行营狀請准兵部式依開元格置跳盪及第一第二功狀奉宣石雄所進文書欲勘問宜商量奏来狀論赤頭赤心徤兒狀論堯山縣狀奏磁邢洛三州諸縣鎮兵馬狀潞磁等四州縣令録事參軍狀論邢州狀廵邉使劉𪷟狀昭義軍事宜狀請先降使至党項屯集處狀論塩州屯集党項狀請遣使至天井兾氏宣慰狀右臣等近訪聞城中之計只待林木隂合以老王師如此遷延必恐過夏伏見元和中憲宗緣淮西久未成功遣尚書右丞許孟容至行营宣慰令面詰責光顔重胤兼取光顔等及大將巳下狀皆請一箇月内併賊自後不敢逗留累破大城柵憲宗又令梁守謙往遂破郾城續令裴度去竟破淮蔡去秋李囘唯至鎮魏兩道王宰石雄並未有制使宣慰臣等商量望令李回至天井兾氏宣慰兼取王宰石雄及諸軍都頭兩道大將等狀令具破賊期限聞奏如䝉允許望令乘遞早發未審三月一日㑹昌四年奏晉州刺史李丕狀丕殺安義節之子緣楊言作亂而李右緣安義節管沙陀兵馬三十餘年蕃人之心最尚讐怨戰陣之際固難隄防李丕既不主兵無以自衞且令在州綏緝應接石雄行營每欲進兵與其謀度不妨理郡兼得坐籌如䝉允許望各賜詔處分未審月十四日㑹昌四年三李克勤請官軍一千二百人自引路取渉縣斷賊山東三州道路狀右奉宣令臣等商量奏來者臣等喚得王逢細問王逢云自領行營兵馬便在榆社並不到儀州其渉縣道路逺近山川險阻先不曾諳委又恐李克勤所通渉縣多少未得諳實今請於儀州置軍粮迤邐下寨兼側近捉生勘問委知渉縣無賊大兵鎮守方可進軍又去榆社河東怯弱終不堪用代山向北軍馬王逄曾經使用郎校精强今來是防秋時請委節度使除蔚州飛狐靈丘與幽州接界外代諸州軍量抽二千人即得此二千人巳敵榆社五千人又向北烽子約有一千人敵巳來極勁耐辛苦一人敵十人量抽五百人將赴行營每隊與十人五人令入陰偷城非常得力又云李克勤所請一千二百人太少軍中難得一一相似若只與二千二百人無三百人巳來堪用臣等商量且差中使押領李克勤赴榆社至晉州過日先召取李丕與李克勤面議機計審定入兵處所錄取兩本狀一本封進一本將與義忠其所要兵馬多少及進軍時日並委義忠與行營大將及克勤審細商量奏聞如可決行須便應機速去不要更待進止即事得神速免漏軍機如䝉允許望賜義忠李丕詔處分未審四月二日㑹昌四年魏城入賊路狀右伏以饋運支計本約至五月今若五月未平小寇即須便過盛暑臣等夙夜思慮切要改張石雄西面險阻須得王宰忠義深入方可進軍榆社兵由未足天井固難獨入以此故遂成因循訪聞魏城絶當要害向南十二里至狗脊嶺雖有小山並無險阻二十五里便至武鄉縣直抵潞州便是平川臣等訪問王逢須得一萬精兵方可前進今側近更無徴兵處逺處又不及事望降中使與石雄商量便將義武歩兵萬人就義武馬軍兼沙陀馬軍五百就榆社沙陀此外於中武歩兵及河中衙隊共揀七千人通前似僅一萬人并榆社宣武兖海義父馬軍都是一萬五千精兵足得濟事取魏武路直入旬月必見成功兾氏翼城猶有一萬八千人但令保險又守城寨權差供奉一人監領待石雄得武鄉後即令兾氏翼城諸寨兵馬齊進與石雄合軍仍委石雄與李丕同商量如此穩便即須排比今月中旬末赴魏城事貴神速不得漏泄四月五日㑹昌四年天井兾氏行營狀右昨者初夏頻請進軍所兾未熱之時便見次第今炎毒巳甚廹促稍難殷宗伐鬼方周公東征皆三年乃尅淮蔡滄景亦三四年王者之師以全取勝急攻則狂賊得計稍緩則賊勢日竆况出内庫貨財以資軍食計量饋運必及冬間緣兩道皆有供奉官非惟節將心不敢安難於擇使亦恐營柵甚暑不易秖供望賜詔各令且回兼詔示王宰石雄亦不可稍緩之意但云時方炎暑恐供奉在彼有妨戎事任卿自擇便利不得安閑六月四日㑹昌四年請准兵部依開元二年軍功格置跳盪及第一第二功狀開元格臨陣對寇矢石未交先鋒挺入陷堅灾衆賊徒因而破敗者為跳盪右開元中酬跳盪功止於武官及勲比今日流例即事校簿其立跳盪功與格文相當者不問軍將官健白身便望授監察御史者超兩資授憲官巳至常侍大夫者臨時别望優與處分其先鋒第一功如有官者便授檢校將軍卿監累官至賔客者即授御史其第二功無官者授檢校少卿監及中郎將累至賔客者即與御史開元格跳盪功破賊陣不滿萬人所叙不得過十人若萬人以上每一千人聽加一人其先鋒第一功所叙不得過二十人第二功所叙不得過四十人右三等立功人数請依開元格收叙如過此数並望落下開元格招得一萬人巳上其頭首一人准跳盪功例一千人巳上准第一等例賊数不滿千人量差等處分右若依舊格雖有此例今望招得一千人便准跳盪例五百人准第一等例五百人以下節級處分開元格每獲一生酬獲人絹十疋右緣並無軍將言健等第稍似不備今請獲賊都頭賞絹三百疋獲正兵馬使賞絹一百五十疋獲副兵馬使都虞候賞絹一百疋都虞候巳上仍並别酬官爵如是官健仍優與軄名獲賊十將賞絹七十疋獲賊副將賞絹三十疋獲賊赤頭郎及劉稹新召宅内突將賞絹十疋獲賊長行賞絹三疋如是土團練鄉夫之類不在此例每獲生口便望令所獲人對中使㸃勘上暦不得令有虚妄其賞給時亦望令中使自對面分付以前件開元格如前臣等商量緣比來大陣酬賞只是十將巳上得官其副將巳上至長行並是甄錄今但與格文相當即便酬官所兾盡霑渥澤又緣每陣獲生並有優賞今㨿開元舊格等級加恩如此則頒賞有名人心知勸如䝉允許望各賜詔仍封賞格令牓示三軍未審奉宣石雄所進文書欲勘問宜商量奏來狀右臣等商量賀意比因楊弁作亂之時巳渉賊中言語究其蹤跡必非循良深知王宰不知爲其詿誤若不尋問旬月後王宰的自知見朝廷隱忍必懷憂負又不一度明辦石雄轉有所疑望付封晉絳所進賊中文書詔示王宰及守度對王宰追賀意勘問如審有潜報蹤由便就行營按軍令如渉曖昧即令王宰差使押領送上都其遊弈差替聞奏仍望詔示石雄未審七月一日㑹昌四年閏論赤頭赤心健兒等狀右健兒等敢同元悪乆抗王師比屋皆誅未足塞責然以此軍忠義未嘗失節艱難巳後頻立戰功赤頭赤心昔是賊妄立此名以張聲勢未必人皆敢勇生死一心所慮玉石俱焚善悪同棄詔王宰石雄義逸國亮許其自相糺出如是鄆州父兄子弟及從諫處招到兇惡將徤等棄用兵後為劉稹出死力戰闘先犯官軍毁罵行營節度使者任自推出即免累及平人伏料如此號令必不敢容蔽兇黨其合誅戮者亦自甘心昭示四方稱朝廷弔人伐罪之意如䝉允許望付翰林約此意詔示未審九月三日㑹昌四年諭堯山縣狀右臣等見鎮州奏事官梁居簡稱城内並無禮於元逵兇悪頭首推出二十餘人並梟戮訖其餘皆惧殺戮却閉城門伏以寇孽既平盡是國家城鎮控制河朔須存壘垣豈可更令元逵窮兵攻取望中使賜城内將士勑書招携各令安堵仍賜元逵詔便令抽兵歸本道并賜盧鈞詔亦令自遣使安存未審年九月㑹昌四日十八奏磁邢州諸鎮縣兵馬狀右件鎮縣兵馬並准江淮諸道例割屬本州收管所有觧補並委刺史自處置訖如鎮遏十將巳上是軍中舊將兼有憲官不願屬刺史者並委盧鈞道上驅使潞磁等四州縣令錄事參軍狀右緣地貧俸薄無人情願多是假攝破害疲甿望委吏部於今年選人中揀幹濟曾有績効人稍優一兩任注擬其俸料待勘數到續請商量聞奏以前並是積久之弊且要改張所兾刺史得主兵權免受牽制官人皆由選擇可委緝綏既無軍鎮干侵自然得施教化臣等商量如前未審月二十七日㑹昌四年九論邢州狀右邢州城門盧弘指稱劉從諫安置昭義軍額龍罡縣安置邢州額刺史李行循見在縣中安置伏以朝廷制置必在正名劉從諫曾不聞奏擅自移改臣等商量邢州額望依前於城安置刺史便勤移入州内如亭臺有僣侈處並勒毁拆訖聞奏龍罡縣依前充縣令理所月十七日􅊨㑹昌四年十巡邉使劉濛狀右緣李回等稱黠戞斯使云今冬必欲就黑車子收回紇可汗餘燼切望國家兵馬應接黠戞斯使回日巳賜勅書許令幽州太原天德振武各於路邀截出兵伏以控馭蕃戎最在誠信既有期約不可參差須遣使臣早為布置其劉濛便望從靈武至天德振武取太原路赴京兵力素全畨人至衆只要令先事揀練兼修整器械緣累年用兵計所聞者最是兵伏早須為備擬仍令代北諸軍鎮添補逃亡官健及㸃檢退渾沙陀等部落樅樅排比至防秋時且各令於把頭烽内要害城鎮屯集待知囘鶻指的消息即於山外邀截其天德自西受降城至振武穿隂山賊路如有要路削及添木石填塞處早令下手修繕仍於要路深掘壕塹多置陷馬坑湏防黠戞斯向北蹙逐回鶻入塞唐突緣天德振武兩處兵力寡少恐湏臨時接借望委劉濛與節度防禦使仔細商量㨿下切要聞不得妄令申請其幽州兵馬至多不得先令排比待冬至初續降中使賜詔如䝉允許望付翰林約此意各賜詔處分未審月二十三日㑹昌五年二昭義軍事宜狀右今日見石雄報狀盧鈞因出城至斐村送兵馬歩軍遂囘旗刼掠以此知盧鈞都不曉戎事從前發遣兵馬節度使不合出子城諸城門亦合先布腹心把捉聞昭義軍中畏惧石雄稍甚如軍亂未定且要石雄提挈精卒自至澤州移牒索亂軍頭首如送出首悪其餘不問計必當無事如指揮未定且要分五百人兼揀好將鎮守端氏城其端氏城是劉從諫近年修築非常牢固去年劉稹阻命安全慶軍元在端氏所以敢擾西界今若分兵鎮守端氏即翼城盡無可虞又恐亂軍潰㪚於諸處劫殺河隂兵馬切不可抽亦須稍加警備石雄忠勇思慮恐未周至伏望賜密詔處分謹錄奏聞月十一日㑹昌五年八請先降使至党項屯集處狀右伏以前代伐叛皆須先諭文誥儻未柔服則當臨以兵威古人云眀其有罪敵乃可服緣党項自麟府鄜坊至于太原徧居河曲種落實蕃其間皆有善良豈敢盡為暴害况北有残虜西有犬戎使其貳心終成邉隙切要存以大信示以優恩撫納不悛然加顯戮便須擒盡首悪永絶禍根如此則朝廷誅之有名彼亦無怨臣等商量望差給舎一人令邉鎮出兵䕶送且至叱利鎮城下密召酋長喻以國恩問其屯兵事由有何寃屈既命親王為帥又有巡院監察只合詣闕伸寃豈可便興師旅殘毁城戍焚爇村閭百姓何辜受此塗炭其首謀皆叛及打破邠寜塩州界城堡罪人並須分别送出仍須是大族酋長不特是族内平人善悪既分邉境寧靜即且為容忍待之如初若不送罪人猶敢嘯聚必當大兵誅討他日不得有詞如蒙允許臣等續揀擇使臣聞奏仍望付翰林約此意撰敕書未審月十一日㑹昌六年正論塩州屯集党項狀右党項久為劫盜須示嚴刑比者且務含容猶可待之恩信今者自知悪稔朝廷將欲翦除必恐轉不自安更懷奸計出師則鳥㪚山谷抽兵則蟻聚塞垣日往月來漸成邉患望使王釗士幹詔及其屯集未㪚速令攻討如巳退㪚則須乘此兵力驅出南山其打破城堡及於叱利鎮屯集者即且驅出令於平夏放牧不得更固山險切須分别詳審不得枉及無辜務令邉寨永清商旅無滯兾因此舉盡獲叛徙未審昌㑹二十六日六年正月李文饒文集卷第十六
