front:
  text: 李文饒文集序㑹昌一品制集
  hash: sha256:ae0bad644092f9536e3e8e3b6c6c05fe62b67925f5c5a493c6e4d653906e704f
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4c0067_SBCK_000-1a}
body:
  text: 桂管都防禦觀察處置等使正議大夫持節桂州諸軍事守桂州刺史兼御史中丞上柱國榮陽郡開國矦食邑一千户鄭亞撰綸綍之興載籍之始先王彂號施令朙罰敕法盖本於此也唐虞之盛二典存焉夏殷之隆厥有訓誥自胤征甘誓乃有誓命之書皆三代之文一王之法也虞夏之際代祀綿遠其代工掌制之名氏莫得而知至于成湯太甲則有仲虺伊尹為之訓誥髙宗得傳說則有說命之篇周公召公相成王則有􅏖誥酒誥周官顧命秦始皇帝并一區字丞相李斯實掌其言漢興當秦焚書之後侍從之臣皆不習文史蕭曹之軰又乏儒墨之用每封功臣建子弟其辭多天子為之縱委於執翰者亦非彰灼知名之士武帝使司馬相如視草率皆文章之流以相如非將相噐也厥後寢㣲寖長下于魏晋亦代有其人我髙祖革隋文物大備在貞觀中則顔公師古岑公文本興焉在天后時則李公嶠崔公融出焉燕許角立於玄帝之朝常楊繼美於代宗之世洎憲宗皇帝英武啟運雄圖赫張中興之業髙映前古其時則先太師忠公翺翔内署有宻勿賛佐之績平呉定蜀時惟其功及登樞衡作霖雨尊王室卑諸矦圖蔡料齊外定内理顯王言於典誥彰帝範於圖籍紀在徽冊播於無竆特進太子少保分司東都衞公長慶中事惠皇為翰林學士訓誥之業彰於前聞昭肅皇帝綂握乾符寤寐良弼詔自淮海復升台庭盡付玄機允猒神度每彤庭奏罷列承天睠帝亦講伊訓說命之㫖定元首股肱之契以太平之制度上古之文教咸屬於公焉㑹先太后懿號未立帝朙彂有永懐之痛公述沙麓神井之瑞賛繞樞懐日之慶懋遵聖緒光慰孝思於是承命有宣懿祔廟之制及武宗郊昊天拜淸廟文物胥備朝庭有禮華夷述軄河朔修貢乃顯神休薦徽號奉揚一徳以示萬方於是撰仁聖文武至神大孝之冊封域無虞天子翛然有求互之思乃範貞金模聖表隆凖日角燭于宫庭中外臣寮咸欲頌山河而褒日月也公於是有聖容之賛天街之北獯鬻攸居因饑慿凌怙衆强禦嚴之以刁斗而勃爾無懼申之以文告又坦然不率天子震怒旋命征之公獨運沉機上資神㫁萬里勝負决於帷中雷霆既震犬羊遂潰疣贅披抉腥膻解離遁其名王復我貴主公於是有討北狄之詔天寳末薊門為首亂之地長安並蒙榛棘襲世未平至是漁陽帥張仲武掃除僣亂臧獲仇讎奉揚威神乃底靖仍願勒石於隂山之塞以顯聖功飛章上聞帝用允若公極渙汗明命舒展格吉呼嘯神祗􅻸納嵩華當晝而文星現不寐而白鳯来彰諸矦不朽之勲廣元后無爲之化公於是有幽州紀聖功之碑潞帥劉從諫死其子因關河之險恃甲兵之衆乃敢揚聲進討拒命王庭中外疑迷牙撓天聽帝凝思奮神武公累罄竒謀且曰重耳在䘮不聞利父死輙渠受戮祗以拒君况明皇舊官天井内地跨連河北脅倚山東豈可行有匪人坐爲汙俗若是可忍孰不可容沃小無疑躡足乃定又曰上黨居天下之脊當河朔之喉今漳水雄兵常山勁卒是爲唇齒實懼因依不若乘其未萌制其將動帝俞其奏乃妙選使臣以勞諭之嚴立刑賞以勸戒之魏矦勠力從命絶壺闗之右臂收泜水之上㳺獲兹渠魁在此成筭又轅門叛將横水餘兇竊上相之旌旗盜晉陽之筦鑰帝怒斯赫人心愈疑咸以師老于郊梟巢尚固議罷兵者蚊聚請宥過者雷同公又揚笏而言曰彼地則義師帥分宗室是互祖勤啇之邑后稷造周之邦瓜瓞具存堂構斯在苟虧䇿畫不襲仇讎則是奬彌牟逐主之風長冐頓射親之俗詩偁築室于道書謂疑謀勿成由是洞啓宸衷大破群議運籌制勝舉無遺冊防㣲慮遠必契神機授鉞之臣伏膺承命謝安之圍碁尚刼曹参之飲酒方酣果有軍書奏聞戎捷砥磨周鉞水淬鄭刀萬里来袁尚之頭顱二塚葬蚩尤之肩髀歡聲雖震於朝市喜氣不見於形容何其纂立功勲鎮定風俗若是之重也公於是有伐上黨之制平晉陽之敕宗英可汗獻琛輸寳越自絶域通于本朝文畢伯士胤呼韓谷蠡之師或執玉而朝靈囿或解辦而拜甘泉並垂於史冊光被明命公於是有諭囬鶻之命五慰堅昆之書四文章等於訓傳機事出於神明固将偃仰邳石之符傲睨鬼籍之録聞之者可以祛聾瞶得之者可以弼邦國每牙管既㧞芝泥將熟甞於前席親授筆札公亦分隂可就簡如飛時有急宣關於宻畫內庭外制皆不與聞或勢切疾雷幾難終日宣室未召武帳莫開公則䟽於封章逹於旒冕當乙夜觀書之際未嘗不偁美再三此文豈可與賦洞簫而諷於後庭聞子虚而嗟不同世者論功較德邪歲在乙丑群公常伯以天子之道貫于神祗一年而風雨攸序災沴不作一年殱醜虜北伐之詩四年誅狡童詠東征之歌而又伐摩尼之風壊浮屠之俗偃兵反朴四海胥定思欲増鴻名光下武公乃觀東序之圖按西崑之謀鋪舒名實藻縟文質類于上帝爲唐神宗公於是纂章天成功神德明道之冊文號位既畢華夷㑹同方將命禮官召儒者訪匡衡后土之議採公玉明堂之圖考肆覲之禮於梁生取封禪之書於太子盡皇王之盛事極臣子之殊功而軒鼎將成禹書就掩然猶進先嘗之藥獻髙手之醫藏周旦請代之書追漢宣易名之美作為大誥祈于昊天始終一朝紹續九德其功閥也既如彼其制作也又如此故合武宗一朝冊命典誥奏議碑賛軍機羽檄凡兩帙二十卷輙署曰㑹昌一品制集紀年追聖德也書位旌官業也歲在丁卯亞自左掖出爲桂林九月公書至自洛以典誥制命示于幽鄙且使爲序以集成書尋玄珠不究於倪域聴希聲莫竆於髙下承命震惴㡬移朝夕援筆而復止者三四伏念江陸脩盪辭譲不及因濟絜以叙焉夫全功難持大名難兼日赫於晝而乏淸媚月皎於夜而無温煦冬之爲候也則雪霜飄暴凍入肌髪夏之爲用也則金流石爍火走膚脉如陽春髙秋者稀焉南則瘴風毒虺之爲厲也北則獯戎黠虜之爲患也如雒邑咸秦者幾焉鵰鷲不傳之以馳騁驊騮不授之以騫翥如應龍者鮮焉仲尼聖賢之宗也位止於司冦師𥅆道德之祖也宫不過柱史如姬旦者幾焉是以保衡傅說左右殷宗召公畢公寅亮周室咸著大訓克爲元龜書契以来未之多有李斯以刻石紀號之文勝而不在休明之運又何足數㦲周勃霍光雖有勲伐而不知儒術枚臯嚴忌善爲文筆而不至廊廟自是已降其類寔煩惟君藴開物致君之才居元弼上公之位建靖難平戎之業垂經天緯地之文粹乎厥躬由是人仰德葢四序之陽春九州之咸雒品彚之應龍人中之姬旦也後之學者其景行之
