body:
  text: 雜狀論儀鳯以後大臣褒贈狀論杜元頴追贈二狀論吐蕃維州城副使悉怛謀狀論敕楊嗣復等三狀奏張仲武寄回鶻生日駝馬狀薦胡震狀論河東等道加俸給狀論淮南五道置逰奕船狀論兩京及諸道悲田坊狀論儀鳯以後大臣褒贈狀故中書令郝處俊右儀鳯元年八月高宗將傳位於天后處俊對曰天下者高祖太宗之天下也非天皇之天下也天皇只合謹守宗廟傳之子孫誠不可持國與人有私於天后其事遂止處俊後子孫為酷吏所害故文昌右相岑長倩右天授初鳯閣舍人張嘉福與王慶之等率數百人連名上表請立武承嗣為皇太子長倩與地官尚書格輔元竟不署名以中宗在東宫不可更立武承嗣言詞切直仍責上書者遣散為承嗣所害故御史大夫同鳯閣鵉臺平章事格輔元右張嘉福請立武承嗣為皇太子天后問輔元輔元固稱不可為武承嗣所害故右衛將軍李安靖右天授年王公百僚皆勸革命安靖獨義形於色及被收下獄來俊臣詰其反狀安靖謂曰以我是唐家老臣須殺任殺若問其謀反實無可對為俊臣所害故贈越州都督徐有功右當天后革命之初宗室英賢將相舊老忠於國者相繼受誅徐有功自司刑丞纍遷至司刑少卿數議大獄務在平恕凡所濟活者數百家前後奏雪枉破家者三經斷死而執志不渝兼明玄宗外祖母龐氏之冤開元中贈越州都督就第吊祭贈物三百假一子官就第一作就家兼明一作兼雪以前臣等伏見元和以來禇遂良狄仁傑張東之等子孫纍有恩制授惟此數家未蒙甄録望各訪求子孫承嫡者特授一官如先未有諡者各令有司定諡如無子孫特與追贈所貴百代之下再振清風海內忠良無不感厲未審可否吏部狀準制請復舊官爵故循州司馬杜元頴二狀右臣等商量杜元頴雖失於馭遠致蠻寇內侵然握節嬰城舍生取義圍解之後懲貶不輕但以蠻夷之情不可開縱若為之報怨以快其心則是不貴王臣取笑戎狄漢景所以聞鄧公之説恨鼂錯之誅元頴長慶之初首居宰弼潔廉畏法忠藎小心雖無光赫之名頗著直清之稱既逄昌運合與申冤望却還舊官階等仍追贈右僕射未審可否第二狀奉宣令更商量奏來者右臣等商量比聞外議皆以元頴不能綏撫南蠻又無備禦責此二事以為愆尤臣等究其情由實有本末緣韋臯久在西蜀自固兵權邀結南蠻為其外援親昵信任事同一家此時亭障不修邉防罷警若後人加置一卒繕理一城必有異詞便乖鄰好自武元衡以後三十餘年戎備落然不可獨責元頴蠻退後京城傳説驅掠五萬餘人音樂伎巧無不蕩盡緣郭釗無政都不勘尋臣德裕到鎮後差官於蠻經歷州縣一一勘尋皆得來名具在案牘蠻共掠九千人成都郭下成都華陽兩縣只有八十人其中一人是子女錦錦雜劇丈夫兩人醫眼太秦僧一人餘並是尋常百姓並非工巧其八千九百餘人皆是黎雅州百姓半雜獦獠臣德裕到鎮後移牒索得三千三百人兩畨送到與監軍使於龍興大慈寺點閲並是南界蠻獠緣朝廷寵待如舊從此蠻心益驕今西川節將惟務姑息臣等所以薄元頴之過謂合追榮頻承顧問不敢不縷悉聞奏况元頴殁後五經大赦下位卑官皆得追復官爵倘聖旨以贈與為優望只準赦文却還舊爵其贈官落下未審可否論太和五年八月將故維州城歸降準詔却執送本蕃就戮人吐蕃城副使悉怛謀狀右臣頃蒙先朝授劍南西川節度使其悉怛謀雖是吐蕃酋長久樂皇風將彼堅城降臣當道臣差行維州刺史虞藏儉便領兵馬入據其城飛章以聞先帝驚喜其時與臣仇者望風疾臣遽興疑言上罔宸聽以為與吐蕃盟約不可背之必恐將此為詞侵犯郊境遂詔臣却還北城兼執送悉怛謀等令彼自戮復降中使迫促送還昔白起殺降終于杜郵致禍陳湯見按是為郅支報仇感歎前事愧心終日今者幸逢英主忝被台司輒敢追論伏希省察且維州據髙山絶頂三靣臨江在戎虜平州之衝是漢地入邉之路初河隴盡沒唯此州獨存吐蕃潛將婦人嫁與此州門子二十年後兩男長成竊開壘門引兵而入遂為所滅號無憂城從此得併力於西邉更無虞於南路慿陵近甸旰食纍朝貞元中韋臯以經略河湟此城為始盡鋭萬旅急攻數年吐蕃愛惜既甚遣其舅論莽熱來救雉堞髙峻臨衝難及於層霄鳥徑屈蟠猛士多麋於􅓓石莫展公輸之巧空擒莽熱而還及南蠻負恩掃地驅劫臣初到西蜀衆心未安外揚國威中緝邉備其維州熟臣信令乃送款與臣臣告之以須俟奏報貴探情偽其悉怛謀等尋帥城兵并州印甲仗塞途相繼空壘來歸臣即大出牙兵受其降禮南蠻在列莫敢仰視况西山八國隔在此州比帶使名都成虛語諸羌久苦畨中徴役願作王人自維州降後皆云但得臣信牒帽子便相率內屬其蕃界合水捿雞等城既失險阻自須抽歸可減八處鎮兵坐收千餘里舊地臣見此有莫大之利為恢復之機所以靣許奏聞各加酬賞臣自與錦袍金帶顒俟朝旨且吐蕃維州未降以前一年猶圍逼魯州以此言之豈守盟約况臣未嘗用兵攻取彼自感化來降又沮議之人豈思事實犬戍遲鈍土曠人稀每欲乘秋犯邉皆須數嵗聚食臣得維州逾月未有一使入疆自此之後方應破膽豈有慮其復怨鼓此遊詞臣受降之初指天為誓寧忍將三百餘人性命棄信纍表陳論乞垂矜舍答詔嚴切竟令執還加以體被三木輿於竹畚及將即路冤呌嗚呼將吏對臣無不隕涕其部送者更遭蕃帥譏誚云既以降彼何須送來乃却將此降人戮於漢界之上恣行殘忍周固携離至乃擲其嬰孩承以槍槊臣聞楚靈誘殺蠻子春秋明譏周文收送鄧叔簡册致貶况乎大國負此異族塞忠款之路快凶虐之情從古以來未有此事伏惟仁聖文武至誠大孝皇帝陛下振睿聖之宏圖得懷猍之上策故南蠻申請朝之願北虜效欵塞之誠臣實痛惜悉怛謀等舉城向化解辮歸義而未加昆邪之爵不賞庶其之功翻以忠愛屠為仇讐所快身遭此酷名又不彰職由愚臣陷此非罪雖時更一紀而運屬千年臣所以具陳根本不憚繁細冀蒙睿鑒追奬忠魂伏乞宣付中書各加褒贈冀華夷感德幽顯伸冤警既往之幸心激將來之峻節臣德𥙿無任懇願之至謹録奏聞伏候敕旨論救楊嗣復李珏陳夷直二狀右臣等聞向外傳説紛然陛下皆遣中使未測其由臣等相顧憂惶不知死所嗣復等所涉論實負聖明臣等所以顯書其罪不為末減只望上於竄逐用戒群邪古人稱刑人於市與衆共棄陛下若以嗣復等罪狀必不可容伏望且降使臣就彼鞫問待得其罪顯戮不遲如便遣使必貽後悔文宗只緣貶宋申錫更不按問至今人以為冤臣等於嗣復等實無情故所利者宗社所惜者聖明不欲令一事駭聽失天下之望若使四方將相或以此為詞臣等避罪不言無以塞責伏望陛下特回宸慮下納愚忠臣等餘年方敢自保陛下若以臣等事君不盡情涉容姦先罪臣等實所井分輒陳肝血不避嚴誅不任懇切兢皇之至謹俯伏待罪望速降敕旨第二狀右臣等適以有狀論奏未奉聖旨今向外之心驚駭不知所為臣等若茍務偷安不更冒死陳奏必恐旬月之後人情皆以為冤陛下此時追悔無及臣等昨者商量之初只以嗣復等所涉議論不可令在藩鎮止於貶責足以塞辜如更過於此實搖動天下之心必損聖明之德如以臣等情涉顧望伏望先罪責臣實所井分臣等專在中書伏望特開延英賜對得靣陳肝血死無所恨第三狀右臣等適再已陳奏未奉聖旨伏見貞元初宰臣劉晏緣德宗在東宫時涉動搖之論竟以此坐死旋則朝廷中外皆以為冤兩河不臣之地悉恐亡懼德宗尋亦追悔官其子孫近則宋申錫涉交通藩邸貶官文宗尋又追悔至于流涕如嗣復等螻蟻之命至細至微特賜矜全必彰聖德天下臣子孰不上感天慈不爾恐四海人情自此憂懼臣等亦兢危不暇無以禆助聖明伏望特開延英賜臣等靣陳血誠以安中外如蒙聖慈納臣等愚懇伏望更重貶官所冀人心允愜張仲武寄回鶻生口駝馬狀右臣等舊讀實録不至遺忘伏思纍聖以來未有此例謹按左傳諸侯不相遺俘昔魯受齊俘見譏左氏諸侯尚為非禮况在台臣臣等忝備鈞衡須謹繩墨若苟受私遺不守舊章則何以上戴聖君儀刑百辟伏望聖恩盡許却還從此便為故事仍望許臣與一書報答令其深諭國體其書草續撰進上以聞前試宣州溧水縣尉胡震右胡震博通六經華皓一志家在海郡筋力未衰臣童幼之時於震受業豈謂年逾四紀位列三公雖自君恩亦因儒訓臣伏以元和二年前揚州士曹參軍薛玄造緣與臣亡父授經具表論薦憲宗授越州諸暨縣令臣幸因家門舊事輒敢薦聞伏希聖慈特受浙東管內一官所冀臣報其舊恩獲繼先志既顯蓽門之士實為儒者之榮臣不任懇欵兢皇之至謹録奏聞伏聽敕旨奉宣卿官至將相不忘本師朕深所嘉歎冝依所奏論河東等道比逺官加給俸料狀右河東等道或興王舊邦或陪京近地州縣之職人合為樂只緣俸祿寡薄官同比逺元和六年閠十二月十二日及元和七年十二月二十四日敕河中鳯翔鄜坊邠州易定等道令户部加給俸料錢共當六萬二千五百貫吏曹出得平留官數百員時議以為至當自後訪聞户部所給零碎兼不及時觀察使以為虛折皆别將破用徒有加給不及官人近地好官依前比逺伏望今日以後户部却與實物仍及時支遣諸道並委觀察判官專判此案隨月加給官人不得别將破用如有違越觀察判官逺貶觀察使奏取進止又選人官成後皆於城中舉債到任填還致其貪求罔不由此其今年河東隴州鄜坊邠州新授比逺官等望許連狀相保户部各借兩月加給料錢至支給時除下所冀初官到任不帶息債衣食稍足可貴清廉請淮南等五道置遊奕􅊑狀淮南令出三百人緣疆界闊逺請浙西宣歙江西鄂嶽百人各出二右訪聞自有還僧以來江西劫殺比常年尤甚自上元至宣池地界商旅絶行緣所在長吏掩閉道路頗甚怨嗟望每道令㨂前件人解弓弩及諳江路者每一百人置遊奕將一人須清白強幹稍有見會者充如法造遊奕􅊑船五十隻一百人分為兩番長須在江路來往淮南遊奕至池州界首浙西遊奕至宣州界首江西遊奕至鄂州界首常須每月一度於界首交牌各知界內平安申報本使其下畨人便於沿江要害處置營不得抽歸使下其糧餉春冬衣使司差人就營所支給如三度以下擒捉得賊委使司超與職名其官健以下便以賊贓物賞給務令優厚如兩度有賊不覺察遊奕將科責差替如容縱賊盜不問有贓無贓並委本道差人所在集衆決殺如賊大假巢穴去處仰數道計會一時掩捉倘去根本軍將授官酬賞所貴鄰接之地同心叶心江路盜賊因此斷絶臣等今月二十五日已於延英靣奏伏蒙聖恩允許未審可否論兩京及諸道悲田坊右恤貧寬疾著於周典無告常餼存於王制國家立悲田養病置使專知開元五年宰臣宋璟蘇頲奏所稱悲田乃關釋教此是僧尼職掌不合定使專知請令京兆按此分付其家玄宗不許至二十二年十月斷京城乞鬼悉令病坊收管官以本錢收利以給之今緣諸道僧尼盡以還俗悲田坊無人主領必恐病貧無告轉致困窮臣等商量緣悲田出於釋教並望更為養病坊其兩京及諸州各於子録事耆夀中㨂一人有名行謹信為鄉閭所稱者專令勾當其兩京望給寺田十頃大州鎮望給田七頃其他諸州望委觀察使量貧病多少給田五頃三二頃以充粥飯如州鎮有羡餘官錢量與置本收利最為穩便若可如此方圓不在更給田之限各委長吏處置訖聞奏李文饒文集卷第十二
