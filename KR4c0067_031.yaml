front:
  text: 李文饒外集卷第二窮愁志
  hash: sha256:640584121f610039a0881e30a6a56390803eb87c973b31f7f80f7f85c8e5b114
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4c0067_SBCK_031-1a}
body:
  text: 論舊臣論隂德論臣子論忠諌論管仲害霸論慎獨論王言論退身論豪俠論英傑論臣友論天性論舊臣論或問先王論道之臣事後王乎曰不改先王之道則事之改先王之道則去之以事堯之心事舜禹者其臯陶益稷乎以事武王之心事成王者其周召乎以事漢高之心事惠帝者其蕭曹乎曹參尚不易蕭何之規况高祖之道昔區區楚國醴酒不設穆生先去且穆生豈為巳也蓋傷廢先王之道不忍見後王之面其不去者焉得免胥靡之恨哉魏晉以降居相位者皆􅌤面愧心而巳又有攘臂於其間者掎托先王之道以諱舊過改張先王之道以媚新君棄先王之故老以掩其羞用先王之罪人以協其志若天地間無神明則巳儻有神明鬼得而誅之矣隂德論陳平稱吾多隂謀道家之所禁吾世即廢亦巳矣不能復起以吾多隂禍也至曾孫何國絶班生著陳平之言以為世戒理當然矣而丙丞相才及子顯黜為關內侯至孫昌乃絶國絶三十二歲復續而張湯杜周子孫世有令名皆在顯位其故何哉丙丞相於漢宣之德可謂至矣晉荀息以忠貞之故不敢負獻公程嬰以託孤之義不忍欺趙氏所以繼之以死終不食言丙丞相於史皇孫敬君臣之分無親戚之情而保養曾孫仁心惻隱置於間燥給以私財介然拒天子之使因是全四海之命漢書稱因赦天下郡邸獄繫者是恩及四海也又奏記霍光決定大䇿既而顯徴卿之美削士伍之辭其深厚不伐古所未有夏侯勝以為有隂德者必饗其樂以及子孫是宜篤生賢人世濟其美古所謂有後者良謂是矣焉在傳爵邑而巳哉張杜有後豈用法雖深而治者或能去天下之惡除生人之害所以然也臣子論士之有氣志而思富貴者必能建功業有志氣而輕爵祿者必能立名節二者雖其志不同然時危世亂皆人君之所急也何者非好功業不能以戡亂非重名節不能以死難此其梗槩也好功業者當理平之世或能思亂唯重名節者理亂皆可以大任平淡和雅世所謂君子者居平必不能急理煩遭難亦不能捐軀濟危可以羽儀朝廷潤色名教如宗廟瑚璉園林鴻鵠雖不常為人用而自然可貴也世謂三劉之儔也然世亦有不拘小疵而能全大節者如陳平背楚歸漢漢王疑其多心令護諸將又疑其受金可謂不能以名節自固矣及功成封侯辭曰非魏無知臣安得進漢高曰若子可謂不背本矣其後竟誅諸吕以安劉氏近日宰相上官儀詩多浮醘時人稱為上官體實為正人所病反高宗之初竟以謀廢武后心存王室至於宗族受禍郭代公倜儻不羈之士也少不以名節自檢當蕭岑內難保護睿宗雖履危機竟全臣節則名節之間不可以一概論也陳平能不背魏無知所以必不負漢王矣今士之背本者人君豈可保之哉忠諌論人臣拒諌有二一曰生於愛名二曰不能去欲雖桀紂桓靈之君未能忘名自知為惡多矣畏天下之人知之將謂諌則惡不可掩故不欲人之諌已如晉獻非􅌐姬寢不安齊柏非易牙食不美必不能去之亦不欲人諌已人臣忠諌亦有二欲道行於君可使身安國理者其辭婉欲名高後世不顧身危國傾者其辭訐若考叔啓大遂以成莊公之孝倉唐獻犬鴈以復文侯之愛留侯封雍齒以安群臣招四皓以定惠帝此所謂婉也諌大夫言婢不為主白馬令言帝欲不諦劉李二人名各不便故書官激主之怒自有其名望其聽從固不可得此所謂訐也漢元帝欲御樓船薛廣德當乘輿諌曰臣自刎以血汚車輪則陛下不入廟矣張猛曰乘船危就橋安聖主不乘危元帝曰曉人不當如是耶則知諫之道在於婉矣唯英主必能從諌何者自知功德及生人者大矣雖有小惡不諱人言如漢高械繫蕭相國及聞王衛尉之言乃曰我不過為桀紂主而相國為賢相此所謂不諱也近日名臣王石泉居相時子為眉州司士天后嘗問曰卿在相位子何逺乎對曰廬陵是陛下愛子今猶在逺臣之子焉敢相近有以見君子之心亦倉唐之比也管仲害霸論昔管仲對柏公曰宫中之樂無所禁禦不害霸也舉賢而不能任此害霸也余竊窺敬仲此對是欲一齊國之政滿柏公之志然則非專任亦不能致霸一則仲父二則仲父柏公所以能九合諸侯為五霸之首中代蜀主之任孔明符堅之用景略雖關羽不能移樊世不能惑蜀與秦皆君安國理非專任之效歟柏公得敬仲則興隆霸業漢元信石顯而反穢明德信任同而理亂異者何也所任用非其人也近世有以宫中之樂餌其君者而苞苴日行紀綱日壞朋黨益熾讒言益昌得非竊管仲之術違管仲之也莊周稱所謂至智也者有不為大道積者乎又曰跖不得聖人之道不行豈斯之謂也慎獨論士君子愛身防患無踰於慎獨矣能懼顯觀詩曰無曰不顯莫豫云觀不為暗欺忠信參於外雖有盜賊不能為患矣易曰無有師保如臨父母斯之謂也賊入趙孟之門者覩其盛服將朝不忘恭敬悔受君命至於觸槐所以知其不為患也向使趙孟未闢寢門尚安袵席思變詐之數無肅敬之容為盜者必激其怒心增其勇氣焉得保其首領哉推是而言人不可以不誠矣若乃懷詐飾智意忌貌親人巳見其肺肝而自謂無迹天巳奪其魂魄而不窹將亡此汲黯所以面折孫弘留言李息莊周稱賊莫大於德為一本無為字有心以有眼為德者尚不可以有心眼况為惡者乎王言論夫帝王與群臣言不在援引古今以飾雄辨唯在簡而當理雄辨不足以服姦臣之心唯能塞諍臣之口昔田蚡請考功地益宅武帝曰遂取武庫衛將軍言郭解家貧又曰布衣權至使將軍知此其家不貧殷仲文言音樂好之自解宋祖曰吾秪恐解此謂簡而當理足使姦臣奪心邪人破膽矣余歷事六朝弼諧二主文宗辭皆文雅而未嘗騁辨武宗言必簡要而不為文飾皆得君人之量能盡臣下之詞豈唯王言如是人臣亦當然也其有辨若波瀾辭多枝葉文經意而飾詐矯聖言以蔽聰此乃姦人之雄遊説之士焉得謂之獻替哉為臣者當戒於斯慎於斯必不獲罪於天矣退身論老子曰功成名遂身退天之道也昔余常感焉自前朝李右相元中書皆宴安厚味終嬰大戮所以文種有藏弓之恨李斯有稅駕之歎張華顧優遊而不獲裴顔勸廢賈后華答以庶可優遊卒歲傳亮贊識微而不免北四子者皆神敏知幾聰明志古圖國致霸動必成功而自謀其身猶有所恨况常人哉其難於退者以余忖度頗得古人微旨天下善人少惡人多一旦去權機不測操政柄以禦怨誹者如荷戟以當狡獸閉關以待暴客若捨戟開關則冦難立至遲遲不去者以延一日之命庶免終身之禍亦猶奔馬者不可以委轡乘流者不可以去楫是以懼禍而不斷未必皆耽祿而患失矣何以知之余之前在鼎司謝病辭免尋即遠就澤國自謂在外而安豈知以天高不聞身遠受害近者自三公鎮于舊楚懇辭將相歸守丘園而行險之人乘隙構患竟以失巨漢而懸肆去灌木而嬰羅余豈不知身退罹殃蓋耻同種斯之不去也則知勇退者豈容易哉如陸士衡稱不知去勢以求安辭寵以招福斯言過矣唯有遭逢善人則庶可無患故范睢得蔡澤退而不辱虞丘得叔孫去而不困其次剛毅者有心者亦可矣子文舉子玉以靖國隨會避郤子以紓亂皆保其後矣若小人則禍必及之無所逃也終不及扁舟變姓名浩然五湖之外不在人間之世斯可以免矣豪俠論爰盎汲黯皆豪俠者也若非氣蓋當世義動明主豈有是名哉爰盎曰緩急人所有故善劇孟匿季心汲黯好逰俠任氣節善灌夫所以知其然也余斯言豈徒望彂楊子所謂孟軻之勇類於是夫俠者蓋非常之人也雖以然諾許人必以節義為本義非俠不立俠非義不成難兼之矣所謂不知義者感匹夫之交校君父之命為貫高危漢祖者是也所利者邪所害者正為梁王殺爰盎者是也此乃盜賊耳焉得謂之俠哉唯鋤麑不賊趙孟承基不忍志寧紇于承基為承乾賊于志寧見其執喪盡哀不忍害之也斯為真俠矣淮南王憚汲黯以其守節死義所以易公孫弘如彂蒙耳黯實氣義之兼者士之任氣而不知義皆可謂之盜矣然士無氣義者為臣必不能死難求道必不能出世近代房儒復問徑山大師欲習道可得至乎徑山對曰學道者唯猛將可也身首分裂無所顧惜由是而知士之無氣義者雖為桑門亦不足觀矣英傑論帝王之於英傑當須御之以氣結之以恩然後可使也若不以英氣折之而寵以姑息則驕不可任若不以恩愛結之而肅以體貌則怨不為周駕馭之術唯漢高祖盡之黥布歸漢高祖方踞床洗音跣而召布入見布大怒悔來欲自殺出就舍帳音張服御飮食從官如漢王居布又大喜過望武帝踞厠見衛靑靑以大將軍之貴而隸人蓄之此不得不絶大漠而蕩葷粥撿狁也蜀先主與關羽張飛同卧起而稠人廣坐侍立終日皆用此道故能成功夫御英傑使猛將與見道德之人接方正之士不同也不可以繁禮飾貌以浮辭足豫句反言宜洞開胸懷令見肝肺氣懾其勇恩結其心雖踞洗召之不為薄矣祿山夷狄之譎詐者也非將門英豪草萊竒傑其戰鬪之氣擊刺之才去關張逺矣天寶末受專征之任託不御之權入朝賜宴坐內殿西序雞障之下非其所據果蓄異圖幽陵厲階至今為梗蓋恩甚驕盈以至於此儻以徒隸蓄之豈有斯恨臣友論君之擇臣士之求友當以志氣為先患難為急漢高以周勃可屬大事又曰安劉氏者必勃也文帝戒太子曰即有緩急亞夫真可任將兵此皆得於氣志之間而後知可以託孤寄命矣何者人君不能無緩急士君子未嘗免憂患故漢高知周勃可託文帝識亞夫可任信陵降志於朱亥爰盎不距於劇孟且夫周文有閎夭而禦侮孟宣以彌明而免難孔聖得仲由而不聞惡言宋祖失穆之而謂人輕我則擇臣求友得不先於此乎太倉令淳于公歎生女不生男緩急非有益也緹縈自傷乃上書贖父罪詩曰鶺鴒在原兄弟急難父子兄弟未嘗不以赴急為仁孝况朋友之際本以義合貴盛則相望以力憂患而不拯其危自保榮華坐觀顛覆可不痛哉昔衛靑之衰也故人多事冠軍而任安不去吳章之敗也門人更名他師而幼孺自效幼孺名敞姓非便故不書此所以可貴也善人良士秪可以淡水相成虛舟相值聞其患也則䇿足先去曰見幾而作不俟終日知其危也則奉身而退曰既明且哲以保其身良士之於人如是曷若識劇孟朱亥哉天性論余開成中作鎮淮服聞東宫為人所搆天子赫然大怒召宰臣及公卿大僚議於內殿其時諌者僉曰太子幼年思慮未至亦曰太子之年足以改過往復移時大略不出於此夫明主可以理奪其要在於聞所未聞昔千秋上書言子弄父兵罪當笞耳武帝一言而寤蓋以簡而當理魏太祖嘗謂諸子曰吾必不用左右之言以理汝曹何者使左右君子也必不離人父子之間使左右小人也小人之言必不可用其時無人以此言寤主因問主上太子之過得於何人言之者與太子恩愛厚薄何如哉文宗聰明睿智聞之必寤寤之後太子必安以余揣之不三數月則父子如初矣蓋以父子之愛彂於天性言之者必當易寤况一子乎是以漢高覩四皓上夀悲歌鴻鵠宣帝以玄成退讓令傳淮陽元帝聞史丹稱器人於絲竹默然而笑皆外感中悟屈巳捨愛可不謂之天性哉文宗竟不得一聞是言豈太子之命也歟李文饒外集卷第二
