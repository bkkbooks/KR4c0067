body:
  text: 紀功幽州紀聖功碑銘異域歸忠傳序黠戞斯朝貢傳序幽州紀聖功碑銘并序奉敕撰幽州盧龍軍師檢校尚書右僕射張公仲武往年修獻捷之禮今年有銘勳之請二者君子韙之豈不以諸矦有四夷之功獻其戎捷春秋舊典也宗周納肅慎之貢銘於楉矢天子令德也斯可以為元矦衆可以為後代法聖上嘉其動而中禮乃命宰臣採其元功傳於惇史臣德𥙿敢揚言曰夫兵者所以除暴害也愛人則惡其為害禁暴則惡其為亂雖睿智不殺化之以神至德允懷招之以禮然書有搰夏之戒傳有修刑之訓虞舜四罪乃成大功文王一怒以至無侮非德教之助歟仁聖文武章天成功神德明道大孝皇帝熙我文典煥乎光明極象外之微臻於至道鼓天下之動致於中和慮必鈎深退而藏密故能神機獨照伐未兆之謀威光遠震制不羈之虜當其時也烽燧迭警羽書狎至人心大搖群師沮氣皇帝以軒后之威神漢髙之大略光武之雄斷魏祖之機權合而用之以定王業此議臣所以不敢望於淸光也倬哉天地應而品物生君臣應而功業成故龍躍而雲從鶴鳴而子和方叔伐獫狁蠻荆來威安遠擊車師西域振服宜有良將殿于朔邉張公禮閲戰器書成傳癖張仲孝友子𥜗塞泉流落不偶光景未耀明主雅聞竒志將帥而拜將軍遙推赤心築壇而命元帥非自雄武授之薊門果能精誠奮彂䇿慮逼億千里獻籌一心憂國則知龍顔善將任人傑而不疑日角好謀歎敵國而強意回鶻者本北狄之裔也或曰獯狁或曰山戎五帝所不能臣三王所不能制前史載之詳矣暨薛延陀之敗也莤帥吐迷度率衆欵塞太宗幸靈武納降立回鶻部落置瀚海都督因我封殖遂雄北方肅宗之戡內難也葉護以射雕之士親護戎旌亦由羌髳率師以翼周北貊梟騎以助漢既殄大憝乃疇厥庸特拜葉護司空歲賜繒二萬匹厥後飾宗女以配之立宫室以居之其在京師也瑶祠雲構甲第棊布棟宇輪奐衣冠縞素交利者風偃挾邪者景附其翎矦貴種則被我文繢帶我金犀恱和音猒珍膳蝎蠧上國百有餘年既而傑鷔無親天命不祐僣侈極欲神道惡盈本國荐飢畜産耗半黠戞斯因利乘便遂焚龍庭區落蕭條隂磷青焚今之烏介可汗亡逃失國竊號沙漠非我册命自為假王其來也羡漫隂山睥睨髙闕玄塞之下氛霧蔽天質貴主以前驅傾大國而求援或丐我米糒救其飢人或邀我甲兵復其故地外雖柔服內有桀心因行人致詞徵呼韓故事願居光祿塞急保受降城其下有二部曰赤心宰相那頡啜特勒赤心者天性忿鷙戎馬尤盛初與名王嗢沒斯首謀內附俄而負力怙氣潛圖厲階為嗢沒斯所給誘以俱謁可汗戮於帳下其衆大潰東逼漁陽上乃賜公璽書授以方略公以室韋悍亟之兵近我邉鄙俾其偵邏且禦內侵尋以徵役不供為虜所敗由是介馬數萬連亘幽陵伏精甲於松布穹廬於磧鹵散若飛鳥止如長雲火燎於原不可嚮邇公激義氣以虹貫彂精誠而石開竒計兵權密授髦俊乃命介弟仲至與禆將遊奉寰王如清左敵萬李君慶張自榮髙守素李志操率鋭兵三萬建斾而前介胄雪照戈矛林植命以義殉壯由師直聲隆隆而未泄欲逐逐而不食戢以聽命嚴而有威公曰險道傾反且馳且射胡兵所以無敵也致之平原勒以方陳我師可以逞志也於是據于莽平環以武剛首尾蛇伸左右翼張輕騎既合竒鋒橫鶩如摧枯株如摶畜兔攝讋者弗取陸梁者皆仆虜王矦貴人計以千數然後盡羅服聽悉數系纍谷靜山空靡有孑遺槖駝駃騠風澤而散旃墻罽幕野馬牛幾至於谷量虜血殆同於川決徑路寶刀祭天金人竒貨珍器不可殫論乃命從事李馳傳上奏又命牙門將國從紀繼獻戎俘皇帝受而勞之群臣畢賀昔長平七征驃騎一舉竇憲合氐戎之衆陳湯攬城郭之兵或生靈減耗士馬物故或邀功救罪矯命專征然猶告類上帝薦功淸廟願視二漢不其恧歟以公威動蠻貊功在漏刻因命公為東靣招撫回鶻使先是奚契丹皆有虜使監護其國貴以歲遺且為漢諜自回鶻嘯聚靡不鴟張公命禆將石公緒等諭意兩部戮回鶻八百人雖介子討罪於龜茲班超行誅於鄯善未足儔也回鶻又遣宣門將軍等四十七人詭辭結歡僣伺邉隙公密賂其下盡得隂謀且欲馳入五原大驅雜虜公逗留其使緩彼師期竟得人病馬瘏縮衄而退挫鋭解紛緊公善計今烏介自絶皇澤莫敢近邉并丁令以圖安依康居而求活盡􅑫餘種屈意黑車寄託遠道流離飢凍黑車亦倚其威重迫脅諸戎造謀藉兵解仇交質自謂約齎深入漢將取而未期渡幕輕留三師往而非利公以壯猷逺馭長討羈縻不偷避慊之便終致盡敵之術將時動而得雋豈歲數而勝微矧乎明主仗將師為瓜牙視戎狄為鼠彘方獵猛敵不玩細娛非周宣無以成召虎之勳非漢宣無以聽營平之計朂哉上將光我中興公前後受降三萬人特勒二人可汗姊一人都督外宰相四人其他矦王騎將不可備載王褒以日逐歸德稱為人瑞班固以稽落蕩寇大振天聲孰若天子神武百蠻振懾乘其戚困臨以兵鋒刈單于之旗納休屠之附非萬里之伐無三年之勤巍乎成功輝焯後代宜刻金石以揚鴻休銘曰大和之初赤氣宵興開成之末彤雲暮凝異鳥南來胡徴之滅北夷颷掃厥國土崩逼迫遷徙震我邉鄙長蛇去冗奔鯨失水上都薊門兵連千里曽不畏天猶為驕子丐我邉穀邀我三師假我一城建彼旙旗歸計強漢郅支嫚詞狼顧朔野伏莽見誅鴈門之北羌戎雜處濈濈群羊茫茫大鹵縱其梟騎驚我牧圉暴若豺狼疾如風雨皇赫斯怒羽檄徵兵謀而淵默斷乃雷聲沉機變化動若神明沙漠之北虜無隱情漁陽突騎燕歌壯氣赳赳元戎耽耽虎視金鼓誓衆干旄蔽地爰命介弟屬之大事翩翩飛將董我三軍稟兄之制代師之勤威略火烈胡馬星分戈回白日劍薄浮雲天街之北旄頭已落絶轡之野蚩尤未縛俾我元矦恢弘遠略取彼單于係之徽索隂山寢烽亭徼櫜弓萬里昆吾九譯而通蠻夷既同天子之功儒臣篆美刋石垂鴻異域歸忠傳序會昌二年四月甲申回鶻大特勒唱沒斯率其國特勒宰相尚書將軍凡十二人大首領三十七人騎士二千一百六十八人內附制授嗢沒斯特進檢校工部尚書左金吾衛大將軍同正封懷化郡王其酋帥遍加戎秩賜之金紫於是穹廬之長盡識漢儀左袵之人咸被王澤矣臣聞書載率服美大舜之功詩列既平顯周宣之德暨漢宣帝亦單于慕義呼韓來朝歷紀數千稱者三代則知非常之運必待非常之君誠契感通斯為難遇伏惟仁聖文武至神大孝皇帝紹髙祖太宗之神武慕玄宗憲宗之遠略英才天縱武節霆馳靜深之謀淵然若海先難之志屹然若山自嗢沒斯歸欵朔邉注心魏闕制置大略盡出宸算漢高從善能用六竒光武揣情坐知千里諸將無搴旗之效群臣乏借箸之籌夫天以信而成功地以定而載物惟大君懋一德法兩儀故能懷異俗之心盛中興之業嗢沒斯者回鶻之貴酋也夙稟正性生知大義識倚伏之數明禍福之機回鶻運屬天亡歲久不稔畜産大耗國邑為虛流亡遍於沙漠僵仆被於草莽由是國之將帥各率支兵或入西戎或歸諸部惟嗢沒斯精誠上逹天誘其衷拔自狼居之山願拜龍顔之主封章瀝懇指日誓心不奪之誠介如石矣先是有赤心宰相桀傲亂常頗為邉患嗢沒斯潛布誠欵於天德軍使田牟暴其罪狀梟首以徇歸大國明也戴聖君忠也去亂邦智也執醜虜義也其比四夷悉謂誠臣昔仲尼以曽參孝因為陳君臣父子之義以著孝經今聖主以嗢沒斯忠爰採武義貞烈士以為歸忠傳則聖人善誘之道又何以加於此乎乃集秦漢以來至聖朝去絶域歸中國獲名節自著功業保終者三十人勒成上下兩卷其不因獻款無迹可稱者今並不載臣又聞善者天報之以福為不善者天報之以殃神道昭晣應如影響嗢沒斯方欲保大節成大勳宜乎佩服斯文以為鑒戒臣備位台鉉獲奉睿謀受詔序事冠于篇首黠戞斯朝貢圖傳序昔越裳貢雉薦於宗廟西旅獻􅋙陳以典訓所以感其至而戒其初也仁聖文武至神大孝皇帝御曆之四年天瑞燦爛王道昭焯五材並用六轡斯柔布政宣室以張神化報兵朔野以耀威靈故得天晬而淸日晏而明蟲螟不生嘉榖以成中宇既安四夷來庭由是龍荒君長黠戞斯遣使注吾合素等上表獻良馬二匹絶大漠而貢赤誠涉流沙而霑赭汗非至德所感孰能臻於此乎皇帝以前有鸞旗焉用驥騄不貴龍友帷駕鼓車乃命其使見於內殿賜以珍膳錫之文錦謹按故相魏國公賈耽所撰古今四夷述黠戞斯者本堅昆國也貞觀二十一年其酋長入朝授以將軍印拜堅昆都督逮于天寶季年朝貢不絶暨中國多難為回鶻隔礙黠戞斯忿其桀鶩乘彼荐飢於是破龍庭焚罽慕蕭條萬里地無種落始得出重泉而見白日披氛霧而覩青天臣伏見太宗謂群臣曰南荒西域自遠而至其故何哉宰臣房玄齡對曰殊域來朝者中國乂安帝德遐被所致也太宗曰向中國不安亦何緣而至朕覩此懷懼何者昔秦始皇并吞六國漢武帝威加戎狄今殊方異類無遠不賔竊比秦漢想無多愧亦欲傳之子孫念二王之末途朕所以不能不懼爾臣伏思太宗往日之懼致我唐百代之隆則聖祖詒謀可謂深矣此太宗所以永保鴻名為受命之祖陛下所以丕承王業為中興之主豈不宜哉天旨以賈耽有陳平鎮撫之才得充國通知之敏其所述作該明古今乃詔太子詹事韋宗卿祕書少監吕述往蒞賔館以展私覿稽合同異視縷闕遺傳胡貊兜離之音載山川曲折之狀條貫周備文理洽通臣伏以貞觀初中書侍郎顔師古上言昔周武王天下太平逺國歸款周史乃集其事為王會篇今萬國來朝蠻夷率服實可圖寫請撰為王會圖有詔從之臣輒因韋宗卿吕述所紀異聞飾以繢事敢敘率服以冠篇首李文饒文集卷第二
