body:
  text: 後序唐有天下幾三百年賢相名儒接武而出固未易歷數也然考其功烈文章光明偉大卓然足以垂不腐者蓋亦無幾自房杜姚宋之後相之有聲者衛公李文饒而王楊燕許之後儒之可宗者文公韓退之而巳故世之論衛公者必以功烈言而鮮及於文章論文公者必以文章稱而或略於功烈殊不知衛公之文章常出乎功烈之外而文公之功烈不在乎文章之下借令衛公當文公時則必以文章顯矣文公得衛公位則必以功烈著矣觀幽州紀聖功碑異域歸忠傳序會昌功烈非衛公孰能形容之文公論淮蔡之敗可立而待折王庭湊之凶熖而奪之氣胸中所藴固不止於文章也夫道之在天下操之則為心盡之則為性持之則為志養之則為氣存之則為神是道也見之設施則為功烈寓之言語則為文章易地皆然豈有彼此之異哉元和十五年文公嘗為袁州刺史大和八年衛公亦嘗為袁之長史文公之去袁也崇廟貌以祀之列豐碑以記之其文集之行於世者又鋟木於郡庠至於衛公則不然祠堂數椽地石刻數尺許蕭然岑壑之上佛屋之側文之流傳者僅有十五賦其全集則未之見豈世之知衛公者一於功烈鮮及於文章歟紹興巳卯冬建安邵公來守是邦下車之初首訪韓李遺集而衛公文集獨未有表而出之
