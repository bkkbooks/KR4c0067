body:
  text: 後序唐有天下幾三百年賢相名儒接武而出固未易歴數也然考其功烈文章光朙偉大卓然足以垂不腐者盖亦無幾自房杜姚宋之後相之有聲者衞公李文饒而王楊燕許之後儒之可宗者文公韓退之而巳故世之論衞公者必以功烈言而鮮及於文章論文公者必以文章稱而或畧於功烈殊不知衞公之文章常出乎功烈之外而文公之功烈不在乎文章之下借令衞公當文公時則必以文章顯矣文公得衞公位則必以功烈著矣觀幽州紀聖功碑異域歸忠傳序㑹昌功烈非衞公孰能形容之文公論淮蔡之敗可立而待折王庭湊之兇熖而奪之氣胸中所藴固不止於文章也夫道之在天下操之則爲心盡之則爲性持之則爲志養之則爲氣存之則爲神是道也見之設施則爲功烈寓之言語則爲文章易地皆然豈有彼此之異㢤元和十五年文公嘗爲袁州刺史大和八年衞公亦嘗爲袁之長史文公之去袁也崇廟貌以祀之列豊碑以記之其文集之行於世者又鋟木於郡庠至於衞公則不然祠堂數椽地石刻数尺許蕭然岑壑之上佛屋之側文之流傳者僅有十五賦其全集則未之見豈世之知衞公者一於功烈鮮及於文章歟紹興巳卯冬建安邵公来守是邦下車之初首訪韓李遺集而衞公文集獨未有表而出之
