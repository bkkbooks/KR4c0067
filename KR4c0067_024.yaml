front:
  text: 李文饒别集卷第四
  hash: sha256:e98ca09ffa1a3a83a80edbc7520fa5d0607e5d7f28b5f7a9f5de7e421e54b69c
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4c0067_SBCK_024-1a}
body:
  text: 詩下并唱酬共三十五首奉送相公十八丈鎮楊州西川節度使李德裕千騎風生大斾舒春江重到武侯廬共懸龜印銜新綬同憶鱣庭訪舊居取履橋邊啼鳥換釣璜溪畔落初今來却笑臨卭客入蜀空馳使者車酬西川尚書淮南節度使王播昔年獻賦去江湄今日行春到始悲三徑尚存新竹樹四鄰惟見舊孫兒壁間潜認偷光處川上寧忘結網時更見橋邉記名字始知題柱免人嗤題劒門奇峯百仞懸清眺出嵐烟逈若戈回日高疑劒倚天參差霞壁聳合沓翠屏連想是三刀夢森然在目前頃歲入蜀偶題此詩馬上所成數字未穩今慿連帥尚書盧公再換舊石㑹昌三年四月一日守司空兼門下侍郎平章事李德裕漢州月夕遊房太尉西湖丞相鳴琴地何年閉玉徽聞於四海房公以好琴偶因明月夕重敞故樓扉桃柳豀空在芙蓉客暫依與王仲寶長南史安陸侯水依芙蓉何其麗也史庾杲之書稱泛渌誰憐濟川楫長與夜舟歸重題晚日臨寒渚微風彂櫂謳鳳池波自閲魚水運難留亭古思宏㨂川長憶夜舟想公高世志祗似冶城遊奉和兵部侍郎鄭浣太尉留琴地時移重可尋徽絃一掩抑風月助登臨榮駐清油騎高張白雪音秪言酬唱美良史記王針重題靜對烟波夕猶思棟宇精卧龍空有處馴鳥獨忘情顧步襟期遠參差物象橫自宜雕樂石爽氣際青城奉和禮部郎中集賢殿學士劉禹錫木落漢川夜西湖懸玉鈎旌旗還外次舟楫泛中流目極想前事神交如舊遊瑶琴久已絶松韻自悲秋重題林端落照盡湖上遠風清水榭芝蘭室仙舟魚鳥情人琴久寂寞烟月冀平生一泛釣潢處再吟鏘玉聲房公舊竹亭聞琴緬慕風流神期如在因重題此作流水音長在青霞意不傳獨悲形解後誰聽廣陵絃奉和鄭浣石室寒飈警孫枝雅器裁坐來山水操絃斷吊餘哀奉和劉禹錫尚有竹間露永無綦下塵一聞流水曲重憶餐霞人憶金門舊遊奉寄江西沈大夫東望滄溟路幾重無因白首更相逢已悲泉下雙琪樹昌皆已淪沒韋申令武元又借天邊一卧龍官南海杜西川謫人事升沉才十載官遊漂泊過千峯思君逺寄西山藥嘗鎮大夫金丹之術鍾陵兼好歲暮相期向赤松錦城春事憶江南五言三首桐花鳳百花潭憶子夜歌並闕早入中書行公主冊禮事畢登集賢閣成詠明星入東陌燦燦光層宙皎月映高梧輕風彂凉候金門列葆吹鍾室傳清漏簡冊自中來貂黃添宣授更登天祿閣極眺終南岫遙羡商山翁間歌紫芝秀晨興念始辱夕惕思致冦傾奪非我心悽然感田竇題羅浮石刻於石上清景持芳菊凉天倚茂松名山何必去此地有群峯重過列子廟追感頃年自淮服與居守王僕射同題名于廟壁僕射已為御史余尚布衣自後俱列紫垣繼遊內署兩為夏官之代復聨左揆之榮荷寵多同感涕何極因書四韻奉寄白首過遺廟朱輪入故城已慙聨左揆猶喜抗前旌曵履忘年舊彈冠久要情重看題壁處豈羡棄繻生遙傷茅山縣孫尊師三首蟬蛻遺虛白霓飛入上清同人悲劒解舊友覺衣輕黃鵠遙將舉班麟儼未行惟應鮑靚室中夜識琴聲金格期初至颷輪去不停山摧武擔石天隕少微星弟子悲徐甲門人泣蔡經空聞留玉舄猶在阜鄉亭空宇留丹竈層霞被羽衣舊山聞鹿化遺舄尚鳬飛數日奇香在何年白鶴歸想君旋下泪方欵里閭扉尊師是桃源黃先生傳法弟子常見尊師稱先師靈迹今重賦此詩兼寄題黃先生舊館後學方成市吾師又上賔並是先生弟子今茅山宫觀道士洞天應不夜源樹秪如春桃源事此並述棊客留童子生弟子桃源瞿山童即先載在傳記得仙人棊子山精避直神坐有聲先生疑山神所為先生初至茅山童子觸法靈異如此矣書符召至之其無因握石髓及與養生人僕射相公偶話於故集賢張學士㕔寫得德裕與僕射舊唱和詩其時和者五人惟僕射與德𥙿皆列高位凄然懷舊輒獻此詩賦感鄰人笛詩留夫子墻延年如有作應不用山王以貴不得列於五君之數顔延年五君詠山濤王戎惠泉茲泉由太潔終不畜纎鱗到底清何益含虛勢自貧明璣難祕彩美玉詎潜珍未及黃陂量滔滔豈有津無題松倚蒼崖老蘭臨碧洞衰不勞鄰舍笛吹起舊時悲題冠蓋里在襄州南大山下偶來冠蓋里愧是舊三公自喜無兵術輕裘上閟宫離平泉馬上作十年紫殿掌洪鈞出入三朝一品身文帝寵深陪雉尾武皇恩厚宴龍津黑山永破和親虜烏嶺全坑跋扈臣自是功高臨盡處禍來名滅不由人謫仙領南道中作嶺水爭分路轉迷桄榔椰葉暗蠻溪愁衝毒霧逢蛇草畏落沙蟲避燕泥五月畬田收火米三更津吏報潮雞不堪腸斷思鄉處紅槿花中越鳥啼到惡溪夜泊蘆島甘露花香不再持遠公應怪負前期青蠅豈獨悲虞氏黃犬應聞笑李斯風雨㢓昏蠻日月烟波魂斷惡溪時嶺頭無限相思泪泣向寒梅近北枝登崖州城作獨上高樓望帝京鳥飛猶是半年程青山似欲留人住百匝千遭繞郡城歌篇三首鴛鴦篇霜夜對月聽小童薛陽陶吹笛二首闕南梁行和二十二凡江城鬱鬱春草長悠悠漢水浮清光雜英飛盡空和景緑楊隂重官舍靜此時醉客縱橫書公言可薦承明廬青天詔下寵光至頒籍金閨徵石渠重歸山路烟嵐隔巫山未深晚花折澗底紅光奪日燃搖風有毒愁行客杜鵑啼咽花亦殷聲悲絶艷連空山斜陽瞥映淺深樹雲雨翻迷崖谷間山雞錦質矜毛羽透竹穿蘿命儔侶喬木幽谷上下同雄雌不異飛棲處望秦峯逈過商顏浪疊雲堆萬簇山行盡杳冥青嶂外九重鍾漏紫雲間元和列侍明光殿諫草初焚市朝變北闕趍臣半隟塵南梁笑客皆飛霰追思感歎却昏迷霜鬢愁吟到曉雞故園歲深開斷簡秋堂月曉掩遺袿鳴鳴曉角霞輝粲撫劒當楹一長歎芻狗無由學聖賢空持感激終昏旦李文饒别集卷第四
